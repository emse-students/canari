// Gradle init script (`-I`): downloads every dependency the Android app's variants resolve, so the
// ~/.gradle cache that `compile-android-app` (ci.yml) saves holds what a RELEASE build needs and
// not only what the debug compile touched. Run by `.github/scripts/android-app-compile.sh`, online
// and then `--offline`. cicd.md#the-android-release-build-resolves-from-a-cache-ci-completes-and-proves-offline-2026-11-25
//
// Why: the compile gate only runs debug tasks, so `universalReleaseRuntimeClasspath` was never
// resolved there. A release restored the cache (a key HIT), still found
// `error_prone_annotations-2.26.0.jar` missing, and went to Maven Central, which answered 429.
//
// (Iterated over a copy: resolving a configuration can register others, and a live iteration threw
// ConcurrentModificationException.)
// The variant classpaths are resolved STRICTLY (a failure fails the task: those are what the
// release links). Every other resolvable configuration is resolved best-effort, to warm the cache
// with tooling artifacts; one that cannot resolve on its own is logged and skipped.
allprojects { project ->
  project.tasks.register('resolveAllArtifacts') { task ->
    task.notCompatibleWithConfigurationCache('resolves configurations at execution time')
    task.doLast {
      int strictCount = 0
      new ArrayList(project.configurations).each { c ->
        if (!c.canBeResolved) return
        if (c.name ==~ /.*(Release|Debug)(Runtime|Compile)Classpath/) {
          int files = c.incoming.files.files.size()
          strictCount++
          println "RESOLVED ${project.path}:${c.name} (${files} files)"
        } else {
          try {
            c.incoming.files.files.size()
          } catch (Exception e) {
            println "SKIPPED ${project.path}:${c.name} (${e.class.simpleName})"
          }
        }
      }
      println "CLASSPATHS ${project.path} ${strictCount}"
    }
  }
}
