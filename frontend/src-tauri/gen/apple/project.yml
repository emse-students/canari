name: canari
options:
  bundleIdPrefix: fr.emse.canari
  deploymentTarget:
    iOS: 16.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Canari
      PRODUCT_BUNDLE_IDENTIFIER: fr.emse.canari
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  canari_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: AppIcon.icon
      - path: Externals
      - path: canari_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: canari_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        # ONLY the keys below are mirrored from the committed Info.plist (callsCompiled.test.ts holds
        # the background modes and the microphone string together). Others - CFBundleURLTypes,
        # BGTaskSchedulerPermittedIdentifiers, ... - are NOT mirrored, so xcodegen must not
        # regenerate the plist: it would drop them.
        UIBackgroundModes: [remote-notification, processing, fetch, audio]
        NSCameraUsageDescription: Canari utilise l'appareil photo pour vos appels vidéo, pour prendre des photos à partager dans vos conversations, des photos et vidéos pour vos publications, et pour filmer vos CanaReels.
        NSMicrophoneUsageDescription: Canari utilise le microphone pour vos appels audio et vidéo, pour enregistrer des messages vocaux et le son des vidéos que vous filmez pour vos publications et vos CanaReels.
        NSPhotoLibraryUsageDescription: Canari accède à vos photos pour les partager dans vos conversations.
        NSPhotoLibraryAddUsageDescription: Canari enregistre vos CanaReels dans vos photos quand vous le demandez.
        NSFaceIDUsageDescription: Canari utilise Face ID pour déverrouiller l'application de façon sécurisée.
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.9.9
        CFBundleVersion: "0.9.9"
    entitlements:
      path: canari_iOS/canari_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64, x86_64]
        VALID_ARCHS: arm64  x86_64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: bun tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
# NOTE: this project.yml is NOT the build source of truth. The authoritative Xcode
# project is the hand-maintained canari.xcodeproj/project.pbxproj (edited in Xcode,
# Pods/SPM, as documented in README.md); the CI builds it directly and never runs
# xcodegen. The Notification Service Extension (WP-iOS-6/7) is therefore added as a
# CanariNotifications target directly in that pbxproj (edited by hand), NOT declared
# here. Its source files live in canari_NSE/; the CI macOS runner builds/signs it.