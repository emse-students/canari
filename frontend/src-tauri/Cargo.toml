[package]
name = "canari"
version = "1.0.0"
description = "Le réseau des marteaux"
authors = ["Léon Muselli / Jolan Boudin"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mines_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-localhost = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2.4", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mls-core = { path = "../mls-core" }
tauri-plugin-biometric = "2"
tauri-plugin-keystore = "2.1.0-alpha.1"
tauri-plugin-customtabs = { path = "plugins/tauri-plugin-customtabs" }
tauri-plugin-http = { version = "2", default-features = false, features = ["rustls-tls"] }
tauri-plugin-deep-link = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2.7"
tauri-plugin-websocket = "2.4.2"
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
base64 = "0.22"
# Channel-message push decryption (AES-256-GCM): channel messages use the same AEAD as WebCrypto
# (ciphertext||tag, 12-byte nonce); the native push service decrypts inline ciphertext locally.
aes-gcm = "0.10"
# Graine message-key derivation, re-implemented here because a push is decrypted before any WebView
# runs. It must agree with `frontend/src/lib/crypto/graine.ts` byte for byte; the shared test
# vectors live in both test suites (see `mobile/graine.rs`).
hkdf = "0.12"
sha2 = "0.10"
log = "0.4"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread"] }

[patch.crates-io]
# tao 0.35.0 panics with NullPtr("get_object_class") when intent.getType() returns null
# (e.g. deep links like fr.emse.canari://callback). Fixed by adding a null guard.
tao = { path = "patches/tao" }
# tauri-plugin-keystore upstream only stores ONE secret behind a hardcoded English prompt. The
# local patch adds the whole *_key_bytes API (an alias-addressed MLS device key), the second
# background-readable item the iOS notification extension needs, and caller-supplied prompt text.
tauri-plugin-keystore = { path = "patches/tauri-plugin-keystore" }
# tauri-plugin-system-components 0.1.8 has no selected image for a tab, so the app's own glyphs could
# only change colour through the bar's `tintColor`, which on iOS 26 tints the glass too (user,
# 2026-09-30: yellow when selected, black when not, the bar not tinted). The local patch adds a tab
# item's `selectedImage`, and REMOVES the plugin's keyboard guard, which resized the WebView after
# every keyboard dismissal alongside `CanariApplyKeyboardLayout` - the `CANARI PATCH` hunks in
# `ios/Sources`; everything else is the published crate, unchanged.
tauri-plugin-system-components = { path = "patches/tauri-plugin-system-components" }

# The native iOS tab bar - Liquid Glass on iOS 26 (docs/wiki/frontend/mobile.md#the-native-ios-tab-bar).
# iOS ONLY, and EXACT: a 0.1.x from one author, whose Swift ships inside the app - PATCHED, see
# `[patch.crates-io]` above.
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-system-components = "=0.1.8"
# The App Group path for the BENCH command (`commands::bench`), asked of Foundation through the
# Objective-C runtime. Optional, and pulled in only by `bench-observables`: a store build links
# nothing of it. Already in the tree through wry, so this names a version the lock carries.
objc2 = { version = "0.6", optional = true }

# A BENCH build for the phone on the bench (`ios.yml` with `local_url`), and NOTHING else: the
# `bench_native_store` command the cross-client rig asks the iPhone's native stores through
# (docs/wiki/cross-client-ios.md, O5/O15). No release path enables it, and every store archive is
# asserted to carry none of it (`.github/scripts/bench-observables.sh`).
[features]
bench-observables = ["dep:objc2"]

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }
log = "0.4"


# `flock` for the Graine seed mirror (`commands::push::with_graine_mirror`). std's `File::lock`
# returns `Unsupported` on Android - its target is not in std's list - and every seed write failed
# silently in a killed app (NOTIF-20, 2026-09-27). Already in the tree through Tauri; named here
# because this crate now calls it directly.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
