[package]
name = "canari"
version = "1.4.1-alpha.3"
description = "Le réseau des marteaux"
authors = ["Léon Muselli / Jolan Boudin"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mines_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-localhost = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2.7"
tauri-plugin-sql = { version = "2.4", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mls-core = { path = "../mls-core" }
tauri-plugin-biometric = "2"
tauri-plugin-keystore = "2.1.0-alpha.1"
tauri-plugin-customtabs = { path = "plugins/tauri-plugin-customtabs" }
tauri-plugin-gallery = { path = "plugins/tauri-plugin-gallery" }
# Account restore on a new Android phone (WP-RESTORE-1): Android only, iOS answers Unsupported.
tauri-plugin-restore = { path = "plugins/tauri-plugin-restore" }
tauri-plugin-http = { version = "2.8", default-features = false, features = ["rustls-tls"] }
tauri-plugin-deep-link = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2.7"
# EXACT, and PATCHED (`[patch.crates-io]` below): the app supplies the TCP connect. The vendored
# patch (`patches/tauri-plugin-websocket`) makes `Builder::new` TAKE the connector and removes
# `init()` and `Default`; an unpatched upstream `Builder::new` takes no argument, so the app's
# `Builder::new(happy_eyeballs::tcp_connector())` fails to COMPILE rather than install silently.
tauri-plugin-websocket = "=2.5.0"
tauri-plugin-log = "2"
tauri-plugin-store = "2.5"
tauri-plugin-os = "2"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
base64 = "0.22"
# Channel-message push decryption (AES-256-GCM): channel messages use the same AEAD as WebCrypto
# (ciphertext||tag, 12-byte nonce); the native push service decrypts inline ciphertext locally.
aes-gcm = "0.10"
# Graine message-key derivation, re-implemented here because a push is decrypted before any WebView
# runs. It must agree with `frontend/src/lib/crypto/graine.ts` byte for byte; the shared test
# vectors live in both test suites (see `mobile/graine.rs`).
hkdf = "0.12"
sha2 = "0.10"
log = "0.4"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "net", "time", "macros"] }

[patch.crates-io]
# tauri-plugin-keystore upstream only stores ONE secret behind a hardcoded English prompt. The
# local patch adds the whole *_key_bytes API (an alias-addressed MLS device key), the second
# background-readable item the iOS notification extension needs, and caller-supplied prompt text.
tauri-plugin-keystore = { path = "patches/tauri-plugin-keystore" }
# tauri-plugin-system-components 0.1.8 has no selected image for a tab, so the app's own glyphs could
# only change colour through the bar's `tintColor`, which on iOS 26 tints the glass too (user,
# 2026-09-30: yellow when selected, black when not, the bar not tinted). The local patch adds a tab
# item's `selectedImage`, and REMOVES the plugin's keyboard guard, which resized the WebView after
# every keyboard dismissal alongside `CanariApplyKeyboardLayout` - the `CANARI PATCH` hunks in
# `ios/Sources`; everything else is the published crate, unchanged.
tauri-plugin-system-components = { path = "patches/tauri-plugin-system-components" }
# tauri-plugin-websocket 2.5.0 connects through `tokio-tungstenite`'s `TcpStream::connect`, which
# tries the resolved addresses IN TURN: on a network handing out an IPv6 that routes nowhere, the
# chat socket waited 20 s on IPv6 before trying IPv4 and missed the page's 15 s deadline every time
# (CALL-WS-V6, 2026-10-20). The local patch makes `Builder::new` REQUIRE a TCP connector, through
# which the app's Happy Eyeballs connect (`src/happy_eyeballs.rs`) runs before the unchanged TLS
# and WebSocket handshakes, and registers a connection's writer BEFORE answering its id (so a
# `disconnect()` right after the id cannot miss it) - the `CANARI PATCH` hunks in `src/lib.rs`;
# everything else is the published crate. A vendored fork: an upstream release is rebased by hand.
tauri-plugin-websocket = { path = "patches/tauri-plugin-websocket" }

# The native iOS tab bar - Liquid Glass on iOS 26 (docs/wiki/frontend/mobile.md#the-native-ios-tab-bar).
# iOS ONLY, and EXACT: a 0.1.x from one author, whose Swift ships inside the app - PATCHED, see
# `[patch.crates-io]` above.
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-system-components = "=0.1.8"
# The App Group path (`app_group.rs`), asked of Foundation through the Objective-C runtime. Every
# iOS build needs it since `store_push_secret` writes the notification extension's copy of the push
# secret there; the bench command uses the same function. Already in the tree through wry, so this
# names a version the lock carries.
objc2 = "0.6"

# A BENCH build for the phone on the bench (`ios.yml` with `local_url`), and NOTHING else: the
# `bench_native_store` command the cross-client rig asks the iPhone's native stores through
# (docs/wiki/cross-client-ios.md, O5/O15). No release path enables it, and every store archive is
# asserted to carry none of it (`.github/scripts/bench-observables.sh`).
[features]
bench-observables = []

[dev-dependencies]
# Paused clock for the Happy Eyeballs race tests: virtual time, never the wall clock.
tokio = { version = "1.0", features = ["test-util", "macros", "rt"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }
log = "0.4"


# `flock` for the Graine seed mirror (`commands::push::with_graine_mirror`). std's `File::lock`
# returns `Unsupported` on Android - its target is not in std's list - and every seed write failed
# silently in a killed app (NOTIF-20, 2026-09-27). Already in the tree through Tauri; named here
# because this crate now calls it directly.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
