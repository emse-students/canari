[package]
name = "tauri-plugin-restore"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-restore"
description = "Android's Restore Credentials API: the restore key that brings a Canari session to a new phone (WP-RESTORE-1, docs/wiki/account-restore.md)."
license = "Apache-2.0"

[lib]
name = "tauri_plugin_restore"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
