[package]
name = "tauri-plugin-gallery"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-gallery"
description = "Saves a video into the phone's own gallery (Android MediaStore, iOS Photos) and opens the app's system settings page - CanaReels C6."
license = "Apache-2.0"

[lib]
name = "tauri_plugin_gallery"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
log = "0.4"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
