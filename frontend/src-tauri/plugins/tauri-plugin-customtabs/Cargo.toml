[package]
name = "tauri-plugin-customtabs"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-customtabs"
description = "Opens a URL in a Chrome Custom Tab on Android, which the OS closes automatically when the launching app returns to the foreground (WP-OIDC-TAB-1)."
license = "Apache-2.0"

[lib]
name = "tauri_plugin_customtabs"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
