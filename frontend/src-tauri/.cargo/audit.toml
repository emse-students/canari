# Advisories with no fix available, each with the reason it cannot be honoured here and the
# condition that lifts it. Nothing else is silenced: an ID not listed still fails the job, and an
# entry whose crate has left the graph is dead weight - delete it rather than carry it.

[advisories]
ignore = [
  # rsa 0.9.10, Marvin attack. NOT BUILT here either: it is an optional dependency of sqlx-mysql,
  # and this app opens SQLite only, so the MySQL driver is never enabled. Unlike the two services,
  # whose argument is that no RSA key is ever constructed, here the code is not even compiled in.
  "RUSTSEC-2023-0071",
  # libcrux-kem 0.0.9, wants >=0.0.10: a panic in the HYBRID KEM (encapsulation from a short seed,
  # decoding a short hybrid key). Both advisories were issued 2026-10-07. NOT REACHABLE: it is compiled
  # because hpke-rs-libcrux needs it, but the MLS cipher suite is MLS_128_DHKEMX25519_AES128GCM_SHA256_Ed25519
  # ([mls-protocol](docs/wiki/protocols/mls-protocol.md)), whose KEM is plain X25519 - no hybrid key is ever
  # built or decoded - and the worst case is a local denial of service (CVSS 5.6). The fix cannot be
  # taken yet: it ships in hpke-rs-libcrux 0.8.0 (libcrux-kem =0.0.10, published 2026-10-07), while
  # openmls_libcrux_crypto 0.4.0, the newest, pins hpke-rs-libcrux ^0.7. Lifted by an
  # openmls_libcrux_crypto release taking hpke-rs-libcrux 0.8; then delete both entries.
  "RUSTSEC-2026-0330",
  "RUSTSEC-2026-0331",
  # crypto-bigint 0.5.5 (RUSTSEC-2026-0387, 2026-10-23), wants >=0.7.6: operations meant to be
  # constant-time (subtraction, division, Montgomery multiplication) may branch on secret data. No
  # 0.5.x fix exists; 0.7 needs elliptic-curve 0.14, and its only path here is mls-core's
  # openmls_rust_crypto 0.6.0 / openmls_basic_credential 0.6.0 (p256/p384/k256 0.13), the newest.
  # NOT REACHABLE, as in mls-wasm: mls-core names one ciphersuite,
  # MLS_128_DHKEMX25519_AES128GCM_SHA256_Ed25519, and one signature scheme, ED25519, so no
  # P-256/P-384/secp256k1 secret is ever generated or used. Lifted by an openmls_rust_crypto on
  # elliptic-curve 0.14; the retirement step of code-analysis.yml fails when it is not reported.
  "RUSTSEC-2026-0387",
  # libsqlite3-sys 0.30.1 (RUSTSEC-2026-0459, CVE-2026-119375, 2026-10-30), wants >=0.39.0 (bundled
  # SQLite 3.54): a database opened with a crafted sibling -wal of a different page size returns
  # uninitialised page-cache memory. No fix can be taken: sqlx-sqlite 0.8.6 requires ^0.30.1, 0.9.0
  # (the newest) <0.38, and tauri-plugin-sql 2.6.0 / 3.0.0-alpha.3 both require sqlx ^0.8.
  # NOT REACHABLE: the only files opened are canari_<userId>.db (app_config_dir, via the plugin) and
  # mls_pending.db (app_data_dir), fixed names in the app's private sandbox (Android internal storage,
  # allowBackup=false; the iOS container); nothing imports, restores or opens a database from outside
  # it, so planting the crafted pair already requires the access the leak would grant. Lifted by an
  # sqlx release accepting libsqlite3-sys >=0.39 and a tauri-plugin-sql on it; then delete this entry.
  # RE-EXAMINE BY 2027-01-31: no such release by then means the vendored fork in
  # docs/wiki/backlog.d/p2-sqlite-bundled-needs-sqlx-release.md.
  "RUSTSEC-2026-0459",
]
