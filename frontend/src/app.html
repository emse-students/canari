<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="Canari : fil social, associations, agenda et messagerie chiffrée pour la communauté EMSE."
    />
    <!-- Applique le thème avant le premier paint pour éviter le flash blanc/noir. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('canari-theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.dataset.theme = 'dark';
        } catch (_) {}
      })();
    </script>
    <!-- Only the native Tauri WebView draws edge-to-edge behind the system's own gesture/button
         area, so only there does env(safe-area-inset-*) answer a real question. A plain mobile
         browser tab already excludes that area from its own viewport - env() reports it there
         too (non-zero on at least one device measured), so every consumer of the raw env() value
         double-reserved it, opening a dead gap above the browser's own on-screen nav buttons.
         --safe-area-inset-bottom is the one place this is decided, set before first paint like
         the theme above; every consumer reads var(--safe-area-inset-bottom, 0px) instead of
         calling env() itself. -->
    <script>
      (function () {
        try {
          if (!window.__TAURI_INTERNALS__) {
            document.documentElement.style.setProperty('--safe-area-inset-bottom', '0px');
          }
        } catch (_) {}
      })();
    </script>
    <style>
      /* THESE THREE LITERALS ARE THE APP'S GROUND, NOT A PLACEHOLDER FOR IT.

         They exist to paint before app.css loads, but `html[data-theme='dark'] body` outranks
         app.css's `html, body`, so whatever is written here is what the page KEEPS. The dark value
         was left at #1f1f1f when the palette went OLED, and the result measured 2026-09-08 was a
         `--cn-bg` of #000 that nothing painted: every gutter in the app read rgb(31,31,31) while
         the token said black. A literal that disagrees with a token is not a duplicate, it is the
         winner - so these must be changed in the same commit as --cn-bg and --cn-surface. */
      html,
      body {
        background: #f0f2f5;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #000000;
      }
      #canari-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000000;
        transition: opacity 0.4s ease-out;
      }
      #canari-splash.done {
        opacity: 0;
        pointer-events: none;
      }
      #canari-splash svg {
        width: 88px;
        height: 88px;
        animation: splash-pulse 2s ease-in-out infinite;
      }
      #canari-splash span {
        color: #fac809;
        font-weight: 700;
        font-size: 1.75rem;
        letter-spacing: 0.04em;
        margin-top: 18px;
        font-family: 'Fredoka Variable', 'Fredoka', system-ui, sans-serif;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.07);
          opacity: 0.8;
        }
      }
    </style>
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <!--
      Declared rather than left to the convention path, because Safari only probes
      /apple-touch-icon.png (and -precomposed) when no link says otherwise - which is
      what produced three 404s and a home-screen icon that was a page screenshot.
      Both files come from scripts/gen-web-icons.mjs; do not edit them by hand.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#151B2C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Canari - Mines Saint-Étienne</title>
    <meta name="canari-seo-placeholder" data-canari-seo />
    <meta name="application-name" content="Canari" />
    %sveltekit.head%
  </head>
