<svg viewBox="0 0 337 325" width="337" height="325" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <!--
    THE ONE DRAWING every icon in this repository comes from.

    The bird is scaled to 71 percent of the canvas, centred, so that it fits INSIDE the circle
    inscribed in that canvas rather than against its edge. The number is measured, not chosen: the
    bird's extremities are its tail and its beak, which sit on opposite diagonals, so at full size
    they reach 1.347 times the inscribed circle's radius and a circular mask cuts them off. 0.71
    leaves about 4 percent clearance inside the circle. The icon generators in scripts/ divide by
    this factor where they mean a bird size; appIcons.test.ts pins the factor and the circle.

    The outline is ONE path traced from the previous hand-drawn vector (2026-09-30, potrace after a
    1 px smoothing), so the wobble of the hand tracing is gone and the drawing is otherwise the same:
    same pose, same open beak, same wing groove. The inner transform undoes the group's, so the
    path's own numbers are the 1800 px raster's.
  -->
