[package]
name = "mail-tls"
version = "1.8.3-alpha.1"
edition = "2021"
description = "Sans-IO TLS client for the school mailbox (partage.emse.fr), for WASM and native"

# `cdylib` is the WASM the web loads when the Mail tab is opened; `rlib` is the same crate for the
# native tests (and for a native consumer, one crate for both, docs/wiki/mail-client.md D3).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# TLS 1.3 and 1.2 over ring, nothing else: no `aws-lc-rs` (it does not build for
# wasm32-unknown-unknown), no logging feature (nothing of a handshake is logged from inside).
# Why ring and not a pure-Rust provider: docs/wiki/mail-client-transport.md#the-crypto-provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The Mozilla root store, not a pinned root: a RENATER certificate rotation onto another public CA
# must not break the client (mail-client-transport.md#the-roots).
webpki-roots = "1"
wasm-bindgen = "0.2"

# ring reads randomness through getrandom 0.2; on wasm32-unknown-unknown that crate has NO source of
# its own and only compiles with `js` (crypto.getRandomValues). ring's feature turns it on.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
# rustls reads the wall clock (certificate validity) through `UnixTime::now()`, which wasm32 has
# only with this feature: `web-time`, i.e. `Date.now()`. Without it `std::time::SystemTime` would
# PANIC there (the v0.16.4 outage, `.github/scripts/checks.sh mls-wasm-verify`).
rustls-pki-types = { version = "1", features = ["web"] }
js-sys = "0.3"

[dev-dependencies]
# An in-process TLS server for the handshake tests, with a certificate made for the test.
rcgen = "0.14"

# The download is what the web pays when the Mail tab opens: optimise for size.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# The host tools are never stripped: the same reason, and the same lines, as mls-wasm's manifest
# (docs/wiki/cicd.md#the-ios-toolchain-is-pinned-xcode-27-since-171).
[profile.release.build-override]
strip = false
