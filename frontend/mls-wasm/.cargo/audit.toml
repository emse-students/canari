# Advisories with no fix available, each with the reason it cannot be honoured here and the
# condition that lifts it. Nothing else is silenced: an ID not listed still fails the job, and an
# entry whose crate has left the graph is dead weight - delete it rather than carry it.

[advisories]
ignore = [
  # libcrux-kem 0.0.9, wants >=0.0.10: a panic in the HYBRID KEM (encapsulation from a short seed,
  # decoding a short hybrid key). Both advisories were issued 2026-10-07. NOT REACHABLE: it is compiled
  # because hpke-rs-libcrux needs it, but the MLS cipher suite is MLS_128_DHKEMX25519_AES128GCM_SHA256_Ed25519
  # ([mls-protocol](docs/wiki/protocols/mls-protocol.md)), whose KEM is plain X25519 - no hybrid key is ever
  # built or decoded - and the worst case is a local denial of service (CVSS 5.6). The fix cannot be
  # taken yet: it ships in hpke-rs-libcrux 0.8.0 (libcrux-kem =0.0.10, published 2026-10-07), while
  # openmls_libcrux_crypto 0.4.0, the newest, pins hpke-rs-libcrux ^0.7. Lifted by an
  # openmls_libcrux_crypto release taking hpke-rs-libcrux 0.8; then delete both entries.
  "RUSTSEC-2026-0330",
  "RUSTSEC-2026-0331",
  # crypto-bigint 0.5.5 (RUSTSEC-2026-0387, 2026-10-23), wants >=0.7.6: operations meant to be
  # constant-time (subtraction, division, Montgomery multiplication) may branch on secret data. No
  # 0.5.x fix exists; 0.7 needs elliptic-curve 0.14, and openmls_rust_crypto 0.6.0 and
  # openmls_basic_credential 0.6.0 (p256/p384/k256 0.13 via hpke-rs-rust-crypto) are the newest.
  # NOT REACHABLE: compiled because the RustCrypto provider registers every suite, but mls-core names
  # one ciphersuite, MLS_128_DHKEMX25519_AES128GCM_SHA256_Ed25519, and one signature scheme, ED25519
  # (graine signatures included), so no P-256/P-384/secp256k1 secret is ever generated or used.
  # Lifted by an openmls_rust_crypto on elliptic-curve 0.14; the retirement step of
  # code-analysis.yml fails when it is not reported.
  "RUSTSEC-2026-0387",
]
