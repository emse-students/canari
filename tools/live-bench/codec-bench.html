<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live codec bench</title>
    <style>
      body {
        font: 13px monospace;
        margin: 8px;
        background: #fff;
        color: #000;
      }
      button {
        font: inherit;
        margin: 2px;
      }
      pre {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <p>
      Live bitrate-floor and codec bench (tools/live-bench/README.md). Results stay in this page.
    </p>
    <div id="b"></div>
    <pre id="o"></pre>
    <script src="codec-bench.js"></script>
    <script>
      const o = document.getElementById('o');
      const print = (v) => (o.textContent = JSON.stringify(v, null, 1) + '\n' + o.textContent);
      const runs = [
        ['matrix', () => __CB.matrix()],
        ['MR 720p 1.0', () => __CB.start('mr', { w: 1280, h: 720, bps: 1e6 })],
        ['MR 480p 1.0', () => __CB.start('mr', { w: 848, h: 480, bps: 1e6 })],
        [
          'WC avc1.42E01F 720p 1.0',
          () => __CB.start('wc', { codec: 'avc1.42E01F', w: 1280, h: 720, bps: 1e6 }),
        ],
        [
          'WC avc1.4D401F 720p 1.0',
          () => __CB.start('wc', { codec: 'avc1.4D401F', w: 1280, h: 720, bps: 1e6 }),
        ],
        ['state', () => __CB.state()],
        ['show last', () => __CB.show(__CB.results.length - 1, 30)],
        ['clear', () => __CB.clear()],
      ];
      for (const [name, fn] of runs) {
        const btn = document.createElement('button');
        btn.textContent = name;
        btn.onclick = async () => {
          try {
            print(await fn());
          } catch (e) {
            print(String(e));
          }
        };
        document.getElementById('b').appendChild(btn);
      }
    </script>
  </body>
</html>
