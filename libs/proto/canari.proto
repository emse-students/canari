syntax = "proto3";

package canari;

// ═══════════════════════════════════════════════════════════════════════════
// WebSocket transport envelope  (client ↔ gateway)
// ═══════════════════════════════════════════════════════════════════════════
//
// All WebSocket frames are sent as binary (not text).
// The client wraps every outgoing frame in WsEnvelope; the gateway sends back
// InboundMsg directly (no outer envelope needed for server → client).
//
// Wire flow:
//   Client   →  WsEnvelope (binary)  →  Gateway
//   Gateway  →  InboundMsg (binary)  →  Client

message WsEnvelope {
  oneof body {
    MlsFrame     mls     = 1;  // application message or MLS commit
    WelcomeFrame welcome = 2;  // MLS Welcome (group invite)
    ReadAck      read    = 3;  // read receipt
  }
}

// A single fan-out target.
message Recipient {
  string user_id   = 1;
  string device_id = 2; // empty = fan-out to all devices of this user
}

// Wraps an opaque MLS ciphertext (application message or commit).
message MlsFrame {
  bytes             ciphertext = 1; // raw MLS ciphertext bytes (never base64)
  string            group_id   = 2; // empty on commits sent without explicit group
  repeated Recipient recipients = 3; // leave empty = derive from group members
}

// Wraps an MLS Welcome message.
message WelcomeFrame {
  bytes             ciphertext = 1;
  string            group_id   = 2;
  repeated Recipient recipients = 3;
}

// Read receipt.
message ReadAck {
  string message_id = 1; // UUID string of the acknowledged message
}

// Server → client delivery frame (pushed via Redis pub/sub).
message InboundMsg {
  bytes  ciphertext       = 1; // raw MLS bytes
  string sender_id        = 2;
  string sender_device_id = 3;
  string group_id         = 4;
  bool   is_welcome       = 5; // true → process as MLS Welcome, not as application msg
  bool   is_commit        = 6; // true → MLS structural commit (add/remove member); sender should skip self-processing
}

// ═══════════════════════════════════════════════════════════════════════════
// Application payload  (plaintext INSIDE the MLS ciphertext)
// ═══════════════════════════════════════════════════════════════════════════
//
// This is what gets encrypted end-to-end by MLS.
// The server never sees the plaintext; it only routes opaque ciphertext blobs.
//
// Encoding: proto3 binary serialised with this schema, passed as raw bytes to
// `WasmMlsClient::send_message_bytes()`.

message AppMessage {
  // Unique identifier assigned by the sender (UUID string).
  string message_id = 6;
  // Client-side send timestamp (milliseconds since Unix epoch).
  int64  sent_at    = 8;
  oneof kind {
    TextMsg     text     = 1;
    ReplyMsg    reply    = 2;
    ReactionMsg reaction = 3;
    MediaMsg    media    = 4;
    SystemMsg   system   = 5;
    CallMsg     call     = 7;
    PollMsg     poll     = 9;
    // Graine key material. These NEVER travel in a conversation: they are carried by the
    // community's distribution group, which holds key material and never a message body.
    GraineMsg        graine         = 10;
    GraineRequestMsg graine_request = 11;
    GraineBundleMsg  graine_bundle  = 12;
  }
}

// ── WebRTC Signaling ─────────────────────────────────────────────────────

message CallMsg {
  string call_id = 1; // Unique for the call session
  bool   has_video = 6; // Whether the caller intends to send video
  /** Originating device id (for multi-device answered / dismiss sibling rings). */
  string device_id = 8;

  oneof payload {
    string offer_sdp     = 2; // SDP offer json string
    string answer_sdp    = 3; // SDP answer json string
    string ice_candidate = 4; // ICE candidate json string
    bool   hangup        = 5; // End call
    bool   answered      = 7; // Picked up on another device of the same user
  }
}

// ── Plain text ───────────────────────────────────────────────────────────

message TextMsg {
  string content = 1;
}

// ── Reply (quote) ────────────────────────────────────────────────────────

message ReplyRef {
  string id        = 1;
  string sender_id = 2;
  string preview   = 3; // first 100 chars of the quoted message
}

message ReplyMsg {
  string   content  = 1;
  ReplyRef reply_to = 2;
}

// ── Emoji reaction ───────────────────────────────────────────────────────

// Carries BOTH legs of a reaction: placing one and taking it back. Removal used to travel as a
// `SystemMsg("remove_reaction")` with a JSON body, which left the two legs with different shapes
// and no room for the timestamp the merge needs on both.
message ReactionMsg {
  string message_id = 1; // UUID of the reacted-to message
  string emoji      = 2;
  // Unix ms at which the sender changed the state of this (user, emoji) pair. The merge keeps the
  // larger one, so a removal reaches a device holding a stale placement and vice versa.
  int64  at         = 3;
  // True when the sender is TAKING THE REACTION BACK. Default false = placing it, so a frame from
  // before this field existed reads as a placement - which is exactly what it was.
  bool   removed    = 4;
}

// ── Poll (community channels) ─────────────────────────────────────────────
//
// The question and option labels are end-to-end encrypted here. Only the
// opaque option ids are mirrored server-side (metadata.poll) so votes can be
// tallied without the server ever seeing the plaintext.

message PollOption {
  string id    = 1; // opaque id, mirrored in the server-side tally
  string label = 2;
}

message PollMsg {
  string              question        = 1;
  repeated PollOption options         = 2;
  bool                multiple_choice = 3;
  int64               ends_at         = 4; // epoch ms; 0 = no deadline
}

// ── Graine: key material for community channels ──────────────────────────
//
// A community channel is NOT an MLS group. Its messages are sealed under a per-sender session
// seed, and only the seeds travel over MLS - through one distribution group per community, which
// carries key material and never a message body. That is what keeps a seed distribution O(1)
// instead of one sealed copy per member, at several hundred members per community.
//
// Full design, measurements and rejected alternatives: docs/wiki/protocols/channel-encryption.md.

// One sender's session for one channel: the seed every message key in it is derived from.
//
// Rotation does NOT delete anything. Rotating means the sender stops using this seed for NEW
// messages; it keeps opening the ones already sent, for ever, for everyone holding it - which is
// what makes reading the past possible at all.
message GraineMsg {
  string channel_id  = 1;
  // Opaque, sender-chosen, unique. No two senders ever write the same session namespace, so a
  // session id needs no coordination and no election to be safe.
  string session_id  = 2;
  bytes  seed        = 3; // 32 raw bytes; every message key is HKDF(seed, "canari-graine-v1", i)
  // Index the recipient may start deriving from. Non-zero when a seed is handed over mid-session,
  // so a member who joined late cannot derive keys for messages sent before they were allowed to.
  uint32 first_index = 4;
  int64  created_at  = 5; // epoch ms, for the 7-day rotation and for ordering a bundle
}

// What a request is FOR, stated rather than inferred from an empty list.
//
// "Repair these sessions" and "send me everything" would otherwise be the same message with an
// empty field, and a malformed request would be indistinguishable from a legitimate one - the exact
// shape that had to be removed from history_request once the minimum client version made it
// unnecessary. UNSPECIFIED is declined and logged, never guessed at.
enum GraineRequestKind {
  GRAINE_REQUEST_KIND_UNSPECIFIED = 0;
  GRAINE_REQUEST_KIND_SESSIONS    = 1; // exactly the session ids listed
  GRAINE_REQUEST_KIND_HISTORY     = 2; // a joiner's catch-up, bounded by history_visibility
}

// Asks ONE named member for seeds, so N members do not all answer at once.
//
// The answerer is named by the requester and is deterministic: the session's own sender always
// holds its seed, so a repair is addressed to them; if they have left the community, it goes to the
// remaining member with the lowest user id. No clock, no election, nothing for a race to decide.
message GraineRequestMsg {
  string            workspace_id     = 1;
  GraineRequestKind kind             = 2;
  repeated string   session_ids      = 3; // meaningful only for KIND_SESSIONS
  string            answerer_user_id = 4; // every other member ignores the request
  string            request_id       = 5; // echoed by the bundle that answers it
}

// The answer: seeds in one message, for one channel or for a whole community.
message GraineBundleMsg {
  string             workspace_id = 1;
  string             request_id   = 2; // the request this answers, echoed verbatim
  repeated GraineMsg seeds        = 3;
  // True when the sender held more seeds than the bundle may carry. The receiver must SAY so rather
  // than render a short history as a complete one - "this is all there is" and "this is all I could
  // send" are different facts.
  bool               truncated    = 4;
}

// ── Encrypted media attachment ───────────────────────────────────────────
//
// Security model: the media service stores only opaque AES-GCM ciphertext.
// The CEK and IV live inside this proto message, which is itself end-to-end
// encrypted by MLS (a conversation) or derived from a Graine session (a community channel).
// Either way the server stores an opaque blob and holds no key to it.

enum MediaKind {
  MEDIA_KIND_UNSPECIFIED  = 0; // generic binary
  MEDIA_KIND_IMAGE = 1;
  MEDIA_KIND_VIDEO = 2;
  MEDIA_KIND_AUDIO = 3;
}

message MediaMsg {
  MediaKind kind      = 1;
  string    media_id  = 2; // opaque server-side identifier
  // 32-byte AES-256-GCM CEK (raw bytes, NOT hex). Readable by whoever can read the message that
  // carries it - group members for a conversation, seed holders for a community channel.
  bytes     key       = 3;
  bytes     iv        = 4; // 12-byte GCM nonce         (raw bytes, NOT hex)
  string    mime_type = 5;
  uint32    size      = 6; // plaintext file size in bytes
  string    file_name = 7; // optional display name
  string    caption   = 8; // optional text caption shown alongside the media
  uint32    width     = 9; // display width in px (post-compression), for layout
  uint32    height    = 10; // display height in px, for layout
}

// ── System / group-management events ────────────────────────────────────

message SystemMsg {
  // One of: "groupRenamed" | "memberAdded" | "memberRemoved" | "groupDeleted"
  string event = 1;
  // Arbitrary JSON payload (kept flexible for future events).
  string data  = 2;
}
