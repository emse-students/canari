[package]
name = "chat-gateway"
version = "0.18.4-alpha.2"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["ws", "macros"] }
# DIRECT ONLY SO THE ERROR UNDER AXUM'S CAN BE READ AS A TYPE, and the version must keep
# unifying with axum's own (both resolve to 0.29 today, one entry each in Cargo.lock). If a
# future axum bump splits them, the downcast in `classify_socket_error` stops matching and
# says so itself at ERROR - see `SocketEnd::Unreadable`.
tokio-tungstenite = "0.29"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redis = { version = "1.0.2", features = ["tokio-comp"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["fs", "trace", "cors"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.20.0", features = ["serde", "v4"] }
jsonwebtoken = { version = "11.0.0", features = ["use_pem", "rust_crypto"] }
reqwest = { version = "0.13.3", features = ["json"] }
bytes = "1"
base64 = "0.23"
