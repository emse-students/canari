# Advisories with no fix available, each with the reason it cannot be honoured here and the
# condition that lifts it. Nothing else is silenced: an ID not listed still fails the job, and an
# entry whose crate has left the graph is dead weight - delete it rather than carry it.

[advisories]
ignore = [
  # rsa 0.9.10, Marvin attack (timing sidechannel in RSA decryption). No fixed version exists.
  # The crate IS compiled - jsonwebtoken's `rust_crypto` feature pulls it unconditionally, there is
  # no finer knob - but this service only ever builds `Validation::new(Algorithm::HS256)` over
  # `DecodingKey::from_secret`, so no RSA key is ever constructed and the vulnerable path cannot
  # run. Lifted by jsonwebtoken gaining a feature that excludes RSA, or by moving to its
  # `aws_lc_rs` backend (which needs cmake and a C compiler in the build image).
  "RUSTSEC-2023-0071",
  # crypto-bigint 0.5.5 (RUSTSEC-2026-0387, 2026-10-23), wants >=0.7.6: operations meant to be
  # constant-time (subtraction, division, Montgomery multiplication) may branch on secret data. No
  # 0.5.x fix exists; 0.7 needs elliptic-curve 0.14, and every p256/p384 0.13 user here is already at
  # its newest release (jsonwebtoken 11.1.0, webrtc 0.17.2's dtls 0.17.2). Two edges, two answers:
  # - jsonwebtoken: NOT REACHABLE, the RSA argument above - HS256 over `from_secret` only, so no EC
  #   key is ever built.
  # - webrtc's dtls: REACHABLE IN CODE. Its ECDHE runs p256/p384 arithmetic on an ephemeral secret
  #   (`EphemeralSecret::random` per handshake, one scalar multiplication each) whenever the peer
  #   puts P-256/P-384 first; signing goes through ring. What bounds it: a per-handshake secret gives
  #   a timing channel ONE operation to observe, and the SFU has placed no real call in production
  #   (calls are switched off in clients, docs/wiki/frontend/modules/live.md).
  # Lifted by webrtc 0.21 (a port onto ring, docs/wiki/frontend/modules/calls.md) AND a jsonwebtoken
  # on elliptic-curve 0.14; the retirement step of code-analysis.yml fails when it is not reported.
  "RUSTSEC-2026-0387",
  # pin-utils 0.1.1 (RUSTSEC-2026-0441, 2026-10-01): "unmaintained" - a status warning, NOT a
  # vulnerability, so nothing exploitable is claimed. Path: webrtc 0.17.2 -> webrtc-util 0.17.2 ->
  # nix 0.26.4 -> pin-utils 0.1.1. No lockfile bump helps: nix 0.26.4 is the newest 0.26 and
  # webrtc-util 0.17.3 still asks for `nix ^0.26.2`; only webrtc 0.21 drops nix. Same webrtc 0.17
  # edge as the entry above. Lifted by the webrtc 0.21 port (docs/wiki/frontend/modules/calls.md) or
  # a webrtc-util on nix >= 0.27; the retirement step of code-analysis.yml fails when it is not
  # reported. Time-boxed: re-examine by the webrtc 0.21 port or 2027-01-31.
  "RUSTSEC-2026-0441",
]
