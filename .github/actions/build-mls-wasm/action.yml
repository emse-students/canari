name: Build MLS WASM
description: >
  Compile frontend/mls-wasm into frontend/src/lib/wasm, and the mail client's TLS
  (frontend/mail-tls) into frontend/src/lib/wasm/mail-tls. The output is a build artefact and is
  never committed, so EVERY pipeline that ships a client - web, Android, iOS - builds
  it here. One place, one pinned wasm-pack, one cache key: a client cannot be a crypto fix behind
  another without this file changing.

runs:
  using: composite
  steps:
    # Keyed on the sources, so an unchanged crate never pays for a rebuild and a changed one
    # can never miss it. mls-wasm is bindings over mls-core, so both crates are in the key.
    #
    # ON macOS THE XCODE MAJOR IS IN THE KEY (2026-11-18): the host half of this build (proc macros,
    # build scripts) is linked by Xcode's toolchain and loaded by that image's dyld, and macOS 27
    # refused a stripped proc macro that macOS 15 loaded. An entry built on another image would
    # hide such a refusal until it expired. BOTH caches carry the tag: this step's artefact cache, and
    # the target-directory cache the Rust setup below restores on a miss (its `cache-key`), which
    # otherwise brought back host dylibs from another Xcode under a "full match".
    - name: Name the host toolchain
      id: host
      shell: bash
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" = "macOS" ]; then
          major="$(xcodebuild -version | awk 'NR == 1 {split($2, v, "."); print v[1]}')"
          echo "tag=-xcode${major}" >> "$GITHUB_OUTPUT"
          echo "xcode=xcode${major}" >> "$GITHUB_OUTPUT"
          echo "host toolchain: Xcode ${major}"
        else
          echo "tag=" >> "$GITHUB_OUTPUT"
          echo "xcode=" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore built WASM
      id: cache
      uses: actions/cache@v6
      with:
        path: frontend/src/lib/wasm
        key: mls-wasm-${{ runner.os }}${{ steps.host.outputs.tag }}-wp0.15.0-${{ hashFiles('frontend/mls-wasm/**', 'frontend/mls-core/**', 'frontend/mail-tls/**', 'rust-toolchain.toml') }}

    - name: Setup Rust
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        toolchain: stable
        target: wasm32-unknown-unknown
        # The repository root holds no workspace manifest, so the default (`.`) makes the bundled
        # rust-cache run `cargo metadata` there and print `failed with exit code 101` on every
        # run - a red line that means nothing and teaches its reader to skip red lines.
        cache-workspaces: |
          frontend/mls-wasm
          frontend/mail-tls
        # The Xcode major on macOS, empty elsewhere (see "Name the host toolchain"): the restored
        # `target/` holds host proc macros linked by that Xcode and loaded by that image's dyld.
        cache-key: ${{ steps.host.outputs.xcode }}
        # THIS ACTION EXPORTS ITS `rustflags` INTO $GITHUB_ENV, so its default (`-D warnings`) does
        # not stay in this step - it becomes RUSTFLAGS for EVERY LATER STEP OF THE CALLING JOB. The
        # AppImage release of v0.14.1 died that way: `bun tauri build`, six steps down, compiled the
        # vendored `tao` patch under our lint bar and three upstream `glib::MainContext::channel`
        # deprecations became errors. A path dependency is the one kind Cargo does NOT `--cap-lints
        # allow`, so vendoring a crate silently opts its upstream code into our strictness.
        #
        # WORSE, IT WAS INTERMITTENT: every step here is gated on a WASM cache miss, so whether the
        # release built at all depended on whether a cache entry had expired. Emptying it here makes
        # the flag scoped to the one command that should carry it, below.
        rustflags: ''
        # THE SAME TRAP, UNDER A NEW NAME: from v2 this action ALSO exports `CARGO_BUILD_WARNINGS`
        # (default `deny`) into $GITHUB_ENV. `1.6.12-alpha.1`'s iOS build died on it: the vendored
        # `wry` patch's upstream warnings became errors. `action-pins.test.mjs` holds both inputs empty.
        build-warnings: ''

    - name: Install wasm-pack
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: ./scripts/install-wasm-pack.sh

    # RING COMPILES C FOR wasm32 (frontend/mail-tls, the mail client's TLS), and Apple's clang has
    # no WebAssembly backend, so on macOS the C compiler for that one target is Homebrew's LLVM.
    # Named for the wasm32 target ONLY (`CC_wasm32_unknown_unknown`) and only in the build step's
    # env, never $GITHUB_ENV: the iOS build that follows keeps Xcode's compiler for everything else.
    # Linux images carry an LLVM clang, which has the backend. A missing compiler is said HERE.
    - name: Find a C compiler for wasm32
      id: wasmcc
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        cc=clang
        if [ "$RUNNER_OS" = "macOS" ]; then
          prefix="$(brew --prefix llvm 2>/dev/null || true)"
          if [ -z "$prefix" ] || [ ! -x "$prefix/bin/clang" ]; then
            echo "no Homebrew LLVM on this image: installing it (Apple clang cannot target wasm32)"
            brew install llvm
            prefix="$(brew --prefix llvm)"
          fi
          cc="$prefix/bin/clang"
          echo "cc=$cc" >> "$GITHUB_OUTPUT"
          echo "ar=$prefix/bin/llvm-ar" >> "$GITHUB_OUTPUT"
        fi
        "$cc" --version | sed -n 1p
        echo 'int canari_wasm_cc_probe(void) { return 0; }' > "$RUNNER_TEMP/probe.c"
        if ! "$cc" --target=wasm32-unknown-unknown -c "$RUNNER_TEMP/probe.c" -o "$RUNNER_TEMP/probe.o"; then
          echo "::error::$cc cannot compile for wasm32-unknown-unknown, which ring (frontend/mail-tls) needs"
          exit 1
        fi

    # The command is `checks.sh mls-wasm-build` (2026-11-15), the one copy the local pre-push run
    # calls too. It sets `RUSTFLAGS=-D warnings` itself - where that belongs: on OUR crypto crates,
    # and nowhere else. Registry dependencies are lint-capped by Cargo, so this reaches mls-wasm and
    # mls-core only.
    - name: Build WASM
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        WASM_CC: ${{ steps.wasmcc.outputs.cc }}
        WASM_AR: ${{ steps.wasmcc.outputs.ar }}
      run: |
        set -euo pipefail
        # Only when the step above named one (macOS); elsewhere the default clang is the one probed.
        if [ -n "$WASM_CC" ]; then
          export CC_wasm32_unknown_unknown="$WASM_CC" AR_wasm32_unknown_unknown="$WASM_AR"
        fi
        bash .github/scripts/checks.sh mls-wasm-build

    # A cache that restores an empty directory would otherwise be found by a module-resolution
    # error three steps later, in a job that has nothing to do with crypto. Say it here.
    #
    # AND REFUSE A WASM THAT CAN PANIC, which is the same question one step further on: the file
    # exists, and can it run? `mls-core` compiles for the host AND for wasm32, and a `std` API that
    # is missing on wasm32 still COMPILES there - `cargo check --target wasm32-unknown-unknown` is
    # green - then PANICS in the browser. v0.16.4 shipped `std::time::SystemTime::now()` inside
    # `load_or_create` that way: every web login unwound in MLS init and the login path reported it
    # as `auth_pin_mismatch`, so every user was told their correct PIN was wrong. Nothing between
    # the merge and the outage could see it.
    #
    # `std` reaches those shims through its per-platform unsupported module, whose panics all carry
    # one sentence, so this catches ANY missing API rather than the clock alone.
    #
    # NO `if:` ON THIS STEP, deliberately: it must also judge a CACHE HIT. The cache is keyed on the
    # crate sources, so an entry stored before this check existed restores an unjudged artefact, and
    # a gate that only runs on a rebuild is a gate a cache turns off.
    #
    # ONE IMPLEMENTATION, IN BASH (`checks.sh mls-wasm-verify`, which the local pre-push run calls
    # too since 2026-11-15). This action is where every pipeline builds the file, and it installs
    # no runtime of its own - a second copy in a `package.json` script would drift from this one on
    # the day somebody edits the marker, and the drift is invisible until it matters.
    - name: Verify the artefact
      shell: bash
      env:
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: bash .github/scripts/checks.sh mls-wasm-verify
