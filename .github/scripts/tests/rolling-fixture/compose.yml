# A four-service estate for deploy-rolling.test.sh, wired as production is: the EDGE (a copy of the
# real infrastructure/edge/nginx.conf, production's image) holds the host port, a FRONTEND nginx asks an
# AUTH service about each API request (as production's asks core-service) and then proxies it to an
# API, and the frontend and the API are images "this repository builds" (prefix `rolltest/`)
# declared overlap, each with the rotation that takes its old replica out of the nginx in front
# before it stops. And, as production calls one service from another: a MESH (the real
# infrastructure/edge/mesh.conf, its routes swapped for the API's) that the API's rotation names too,
# and a CALLER container the test runs a client in, calling the API through the mesh - or, for the
# control, by its own DNS name.
name: canari-rolltest

services:
  api:
    labels:
      canari.deploy.replace: overlap
      canari.deploy.rotation: frontend:3000,mesh:3000
    image: rolltest/api:${TAG:?TAG is required}
    environment:
      VERSION: ${TAG}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s
    # As production's services, which call one another through the mesh: on the release that adds it,
    # the mesh is up before them.
    depends_on:
      mesh:
        condition: service_started

  # Never replaced by a release (pinned, a third-party image running a mounted script), so a
  # subrequest's connection never lands on the replica being retired: auth.mjs says why it exists.
  auth:
    labels:
      canari.deploy.replace: pinned
    image: oven/bun:1.4.3-alpine
    command: ["bun", "/fixture/auth.mjs"]
    volumes:
      - ${FIX_DIR:?FIX_DIR is required}:/fixture:ro
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s

  frontend:
    labels:
      canari.deploy.replace: overlap
      canari.deploy.rotation: edge:80
    image: rolltest/frontend:${TAG:?TAG is required}
    # The target lists rolling.sh writes, mounted as production mounts them - and the `upstream` lists
    # of 1.6.2 beside them, which a frontend of that release reads: one file runs both eras here,
    # where production's compose of each release mounts its own (a container keeps the mounts it was
    # created with, so a 1.6.2 frontend keeps its own across the deploy that replaces it).
    volumes:
      - ${EDGE_DIR:?EDGE_DIR is required}/targets:/etc/nginx/targets:ro
      - ${EDGE_DIR:?EDGE_DIR is required}/rotation:/etc/nginx/rotation:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s
    depends_on:
      api:
        condition: service_started
      auth:
        condition: service_started

  edge:
    labels:
      canari.deploy.replace: pinned
    # Production's edge image, digest included - deploy-replace.test.sh holds the two equal.
    image: nginx:1.31.8-alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    command: ["nginx", "-c", "/etc/nginx/edge/nginx.conf", "-g", "daemon off;"]
    volumes:
      - ${EDGE_DIR:?EDGE_DIR is required}:/etc/nginx/edge:ro
    ports:
      - "127.0.0.1:${ROLLTEST_PORT:?ROLLTEST_PORT is required}:80"
    # Production's healthcheck, required identical by deploy-replace.test.sh: without it the first
    # deploy believed a `running` edge that was not yet listening, and the test's first POST met
    # Docker's port proxy resetting it (3 runs in 62, 2026-10-18).
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/run/nginx.pid && grep -q ' 00000000:0050 00000000:0000 0A ' /proc/net/tcp"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s
    depends_on:
      frontend:
        condition: service_started

  # Production's mesh: its image, its mount of the edge directory, its configuration (deploy-rolling
  # writes edge/mesh.conf from the real file, with the fixture's one route), and its healthcheck on
  # the one port it listens on here (0x0BB8 = 3000).
  mesh:
    labels:
      canari.deploy.replace: pinned
    image: nginx:1.31.8-alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    command: ["nginx", "-c", "/etc/nginx/edge/mesh.conf", "-g", "daemon off;"]
    volumes:
      - ${EDGE_DIR:?EDGE_DIR is required}:/etc/nginx/edge:ro
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/run/nginx.pid && grep -q ' 00000000:0BB8 00000000:0000 0A ' /proc/net/tcp"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s

  # Another service of the estate, for the calls one service makes to another: the test runs
  # client.mjs inside it (`docker exec`), on the runtime the services run on. Pinned and idle otherwise.
  caller:
    labels:
      canari.deploy.replace: pinned
    image: oven/bun:1.4.3-alpine
    command: ["sleep", "infinity"]
    # As production's Bun callers set it (deploy-replace.test.sh holds the two equal): a resolved
    # address is kept the resolver lifetime, not Bun's 30 s, which case 2d measures across a recreate.
    environment:
      BUN_CONFIG_DNS_TIME_TO_LIVE_SECONDS: "2"
    volumes:
      - ${FIX_DIR:?FIX_DIR is required}:/fixture:ro
    depends_on:
      mesh:
        condition: service_started
