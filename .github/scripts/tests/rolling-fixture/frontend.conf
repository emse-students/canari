# A stand-in for the frontend's nginx, for deploy-rolling.test.sh. It carries what of
# infrastructure/local/Dockerfile.frontend the rolling replacement depends on - the replica list it
# includes, the `auth_request` every API location makes BEFORE choosing its upstream, and the three
# directives the test asserts the real file carries too - and nothing else.

# The replica list rolling.sh writes (`upstream api`), included as the frontend's nginx includes it.
include /etc/nginx/rotation/frontend.conf;

server {
    listen 80;
    resolver 127.0.0.11 valid=2s ipv6=off;
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout;

    location = /nginx-health {
        access_log off;
        return 200;
    }

    # Production asks core-service; the fixture asks a pinned `auth` service (auth.mjs says why).
    location = /internal/auth {
        internal;
        set $upstream_auth auth:3001;
        proxy_pass http://$upstream_auth/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location /api/ {
        auth_request /internal/auth;
        # The group's name, no port: nginx picks the `upstream api` list, not a DNS lookup.
        set $upstream_api api;
        proxy_pass http://$upstream_api;
    }
}
