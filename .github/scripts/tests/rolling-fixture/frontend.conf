# A stand-in for the frontend's nginx, for deploy-rolling.test.sh. It carries the three directives of
# infrastructure/local/Dockerfile.frontend that the rolling replacement depends on - the test asserts
# the real file carries the same three - and nothing else.
server {
    listen 80;
    resolver 127.0.0.11 valid=2s ipv6=off;
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout;

    location = /nginx-health {
        access_log off;
        return 200;
    }

    location /api/ {
        set $upstream_api api:3000;
        proxy_pass http://$upstream_api;
    }
}
