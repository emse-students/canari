# A stand-in for the frontend's nginx, for deploy-rolling.test.sh. It carries what of
# infrastructure/local/Dockerfile.frontend the rolling replacement depends on - the replica list it
# includes, and the three directives the test asserts the real file carries too - and nothing else.

# The replica list rolling.sh writes (`upstream api`), included as the frontend's nginx includes it.
include /etc/nginx/rotation/frontend.conf;

server {
    listen 80;
    resolver 127.0.0.11 valid=2s ipv6=off;
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout;

    location = /nginx-health {
        access_log off;
        return 200;
    }

    location /api/ {
        # The group's name, no port: nginx picks the `upstream api` list, not a DNS lookup.
        set $upstream_api api;
        proxy_pass http://$upstream_api;
    }
}
