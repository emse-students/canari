# A stand-in for the frontend's nginx, for deploy-rolling.test.sh. It carries what of
# infrastructure/local/Dockerfile.frontend the rolling replacement depends on - the target list it
# includes, the `auth_request` every API location makes BEFORE choosing its upstream, and the three
# directives the test asserts the real file carries too - and nothing else.

# The target list rolling.sh writes (`$target_api`), included as the frontend's nginx includes it.
include /etc/nginx/targets/frontend.conf;

server {
    listen 80;
    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 2s;
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout;

    location = /nginx-health {
        access_log off;
        return 200;
    }

    # Production asks core-service; the fixture asks a pinned `auth` service (auth.mjs says why).
    location = /internal/auth {
        internal;
        set $upstream_auth auth:3001;
        proxy_pass http://$upstream_auth/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location /api/ {
        auth_request /internal/auth;
        # The target the list sets: `api:3000` at rest, resolved for the request; the new replica's
        # container name during a take-out, resolved the same way.
        proxy_pass http://$target_api;
    }
}
