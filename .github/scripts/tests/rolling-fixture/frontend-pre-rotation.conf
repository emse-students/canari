# The fixture's frontend as it was BEFORE the replica lists (2026-11-01): every service by its DNS
# name and port, re-resolved every 2 s - what production's frontend image did until then. A release
# still finds such an image running on the first deploy that carries the lists, and runs one again
# after a rollback to an older release; deploy-rolling.test.sh exercises both.

server {
    listen 80;
    resolver 127.0.0.11 valid=2s ipv6=off;
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout;

    location = /nginx-health {
        access_log off;
        return 200;
    }

    location = /internal/auth {
        internal;
        set $upstream_auth auth:3001;
        proxy_pass http://$upstream_auth/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location /api/ {
        auth_request /internal/auth;
        set $upstream_api api:3000;
        proxy_pass http://$upstream_api;
    }
}
