  # --- npm, bundled in node:24-alpine (the frontend-ssr base) ------------------------------------
  # The image runs `node index.js` and nothing else: npm is never invoked in it, so its own
  # dependencies (brace-expansion, undici) are files on disk, not code that runs.
  - id: CVE-2026-102276
    paths:
      - "usr/local/lib/node_modules/npm/**"
    statement: "A dependency of the npm CLI bundled in node:24-alpine; frontend-ssr runs node index.js and never invokes npm."
  - id: CVE-2026-102278
    paths:
      - "usr/local/lib/node_modules/npm/**"
    statement: "A dependency of the npm CLI bundled in node:24-alpine; frontend-ssr runs node index.js and never invokes npm."
  - id: CVE-2026-19534
    paths:
      - "usr/local/lib/node_modules/npm/**"
    statement: "A dependency of the npm CLI bundled in node:24-alpine; frontend-ssr runs node index.js and never invokes npm."

