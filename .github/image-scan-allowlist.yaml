  # --- npm, bundled in node:24-alpine (the frontend-ssr base) ------------------------------------
  # The image runs `node index.js` and nothing else: npm is never invoked in it, so its own
  # dependencies (brace-expansion, undici) are files on disk, not code that runs.
  - id: CVE-2026-102276
    paths:
      - "usr/local/lib/node_modules/npm/**"
    statement: "A dependency of the npm CLI bundled in node:24-alpine; frontend-ssr runs node index.js and never invokes npm."
  - id: CVE-2026-102278
    paths:
      - "usr/local/lib/node_modules/npm/**"
    statement: "A dependency of the npm CLI bundled in node:24-alpine; frontend-ssr runs node index.js and never invokes npm."
  - id: CVE-2026-19534
    paths:
      - "usr/local/lib/node_modules/npm/**"
    statement: "A dependency of the npm CLI bundled in node:24-alpine; frontend-ssr runs node index.js and never invokes npm."
  # undici 6.28.0 at usr/local/lib/node_modules/npm/node_modules/undici (2026-10-24): npm's own copy.
  # node:24-alpine is a floating tag already at the newest Node 24 (24.22.1, 2026-10-20, npm 11.19.1),
  # so there is nothing to move to; the next rebuild retires this. Node's built-in fetch (the
  # healthcheck's) is compiled into the node binary and is not this file.
  - id: CVE-2026-109869
    paths:
      - "usr/local/lib/node_modules/npm/**"
    statement: "undici 6.28.0 bundled with the npm CLI in node:24-alpine; frontend-ssr runs node index.js and never invokes npm, and node's own fetch is built into the binary, not this copy."

  # Two more advisories on the same npm-bundled undici 6.28.0 (2026-10-28), fixed in 6.29.1: re-read
  # that day, node:24-alpine (24.22.1, npm 11.19.1, built 2026-10-21) still carries 6.28.0, so there
  # is no patched tag to move to. Scoped by purl to that one version, so a newer npm is not covered
  # and the rescan retires each entry the day the image moves. Verified: the file is under npm's own
  # node_modules and frontend-ssr's final stage runs `node index.js` only; not verified: that nothing
  # else in the image shells out to npm.
  - id: CVE-2026-109383
    purls:
      - "pkg:npm/undici@6.28.0"
    statement: "undici 6.28.0 (certificate validation bypass) bundled with the npm CLI in node:24-alpine; frontend-ssr runs node index.js and never invokes npm, and node's own fetch is built into the binary, not this copy. No patched node:24-alpine yet; remove when the tag ships npm with undici >= 6.29.1."
  - id: CVE-2026-87018
    purls:
      - "pkg:npm/undici@6.28.0"
    statement: "undici 6.28.0 (denial of service via TLS renegotiation) bundled with the npm CLI in node:24-alpine; frontend-ssr runs node index.js and never invokes npm, and node's own fetch is built into the binary, not this copy. No patched node:24-alpine yet; remove when the tag ships npm with undici >= 6.29.1."

  # --- brotli-libs 1.2.0-r1, in the Alpine 3.24 images (decided 2026-10-24) ---------------------
  # Reported in adminer, nginx:1.31.8-alpine (the edge), nginx:stable-alpine (the frontend base) and
  # postgres:18-alpine. Every one of those pins was already the newest upstream build: Alpine shipped
  # the fix (1.2.1-r0) on 2026-10-22 and the official images were rebuilt that day still carrying
  # 1.2.0-r1, so there was no patched digest to move to. Scoped by purl to that one package version,
  # so a later brotli build is NOT covered and the rescan retires the entry the day the pins move.
  # What was verified (Trivy's package inventory of each image): the only packages depending on
  # brotli-libs are libcurl (all four) and freetype (both nginx). Nothing verified which processes
  # call them at runtime.
  - id: CVE-2026-111497
    purls:
      - "pkg:apk/alpine/brotli-libs@1.2.0-r1"
    statement: "brotli-libs 1.2.0-r1 in adminer, nginx:1.31.8-alpine, nginx:stable-alpine and postgres:18-alpine, pulled in only by libcurl (all four) and freetype (nginx): it decodes brotli in HTTP responses curl fetches and in WOFF2 fonts, not in request bodies these servers accept - the dependency graph was verified, runtime use was not. No patched upstream image yet (Alpine fixed 2026-10-22; official nginx/postgres/adminer images rebuilt only with 1.2.0); remove when the pins are rebuilt."
  # The same advisory as Debian's libbrotli1 1.1.0-2+b7, in ghcr.io/goauthentik/server:2026.8.5
  # (Debian 13), reported 2026-10-24 and fixed in Debian's 1.1.0-2+deb13u1. 2026.8.5 (2026-10-21) is
  # the newest authentik release, and this repository does not rebuild that image, so there is no pin
  # to move. Scoped by purl to that one build: the retirement check reads each purl's package, so this
  # half retires on its own even while the Alpine half above is still reported. Which authentik
  # processes load libbrotli1 was NOT verified.
  - id: CVE-2026-111497
    purls:
      - "pkg:deb/debian/libbrotli1@1.1.0-2+b7"
    statement: "Debian libbrotli1 1.1.0-2+b7 in authentik 2026.8.5, the newest authentik release, an upstream image this repository does not build, so the fix is not ours to ship; which processes load it was not verified. Remove when an authentik release ships 1.1.0-2+deb13u1."

  # Three Python libraries in the same authentik image (2026-10-27), each HIGH with a published fix
  # and none in a release: 2026.8.5 (2026-10-21) is the newest. Read from authentik's own lockfile
  # at that tag (not from running the image): dnspython arrives only through `email-validator`;
  # msgpack through `django-channels-postgres` (its own workspace package) and `autobahn`; oauthlib
  # through `requests-oauthlib`, authentik's client side of an external OAuth source. Scoped by
  # purl, so a different build of any of them is not covered, and the retirement check reads each
  # entry as `id package version`. A second msgpack copy (1.1.2, outside the lockfile read
  # here, so its origin is unverified; fixed in 1.2.3 too) is covered by a second purl on the
  # same entry. NOT verified for any of the three: which authentik process imports it at runtime, and whether input an outsider controls
  # reaches the vulnerable call; the advisories name denial of service (dnspython, msgpack), and
  # oauthlib's text was not read in full.
  - id: CVE-2026-114605
    purls:
      - "pkg:pypi/dnspython@2.8.0"
    statement: "dnspython 2.8.0 (denial of service on a crafted DNS compression pointer chain) in authentik 2026.8.5: required only by email-validator, which resolves a domain when it checks an address; whether that check runs with deliverability on, and on whose input, was not verified. still present in authentik 2026.8.5; no authentik release ships the fix yet. Upstream image, not rebuildable here; remove when a release ships the fixed library."
  - id: CVE-2026-114613
    purls:
      - "pkg:pypi/msgpack@1.2.1"
      - "pkg:pypi/msgpack@1.1.2"
    statement: "msgpack 1.2.1 and 1.1.2 (memory leak while deserializing a map) in authentik 2026.8.5: required by django-channels-postgres and autobahn, so it decodes authentik's own internal messages; whether any of that input comes from outside the deployment was not verified. still present in authentik 2026.8.5; no authentik release ships the fix yet. Upstream image, not rebuildable here; remove when a release ships the fixed library."
  - id: CVE-2026-49272
    purls:
      - "pkg:pypi/oauthlib@3.3.1"
    statement: "oauthlib 3.3.1 in authentik 2026.8.5: required by requests-oauthlib, the client side of authentik's external OAuth sources, which the blueprints may use for a sign-in source (not checked whether it is an OAuth one); whether the advisory's conditions can arise there, and the full advisory text, were not verified. still present in authentik 2026.8.5; no authentik release ships the fix yet. Upstream image, not rebuildable here; remove when a release ships the fixed library."

