  # --- curl 8.22.0-r0, in the same four Alpine 3.24 images (2026-10-26) -------------------------
  # CVE-2026-92392 (HTTP/2 upload use-after-free), fixed by Alpine in 8.23.0-r0. Reported as `curl`
  # in adminer, nginx:1.31.8-alpine and nginx:stable-alpine, and as `libcurl` in postgres:18-alpine.
  # Measured with Trivy 0.75.0 on 2026-10-26: adminer:latest and nginx:1.31.8-alpine are still the
  # pinned digests, nginx:stable-alpine and postgres:18-alpine (a newer digest than the pin) were
  # rescanned and carry the same 8.22.0-r0, so there was no patched digest to move to. Scoped by purl,
  # so a later curl build is NOT covered and the rescan retires each half the day its pin moves.
  # The `curl` half was retired on 2026-11-12 (#3260): adminer 3a07decd carries no curl 8.22.0-r0,
  # and the scan of that run reported it in no other image. Only postgres's `libcurl` is left.
  - id: CVE-2026-92392
    purls:
      - "pkg:apk/alpine/libcurl@8.22.0-r0"
    statement: "libcurl 8.22.0-r0 (postgres:18-alpine): HTTP/2 upload use-after-free in a client library postgres does not call on request data; which processes load it was not verified. No patched upstream image yet (Alpine ships 8.23.0-r0); remove when the postgres pin is rebuilt."

