# =================================================================================================
# THE IMAGE SCAN'S ALLOWLIST - Trivy's own ignore-file format, read by `.github/scripts/image-scan.sh`
#
# EVERY ENTRY CARRIES A `statement`: why the advisory does not reach us, or why the fix is not ours
# to ship today. `image-scan-allowlist.test.mjs` refuses an entry without one, and refuses a date
# (`expired_at`): an entry is retired by EVIDENCE, never by a clock.
#
# AND EVERY ENTRY RETIRES ITSELF. `image-scan.sh` scans each image a second time WITHOUT this file,
# and an id that scan no longer reports fails the run: the image moved, the reason is gone, delete
# the entry. So a pull request that moves a pin (an authentik upgrade, a postgres digest) deletes
# the entries it made unnecessary in the same commit.
#
# Measured with Trivy 0.75.0 on 2026-10-23; the reasoning is in docs/wiki/cicd.md
# ("Container images are scanned").
# =================================================================================================
vulnerabilities:

  # --- gosu, in the official postgres images (production's 18, the identity provider's 16) -------
  # gosu is built by the postgres image's maintainers with Go 1.24.6, and every Go standard-library
  # advisory since lands on it. It runs ONCE, in the entrypoint, to drop from root to `postgres`,
  # then exec()s the server - it holds no socket and parses no input, so the net/http, crypto/x509
  # and archive code these advisories are about never runs. gosu's own SECURITY.md says so. The fix
  # is a postgres image rebuilt on a newer Go, which is upstream's to ship; the digest moves with it.
  - id: CVE-2025-61726
    paths:
      - "usr/local/bin/gosu"
    statement: "Go stdlib in gosu, which only drops privileges at container start and exec()s postgres; the vulnerable code never runs. Upstream postgres image."
  - id: CVE-2025-61729
    paths:
      - "usr/local/bin/gosu"
    statement: "Go stdlib in gosu, which only drops privileges at container start and exec()s postgres; the vulnerable code never runs. Upstream postgres image."
