# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# This repository had NO version-update configuration until 2026-08-26 while carrying
# `dependabot-auto-merge.yml` - an auto-merge workflow with nothing but security alerts to merge.
# It is the largest of the five projects and the only one with Rust, Docker and native manifests,
# so it is also the one where a silent drift costs the most.
#
# ---------------------------------------------------------------------------------------------
# What is DELIBERATELY not declared here
#
#   frontend/src-tauri/patches/*    Vendored FORKS (tauri-plugin-keystore, tauri-plugin-system-components,
#                                   tauri-plugin-websocket - the Happy Eyeballs connect). Their versions are
#                                   pinned to the patch, not to upstream; a bump here would revert
#                                   the patch. They move when somebody rebases them by hand.
#   frontend/src-tauri/gen/apple    The iOS project has NO manifest Dependabot reads. The Podfile
#                                   declares no pod (Firebase arrives by Swift Package Manager), and
#                                   CocoaPods is not a Dependabot ecosystem anyway; the `swift`
#                                   ecosystem reads a `Package.swift`, and this is an Xcode project
#                                   whose packages live in `project.pbxproj` + `Package.resolved`.
#                                   `firebase-ios-sdk` is therefore moved by hand, with its Android
#                                   twin (docs/wiki/cicd.md, "Native and identity-provider manifests").
#   infrastructure/local/_archived  Kept for reference, built by nothing.
#
# The grouping is the ecosystem's: dev minor+patch and prod patch collapse into one PR to cut noise,
# majors arrive alone so they are reviewed alone. Same prefix and labels as Sky, MiGallery and
# Portail-etu so the five repos read the same in a notification list.
#
# ---------------------------------------------------------------------------------------------
# NO BLOCK CARRIES `target-branch` ANY MORE, AND THE DANGER IT ANSWERED HAS MOVED RATHER THAN GONE
#
# For one day (2026-09-02) every block targeted a `dev` branch, so a dependency update met a copy of
# production's data before production got it. The measurement behind that is the outage of
# 2026-09-01: `postgres 15-alpine -> 18-alpine` went green through every gate this repository has,
# was auto-merged onto `main`, and PG 18 then refused production's data directory - 33 minutes down.
# Nothing in CI could have seen it, because what failed was RUNNING against real data and no gate
# here runs anything against real data.
#
# The user cancelled the two-branch model the following day: `main` is the only branch, and updates
# merge onto it as before. WHAT PROTECTS PRODUCTION NOW IS THAT A MERGE DOES NOT DEPLOY. Nothing
# reaches an estate until a release is published, so an update that would break production sits on
# `main` until somebody cuts a release - and a `X.X.X-alpha.N` pre-release deploys the dev estate
# first, on its fictional seed data, whenever one is published.
#
# THE DIFFERENCE IS WHO DECIDES, and it is worth being honest about: the old mechanism ran with
# nobody at the keyboard, this one runs when a human publishes an alpha. The ceiling in `ci.yml`'s
# `Dependency ceiling` check is what still refuses the update classes this repository cannot see
# the failure mode of; it is not a substitute for a rehearsal, and the backlog says so.

version: 2
updates:
  # --- CI ---------------------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    rebase-strategy: auto
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5

  # --- Frontend (bun) ---------------------------------------------------------------------------
  # `frontend/bun.lock` is the one committed JS lockfile; see .gitignore, which negates it out of
  # the blanket `*.lock` rule.
  - package-ecosystem: "bun"
    directory: "/frontend"
    rebase-strategy: auto
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    # TypeScript is held at 6 ON PURPOSE, and it is not laziness - see
    # `docs/wiki/ecosystem-convergence.md`, section 9, for the two measurements. Without this
    # ignore, Dependabot proposes `typescript 6.0.3 -> 7.0.2` and `arm-auto-merge.yml` is sitting
    # right there. Delete this block only after re-running BOTH checks.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "frontend"
    open-pull-requests-limit: 5
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: "production"
        update-types: ["patch"]

  # --- Backend services (bun) -------------------------------------------------------------------
  # Four NestJS services, each with its own bun.lock. They drifted apart without this:
  # @nestjs/core sat at 11.1.19 in two services and 11.1.28 in the other two, and typeorm at 1.0.6
  # against 1.1.0, in one monorepo.
  #
  # These lockfiles MUST stay at `lockfileVersion: 1`. Dependabot bundles bun 1.3.14 and answers
  # `UnknownLockfileVersion` on a v2 lockfile - it does not fail the run, it silently stops opening
  # pull requests for the directory, which looks exactly like having none to open. A bun >= 1.4.0
  # only writes v2 into a lockfile it CREATES, so the hazard is deleting a bun.lock and reinstalling.
  - package-ecosystem: "bun"
    directories:
      - "/apps/core-service"
      - "/apps/social-service"
      - "/apps/media-service"
      - "/apps/chat-delivery-service"
    rebase-strategy: auto
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    # TypeScript is held at 6 ON PURPOSE, and it is not laziness - see
    # `docs/wiki/ecosystem-convergence.md`, section 9, for the two measurements. Without this
    # ignore, Dependabot proposes `typescript 6.0.3 -> 7.0.2` and `arm-auto-merge.yml` is sitting
    # right there. Delete this block only after re-running BOTH checks.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "backend"
    open-pull-requests-limit: 10
    # ORDER MATTERS: a dependency joins the FIRST group whose patterns match it, and the two
    # catch-alls below match on `dependency-type` alone, so anything specific has to come first.
    groups:
      # A FRAMEWORK MOVES AS ONE PIECE OR IT DOES NOT MOVE.
      #
      # On 2026-08-31 `@nestjs/platform-express` 11 -> 12 arrived as its own pull request, was
      # merged on a green CI, and left `@nestjs/common` and `@nestjs/core` at 11 in core-service
      # and chat-delivery-service both - `platform-express@12` declaring `peerDependencies:
      # {"@nestjs/common": "^12.0.0", "@nestjs/core": "^12.0.0"}` against two packages pinned at
      # 11.2.3. Nothing in CI could see it: a peer mismatch is a warning to bun, tsc checks only
      # the surface the code uses, and no test calls `NestFactory`, so the adapter that package
      # exists to provide is never instantiated.
      #
      # This group includes MAJORS on purpose - it is the one case where a major must not arrive
      # alone. It does not make the update automatic: the auto-merge ceiling still refuses any
      # major, so this decides that a human reviews ONE coherent pull request per service rather
      # than eight incoherent ones.
      nestjs:
        patterns:
          - "@nestjs/*"
        update-types: ["major", "minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: "production"
        update-types: ["patch"]

  # --- Rust -------------------------------------------------------------------------------------
  # Six crates that are ours. The MLS crates are the reason `cargo audit` matters here and not only
  # in CI: openmls and its crypto backend are where a vulnerability would be an encryption defect,
  # not a availability one.
  #
  # TWO OF THE SIX DIRECTORIES BELOW ARE DECLARED AND UNREACHABLE, and they are declared anyway so
  # that the day the block lifts they are already covered. `frontend/src-tauri` and the plugin under
  # it reach a manifest carrying `links`, which cargo refuses without a build script - and Dependabot
  # materialises manifests and lockfiles only, never `build.rs`. So both produce nothing, silently,
  # since 2026-08-08. `.github/scripts/tests/dependabot-cargo-reach.test.sh` pins that set and fails
  # if it grows; the entry in docs/wiki/backlog.md carries what it costs and the ways out.
  - package-ecosystem: "cargo"
    directories:
      - "/apps/call-service"
      - "/apps/chat-gateway"
      - "/frontend/mls-core"
      - "/frontend/mls-wasm"
      - "/frontend/src-tauri"
      - "/frontend/src-tauri/plugins/tauri-plugin-customtabs"
    rebase-strategy: auto
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    open-pull-requests-limit: 10
    # tokio-tungstenite is a DIRECT dependency of chat-gateway only so the error under axum's can
    # be downcast; it MUST stay on the version axum itself resolves, or the classifier reads
    # nothing. #944 bumped it alone to 0.30 while axum stayed on 0.29 and every client goodbye
    # became an ERROR line again (prod, 2026-10-07). It moves with axum, by hand.
    ignore:
      - dependency-name: "tokio-tungstenite"
    # ORDER MATTERS: first matching group wins, so the specific ones come before the catch-alls.
    groups:
      # The same rule as `nestjs` above, on the crates where getting it wrong is an ENCRYPTION
      # defect rather than an availability one. openmls, openmls_traits, openmls_rust_crypto and
      # openmls_basic_credential are one release train: on 2026-08-31 they arrived as four separate
      # 0.5 -> 0.6 pull requests, and the measurement is that NONE of them can build alone -
      # openmls 0.9.0 against openmls_traits 0.5.0 fails with 46 errors, all of them one sentence:
      # `there are multiple different versions of crate openmls_traits in the dependency graph`.
      # Four green-looking pull requests, four guaranteed red runs, and a reviewer's afternoon.
      # Majors are included so they arrive together.
      #
      # Grouping them does NOT make them automatic, and the two gates answer different halves.
      # `tests/cross_version_state.rs` answers the half no compiler can: does today's code still
      # open a group, a frame and a keystore written by the previous version. The COMPILER answers
      # the other half, and on this bump it spoke first - openmls 0.9.0 adds `OwnPendingCommit` and
      # `OwnPrivateMessage` to `ProcessedMessageContent`, a semantic change this crate has to make
      # a decision about rather than absorb.
      openmls:
        patterns:
          - "openmls*"
        update-types: ["major", "minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: "production"
        update-types: ["patch"]

  # --- Container base images --------------------------------------------------------------------
  # One directory, eight Dockerfiles. This is what would have caught Dockerfile.frontend-ssr sitting
  # on node:22-alpine while every other image in the same folder had moved to node:24.
  - package-ecosystem: "docker"
    directory: "/infrastructure/local"
    rebase-strategy: auto
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5
    # NODE 25 IS AN ODD MAJOR, OUT OF SUPPORT SINCE 2026-06-01 AND NO LONGER REBUILT: #2338 moved
    # frontend-ssr onto it and the image scan reported its stale OpenSSL and npm the same day. Odd
    # majors never become LTS, so a node major moves by hand, onto the next LTS line (26), and
    # Dependabot keeps the minors and patches of the one in place. (A `versions` range is refused
    # for a docker ignore, measured on #2362.)
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # --- Android (Gradle) ---------------------------------------------------------------------------
  # `gen/android` is COMMITTED AND HAND-MAINTAINED, not regenerated: its build files carry decisions
  # (the AppCompat theme, the Firebase and AndroidX pins, AGP in `buildSrc`, the Gradle wrapper), so
  # until 2026-10-23 they aged with nothing watching them. Its `settings.gradle` applies
  # `tauri.settings.gradle`, which is generated and ignored by version control - so this directory
  # may fail to resolve for Dependabot, silently, like the two cargo directories above. If it never
  # opens a pull request, read its update job in the Actions log before believing there is nothing
  # to do.
  #
  # THE CEILING JUDGES THESE BY THE `compile-android-app` JOB OF `ci.yml` (2026-10-30). It
  # generates the file above with the app crate's build script, stands a committed stub in for
  # the `google-services.json` secret, and runs `:app:checkArm64DebugAarMetadata`,
  # `:app:processArm64DebugMainManifest` and `:app:compileArm64DebugKotlin`. That is evidence about
  # the Kotlin and the dependency metadata, not about a signed release build; `android.yml` still
  # alone builds that. `ceiling_gate_for_ref` in `.github/scripts/lib/ceiling.sh` allows only the
  # direct `gen/android/<branch>` shape. One block per directory, never `directories:`, so the
  # branch always names its directory - which is what that function reads.
  - package-ecosystem: "gradle"
    directory: "/frontend/src-tauri/gen/android"
    rebase-strategy: auto
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
    open-pull-requests-limit: 5
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: "production"
        update-types: ["patch"]

  # The JVM project the Android unit tests run in. `test-android` builds and runs it on every pull
  # request that touches it, so the suite IS the gate here and its updates merge like any other.
  # Its wrapper and Kotlin plugin are pinned to `gen/android`'s Gradle (see its `build.gradle.kts`):
  # a wrapper bump here that the app does not take is two Gradles in a developer's cache, not a break.
  - package-ecosystem: "gradle"
    directory: "/frontend/src-tauri/android-tests"
    rebase-strategy: auto
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
    open-pull-requests-limit: 5
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: "production"
        update-types: ["patch"]

  # --- Compose images -----------------------------------------------------------------------------
  # THE `docker` ECOSYSTEM ABOVE READS DOCKERFILES, AND NOTHING WAS READING THE COMPOSE FILES. That
  # is where the third-party images actually live - redis, postgres, adminer - and all three were
  # floating on 2026-09-01: `redis:alpine` was a floating MAJOR serving 8.8.0, `postgres:15-alpine`
  # floated every patch, and `adminer:latest` was a database admin UI on `:latest` in PRODUCTION.
  # They are pinned by digest now, to what production was proven to be running.
  #
  # WHICH IS EXACTLY WHY THIS ENTRY HAS TO EXIST. A digest nothing updates is a FREEZE, not a pin -
  # it converts "silently moving" into "silently ageing", and the second failure mode is the one
  # nobody notices for a year. This is the mechanism that keeps the pin honest.
  - package-ecosystem: "docker-compose"
    directories:
      - "/infrastructure"
      - "/infrastructure/local"
    rebase-strategy: auto
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5

  # --- The identity provider's stack ------------------------------------------------------------
  # `infrastructure/authentik/compose.yml` is MiConnect's reconstruction reference (no pipeline
  # deploys it), and nothing watched it until 2026-10-23. Its OWN block, not a third directory of
  # the one above: the branch then names this directory, and `ceiling_compose_from_ref` reads it to
  # judge a PostgreSQL update against THIS stack's major rather than production's - they differ.
  #
  # WHAT THIS DOES NOT WATCH: the authentik server and worker. Their image is
  # `${AUTHENTIK_IMAGE:-...}:${AUTHENTIK_TAG:-...}` so the host's `.env` can override it, and
  # Dependabot does not resolve an interpolated reference. Writing it literally would make it
  # visible here and take that override away; that is a decision for the operator of the shared
  # host, recorded in docs/wiki/cicd.md ("Native and identity-provider manifests").
  - package-ecosystem: "docker-compose"
    directory: "/infrastructure/authentik"
    rebase-strategy: auto
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5
