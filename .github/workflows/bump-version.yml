# =================================================================================================
# THE ONLY THING THAT WRITES A VERSION, AND THE ONLY PUSH TO `main` THAT IS NOT A PULL REQUEST.
#
# Publishing a release is the whole trigger of the deploy-at-bump model: this workflow rewrites
# every manifest to the tag's version, pushes that commit to `main`, and CD plus the two store
# workflows start from its COMPLETION and read the file it just wrote. Everything downstream
# therefore depends on this run having landed its commit before it finished - which it does, because
# the push is a step inside it.
#
# WHY IT NEEDS AN APP TOKEN AND NOT `GITHUB_TOKEN` (measured 2026-09-03, on the first real release).
# `main` carries ruleset 22152902: no direct push, `CI passed` required. `GITHUB_TOKEN` acts as
# `github-actions[bot]`, which is NOT a bypass actor, and the Actions app CANNOT be made one - GitHub
# answers `422 Actor GitHub Actions integration must be part of the ruleset source or owner
# organization` for a repository-level ruleset. So this push was refused, this run went red, and
# nothing downstream started: fail-safe, and a chain that does not run. The `canari-auto-merge` App
# (id 4791068) IS installed in the organisation, so it can be and now is a bypass actor, and this
# workflow mints an installation token for it. That token lives one hour and is minted per run,
# which is why an App beats a long-lived PAT: there is no secret to rotate before it silently expires.
#
# THE ONE SIDE EFFECT, AND WHY IT IS NOW HARMLESS. A push made with an App token DOES raise a `push`
# event, where a `GITHUB_TOKEN` push does not - `dependabot-auto-merge.yml` documents that asymmetry
# and depends on it. Here it means `ci.yml` runs once on the bump commit, which is useful rather than
# costly. It does NOT double a deploy: WP-2 deleted `on: push` from `cd.yml`, so nothing deploys on a
# push any more. Before re-adding a `push` trigger to any deploy workflow, read this paragraph again.
name: Bump version on release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver without v prefix (e.g. 0.15.0, or 0.15.0-alpha.1 for a tester build)'
        required: true

permissions:
  contents: write

jobs:
  bump-version:
    name: Sync version across manifests
    runs-on: ubuntu-latest
    steps:
      # Minted before the checkout, because the checkout has to store THIS credential as the remote's
      # - a later `git push` uses whatever token the checkout persisted, not the one in scope.
      - name: Mint the identity the ruleset lets push to main
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve target version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.event.release.tag_name }}"
          fi
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Target version: ${VERSION}"

      - name: Bump all package.json and Cargo.toml versions
        run: bash scripts/bump-app-version.sh "${{ steps.version.outputs.version }}"

      - name: Commit and push to main
        id: push
        run: |
          # The App is what the ruleset lets through, so the commit says so rather than claiming to
          # be `github-actions[bot]`, which is the identity that is REFUSED here.
          git config user.name "canari-auto-merge[bot]"
          git config user.email "canari-auto-merge[bot]@users.noreply.github.com"

          # `-u` STAGES WHAT THE SCRIPT ACTUALLY CHANGED, and that replaced an eleven-line
          # enumeration of paths. The list was a second, silent statement of which files carry a
          # version: `bump-app-version.sh` writes them, the list had to remember them, and nothing
          # compared the two - so a new manifest, a new crate or a renamed directory would be bumped
          # on disk and left out of the commit, producing a release whose components disagree with
          # each other. `-u` cannot drift from the script because it asks git, not a human.
          #
          # `-u` AND NOT `-A`, deliberately: it stages modifications to TRACKED files only, so an
          # untracked artefact can never ride along. `frontend/mls-core/Cargo.lock` is the live
          # example - the script rewrites it, `.gitignore` line 115 (`*.lock`) means git does not
          # track it, and it must stay out of the commit. `-A` would have been a behaviour change
          # dressed as a simplification.
          #
          # The tree is safe for this: `actions/checkout` produced it clean and the bump script is
          # the only thing that has run, so "tracked modifications" IS "what the script wrote".
          git add -u

          if git diff --cached --quiet; then
            echo "No version changes (already at ${{ steps.version.outputs.version }})"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Staged for the bump to ${{ steps.version.outputs.version }}:"
          git diff --cached --name-only | sed 's/^/  /'

          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          # THIS PUSH IS THE ONLY THING THAT DEPLOYS ANYTHING (user, 2026-09-02). `cd.yml` starts on
          # this run's completion, reads the version out of the manifest this step just wrote, and
          # sends a pre-release to the dev estate or a stable to production. The three bundle
          # workflows read the same file for the same decision.
          echo "Pushed version bump; CD and the release builds start from this run's completion."
