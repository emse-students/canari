name: Code Analysis

on:
  pull_request:
    branches:
      - main
  schedule:
    # Daily analysis at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_call:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended, security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # Both install steps stay non-fatal: CodeQL analyses JavaScript and TypeScript from source
      # and a missing node_modules costs resolution accuracy, not the run. What is NOT acceptable
      # is silence - these carried `2>/dev/null || true` UNDER `continue-on-error`, three layers
      # hiding the same failure, so an install that had been broken for months would read exactly
      # like one that succeeded. The failure is now named and printed; only the job survives it.
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
        continue-on-error: true

      - name: Install backend dependencies
        run: |
          for svc in chat-delivery-service core-service social-service media-service; do
            echo "--- $svc"
            ( cd "apps/$svc" && npm ci --ignore-scripts )               || echo "::warning title=CodeQL install::npm ci failed for $svc; analysis continues with unresolved imports"
          done
        continue-on-error: true

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  secret-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `--only-verified` means TruffleHog authenticated the credential against its provider
      # before reporting it, so a finding here is a LIVE secret in a PUBLIC repository, not a
      # string that merely looks like one. That cannot be a warning: the step fails, and the
      # credential is rotated before anything else happens.
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@v3.97.1
        with:
          path: ./
          extra_args: --debug --only-verified

  # This job could not fail until 2026-08-26: every step carried `continue-on-error: true`,
  # including the audits themselves, so a vulnerable dependency produced a green tick. It was
  # hiding three HIGH advisories in EVERY backend service (brace-expansion, fast-uri, js-yaml) and
  # five more in the frontend, sharp's libvips CVEs among them. All eight are fixed; the gate is
  # armed, and the repository is at zero.
  #
  # It CAN now go red on a morning nobody pushed anything - that is the point. A new advisory
  # against a dependency we already ship is exactly the event this job exists to announce, and
  # `.github/dependabot.yml` (added the same day) opens the pull request that closes it.
  dependencies:
    name: Check Dependencies Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # `bun audit`, not `npm audit`: the frontend's committed lockfile is bun.lock, and npm audit
      # against it audits whatever a stray package-lock.json happens to say instead.
      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun audit

      # Every service is audited even after one fails. Aborting on the first would report a
      # single service and call the rest clean by never opening them - the same failure the
      # loop below was written to avoid.
      - name: Audit backend service dependencies
        run: |
          set -uo pipefail
          failed=""
          for svc in core-service social-service media-service chat-delivery-service; do
            echo "--- $svc"
            ( cd "apps/$svc" && npm ci --ignore-scripts && npm audit --audit-level=moderate ) || failed="$failed $svc"
          done
          if [ -n "$failed" ]; then
            echo "::error::npm audit failed for:$failed"
            exit 1
          fi

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Four committed Cargo.lock files, four audits. A loop rather than one root call: these
      # crates are not one workspace, so a single `cargo audit` would read one lockfile and call
      # the other three clean by never opening them.
      - name: Audit Rust dependencies
        run: |
          set -uo pipefail
          failed=""
          for crate in apps/call-service apps/chat-gateway frontend/mls-wasm frontend/src-tauri; do
            echo "--- $crate"
            ( cd "$crate" && cargo audit ) || failed="$failed $crate"
          done
          if [ -n "$failed" ]; then
            echo "::error::cargo audit failed for:$failed"
            exit 1
          fi
