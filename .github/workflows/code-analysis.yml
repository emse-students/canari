# =================================================================================================
# THE SECURITY PASS - A LIBRARY, CALLED FROM BOTH MOMENTS IT IS WANTED
#
# CALLED BY `ci.yml` AND BY `scheduled.yml`, AND BY NOTHING ELSE. It used to carry its own
# `pull_request` and `schedule` triggers, which made it a fourth row in the Actions list and, worse,
# put its verdict OUTSIDE `CI passed`: CodeQL, the secret scan and the vulnerability audit all ran on
# every pull request and **could not block a single merge**, because the branch ruleset requires
# exactly one check and this was not part of it. A red tick nothing enforces is worse than no tick,
# because it looks enforced.
#
# Since 2026-09-04 it is `workflow_call` only. `ci.yml` calls it as a job feeding
# `ci-passed`, so a live secret or a HIGH advisory now stops the merge; `scheduled.yml` calls the
# same file nightly, which is the half a pull request cannot see - **a new advisory lands against
# code nobody touched.** One definition, two moments.
#
# ITS PERMISSIONS ARE PER JOB, and the caller must grant at least as much: a called workflow cannot
# be given more than its caller grants it, and exceeding that is a STARTUP FAILURE - no job runs, no
# log, no annotation. `release-chain.test.sh` derives the caller's grant from what is declared here.
# =================================================================================================
name: Code Analysis

on:
  workflow_call:
    inputs:
      # WHAT AN UNREACHABLE npm ADVISORY ENDPOINT COSTS, AND IT IS NOT THE SAME IN BOTH CALLERS.
      # `bun audit` exits 1 for a 503 exactly as it does for a real advisory, and on 2026-09-03 that
      # walled every merge in the repository behind a five-minute npm outage. A pull request must not
      # be stopped by an incident nobody here can fix; the nightly pass must, because that failure IS
      # the report that a tree has gone a day unaudited. `audit-dependencies.sh` carries the
      # classification, this input carries the policy.
      registry_outage_is_failure:
        description: 'Fail when the npm advisory endpoint never answers. `true` for the nightly pass, `false` for a pull request.'
        required: false
        default: false
        type: boolean

jobs:
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended, security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      # Both install steps stay non-fatal: CodeQL analyses JavaScript and TypeScript from source
      # and a missing node_modules costs resolution accuracy, not the run. What is NOT acceptable
      # is silence - these carried `2>/dev/null || true` UNDER `continue-on-error`, three layers
      # hiding the same failure, so an install that had been broken for months would read exactly
      # like one that succeeded. The failure is now named and printed; only the job survives it.
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
        continue-on-error: true

      - name: Install backend dependencies
        run: |
          for svc in chat-delivery-service core-service social-service media-service; do
            echo "--- $svc"
            ( cd "apps/$svc" && bun install --frozen-lockfile --ignore-scripts ) || echo "::warning title=CodeQL install::bun install failed for $svc; analysis continues with unresolved imports"
          done
        continue-on-error: true

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  secret-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `--only-verified` means TruffleHog authenticated the credential against its provider
      # before reporting it, so a finding here is a LIVE secret in a PUBLIC repository, not a
      # string that merely looks like one. That cannot be a warning: the step fails, and the
      # credential is rotated before anything else happens.
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@v3.97.1
        with:
          path: ./
          extra_args: --debug --only-verified

  # This job could not fail until 2026-08-26: every step carried `continue-on-error: true`,
  # including the audits themselves, so a vulnerable dependency produced a green tick. It was
  # hiding three HIGH advisories in EVERY backend service (brace-expansion, fast-uri, js-yaml) and
  # five more in the frontend, sharp's libvips CVEs among them. All eight are fixed; the gate is
  # armed, and the repository is at zero.
  #
  # It CAN now go red on a morning nobody pushed anything - that is the point. A new advisory
  # against a dependency we already ship is exactly the event this job exists to announce, and
  # `.github/dependabot.yml` (added the same day) opens the pull request that closes it.
  dependencies:
    name: Check Dependencies Vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      # THE INVARIANT THAT KEEPS DEPENDABOT ALIVE, and it is enforced HERE rather than by pinning
      # the toolchain, because a pin never enforced it. Dependabot bundles bun 1.3.14 with
      # `MAX_SUPPORTED_LOCKFILE_VERSION = 1` (dependabot-core#15896, merged 2026-08-14) and answers
      # `DependencyFileNotSupported` to a `lockfileVersion: 2` lockfile - so a v2 lockfile means NO
      # dependency updates for that directory, and the symptom is an ABSENCE of pull requests, which
      # nobody notices. bun 1.4 leaves an existing v1 alone on an ordinary install - but NOT when the
      # manifest holds nested `overrides`, which 1.3.14 could not save and 1.4.0 can: that lockfile is
      # rewritten to v3 on the first install (measured; `ecosystem-convergence.md` section 10). So the
      # version is not a property of the bun version alone, and only this line actually holds it. It
      # reads every COMMITTED lockfile, which `.bun-version` cannot do: a contributor's own bun is
      # not governed by this repository, and deleting a `bun.lock` before reinstalling is all it
      # takes.
      - name: Guard the bun lockfile version
        run: |
          set -uo pipefail
          bad=""
          while IFS= read -r lock; do
            v="$(grep -m1 -o '"lockfileVersion"[[:space:]]*:[[:space:]]*[0-9]*' "$lock" | grep -o '[0-9]*$')"
            echo "--- $lock: lockfileVersion=${v:-MISSING}"
            [ "$v" = "1" ] || bad="$bad $lock"
          done < <(git ls-files '*bun.lock')
          if [ -n "$bad" ]; then
            echo "::error::bun lockfile version must be 1 (Dependabot cannot read v2):$bad"
            exit 1
          fi

      # THE OTHER LOCKFILE INVARIANT, and the one a release used to be the first thing to discover.
      # A Tauri plugin is a JS package AND a Rust crate that must agree on major.minor, and the CLI
      # refuses to build when they do not - but nothing in this pipeline compiles the Tauri app, so
      # the refusal lands in a RELEASE workflow, minutes after the tag. It did on 2026-08-27, killing
      # Android, AppImage and iOS on `@tauri-apps/plugin-log` 2.9.0 against `tauri-plugin-log`
      # 2.8.0. `bun install` re-resolves the JS half and touches no Cargo lockfile, so the two drift
      # by default. Needs no toolchain and no install: it reads two committed files.
      - name: Guard the Tauri JS/Rust version parity
        working-directory: frontend
        run: node ./scripts/check-tauri-plugin-versions.mjs

      # `bun audit`, not `npm audit`: the frontend's committed lockfile is bun.lock, and npm audit
      # against it audits whatever a stray package-lock.json happens to say instead. It goes through
      # `audit-dependencies.sh`, which is the one place that tells the registry's ANSWER apart from
      # its SILENCE - `|| [ "$?" -eq 2 ]` is where this caller's policy lands, and the script turns
      # that 2 into a 1 by itself when the input above says an unaudited tree is a failure.
      - name: Audit frontend dependencies
        env:
          REGISTRY_OUTAGE_IS_FAILURE: ${{ inputs.registry_outage_is_failure }}
        run: |
          set -uo pipefail
          ( cd frontend && bun install --frozen-lockfile )
          .github/scripts/audit-dependencies.sh frontend
          rc=$?

          # AN OUTAGE IS A PROPERTY OF THE REGISTRY, NOT OF THE FRONTEND. If npm did not answer for
          # this tree it will not answer for the four services either, and re-discovering that four
          # more times costs twelve `bun audit` calls carrying bun's own multi-minute timeout each.
          # The fact is carried forward instead - which is the whole of what `$GITHUB_ENV` is for.
          if [ "$rc" -eq 2 ]; then
            echo 'AUDIT_ATTEMPTS=1' >> "$GITHUB_ENV"
            echo '::notice::npm did not answer for the frontend, so the services below ask once each rather than three times.'
          fi
          [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]

      # Every service is audited even after one fails. Aborting on the first would report a
      # single service and call the rest clean by never opening them - the same failure the
      # loop below was written to avoid.
      #
      # AN IGNORE IS AN ALLOWLIST OF ONE ADVISORY IN ONE SERVICE, AND IT CARRIES ITS OWN PROOF.
      # `--ignore` applied to the whole loop would hide an advisory in the three services where
      # nobody checked whether it is reachable, so it is keyed per service and the log says which
      # one was suppressed and why.
      #
      # THE ONE ENTRY, AND WHY IT IS NOT A FIX. GHSA-vcc3-ghjq-m6fr is a moderate denial of service
      # in `decode-uri-component` at every version <= 0.4.2, reached as
      # `minio > query-string > decode-uri-component`. There is no in-range fix anywhere in that
      # chain: minio 8.0.7 is the latest release and pins `query-string: ^7.1.3`, which pins
      # `decode-uri-component: ^0.2.2`; the fixed 0.5.0 is outside that range AND is ESM-only,
      # where `query-string@7` is CommonJS - so forcing it through an override would swap a
      # theoretical denial of service for a certain `ERR_REQUIRE_ESM` at boot.
      #
      # IT IS UNREACHABLE, and that is measured rather than assumed. `decodeComponent` has exactly
      # one caller inside `query-string`, its private `decode()`, which only `parse`, `parseUrl`
      # and `extract` reach - and minio's entire dist calls query-string exactly once, at
      # `helpers.js`, as `querystring.stringify(userTags)`. `stringify` never reaches `decode`.
      #
      # THE SECOND ENTRY, ADDED 2026-09-03 WHEN IT TURNED EVERY PULL REQUEST RED.
      # GHSA-528h-pc64-c93x is a moderate denial of service in `stream-json` at every version
      # <= 3.4.0: its `pick`/`ignore`/`filter`/`replace` filters are O(depth^2) on nested input, so
      # a small crafted document blocks the event loop for seconds to minutes. It arrives as
      # `minio > stream-json`, and there is again no in-range fix - minio 8.0.7 is the latest
      # release and requires `stream-json: ^1.8.0`, while the fix is 3.5.0, two majors outside it.
      #
      # IT IS UNREACHABLE TWICE OVER, measured in the installed tree rather than argued:
      #
      #   1. minio imports exactly ONE thing from the package, `stream-json/jsonl/Parser.js`, in
      #      `notification.mjs` and its CJS twin. It imports NONE of the four filters the advisory
      #      is about - the vulnerability is in `stream-json/filters/*`, which nothing pulls in.
      #   2. `notification.mjs` is minio's bucket-notification API, and this service does not call
      #      it. Its entire use of the client is `bucketExists`, `fPutObject`, `getObject`,
      #      `makeBucket`, `putObject`, `removeObject` - none of which reaches that module.
      #
      # SO EVERY PREMISE IS ASSERTED, not just written down. The step below fails if minio ever
      # starts PARSING a query string, or if the `stringify` call site it was measured on
      # disappears, or if minio starts importing a stream-json FILTER, or if this service starts
      # calling the notification API - any one of those voids a reachability argument, and the
      # ignore that rests on it has to be
      # revisited rather than silently outliving the reason it was granted. An advisory suppressed
      # on a premise nothing checks is a hole with a comment over it.
      - name: Audit backend service dependencies
        env:
          REGISTRY_OUTAGE_IS_FAILURE: ${{ inputs.registry_outage_is_failure }}
        run: |
          set -uo pipefail

          ignores_for() {
            case "$1" in
              # GHSA-vcc3-ghjq-m6fr - unreachable, see the header above and the assertion below.
              media-service) echo "--ignore=GHSA-vcc3-ghjq-m6fr --ignore=GHSA-528h-pc64-c93x" ;;
              *) echo "" ;;
            esac
          }

          failed=""
          for svc in core-service social-service media-service chat-delivery-service; do
            echo "--- $svc"
            ig=$(ignores_for "$svc")
            [ -n "$ig" ] && echo "    suppressing, with the reason and the assertion in this workflow: $ig"
            # Same three outcomes as the frontend, and the same policy: 2 is "the registry never
            # answered", which is not a finding about this service.
            ( cd "apps/$svc" && bun install --frozen-lockfile --ignore-scripts ) || { failed="$failed $svc(install)"; continue; }
            # `$ig` is a deliberately word-split list of `--ignore=` flags built by `ignores_for`,
            # and it is EMPTY for every service but one - quoting it would pass an empty argument.
            # shellcheck disable=SC2086
            .github/scripts/audit-dependencies.sh "apps/$svc" --audit-level=moderate $ig
            rc=$?
            # THE SAME FACT, CARRIED ACROSS THE LOOP. The first service to report 2 has established
            # that npm is not answering; the rest ask once and move on. Without this the loop's worst
            # case is four services x three attempts x bun's own timeout, to learn one thing.
            [ "$rc" -eq 2 ] && export AUDIT_ATTEMPTS=1
            [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ] || failed="$failed $svc"
          done

          # The premise behind the one ignore. Runs after the loop so `node_modules` exists.
          echo "--- the premise behind media-service's ignore"
          dist="apps/media-service/node_modules/minio/dist"
          if [ ! -d "$dist" ]; then
            echo "::error::$dist is not there, so the reachability of GHSA-vcc3-ghjq-m6fr cannot be checked. The ignore is not granted."
            failed="$failed media-service(premise)"
          else
            parses=$(grep -rlE 'querystring\.(parse|parseUrl|extract)\b' "$dist" || true)
            stringifies=$(grep -rlE 'querystring\.stringify\b' "$dist" || true)
            if [ -n "$parses" ]; then
              echo "::error::minio now PARSES a query string, so decode-uri-component is reachable and GHSA-vcc3-ghjq-m6fr is no longer unreachable: $parses"
              failed="$failed media-service(premise)"
            elif [ -z "$stringifies" ]; then
              echo "::error::minio no longer calls querystring.stringify either - the call site the ignore was measured on is gone, so the measurement no longer describes this tree."
              failed="$failed media-service(premise)"
            else
              echo "    minio still calls only querystring.stringify; the ignore holds."
            fi
          fi

          # THE PREMISES BEHIND THE SECOND IGNORE, GHSA-528h-pc64-c93x. Two of them, because the
          # argument has two INDEPENDENT legs and either alone would carry it - so both are checked,
          # and the ignore is refused the moment either stops being true.
          echo "--- the premises behind media-service's second ignore"
          mdist="apps/media-service/node_modules/minio/dist"
          if [ ! -d "$mdist" ]; then
            echo "::error::$mdist is not there, so the reachability of GHSA-528h-pc64-c93x cannot be checked. The ignore is not granted."
            failed="$failed media-service(premise2)"
          else
            # LEG ONE: the vulnerability is in `stream-json/filters/*`. minio must import only the
            # JSONL parser and none of the four filters.
            filters=$(grep -rlE 'stream-json/(filters|pick|ignore|filter|replace)' "$mdist" 2>/dev/null | grep -v '[.]map$' || true)
            if [ -n "$filters" ]; then
              echo "::error::minio now imports a stream-json FILTER, which is exactly what GHSA-528h-pc64-c93x is about, so it is no longer unreachable: $filters"
              failed="$failed media-service(premise2)"
            else
              echo "    minio imports no stream-json filter, only jsonl/Parser.js; leg one holds."
            fi
            # LEG TWO: the only minio module touching stream-json at all is the bucket-notification
            # API. This service must not call it.
            notif=$(grep -rnE '(listen|set|get|removeAll)BucketNotification|NotificationConfig|NotificationPoller' apps/media-service/src 2>/dev/null || true)
            if [ -n "$notif" ]; then
              echo "::error::media-service now calls minio's notification API, the only module that touches stream-json, so GHSA-528h-pc64-c93x is reachable: $notif"
              failed="$failed media-service(premise2)"
            else
              echo "    media-service calls no minio notification API; leg two holds."
            fi
          fi

          if [ -n "$failed" ]; then
            echo "::error::bun audit failed for:$failed"
            exit 1
          fi

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Four committed Cargo.lock files, four audits. A loop rather than one root call: these
      # crates are not one workspace, so a single `cargo audit` would read one lockfile and call
      # the other three clean by never opening them.
      - name: Audit Rust dependencies
        run: |
          set -uo pipefail
          failed=""
          for crate in apps/call-service apps/chat-gateway frontend/mls-wasm frontend/src-tauri; do
            echo "--- $crate"
            ( cd "$crate" && cargo audit ) || failed="$failed $crate"
          done
          if [ -n "$failed" ]; then
            echo "::error::cargo audit failed for:$failed"
            exit 1
          fi
