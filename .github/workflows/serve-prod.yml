name: Serve the production estate

# CALLED BY `release.yml` WHEN THE RELEASE IS STABLE AND BOTH STORES TOOK THE VERSION, AND BY
# NOTHING ELSE.
#
# ONE ESTATE, ONE FILE, NO PHASE (2026-09-07). This job used to live in `deploy.yml` behind
# `inputs.phase == 'production' && inputs.prerelease == 'false'`, in a file called twice - so on
# every build call it was drawn as an impossible skipped row, and on the production call the file's
# three build jobs were drawn the same way. See `build.yml` for the measurement.
#
# WHY THE WEB WAITS FOR THE STORES, WHICH IS THE ONE INVARIANT THIS FILE EXISTS BEHIND (user,
# 2026-09-03: *"j'aimerais que toutes les versions soient toujours alignees"*). Store AVAILABILITY
# is never simultaneous - Apple reviews in days, Play rolls out in hours - so "aligned" cannot mean
# "live at the same instant". What CAN be guaranteed is the useful half: **the web never serves a
# version a store REFUSED.** That is expressed where it belongs, as `needs: [build, android, ios]`
# on the caller's job, because a called workflow cannot depend on a job of its caller.
#
# AND SINCE 2026-09-07 IT MEANS WHAT IT SAYS. `ios.yml`'s submission step used to fail the whole
# arm when Apple's single version slot was merely BUSY - the expected outcome of releasing faster
# than Apple reviews - so a full queue skipped this deploy three times running (v0.16.2, v0.16.3,
# v0.16.4) and production sat on v0.16.1 for three days while two releases reported themselves
# shipped. A refusal and a queue now leave `tools/app-store/submit.mjs` by different exit codes, so
# this dependency refuses only what a store actually refused.
#
# THE COST IS ~14 MINUTES AND ONLY PRODUCTION PAYS IT, measured on `v0.16.1-alpha.1`: the two
# mobile arms are the wall and everything else finishes inside their shadow. The dev estate is
# deliberately NOT behind them - dev is where somebody looks first, and an alpha has no production
# estate to get ahead of.
#
# THERE IS NO CI CONDITION HERE either: `release.yml` gates the whole run on `CI passed` being green
# on the very commit these artefacts were built from.
on:
  workflow_call:
    inputs:
      sha:
        description: 'The exact commit this estate is put on - resolved ONCE by the caller'
        required: true
        type: string
      version:
        description: 'The version the bump wrote into the manifests'
        required: true
        type: string
      services_args:
        description: 'The services to pull and recreate, computed by `build.yml` from what it
          actually built. Handed down rather than re-derived.'
        required: true
        type: string

concurrency:
  group: cd-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  DOMAIN: canari-emse.fr
  DEPLOY_PATH: /home/canari/canari

jobs:
  # -----------------------------------------------------------------------------------------------
  # THE PROMOTION JOB IS GONE, AND SO IS THE BRANCH IT PROMOTED
  # -----------------------------------------------------------------------------------------------
  # `promote-dev-to-main` fast-forwarded `main` onto `dev` once the dev estate had ANSWERED
  # /api/version as that commit, then dispatched this workflow. It existed because `dev` was a
  # branch that nothing else would advance, and a branch nobody promotes is a parking lot.
  #
  # The user cancelled that model on 2026-09-02, hours after it landed: `main` is the only branch
  # now, work arrives by pull request, and NOTHING deploys until a release is published. There is no
  # promotion left to perform - the two estates are fed by two kinds of release rather than by two
  # branches, and the proof that used to gate the promotion is simply the alpha somebody published
  # and looked at.
  #
  # WHAT WAS LOST WITH IT, stated because it was real: an automatic proof, on production-shaped
  # data, that a commit serves before production is given it. A pre-release now provides that only
  # when somebody publishes one. That is the trade the user chose, and this comment is here so the
  # next session does not "restore" it by accident.
  # -----------------------------------------------------------------------------------------------

  deploy-to-server:
    name: Deploy to Production Server
    runs-on: self-hosted
    permissions:
      # `write` only for the `prod-released` tag the last step moves - the deploy itself reads.
      contents: write
      packages: read
    environment:
      name: production
      url: https://${{ env.DOMAIN }}
    steps:
      # THE COMMIT, NEVER THE BRANCH, AND THIS IS THE TREE PRODUCTION IS ACTUALLY SERVED FROM:
      # `docker-compose.prod.yml`, the nginx configuration and the migration SQL all come from here,
      # not from the images. `main` MOVES while a release runs - the bump's own push is on it, and
      # auto-merge lands pull requests unattended - and this job waits behind the iOS build, so the
      # gap between the caller resolving the commit and this line is TWENTY-TWO MINUTES, measured on
      # v0.16.6 (bump 19:45:12, deploy 20:07:45). Resolving `main` again here would make the
      # `prod-released` tag at the bottom name a commit this tree is not on. The released commit is
      # always an ancestor of `main` (the ruleset forbids a force-push), so fetching the branch makes
      # it reachable, and `reset` fails loudly if it somehow is not.
      #
      # THERE IS NO `actions/checkout` ABOVE THIS, AND THERE WAS ONE UNTIL 2026-09-24. It cloned the
      # monorepo into the runner's workspace, where not one step ever read it: every step works in
      # DEPLOY_PATH. What it actually did was contribute to the 3.9 GB of `_work` on a box that is
      # about to move.
      - name: Put the deployment tree on the released commit
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard "${{ inputs.sha }}"
          echo "production tree at $(git rev-parse --short HEAD)"

      # Renders infrastructure/.env for production and NOTHING ELSE, from the unprefixed secrets.
      # The list is the manifest's own `secret:` rows that production does not skip; a row added
      # there and not here is caught by `.github/scripts/tests/deploy-env.test.sh`, which derives
      # this block.
      #
      # IT RUNS BEFORE ANY CONTAINER IS TOUCHED, and refuses to write a partial file: a missing
      # required secret fails here, with the previous deployment still up.
      #
      # THIS REPLACES 277 LINES OF INLINED SHELL (2026-09-24). They were ~40 hand-written
      # `if [ -n "$X" ]; then upsert; else warn; fi` blocks - the exact shape `render-env.sh` and
      # `env-manifest.tsv` were written to delete on 2026-09-01, and which production alone went on
      # carrying for three weeks after dev stopped. Its own header says why: a deploy job embedded in
      # YAML can be run by exactly one thing, so it is never tested, only used.
      - name: Render production's environment
        working-directory: ${{ env.DEPLOY_PATH }}
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          SERVICE_ACCOUNT_USER_ID: ${{ secrets.SERVICE_ACCOUNT_USER_ID }}
          EXTERNAL_API_KEY: ${{ secrets.EXTERNAL_API_KEY }}
          SKY_API_KEY: ${{ secrets.SKY_API_KEY }}
          CERCLE_API_KEY: ${{ secrets.CERCLE_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          LYDIA_PROVIDER_TOKEN: ${{ secrets.LYDIA_PROVIDER_TOKEN }}
          LYDIA_PROVIDER_PRIVATE_TOKEN: ${{ secrets.LYDIA_PROVIDER_PRIVATE_TOKEN }}
          # THE VARIABLE IS NAMED AFTER THE SECRET, NOT AFTER THE KEY IT RENDERS. render-env.sh
          # reads the manifest's SOURCE column verbatim for production, so `AUTHENTIK_BASE_URL`
          # here would leave `$AUTHENTIK_URL` unset and fail a `required` row at deploy time.
          AUTHENTIK_URL: ${{ secrets.AUTHENTIK_URL }}
          AUTHENTIK_CLIENT_ID: ${{ secrets.AUTHENTIK_CLIENT_ID }}
          AUTHENTIK_CLIENT_SECRET: ${{ secrets.AUTHENTIK_CLIENT_SECRET }}
          BASE_URL: ${{ secrets.BASE_URL }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          CLOUDFLARE_CALLS_API_TOKEN: ${{ secrets.CLOUDFLARE_CALLS_API_TOKEN }}
          CLOUDFLARE_TURN_KEY_ID: ${{ secrets.CLOUDFLARE_TURN_KEY_ID }}
          GARAGE_RPC_SECRET: ${{ secrets.GARAGE_RPC_SECRET }}
          GARAGE_ADMIN_TOKEN: ${{ secrets.GARAGE_ADMIN_TOKEN }}
          GARAGE_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
          GARAGE_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
          MIGALLERY_API_KEY: ${{ secrets.MIGALLERY_API_KEY }}
          GOOGLE_SAFE_BROWSING_API_KEY: ${{ secrets.GOOGLE_SAFE_BROWSING_API_KEY }}
          CHANNELS_ENCRYPTION_SECRET: ${{ secrets.CHANNELS_ENCRYPTION_SECRET }}
          INTERNAL_SHARED_SECRET: ${{ secrets.INTERNAL_SHARED_SECRET }}
          CALL_ROOM_SECRET: ${{ secrets.CALL_ROOM_SECRET }}
          APNS_VOIP_KEY_P8: ${{ secrets.APNS_VOIP_KEY_P8 }}
          APNS_VOIP_KEY_ID: ${{ secrets.APNS_VOIP_KEY_ID }}
          APNS_VOIP_TEAM_ID: ${{ secrets.APNS_VOIP_TEAM_ID }}
        run: |
          set -euo pipefail
          bash infrastructure/deploy/render-env.sh \
            --environment prod \
            --domain "${{ env.DOMAIN }}" \
            --out infrastructure/.env

      # `latest` AND NOT THE COMMIT SHA, AND THAT IS FORCED BY SELECTIVE REBUILDS. The compose file
      # resolves a tag for EVERY service, including the ones this release did not change - and those
      # have no image at this commit's sha, because nothing built one. A moving tag is the only one
      # that resolves for all of them, each pointing at the last build of that service for THIS
      # estate. Production moves `latest`; a pre-release moves `dev` and leaves `latest` alone, so
      # the two estates never read each other's images.
      #
      # WHICH COMMIT PRODUCTION RUNS is answered by the `prod-released` tag below and by
      # /api/version, never by reading `latest`.
      #
      # THE SCRIPT IS STRICTLY STRONGER THAN THE STEPS IT REPLACES, and one difference is worth
      # naming: it requires every service the compose file DECLARES to be running, exempting only
      # what is written down, where the old step named ten services by hand. `frontend-ssr` was in
      # neither version of that hand list, so an estate whose server-side renderer never came up
      # would have deployed green.
      - name: Deploy the production estate
        working-directory: ${{ env.DEPLOY_PATH }}
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash infrastructure/deploy/deploy-environment.sh \
            --environment prod \
            --path "${{ env.DEPLOY_PATH }}" \
            --tag latest \
            --registry "${{ env.REGISTRY }}" \
            --image-prefix "${{ env.IMAGE_PREFIX }}" \
            --pull-services "${{ inputs.services_args }}"

      # A RENDERED .env PROVES NOTHING ABOUT WHAT IS RUNNING - a container keeps the environment it
      # was created with. This step used to verify five keys in four services by hand; it is derived
      # now, so every key this estate renders is checked in every service the compose file says
      # reads it. Measured against production on 2026-09-24: 51 pairs where the hand-written version
      # covered 5.
      - name: Verify the containers carry the secrets
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          bash infrastructure/deploy/verify-secrets.sh \
            --environment prod \
            --path "${{ env.DEPLOY_PATH }}"

      # THE EDGE HOLDS THE PREVIOUS BUILD'S SHELL, AND THAT SHELL NAMES CHUNKS THIS IMAGE DOES NOT
      # CONTAIN. Since 2026-09-17 nginx offers the SSR page to a shared cache
      # (`max-age=0, s-maxage=60`), which takes the origin round trip - 94 ms of every navigation,
      # measured in the user's own browser - off the critical path. The price is that a deploy has
      # to say when the thing it cached stopped being true, and a stale shell is a BLANK page rather
      # than an old one: its script tags name hashes that 404.
      #
      # IT RUNS AFTER THE HEALTH CHECK, and that ordering is the whole point. Purging before the new
      # containers answer would re-cache the OLD build from the still-running old one, which is
      # precisely the state this step exists to end.
      #
      # `purge_everything` RATHER THAN A URL LIST, because the cacheable set is every path the SPA
      # has a route for - including per-post and per-association URLs that are generated and not
      # enumerable - and purge-by-prefix is an Enterprise feature. Everything content-hashed is new
      # in this image anyway, so what the sweep really costs is one re-fetch of the unchanged
      # assets, once per PoP.
      #
      # THE ZONE IS DERIVED FROM THE TOKEN, not configured beside it. The token is scoped to one
      # zone and carries `#zone:read`, so asking it which zone it is removes a second secret that
      # could silently disagree with the first. The match is anchored on the zone NAME and asserted
      # unique: there is no positional read of the JSON here, because `jq` is NOT installed on this
      # self-hosted runner and reading `result[0]` would be a guess either way.
      #
      # IT FAILS THE JOB, DELIBERATELY. The site is already serving by this point, so a red run here
      # does not mean production is down - it means the deploy stopped short of saying so, and some
      # visitors got a blank page until the TTL expired. That window is bounded by `s-maxage=60` and
      # by nothing else, which is exactly why a missing token must not be discovered a week later.
      - name: Purge the edge cache
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_CACHE_PURGE_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_CACHE_PURGE_TOKEN is not set. nginx offers the SSR shell to the edge with s-maxage=60, so without this purge the previous build's shell - naming chunks this image does not contain - is served as a blank page for up to a minute."
            exit 1
          fi

          ZONE_MATCH='"id":"[0-9a-f]\{32\}","name":"canari-emse.fr"'

          zones="$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_CACHE_PURGE_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=canari-emse.fr")"

          # `|| true` because an expired token is the likeliest failure here and grep finding
          # nothing exits 1, which under `pipefail` would kill this step BEFORE the message that
          # explains it - measured, exit 1 and not one line of output.
          matches="$(printf '%s' "$zones" | grep -o "$ZONE_MATCH" | wc -l || true)"
          if [ "$matches" -ne 1 ]; then
            # Cloudflare's own words, and ONLY those: the success body carries the account id and
            # the name servers, which have no business in a public repository's CI log.
            detail="$(printf '%s' "$zones" | grep -o '"message":"[^"]*"' | head -3 | tr '\n' ' ' || true)"
            echo "::error::expected exactly one canari-emse.fr zone readable by this token, found ${matches}. ${detail:-Refusing to guess which zone to purge.}"
            exit 1
          fi

          zone="$(printf '%s' "$zones" | grep -o "$ZONE_MATCH" | sed 's/"id":"//; s/","name.*//')"

          purged="$(curl -sS -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_CACHE_PURGE_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/${zone}/purge_cache")"

          case "$purged" in
            *'"success":true'*)
              echo "🧹 edge cache purged for v${{ inputs.version }}"
              ;;
            *)
              echo "::error::Cloudflare refused the purge: ${purged}"
              exit 1
              ;;
          esac

      # WHICH COMMIT PRODUCTION IS SERVING, recorded by the thing that made it true. `prod-deployed`
      # was this tag's old name and the change detector's INPUT; the detector reads the previous
      # release now (user's decision, 2026-09-03), so the name changed with the job to stop the next
      # session reading a stale meaning into it. It is written only once the deploy has really
      # succeeded, and it is the ONLY record of the commit after an emergency push, which is why it
      # survived the deletion of its old purpose.
      - name: Record the released commit
        run: |
          set -euo pipefail
          git -C "${{ env.DEPLOY_PATH }}" tag -f prod-released "${{ inputs.sha }}"
          git -C "${{ env.DEPLOY_PATH }}" push -f \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            refs/tags/prod-released
          echo "📌 prod-released -> ${{ inputs.sha }} (v${{ inputs.version }})"

      - name: Notify deployment
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment to production succeeded"
          else
            echo "❌ Deployment to production failed"
          fi

