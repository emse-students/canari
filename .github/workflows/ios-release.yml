name: iOS Release

# Mirrors android-release.yml: runs after "Bump version on release" syncs
# frontend/package.json on main, and attaches the signed .ipa to the GitHub Release.
# Public repo => GitHub-hosted macOS runners are free.
on:
  workflow_run:
    workflows: ['Bump version on release']
    types: [completed]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15 # Xcode 16.2+ (required for current iOS SDK / Tauri toolchain)
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Resolve release tag
        id: release_tag
        run: |
          VERSION="$(bash scripts/read-app-version.sh)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Canari v${VERSION}"

      - name: Select Xcode (>= 16.2)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '>=16.2.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            frontend/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bunx svelte-kit sync

      - name: Build MLS WASM
        uses: ./.github/actions/build-mls-wasm

      - name: Generate protobuf bindings
        working-directory: frontend
        run: bun run proto:gen

      - name: Validate iOS release secrets
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_PROVISIONING_PROFILE_NSE: ${{ secrets.APPLE_PROVISIONING_PROFILE_NSE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BASE_URL: ${{ secrets.BASE_URL }}
          AUTHENTIK_URL: ${{ secrets.AUTHENTIK_URL }}
          AUTHENTIK_CLIENT_ID: ${{ secrets.AUTHENTIK_CLIENT_ID }}
        run: |
          # Two provisioning profiles are required because the project signs two bundles
          # manually: the app (fr.emse.canari, profile "Canari") and the Notification
          # Service Extension (fr.emse.canari.notifications, profile "CanariNotifications").
          required=(
            APPLE_SIGNING_IDENTITY
            APPLE_CERTIFICATE_BASE64
            APPLE_CERTIFICATE_PASSWORD
            APPLE_PROVISIONING_PROFILE
            APPLE_PROVISIONING_PROFILE_NSE
            APPLE_TEAM_ID
            GOOGLE_SERVICE_INFO_PLIST
            JWT_SECRET
            BASE_URL
            AUTHENTIK_URL
            AUTHENTIK_CLIENT_ID
          )

          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required GitHub secret: ${key}"
              exit 1
            fi
          done

          echo "✅ Required iOS secrets are present"

      - name: Install Apple signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Créer un keychain temporaire
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Décoder et importer le certificat
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "✅ Signing certificate installed"

      - name: Install provisioning profiles
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_PROVISIONING_PROFILE_NSE: ${{ secrets.APPLE_PROVISIONING_PROFILE_NSE }}
        run: |
          # Install BOTH profiles into the runner's profile store. xcodebuild resolves the
          # PROVISIONING_PROFILE_SPECIFIER names ("Canari", "CanariNotifications") set in
          # the project by scanning these installed profiles, so both must be present.
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"

          install_profile() {
            local b64="$1"
            local label="$2"
            local tmp="$RUNNER_TEMP/${label}.mobileprovision"
            echo "$b64" | base64 --decode > "$tmp"
            local uuid
            uuid=$(security cms -D -i "$tmp" | plutil -extract UUID raw -)
            local name
            name=$(security cms -D -i "$tmp" | plutil -extract Name raw -)
            cp "$tmp" "$PROFILES_DIR/$uuid.mobileprovision"
            echo "✅ Installed profile '$name' (UUID: $uuid) for $label"
          }

          install_profile "$APPLE_PROVISIONING_PROFILE" "app"
          install_profile "$APPLE_PROVISIONING_PROFILE_NSE" "nse"

      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          # Must match the pbxproj file reference path (canari_iOS/GoogleService-Info.plist,
          # lowercase to match the on-disk group folder) so Xcode bundles it and
          # [FIRApp configure] finds it at launch. printf (not echo) preserves the
          # exact XML without interpreting backslashes or appending a stray newline.
          PLIST_DIR="frontend/src-tauri/gen/apple/canari_iOS"
          mkdir -p "$PLIST_DIR"
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > "$PLIST_DIR/GoogleService-Info.plist"
          echo "✅ GoogleService-Info.plist written to $PLIST_DIR"

      - name: Set export compliance code in Info.plist
        env:
          EXPORT_COMPLIANCE_CODE: ${{ secrets.APP_STORE_CONNECT_EXPORT_COMPLIANCE_CODE }}
        run: |
          # Apple rejects the TestFlight upload with "Invalid Export Compliance Code" unless this
          # code - generated once in App Store Connect's own compliance documentation for this
          # app - is present alongside ITSAppUsesNonExemptEncryption (already committed, true).
          # Kept as a secret rather than committed to Info.plist: this is a public repo, and
          # while the code itself is not a credential that grants access to anything, it is still
          # an Apple-account-specific value tied to one developer's compliance record, with no
          # reason to be permanently baked into a public file when every other Apple-account
          # value here already isn't. Skips (does not fail) when unset, matching the TestFlight
          # upload step below, which already tolerates the other App Store Connect secrets being
          # absent - Info.plist is simply left as committed, and that step's own 409 explains why.
          PLIST="src-tauri/gen/apple/canari_iOS/Info.plist"
          if [ -z "$EXPORT_COMPLIANCE_CODE" ]; then
            echo "::warning::APP_STORE_CONNECT_EXPORT_COMPLIANCE_CODE not set; Info.plist left unchanged"
          else
            /usr/libexec/PlistBuddy -c "Delete :ITSEncryptionExportComplianceCode" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :ITSEncryptionExportComplianceCode string ${EXPORT_COMPLIANCE_CODE}" "$PLIST"
            echo "✅ ITSEncryptionExportComplianceCode set in Info.plist"
          fi
        working-directory: frontend

      - name: Create frontend .env
        working-directory: frontend
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          AUTHENTIK_URL: ${{ secrets.AUTHENTIK_URL }}
          AUTHENTIK_CLIENT_ID: ${{ secrets.AUTHENTIK_CLIENT_ID }}
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
        run: |
          # Same variable set as android-release.yml: the SvelteKit frontend is shared,
          # so it needs the identical build-time config (Authentik SSO included).
          echo "VITE_FRONTEND_URL=${BASE_URL}" > .env
          echo "VITE_GATEWAY_URL=${BASE_URL}" >> .env
          echo "VITE_DELIVERY_URL=${BASE_URL}" >> .env
          echo "VITE_MEDIA_URL=${BASE_URL}" >> .env
          echo "VITE_CALL_URL=${BASE_URL}" >> .env
          echo "VITE_SOCIAL_URL=${BASE_URL}" >> .env
          echo "VITE_CORE_URL=${BASE_URL}" >> .env
          echo "VITE_AUTHENTIK_URL=${AUTHENTIK_URL}" >> .env
          echo "VITE_AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID}" >> .env
          echo "VITE_CALL_E2E_ENCRYPTION=false" >> .env
          if [ -n "$KLIPY_API_KEY" ]; then
            echo "VITE_KLIPY_KEY=${KLIPY_API_KEY}" >> .env
          fi

      - name: Verify frontend env for iOS build
        working-directory: frontend
        run: |
          grep -q '^VITE_FRONTEND_URL=.' .env
          grep -q '^VITE_GATEWAY_URL=.' .env
          grep -q '^VITE_DELIVERY_URL=.' .env
          grep -q '^VITE_MEDIA_URL=.' .env
          grep -q '^VITE_CALL_URL=.' .env
          grep -q '^VITE_SOCIAL_URL=.' .env
          grep -q '^VITE_CORE_URL=.' .env
          grep -q '^VITE_AUTHENTIK_URL=.' .env
          grep -q '^VITE_AUTHENTIK_CLIENT_ID=.' .env
          echo "✅ iOS frontend env prepared"

      - name: Resolve Swift Packages
        working-directory: frontend/src-tauri/gen/apple
        run: xcodebuild -resolvePackageDependencies -project canari.xcodeproj -scheme canari_iOS

      - name: Build frontend
        working-directory: frontend
        run: |
          # Must run before "Prebuild Rust static lib": with `--features tauri/custom-protocol`
          # enabled there, `generate_context!()` embeds `frontendDist` (../build) at compile
          # time and panics if the directory doesn't exist yet - it only skips that check in
          # dev mode (tauri-codegen's context.rs: `dev && dev_url.is_some()`), which is no
          # longer what this build compiles as. TAURI_TARGET activates the Vite mlsWasmStub
          # plugin, excluding WASM modules from the Tauri build (MLS is handled by native Rust
          # code on iOS).
          TAURI_TARGET=aarch64-apple-ios bun run build

      - name: Prebuild Rust static lib (libapp.a)
        working-directory: frontend/src-tauri
        env:
          # Match the lowest pbxproj IPHONEOS_DEPLOYMENT_TARGET (14.0). Without it,
          # rustc/cc default the objects' min-iOS to the SDK version, and every link
          # pass floods "object file built for newer iOS version than being linked"
          # (~75 ld warnings per run).
          IPHONEOS_DEPLOYMENT_TARGET: "14.0"
        run: |
          # The Xcode "Build Rust Code" phase is disabled in the hand-maintained pbxproj
          # (it shells out to bun, which isn't on Xcode's PATH), and Externals/ is
          # gitignored - so a clean checkout has no libapp.a and both the app AND the NSE
          # fail to link with `ld: library 'app' not found`. Reproduce what Tauri's
          # xcode-script does: cross-compile the app staticlib and drop it where the
          # linker search path (Externals/<arch>/<config>) expects it, as `libapp.a`.
          # rust-toolchain.toml pins 1.97.0 (no `targets`), which overrides the action's
          # `stable` here - so the iOS std isn't installed for the toolchain cargo actually
          # uses. Add it to the pinned toolchain (override is active in this dir).
          #
          # --features tauri/custom-protocol is required here because we bypass `tauri ios
          # build`: that CLI enables it automatically, but a raw `cargo build` does not, and
          # without it tauri-build's build.rs bakes `dev=true` into the binary (dev =
          # !has_feature("custom-protocol"), tauri-2.11.1/build.rs). A "dev" binary loads the
          # webview from the Vite dev server (127.0.0.1:1420) instead of the bundled
          # frontendDist assets - unreachable on a real device, producing a black screen with
          # "did you grant local network permission?" (this shipped once, TestFlight v0.14.4).
          rustup target add aarch64-apple-ios
          cargo build --lib --release --target aarch64-apple-ios --features tauri/custom-protocol
          LIB=$(find target/aarch64-apple-ios/release -maxdepth 1 -name 'libmines_app_lib.a' | head -1)
          if [ -z "$LIB" ]; then
            echo "::error::libmines_app_lib.a not produced by cargo"
            exit 1
          fi
          DEST=gen/apple/Externals/arm64/release
          mkdir -p "$DEST"
          cp "$LIB" "$DEST/libapp.a"
          echo "✅ libapp.a staged at $DEST ($(du -h "$DEST/libapp.a" | cut -f1))"

      - name: Build iOS archive
        working-directory: frontend
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # The Vite build itself now runs earlier, in "Build frontend" - "Prebuild Rust
          # static lib" needs `../build` to already exist by the time it compiles.
          #
          # Tauri normally copies frontendDist (../build) into the Xcode assets folder
          # before archiving. Since we bypass `tauri ios build`, we must do this manually.
          # Use `build/.` (not `build/*`) so dotfiles like .well-known/ are included.
          rm -rf src-tauri/gen/apple/assets
          mkdir -p src-tauri/gen/apple/assets
          cp -r build/. src-tauri/gen/apple/assets/

          # Archive directly with xcodebuild, bypassing Tauri's export step which fails
          # with "requires a provisioning profile with the App Groups feature" because
          # Tauri's generated ExportOptions.plist cannot express a two-target
          # (app + appex) manual-signing profile map.
          ARCHIVE_DIR="src-tauri/gen/apple/build"
          ARCHIVE_NAME="canari_iOS.xcarchive"
          ARCHIVE_PATH="${ARCHIVE_DIR}/${ARCHIVE_NAME}"

          # Clean any stale archive so xcodebuild does not append.
          rm -rf "$ARCHIVE_PATH"

          xcodebuild archive \
            -project src-tauri/gen/apple/canari.xcodeproj \
            -scheme canari_iOS \
            -archivePath "$ARCHIVE_PATH" \
            -configuration release \
            -sdk iphoneos \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${APPLE_SIGNING_IDENTITY}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}"

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "::error::xcodebuild archive failed to produce ${ARCHIVE_PATH}"
            exit 1
          fi

          echo "Archive produced: ${ARCHIVE_PATH}"

      - name: Export signed IPA
        id: outputs
        working-directory: frontend/src-tauri/gen/apple
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Re-export the archive produced by the previous step with an ExportOptions.plist
          # that pins manual signing and maps EACH bundle id to its named distribution
          # profile. Both profiles are already installed in the runner store (by name) and
          # carry the required entitlements (App Groups, Associated Domains, aps-environment).
          ARCHIVE="build/canari_iOS.xcarchive"
          if [ ! -d "$ARCHIVE" ]; then
            echo "::error::Archive not found at ${ARCHIVE}"
            find build -maxdepth 3 -type d 2>/dev/null || true
            exit 1
          fi
          echo "Archive: $ARCHIVE"

          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>fr.emse.canari</key>
              <string>Canari</string>
              <key>fr.emse.canari.notifications</key>
              <string>CanariNotifications</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa

          IPA=$(find build/ipa -name '*.ipa' | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::exportArchive produced no .ipa"
            exit 1
          fi
          echo "ipa=frontend/src-tauri/gen/apple/$IPA" >> "$GITHUB_OUTPUT"
          echo "IPA: $IPA"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: ${{ steps.outputs.outputs.ipa }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        # TEMPORARY: also allow workflow_dispatch, to recover v0.14.5 after `gh run rerun`
        # proved unable to pick up this file's own fix (a rerun replays the workflow
        # definition pinned at the ORIGINAL trigger, never the current one on main) - a
        # workflow_dispatch is the only run that resolves this file fresh. Revert to
        # `workflow_run` only once v0.14.5 is confirmed on TestFlight.
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        # TEMPORARY: under workflow_dispatch, github.ref is the branch (refs/heads/main),
        # not the release tag, and this action's lookup for that ref 403s
        # ("Resource not accessible by integration") even after it already found the
        # release by tag_name - it still blocked the next step (TestFlight) from running.
        # Non-blocking for this recovery run; TestFlight is what actually matters. Revert
        # alongside the condition above.
        continue-on-error: true
        with:
          tag_name: v${{ steps.release_tag.outputs.version }}
          fail_on_unmatched_files: true
          files: ${{ steps.outputs.outputs.ipa }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to TestFlight / App Store Connect
        # TEMPORARY: see "Upload to Release" above - revert once v0.14.5 ships.
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          IPA_PATH: ${{ steps.outputs.outputs.ipa }}
        run: |
          # Pushes the App-Store-signed .ipa to App Store Connect (lands in TestFlight).
          # A raw .ipa cannot be sideloaded from a GitHub Release on iOS, so this is the
          # only real distribution path. The step SKIPS (does not fail) until the three
          # App Store Connect API-key secrets exist, so the build/release stays green in
          # the meantime.
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_API_KEY_P8" ]; then
            echo "::warning::App Store Connect API key secrets not set; skipping TestFlight upload"
            exit 0
          fi
          # altool auto-discovers the key at ~/.appstoreconnect/private_keys/AuthKey_<KEYID>.p8
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$ASC_API_KEY_P8" | base64 --decode > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          echo "Uploading ${IPA_PATH} to App Store Connect…"

          ALTOOL_LOG="$(mktemp)"
          set +e
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" > "$ALTOOL_LOG" 2>&1
          ALTOOL_EXIT=$?
          set -e
          cat "$ALTOOL_LOG"
          rm -f "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"

          # altool can exit 0 even when its own payload reports a failed upload (e.g. an
          # asset-validation rejection), so the process exit code alone cannot be trusted -
          # also grep the transcript for altool's own failure markers.
          if [ "$ALTOOL_EXIT" -ne 0 ] || grep -qiE "UPLOAD FAILED|Error Domain=|VALIDATION_ERROR|NSLocalizedDescription" "$ALTOOL_LOG"; then
            echo "::error::altool reported a failed upload - see log above"
            exit 1
          fi
          echo "✅ Uploaded to TestFlight"

