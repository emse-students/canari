# =================================================================================================
# A GREEN PULL REQUEST MERGES ITSELF
#
# THE FIRST OF THE THREE HUMAN GESTURES IS OPENING THE PULL REQUEST, not merging it (user,
# 2026-09-03). Zero approvals are required - "a queue nobody drains is worse than the merge it
# prevented" - so a human clicking Merge after CI goes green adds a wait and decides nothing. This
# arms GitHub's own auto-merge, which merges the instant the required check passes and never before.
#
# THE CREDENTIAL IS THE WHOLE DESIGN HERE, AND `GITHUB_TOKEN` WOULD BREAK THE RELEASE CHAIN.
# Auto-merge merges as whoever armed it, and a merge made by `GITHUB_TOKEN` raises NO `push` event -
# GitHub's anti-recursion rule. So `ci.yml` would never run on `main`, the merge commit would carry
# no `CI passed` check, and `release-preflight.sh`'s third gate - "the tests passed on the commit
# being released" - would refuse EVERY release, on a commit that had in fact been tested. An App
# token does raise the event (`dependabot-auto-merge.yml` documents that asymmetry and depends on
# it), so the same `canari-auto-merge` installation that pushes the version bump arms this.
#
# WHOSE PULL REQUESTS, AND WHY NOT EVERY ONE:
#
#   * NOT Dependabot's. `dependabot-auto-merge.yml` merges those through a ceiling that refuses
#     what CI structurally cannot judge - a datastore major, an image mounting a named volume. On
#     2026-09-01 `postgres 15-alpine -> 18-alpine` merged on a fully green suite and took production
#     down for 33 minutes. Native auto-merge would walk straight past that ceiling, because green is
#     exactly what those updates are.
#   * NOT an outside contributor's. `author_association` must be OWNER, MEMBER or COLLABORATOR -
#     somebody who could merge it by hand anyway. Arming it for anyone who can open a pull request
#     would make a green suite the only thing between a stranger and `main`.
#   * NOT a draft. A draft is a pull request whose author has said it is not ready.
# =================================================================================================
name: Auto-merge a green pull request

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]

# One arming per pull request at a time. `synchronize` fires on every push to the branch, and two
# overlapping runs would both call `gh pr merge --auto`; the second is harmless but the log is
# clearer with one. `cancel-in-progress: true` because only the latest state matters.
concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arm:
    name: Arm auto-merge
    # A draft says "not ready" and an outside contributor has no push access. Dependabot has its own
    # sweep, with a ceiling this would bypass.
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Mint the identity whose merge raises a push event
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

      - name: Ask GitHub to merge it when the checks pass
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # `--auto` HANDS THE DECISION TO GITHUB rather than waiting here. A step that polled the
          # checks would hold a runner for the length of CI and would still have to re-read them at
          # the end, and a workflow that merges on its own reading of "green" is a second opinion
          # about which jobs matter - `CI passed` is the ruleset's answer and must stay the only one.
          #
          # `--squash` because that is what the ruleset allows and what the history uses; the branch
          # is deleted with the merge, since `delete_branch_on_merge` is off at the repository level
          # and a merged branch left behind is one more thing to read past.
          if gh pr merge "$PR" --auto --squash --delete-branch --repo "${{ github.repository }}"; then
            echo "Auto-merge armed. GitHub will squash-merge #$PR as soon as CI passed goes green."
            exit 0
          fi

          # ALREADY ARMED IS NOT A FAILURE, and it is the ordinary case on `synchronize`: every push
          # to the branch re-runs this, and GitHub refuses to arm what is already armed. Anything
          # else is a real problem and must fail loudly - the App uninstalled, its Pull requests
          # write permission revoked, auto-merge disabled on the repository - because the silent
          # version of that is a pull request that simply never merges and nobody looking.
          state="$(gh pr view "$PR" --repo "${{ github.repository }}" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [ "$state" = 'true' ]; then
            echo "Auto-merge was already armed on #$PR; nothing to do."
            exit 0
          fi
          echo "::error::Could not arm auto-merge on #$PR, and it is not armed. Check that the"
          echo "::error::canari-auto-merge App is installed with Pull requests write, and that"
          echo "::error::auto-merge is still allowed on the repository."
          exit 1
