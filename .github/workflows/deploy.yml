name: Deploy an estate

# ONE TRIGGER, AND THAT IS THE WHOLE DESIGN (user, 2026-09-02: *"Le deploiement (production,
# android, ios...) se fait au bump. Pas au push sur main."*).
#
# A push to `main` used to deploy production. It does not any more, and neither does a manual
# dispatch - a dispatch would simply be a second door, and the point of this file is that there is
# exactly one. Retrying a half-failed deploy is "Re-run failed jobs" on the run that already exists.
#
# WHAT REPLACED THE PUSH, and why it is the same door for both estates: publishing a GitHub Release
# runs `Bump version on release`, which writes the version into every manifest and pushes that
# commit to `main`; this workflow starts when that run completes. The RELEASE decides which estate
# is deployed - a pre-release (`v0.15.0-alpha.1`) deploys `dev.canari-emse.fr` and feeds the store
# tester programmes, a stable release (`v0.15.0`) deploys production. Nothing else deploys anything.
#
# THE `branches:` FILTER THAT MUST NOT COME BACK: a release-triggered run has the TAG as its head
# branch, not `main`, so a `branches: [main]` filter here silently drops every release. That bit
# every release up to v0.10.4 - post-release CD never fired once.
#
# `Dependabot auto-merge` is deliberately NOT listed: it completes on every sweep, including the
# ones where it DECLINES to merge, and this workflow would then deploy for nothing. A dependency
# update reaches production when the next release is published, like everything else.
# CALLED BY `release.yml`, AND BY NOTHING ELSE. It used to listen for the bump run's completion on
# its own, which is what made three separate workflows each re-derive the same three facts and each
# resolve `main` for itself. The orchestrator now decides once and hands the answers down, so this
# file is a library: it deploys the commit it is given, to the estate it is told.
on:
  workflow_call:
    inputs:
      sha:
        description: 'The exact commit to build and deploy - resolved ONCE by the caller'
        required: true
        type: string
      version:
        description: 'The version the bump wrote into the manifests'
        required: true
        type: string
      prerelease:
        description: 'The string "true" or "false". A hyphen in the version IS the definition, and
          the caller has already read it - this file never decides its own target.'
        required: true
        type: string
      phase:
        description: 'Which half of this file to run: `build` (the images, and the dev estate) or
          `production`. See the two-call comment in `release.yml` - the caller runs `build`
          immediately and `production` only once Google Play and the App Store have accepted the
          same version.'
        required: true
        type: string

# TWO DEPLOYS OF THE SAME ESTATE MUST NOT OVERLAP, and until 2026-09-02 nothing said so. Three runs
# were in flight against `/home/canari/canari` at once, each able to `git reset --hard` and
# `docker compose up` while another was mid-flight; `dependabot-auto-merge.yml` and `dev-refresh.yml`
# both serialise themselves, and the workflow that actually touches production did not. It does not
# take a burst of human pushes either. The dev arm doubles the exposure, `/home/canari/canari-dev`
# being a second checkout two runs would race on identically, which is why ONE group covers both
# estates: they live on one machine, and two releases published minutes apart - one alpha, one
# stable - would otherwise deploy over each other.
#
# `cancel-in-progress: false` because cancelling a deploy halfway leaves the estate in whatever state
# the kill found - containers half-recreated, the checkout reset to a commit whose images never got
# pulled. Queueing behind it is the only safe answer.
#
# WHAT MAKES A CANCELLED PENDING RUN HARMLESS, which is the non-obvious half: GitHub keeps at most
# one run waiting per group and cancels the rest while they are still pending. That would lose work
# if `enumerate-services` measured against the previous RUN - but it measures against the
# previous RELEASE of the same kind, which is what the target estate actually received, so the
# surviving run rebuilds everything the dropped ones would have.
concurrency:
  group: cd-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  DOMAIN: canari-emse.fr
  DEPLOY_PATH: /home/canari/canari
  # The second estate, on the SAME machine. A separate checkout because two estates sharing one
  # working tree would race - a `git reset --hard` for one rewrites the compose file the other is
  # being deployed from - and a separate compose project (`canari-dev`, declared in the file itself)
  # because that is what gives it its own network and its own volumes.
  DEV_DOMAIN: dev.canari-emse.fr
  DEV_DEPLOY_PATH: /home/canari/canari-dev

jobs:
  # THE DECISION IS MADE ONCE, IN `release.yml`, AND HANDED DOWN.
  #
  # A `release-kind` job used to live here: it checked out `main`, read the version back off the
  # bumped manifest and published it as outputs, because a `workflow_run` carries neither
  # `release.prerelease` nor a usable branch. That reasoning was right and it is now the
  # orchestrator's, one level up, where the bump that WROTE the manifest can read it without a
  # second checkout - and where the two store chains read the same answer instead of each
  # deriving its own. `inputs.sha` is therefore the one commit this whole run builds.

  enumerate-services:
    name: Enumerate the services to build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      services_csv: ${{ steps.detect.outputs.services_csv }}
      services_args: ${{ steps.detect.outputs.services_args }}
      any_changed: ${{ steps.detect.outputs.any_changed }}
      frontend_changed: ${{ steps.detect.outputs.frontend_changed }}
    steps:
      # NO CHECKOUT, NO HISTORY, NO TOKEN - all three existed for the diff that was deleted on
      # 2026-09-03. This job reads no file and calls no API: the service list and the dockerfile
      # map are inline below, and a `fetch-depth: 0` was a full clone of the repository, on every
      # release, to answer a question nobody asks any more.
      - name: Name every service, and the dockerfile that builds it
        id: detect
        run: |
          set -euo pipefail

          declare -A SERVICE_DOCKERFILE=(
            [core-service]="./infrastructure/local/Dockerfile.core-service"
            [social-service]="./infrastructure/local/Dockerfile.social-service"
            [chat-gateway]="./infrastructure/local/Dockerfile.chat-gateway"
            [call-service]="./infrastructure/local/Dockerfile.call-service"
            [chat-delivery-service]="./infrastructure/local/Dockerfile.chat-delivery-service"
            [frontend]="./infrastructure/local/Dockerfile.frontend"
            [frontend-ssr]="./infrastructure/local/Dockerfile.frontend-ssr"
            [media-service]="./infrastructure/local/Dockerfile.media-service"
          )

          ALL_SERVICES=(
            core-service
            social-service
            chat-gateway
            call-service
            chat-delivery-service
            frontend
            frontend-ssr
            media-service
          )

          # EVERY SERVICE, EVERY RELEASE - THE DIFF WAS DELETED ON 2026-09-03 (user: *"On pourrait
          # retirer ce qui est du detect changed services pour tout recompiler, de toute facon ce
          # qui prend du temps c'est android et iOS"*).
          #
          # MEASURED ON `v0.16.1-alpha.1`, which is what settles it rather than the argument:
          #
          #     14min  Android                    }
          #     14min  iOS                        } concurrent
          #      4min  the slowest docker image   } all concurrent, and therefore entirely
          #      2min  the frontend build         } inside the 14-minute shadow
          #      1min  the dev deploy
          #      0min  this job
          #
          # The detection saved nothing a release actually waits for. What it COST was a second
          # thing that had to be right: a baseline resolved from the previous release of the same
          # kind, a `git diff` against it, and a hand-written mapping from changed path to service -
          # a mapping that omits a service silently, and then ships a stale image with nothing
          # saying so. An optimisation whose failure mode is invisible, buying zero wall clock.
          #
          # AND IT WAS LOAD-BEARING FOR THE CONCURRENCY PROPERTY, which is why deleting it is a
          # simplification and not a loss. This workflow QUEUES rather than cancels, and GitHub
          # keeps at most one waiting run per group and drops the rest; what made those dropped runs
          # harmless was precisely that this job measured against the previous RELEASE rather than
          # the previous RUN, so the survivor rebuilt everything they would have. Building
          # everything makes that property trivially true instead of true-by-argument.
          #
          # WHAT IS KEPT IS THE LIST AND THE DOCKERFILE MAP, because they exist nowhere else and
          # `tests/compose-wiring.test.sh` reads the compose file for the other half of the same
          # question.
          # `any_changed` and `frontend_changed` are CONSTANTS now. They are kept rather than
          # deleted because every gate on the production deploy reads them, and removing them
          # means touching those gates - the same surgery as making production wait for the
          # store arms. Those go together, in one change, or not at all.

          MATRIX_ITEMS=""
          FRONTEND_CHANGED="false"
          for service in "${ALL_SERVICES[@]}"; do
            dockerfile="${SERVICE_DOCKERFILE[$service]}"
            MATRIX_ITEMS+="{\"name\":\"$service\",\"context\":\".\",\"dockerfile\":\"$dockerfile\"},"
            case "$service" in
              frontend|frontend-ssr) FRONTEND_CHANGED="true" ;;
            esac
          done
          MATRIX_ITEMS="${MATRIX_ITEMS%,}"
          MATRIX="{\"include\":[${MATRIX_ITEMS}]}"
          SERVICES_CSV="$(IFS=,; echo "${ALL_SERVICES[*]}")"
          SERVICES_ARGS="$(IFS=' '; echo "${ALL_SERVICES[*]}")"
          ANY_CHANGED="true"
          echo "Services selected for image rebuild: ${SERVICES_ARGS}"

          {
            echo "matrix=$MATRIX"
            echo "services_csv=$SERVICES_CSV"
            echo "services_args=$SERVICES_ARGS"
            echo "any_changed=$ANY_CHANGED"
            echo "frontend_changed=$FRONTEND_CHANGED"
          } >> "$GITHUB_OUTPUT"

  # ONE FRONTEND BUILD, WHOSE ENVIRONMENT IS CHOSEN BY THE RELEASE.
  #
  # There used to be two of these jobs, identical but for their secrets, because one CD run deployed
  # both estates. A run now deploys exactly one - a pre-release goes to dev, a stable to production -
  # so the second job had nothing left to be. The duplication was never harmless: the two drifted,
  # and the dev copy is where the `VITE_DEPLOY_ENVIRONMENT` banner lived while nothing said so.
  #
  # THE BUILD CANNOT BE RE-TAGGED FROM ONE ESTATE TO THE OTHER, which is why the environment has to
  # be decided here and not at deploy time: SvelteKit inlines `import.meta.env.*` at build time, so
  # the API origins, the Authentik client id and the banner are baked into the bundle. Shipping
  # production's image to dev would point dev's browser at production.
  build-frontend:
    name: Build Frontend
    needs: enumerate-services
    # `phase == 'build'` HERE AND ON THE NEXT TWO JOBS, `production` ON THE LAST ONE. This file is
    # called TWICE per stable release, and each call runs one half; the images are pushed to GHCR by
    # the first call, so the second has nothing left to build and only has to deploy what is already
    # in the registry.
    if: inputs.phase == 'build' && needs.enumerate-services.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned via `.bun-version`, the one place this repo names a bun. It must never be
          # "latest": that resolves through api.github.com/repos/oven-sh/bun/git/refs/tags and can
          # 401 with GITHUB_TOKEN. The version itself is free to be the newest bun - what must NOT
          # change is the LOCKFILE version, which `Guard the bun lockfile version` in
          # `code-analysis.yml` enforces directly. See `ecosystem-convergence.md` section 10.
          bun-version-file: ".bun-version"

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            frontend/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bunx svelte-kit sync

      - name: Build MLS WASM
        uses: ./.github/actions/build-mls-wasm

      - name: Generate protobuf bindings
        working-directory: frontend
        run: bun run proto:gen

      # THE THREE SECRETS NEITHER ESTATE CAN BE BUILT WITHOUT, taken from the set the release
      # selects. A missing one would otherwise produce a bundle whose every API origin is the empty
      # string, which builds fine and then fails in a browser with no server-side trace.
      #
      # THERE IS NO FALLBACK BETWEEN THE TWO SETS, deliberately. Falling back from `DEV_BASE_URL` to
      # `BASE_URL` would build a pre-release pointing at PRODUCTION and hand it to the store tester
      # programmes - precisely the accident the second environment exists to prevent. A missing
      # secret stops the release instead.
      - name: Validate the frontend build secrets
        env:
          IS_PRERELEASE: ${{ inputs.prerelease }}
          BASE_URL: ${{ secrets.BASE_URL }}
          AUTHENTIK_URL: ${{ secrets.AUTHENTIK_URL }}
          AUTHENTIK_CLIENT_ID: ${{ secrets.AUTHENTIK_CLIENT_ID }}
          DEV_BASE_URL: ${{ secrets.DEV_BASE_URL }}
          DEV_AUTHENTIK_URL: ${{ secrets.DEV_AUTHENTIK_URL }}
          DEV_AUTHENTIK_CLIENT_ID: ${{ secrets.DEV_AUTHENTIK_CLIENT_ID }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            required="DEV_BASE_URL DEV_AUTHENTIK_URL DEV_AUTHENTIK_CLIENT_ID"
          else
            required="BASE_URL AUTHENTIK_URL AUTHENTIK_CLIENT_ID"
          fi
          missing=0
          for name in $required; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set, and this build needs it. There is no fallback to the other environment's secrets - that would point this build at the wrong estate."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Create frontend .env
        working-directory: frontend
        env:
          IS_PRERELEASE: ${{ inputs.prerelease }}
          BASE_URL: ${{ secrets.BASE_URL }}
          AUTHENTIK_URL: ${{ secrets.AUTHENTIK_URL }}
          AUTHENTIK_CLIENT_ID: ${{ secrets.AUTHENTIK_CLIENT_ID }}
          DEV_BASE_URL: ${{ secrets.DEV_BASE_URL }}
          DEV_AUTHENTIK_URL: ${{ secrets.DEV_AUTHENTIK_URL }}
          DEV_AUTHENTIK_CLIENT_ID: ${{ secrets.DEV_AUTHENTIK_CLIENT_ID }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUB_KEY }}
          ANDROID_APP_LINK_SHA256: ${{ secrets.ANDROID_APP_LINK_SHA256 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
          EXPECTED_PROD_DOMAIN: ${{ env.DOMAIN }}
          EXPECTED_DEV_DOMAIN: ${{ env.DEV_DOMAIN }}
        run: |
          set -euo pipefail

          if [ "$IS_PRERELEASE" = "true" ]; then
            APP_URL="$DEV_BASE_URL"
            IDP_URL="$DEV_AUTHENTIK_URL"
            IDP_CLIENT="$DEV_AUTHENTIK_CLIENT_ID"
          else
            APP_URL="$BASE_URL"
            IDP_URL="$AUTHENTIK_URL"
            IDP_CLIENT="$AUTHENTIK_CLIENT_ID"
          fi

          # THE ONE PLACE IN THIS CHANTIER WHERE A MISTAKE SHIPS TO PHONES, so it is an ASSERTION
          # and never a convention. A store build carries its backend origin baked in and cannot be
          # re-pointed afterwards: an alpha built against production would let the tester programme
          # write to real data, and a stable built against dev would point every user at a box that
          # is wiped every Monday. Neither failure is visible in a green pipeline. The secrets are
          # selected by the release just above, so the only way to reach here wrong is a secret that
          # holds the other environment's URL - which is exactly what this catches.
          case "$APP_URL" in
            *"$EXPECTED_DEV_DOMAIN"*) URL_ENVIRONMENT=dev ;;
            *"$EXPECTED_PROD_DOMAIN"*) URL_ENVIRONMENT=production ;;
            *) URL_ENVIRONMENT=unknown ;;
          esac
          if [ "$IS_PRERELEASE" = "true" ] && [ "$URL_ENVIRONMENT" != "dev" ]; then
            echo "::error::This is a PRE-RELEASE but its backend URL is not ${EXPECTED_DEV_DOMAIN} (resolved: ${URL_ENVIRONMENT}). Refusing to build an alpha pointing anywhere else."
            exit 1
          fi
          if [ "$IS_PRERELEASE" != "true" ] && [ "$URL_ENVIRONMENT" != "production" ]; then
            echo "::error::This is a STABLE release but its backend URL is not ${EXPECTED_PROD_DOMAIN} (resolved: ${URL_ENVIRONMENT}). Refusing to build a production release pointing anywhere else."
            exit 1
          fi
          echo "Building the ${URL_ENVIRONMENT} frontend against ${APP_URL}"

          # Every URL is the estate's own origin; nginx routes /ws, /api/ and /media/ on that host.
          echo "VITE_FRONTEND_URL=${APP_URL}" >> .env
          echo "VITE_GATEWAY_URL=${APP_URL}" >> .env
          echo "VITE_CALL_URL=${APP_URL}" >> .env
          echo "VITE_DELIVERY_URL=${APP_URL}" >> .env
          echo "VITE_MEDIA_URL=${APP_URL}" >> .env
          echo "VITE_SOCIAL_URL=${APP_URL}" >> .env
          echo "VITE_CORE_URL=${APP_URL}" >> .env
          echo "VITE_AUTHENTIK_URL=${IDP_URL}" >> .env
          echo "VITE_AUTHENTIK_CLIENT_ID=${IDP_CLIENT}" >> .env

          if [ "$IS_PRERELEASE" = "true" ]; then
            # WHAT RAISES THE PERMANENT "test environment" BANNER. `deployEnvironment()` treats
            # UNSET as production on purpose, so forgetting this line costs dev its banner - visible
            # to whoever is looking at it - rather than putting a banner on production.
            echo "VITE_DEPLOY_ENVIRONMENT=development" >> .env

            # NO VITE_STRIPE_PUBLISHABLE_KEY on dev. It has no payment credentials at all (decided
            # with the user), and a publishable key whose secret half is absent produces a checkout
            # that opens and then fails - worse than a button that is not there.
          elif [ -n "$STRIPE_PUBLISHABLE_KEY" ]; then
            echo "VITE_STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}" >> .env
          fi

          if [ -n "$ANDROID_APP_LINK_SHA256" ]; then
            echo "VITE_ANDROID_APP_LINK_SHA256=${ANDROID_APP_LINK_SHA256}" >> .env
          fi
          if [ -n "$APPLE_TEAM_ID" ]; then
            echo "VITE_APPLE_TEAM_ID=${APPLE_TEAM_ID}" >> .env
          fi
          # In-app GIF picker (KLIPY). Optional - the GIF button is hidden when unset.
          if [ -n "$KLIPY_API_KEY" ]; then
            echo "VITE_KLIPY_KEY=${KLIPY_API_KEY}" >> .env
          fi

      - name: Build frontend
        working-directory: frontend
        # BUILD_WEB selects adapter-node over adapter-static (svelte.config.js). The web deploy
        # needs a server so each page's <head> can be written before it is sent; the Tauri
        # release workflows build without it and keep the static SPA output.
        env:
          BUILD_WEB: '1'
        run: bun run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/build/
          # Sans cette option, upload-artifact exclut les dotfiles : le dossier
          # build/.well-known/ (assetlinks.json + apple-app-site-association)
          # serait absent de l'image nginx -> 404 sur les App Links.
          include-hidden-files: true
          retention-days: 7

  build-docker-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [enumerate-services, build-frontend]
    if: |
      always() &&
      inputs.phase == 'build' &&
      needs.enumerate-services.result == 'success' &&
      needs.enumerate-services.outputs.any_changed == 'true' &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    permissions:
      contents: read
      packages: write
    strategy:
      # One image's failure must NOT cancel its siblings. With the default fail-fast, a frontend
      # build that failed on 11 August cancelled the media-service build sitting next to it - and
      # because the detector below only looks at what the CURRENT push changed, no later run ever
      # revisited it. `POST /api/media/touch` answered 404 in production for a day: the retention
      # clock the endpoint exists to extend was silently dead, on a service whose own build was fine.
      fail-fast: false
      matrix: ${{ fromJSON(needs.enumerate-services.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - name: Download frontend build artifact
        # Both frontend images come from the one adapter-node artifact: nginx serves
        # build/client + build/prerendered, the SSR image runs the server beside it.
        if: matrix.name == 'frontend' || matrix.name == 'frontend-ssr'
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: frontend/build/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # THE IMMUTABLE TAG IS THE COMMIT, AND THE MOVING TAG SAYS WHICH ESTATE MAY PULL IT.
      #
      # `type=ref,event=branch` and `type=sha,prefix={{branch}}-` are gone with the push trigger:
      # there is no branch event any more, and both produced tags nothing ever pulled.
      #
      # `latest` MOVES ONLY FOR A STABLE RELEASE, and `dev` only for a pre-release. Both compose
      # files are deployed with an explicit `TAG=<sha>`, so neither moving tag decides what runs -
      # but `latest` is what a human typing `docker pull` gets, and letting an alpha claim it would
      # make that person's answer to "what is production running" quietly wrong. `enable=` takes a
      # literal true/false, which is why the release kind is threaded in rather than inferred from
      # the default branch (every release commit is on the default branch, alpha and stable alike,
      # so `{{is_default_branch}}` could not tell them apart).
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ inputs.sha }}
            type=raw,value=v${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.prerelease == 'false' }}
            type=raw,value=dev,enable=${{ inputs.prerelease == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,ignore-error=true
          cache-to: type=gha,mode=min,ignore-error=true

  # ════════════════════════════════════════════════════════════════════════════════════════════
  # THE DEV ESTATE - dev.canari-emse.fr, WHICH IS NOW THE PRE-RELEASE TARGET
  #
  # ONE JOB, NOT THREE. `build-frontend-dev` and `build-frontend-images-dev` were deleted on
  # 2026-09-03: a CD run deploys exactly ONE estate now, so the frontend build above already builds
  # the right bundle and tags the right images. The two near-identical jobs existed only because a
  # single push used to deploy both estates at once, and they had already drifted apart.
  #
  # WHAT DEV IS FOR SINCE THE MIGRATION (user, 2026-09-02). It is no longer a rehearsal stage that
  # every change passes through - development is LOCAL now - it is where a `X.X.X-alpha.N`
  # pre-release lands, and what the Play internal track and the TestFlight internal group point at.
  # `dev-refresh.yml` keeps feeding it a copy of production every Monday, so an alpha still meets
  # production-shaped data.
  #
  # THE GATE IS A REPOSITORY VARIABLE, NOT A SECRET. `vars.DEV_ENVIRONMENT_ENABLED` unset means this
  # job skips and a pre-release deploys nothing. It is a `vars` and not a `secrets` entry so its
  # value is visible in the run log: whether a second estate is being deployed is not a secret, and
  # a silent gate is one nobody can debug.
  #
  # WHAT IS DELIBERATELY NOT HERE: no Stripe (dev has no payment credentials at all), and no
  # separate BACKEND images - both estates deploy the same image by its commit sha, which is why
  # `docker-compose.dev.yml` pins `TAG` exactly as production's does.
  # ════════════════════════════════════════════════════════════════════════════════════════════

  deploy-dev:
    name: Deploy to dev.canari-emse.fr
    runs-on: self-hosted
    needs: [enumerate-services, build-frontend, build-docker-images]
    # `build-frontend` IS IN THIS LIST BECAUSE ITS FAILURE WAS LAUNDERED INTO A SKIP, measured
    # 2026-09-02. A `skipped` image job means "the frontend did not change, the existing images
    # stand" - but it ALSO means "the build that feeds me failed", because a job whose dependency
    # fails is reported skipped, not failed. Accepting the skip without asking WHY, this job once
    # deployed an estate referencing `frontend-ssr:dev`, an image that had never been pushed, and
    # the pull failed at the registry instead of at a gate. A status that cannot tell a refusal from
    # a failure to run must not be the only thing consulted: the builder's own result is.
    if: |
      always() &&
      inputs.phase == 'build' &&
      vars.DEV_ENVIRONMENT_ENABLED == 'true' &&
      inputs.prerelease == 'true' &&
      needs.enumerate-services.result == 'success' &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') &&
      (needs.build-docker-images.result == 'success' || needs.build-docker-images.result == 'skipped')
    permissions:
      contents: write
      packages: read
    environment:
      name: development
      url: https://${{ env.DEV_DOMAIN }}
    steps:
      # ONE NAMED STARTING POINT, whatever happened before. The dev estate has its OWN checkout,
      # separate from production's, because two estates sharing one working tree would race: a
      # `git reset --hard` for one rewrites the compose file the other is being deployed from. The
      # clone is done here rather than by hand so the state is reproducible - a directory somebody
      # created once, differently, is exactly the inherited state this repository keeps paying for.
      - name: Ensure the dev checkout exists and is at this commit
        run: |
          set -euo pipefail
          if [ ! -d "$DEV_DEPLOY_PATH/.git" ]; then
            echo "no dev checkout at $DEV_DEPLOY_PATH - cloning"
            rm -rf "$DEV_DEPLOY_PATH"
            git clone --no-checkout \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
              "$DEV_DEPLOY_PATH"
          fi
          cd "$DEV_DEPLOY_PATH"
          git remote set-url origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch origin main
          git reset --hard origin/main
          echo "dev checkout at $(git rev-parse --short HEAD)"

      # Renders infrastructure/.env for the dev estate and NOTHING ELSE, from the DEV_ secrets only.
      # The list is the manifest's own `secret:` rows that dev does not skip; a row added there and
      # not here is caught by `.github/scripts/tests/deploy-env.test.sh`, which derives this block.
      #
      # IT RUNS BEFORE ANY CONTAINER IS TOUCHED, and refuses to write a partial file: a missing
      # required secret fails here, with the previous dev deployment still up.
      - name: Render the dev environment
        working-directory: ${{ env.DEV_DEPLOY_PATH }}
        env:
          DEV_JWT_SECRET: ${{ secrets.DEV_JWT_SECRET }}
          DEV_AUTHENTIK_URL: ${{ secrets.DEV_AUTHENTIK_URL }}
          DEV_AUTHENTIK_CLIENT_ID: ${{ secrets.DEV_AUTHENTIK_CLIENT_ID }}
          DEV_AUTHENTIK_CLIENT_SECRET: ${{ secrets.DEV_AUTHENTIK_CLIENT_SECRET }}
          DEV_BASE_URL: ${{ secrets.DEV_BASE_URL }}
          DEV_POSTGRES_USER: ${{ secrets.DEV_POSTGRES_USER }}
          DEV_POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
          DEV_GARAGE_RPC_SECRET: ${{ secrets.DEV_GARAGE_RPC_SECRET }}
          DEV_GARAGE_ADMIN_TOKEN: ${{ secrets.DEV_GARAGE_ADMIN_TOKEN }}
          DEV_GARAGE_ACCESS_KEY_ID: ${{ secrets.DEV_GARAGE_ACCESS_KEY_ID }}
          DEV_GARAGE_SECRET_ACCESS_KEY: ${{ secrets.DEV_GARAGE_SECRET_ACCESS_KEY }}
          DEV_CHANNELS_ENCRYPTION_SECRET: ${{ secrets.DEV_CHANNELS_ENCRYPTION_SECRET }}
          DEV_INTERNAL_SHARED_SECRET: ${{ secrets.DEV_INTERNAL_SHARED_SECRET }}
          DEV_CALL_ROOM_SECRET: ${{ secrets.DEV_CALL_ROOM_SECRET }}
          DEV_INTERNAL_SECRET: ${{ secrets.DEV_INTERNAL_SECRET }}
          DEV_EXTERNAL_API_KEY: ${{ secrets.DEV_EXTERNAL_API_KEY }}
          DEV_SKY_API_KEY: ${{ secrets.DEV_SKY_API_KEY }}
          DEV_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.DEV_FIREBASE_SERVICE_ACCOUNT_JSON }}
          DEV_CLOUDFLARE_CALLS_API_TOKEN: ${{ secrets.DEV_CLOUDFLARE_CALLS_API_TOKEN }}
          DEV_CLOUDFLARE_TURN_KEY_ID: ${{ secrets.DEV_CLOUDFLARE_TURN_KEY_ID }}
          DEV_MIGALLERY_API_KEY: ${{ secrets.DEV_MIGALLERY_API_KEY }}
          DEV_GOOGLE_SAFE_BROWSING_API_KEY: ${{ secrets.DEV_GOOGLE_SAFE_BROWSING_API_KEY }}
          DEV_SERVICE_ACCOUNT_USER_ID: ${{ secrets.DEV_SERVICE_ACCOUNT_USER_ID }}
          # Push, iOS half. Available on dev on purpose: what stops a test notification reaching a
          # real member is the copy's `TRUNCATE TABLE push_token`, not an absent key, so a dev estate
          # can only reach a phone that has itself signed into dev. Absent, iOS falls back to an FCM
          # banner and the deploy says so.
          DEV_APNS_VOIP_KEY_P8: ${{ secrets.DEV_APNS_VOIP_KEY_P8 }}
          DEV_APNS_VOIP_KEY_ID: ${{ secrets.DEV_APNS_VOIP_KEY_ID }}
          DEV_APNS_VOIP_TEAM_ID: ${{ secrets.DEV_APNS_VOIP_TEAM_ID }}
        run: |
          set -euo pipefail
          bash infrastructure/deploy/render-env.sh \
            --environment dev \
            --domain "${{ env.DOMAIN }}" \
            --build "dev.$(git rev-parse --short=7 HEAD)" \
            --out infrastructure/.env

          # THE THREE HOST PORTS ARE NOT WRITTEN HERE ANY MORE, and the reason is worth keeping.
          # They used to be, in the shape `grep -q '^KEY=' .env || echo KEY=<dev value>`, and that
          # never fired once: render-env.sh builds .env from `infrastructure/.env.example`, which
          # DECLARES all three at production's numbers. The key was never absent, so the dev override
          # was never applied and dev's .env asked for production's port 8080. They are `computed`
          # manifest rows now, upserted by render-env.sh, so one place decides per environment.

      # `dev` IS DEV'S MOVING TAG, FOR EVERY SERVICE AND NOT JUST THE TWO FRONTENDS. It used to be
      # `TAG=latest` for the shared backends and `FRONTEND_TAG=dev` for the frontends, which worked
      # only while one push deployed both estates from one commit. A pre-release and a stable are
      # different commits now, so `latest` belongs to production alone and dev reads `dev`.
      #
      # A MOVING TAG AND NOT THE SHA, because the compose file resolves a tag for EVERY service and
      # this release built only the ones that changed. `dev` resolves for all of them, each pointing
      # at the last pre-release that touched it - which is exactly what a selective rebuild means.
      #
      # `--pull-services` carries the services the detector saw change; the two frontends are added
      # unconditionally when their build ran, because a release always rebuilds them.
      - name: Deploy the dev estate
        working-directory: ${{ env.DEV_DEPLOY_PATH }}
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          FRONTEND_TAG: dev
          CHANGED_SERVICES: ${{ needs.enumerate-services.outputs.services_args }}
          FRONTEND_IMAGES_BUILT: ${{ needs.build-docker-images.result }}
        run: |
          set -euo pipefail
          pull="$CHANGED_SERVICES"
          if [ "$FRONTEND_IMAGES_BUILT" = "success" ]; then
            case " $pull " in
            *" frontend "*) ;;
            *) pull="$pull frontend frontend-ssr" ;;
            esac
          fi
          bash infrastructure/deploy/deploy-environment.sh \
            --environment dev \
            --path "${{ env.DEV_DEPLOY_PATH }}" \
            --tag dev \
            --registry "${{ env.REGISTRY }}" \
            --image-prefix "${{ env.IMAGE_PREFIX }}" \
            --pull-services "$pull"

      # WHAT THE DEV ESTATE IS RUNNING, recorded where a human can read it. This is not the change
      # detector's input any more - that is the previous RELEASE now - so the tag exists only to
      # answer the question the estate itself cannot.
      - name: Record the deployed commit
        if: success()
        run: |
          set -euo pipefail
          git -C "${{ env.DEV_DEPLOY_PATH }}" tag -f dev-deployed "${{ inputs.sha }}"
          git -C "${{ env.DEV_DEPLOY_PATH }}" push -f \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            refs/tags/dev-deployed
          echo "dev-deployed -> ${{ inputs.sha }} (v${{ inputs.version }})"

  # -----------------------------------------------------------------------------------------------
  # THE PROMOTION JOB IS GONE, AND SO IS THE BRANCH IT PROMOTED
  # -----------------------------------------------------------------------------------------------
  # `promote-dev-to-main` fast-forwarded `main` onto `dev` once the dev estate had ANSWERED
  # /api/version as that commit, then dispatched this workflow. It existed because `dev` was a
  # branch that nothing else would advance, and a branch nobody promotes is a parking lot.
  #
  # The user cancelled that model on 2026-09-02, hours after it landed: `main` is the only branch
  # now, work arrives by pull request, and NOTHING deploys until a release is published. There is no
  # promotion left to perform - the two estates are fed by two kinds of release rather than by two
  # branches, and the proof that used to gate the promotion is simply the alpha somebody published
  # and looked at.
  #
  # WHAT WAS LOST WITH IT, stated because it was real: an automatic proof, on production-shaped
  # data, that a commit serves before production is given it. A pre-release now provides that only
  # when somebody publishes one. That is the trade the user chose, and this comment is here so the
  # next session does not "restore" it by accident.
  # -----------------------------------------------------------------------------------------------

  deploy-to-server:
    name: Deploy to Production Server
    runs-on: self-hosted
    needs: [enumerate-services, build-frontend, build-docker-images]
    # A STABLE RELEASE, AND NOTHING ELSE, REACHES THIS JOB, and since 2026-09-04 only after BOTH
    # STORES HAVE ACCEPTED THE SAME VERSION. `prerelease == 'false'` says the first half; the second
    # half is not expressible here, because a called workflow cannot depend on a job of its caller -
    # it is `release.yml`'s `production` job, which needs `[android, ios]` and calls this file a
    # second time with `phase: production`.
    #
    # WHY THE WEB WAITS FOR THE STORES (user, 2026-09-03: *"j'aimerais que toutes les versions soient
    # toujours alignees"*). Store AVAILABILITY is never simultaneous - Apple reviews in days, Play
    # rolls out in hours - so "aligned" cannot mean "live at the same instant", and pretending
    # otherwise would be a promise this file cannot keep. What it CAN guarantee is the useful half:
    # **the web never serves a version a store refused.** A build that fails to sign, an `.aab` Play
    # rejects, an App Store submission answered with a 409 - each now stops production instead of
    # leaving the web a version ahead of every phone.
    #
    # THE COST IS ~14 MINUTES AND IT IS PAID ONLY BY PRODUCTION, measured on `v0.16.1-alpha.1`: the
    # two mobile arms are the wall, everything else already finishes inside their shadow.
    # `deploy-dev` is deliberately NOT behind this - dev is where somebody looks first, and holding
    # it back a quarter of an hour would buy nothing, an alpha having no production estate to get
    # ahead of.
    #
    # There is no CI condition here either - `release.yml` gates the whole run on `CI passed` being
    # green on the very commit these artefacts are built from.
    #
    # `deploy-dev` IS NOT IN THIS LIST, and it must not be added. The two arms deploy DIFFERENT
    # commits now - the alpha somebody published and the stable somebody published - so waiting on
    # one from the other would be waiting on an unrelated run. A dev estate broken for a reason of
    # its own (a mis-set DEV_ secret, a registry that timed out: measured on run 33633156004, its
    # first day) must never hold a production release hostage.
    if: |
      always() &&
      inputs.phase == 'production' &&
      inputs.prerelease == 'false' &&
      needs.enumerate-services.result == 'success' &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') &&
      (needs.build-docker-images.result == 'success' || needs.build-docker-images.result == 'skipped')
    permissions:
      # `write` only for the `prod-released` tag the last step moves - the deploy itself reads.
      contents: write
      packages: read
    environment:
      name: production
      url: https://${{ env.DOMAIN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - name: Log deployment start
        run: |
          echo "🚀 Starting deployment on self-hosted runner…"
          echo "User: $(whoami)"
          echo "Working directory: $(pwd)"
          echo "Deploy path: ${{ env.DEPLOY_PATH }}"

      - name: Setup environment variables
        run: |
          echo "REGISTRY=${{ env.REGISTRY }}" >> $GITHUB_ENV
          echo "IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}" >> $GITHUB_ENV
          # `latest` AND NOT THE COMMIT SHA, AND THAT IS FORCED BY SELECTIVE REBUILDS. The compose
          # file resolves a tag for EVERY service, including the ones this release did not change -
          # and those have no image at this commit's sha, because nothing built one. A moving tag is
          # the only one that resolves for all of them, each pointing at the last build of that
          # service for THIS estate. Production moves `latest`; a pre-release moves `dev` and leaves
          # `latest` alone, so the two estates never read each other's images.
          #
          # WHICH COMMIT PRODUCTION RUNS is answered by the `prod-released` tag the last step writes
          # and by `/api/version`, never by reading `latest`.
          echo "TAG=latest" >> $GITHUB_ENV

      - name: Resolve Docker access
        run: |
          if docker info >/dev/null 2>&1; then
            echo "DOCKER_CLI=docker" >> $GITHUB_ENV
            echo "DOCKER_COMPOSE=docker compose" >> $GITHUB_ENV
            echo "✅ Docker access available via docker"
          elif sudo -n docker info >/dev/null 2>&1; then
            echo "DOCKER_CLI=sudo docker" >> $GITHUB_ENV
            echo "DOCKER_COMPOSE=sudo docker compose" >> $GITHUB_ENV
            echo "✅ Docker access available via sudo docker"
          else
            echo "❌ Cannot access Docker daemon as current runner user"
            id
            ls -l /var/run/docker.sock || true
            echo "Runner user must be in docker group or have passwordless sudo for docker"
            exit 1
          fi

      - name: Authenticate to GHCR
        env:
          REGISTRY: ${{ env.REGISTRY }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "🔐 Logging into GHCR…"
          if [ "$DOCKER_CLI" = "docker" ]; then
            echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USERNAME" --password-stdin
          else
            echo "$GHCR_TOKEN" | sudo docker login "$REGISTRY" -u "$GHCR_USERNAME" --password-stdin
          fi
          echo "✅ GHCR authentication successful"

      - name: Navigate to deployment directory
        run: |
          cd ${{ env.DEPLOY_PATH }}
          echo "📂 Current directory: $(pwd)"

      - name: Pull latest code
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          echo "📥 Updating repository…"
          git fetch origin
          git reset --hard origin/main
          echo "✅ Code updated to $(git rev-parse --short HEAD)"

      - name: Sync runtime secrets into infrastructure/.env
        working-directory: ${{ env.DEPLOY_PATH }}
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          SERVICE_ACCOUNT_USER_ID: ${{ secrets.SERVICE_ACCOUNT_USER_ID }}
          EXTERNAL_API_KEY: ${{ secrets.EXTERNAL_API_KEY }}
          SKY_API_KEY: ${{ secrets.SKY_API_KEY }}
          CERCLE_API_KEY: ${{ secrets.CERCLE_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          LYDIA_PROVIDER_TOKEN: ${{ secrets.LYDIA_PROVIDER_TOKEN }}
          LYDIA_PROVIDER_PRIVATE_TOKEN: ${{ secrets.LYDIA_PROVIDER_PRIVATE_TOKEN }}
          AUTHENTIK_BASE_URL: ${{ secrets.AUTHENTIK_URL }}
          AUTHENTIK_CLIENT_ID: ${{ secrets.AUTHENTIK_CLIENT_ID }}
          AUTHENTIK_CLIENT_SECRET: ${{ secrets.AUTHENTIK_CLIENT_SECRET }}
          FRONTEND_URL: ${{ secrets.BASE_URL }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          CLOUDFLARE_CALLS_API_TOKEN: ${{ secrets.CLOUDFLARE_CALLS_API_TOKEN }}
          CLOUDFLARE_TURN_KEY_ID: ${{ secrets.CLOUDFLARE_TURN_KEY_ID }}
          GARAGE_RPC_SECRET: ${{ secrets.GARAGE_RPC_SECRET }}
          GARAGE_ADMIN_TOKEN: ${{ secrets.GARAGE_ADMIN_TOKEN }}
          GARAGE_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
          GARAGE_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
          MIGALLERY_API_KEY: ${{ secrets.MIGALLERY_API_KEY }}
          GOOGLE_SAFE_BROWSING_API_KEY: ${{ secrets.GOOGLE_SAFE_BROWSING_API_KEY }}
          CHANNELS_ENCRYPTION_SECRET: ${{ secrets.CHANNELS_ENCRYPTION_SECRET }}
          INTERNAL_SHARED_SECRET: ${{ secrets.INTERNAL_SHARED_SECRET }}
          CALL_ROOM_SECRET: ${{ secrets.CALL_ROOM_SECRET }}
          APNS_VOIP_KEY_P8: ${{ secrets.APNS_VOIP_KEY_P8 }}
          APNS_VOIP_KEY_ID: ${{ secrets.APNS_VOIP_KEY_ID }}
          APNS_VOIP_TEAM_ID: ${{ secrets.APNS_VOIP_TEAM_ID }}
        run: |
          if [ -z "$JWT_SECRET" ]; then
            echo "::error::Missing required GitHub secret: JWT_SECRET"
            exit 1
          fi

          if [ -z "$AUTHENTIK_CLIENT_SECRET" ]; then
            echo "::error::Missing required GitHub secret: AUTHENTIK_CLIENT_SECRET"
            exit 1
          fi

          if [ -z "$POSTGRES_USER" ]; then
            echo "::error::Missing required GitHub secret: POSTGRES_USER"
            exit 1
          fi

          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "::error::Missing required GitHub secret: POSTGRES_PASSWORD"
            exit 1
          fi

          # Regenerate .env from the template on every deploy so it stays ordered
          # like .env.example, drops stale keys, and never accumulates leftovers.
          # All real secrets are GitHub-backed and re-injected by the upserts below,
          # so nothing is lost; non-secret defaults come straight from the template.
          if [ ! -f infrastructure/.env.example ]; then
            echo "::error::infrastructure/.env.example is missing - cannot generate infrastructure/.env"
            exit 1
          fi
          cp infrastructure/.env.example infrastructure/.env

          upsert_env_var() {
            key="$1"
            value="$2"
            # Remove existing line (if any), then append.
            # Avoids sed delimiter issues with URLs containing '/'.
            grep -v "^${key}=" infrastructure/.env > infrastructure/.env.tmp || true
            mv infrastructure/.env.tmp infrastructure/.env
            printf '%s=%s\n' "$key" "$value" >> infrastructure/.env
          }

          upsert_env_var "JWT_SECRET" "$JWT_SECRET"

          if [ -n "$INTERNAL_SECRET" ]; then
            upsert_env_var "INTERNAL_SECRET" "$INTERNAL_SECRET"
          else
            echo "::warning::INTERNAL_SECRET is not set - social/form push notifications will be disabled"
          fi

          # Optional override of the verification service account id. When unset, the default
          # from .env.example applies (regenerated above), so no warning is needed.
          if [ -n "$SERVICE_ACCOUNT_USER_ID" ]; then
            upsert_env_var "SERVICE_ACCOUNT_USER_ID" "$SERVICE_ACCOUNT_USER_ID"
          fi

          if [ -n "$EXTERNAL_API_KEY" ]; then
            upsert_env_var "EXTERNAL_API_KEY" "$EXTERNAL_API_KEY"
          else
            echo "::warning::EXTERNAL_API_KEY is not set - external profile API (Sky) will reject all requests"
          fi

          if [ -n "$SKY_API_KEY" ]; then
            upsert_env_var "SKY_API_KEY" "$SKY_API_KEY"
          else
            echo "::warning::SKY_API_KEY is not set - Sky parrainage tree on profiles will be empty"
          fi

          # Le Cercle reads /api/public/cotisant-status before letting a member drink. An empty
          # key is not a degraded mode: assertCercleApiKey rejects EVERY request when unset, so
          # the bar simply stops serving cotisants. Must equal CANARI_API_KEY on the Cercle side.
          if [ -n "$CERCLE_API_KEY" ]; then
            upsert_env_var "CERCLE_API_KEY" "$CERCLE_API_KEY"
          else
            echo "::warning::CERCLE_API_KEY is not set - /api/public/cotisant-status will reject all requests (Le Cercle cannot check cotisant status)"
          fi

          upsert_env_var "CALL_E2E_ENCRYPTION" "false"

          upsert_env_var "AUTHENTIK_BASE_URL" "$AUTHENTIK_BASE_URL"
          upsert_env_var "AUTHENTIK_CLIENT_ID" "$AUTHENTIK_CLIENT_ID"
          upsert_env_var "AUTHENTIK_CLIENT_SECRET" "$AUTHENTIK_CLIENT_SECRET"
          # SPA base URL → FRONTEND_URL (CORS pour core, social, chat-delivery, media).
          upsert_env_var "FRONTEND_URL" "$FRONTEND_URL"
          upsert_env_var "POSTGRES_USER" "$POSTGRES_USER"
          upsert_env_var "POSTGRES_PASSWORD" "$POSTGRES_PASSWORD"
          # chat-gateway CORS, and THIS VALUE NOW REACHES THE CONTAINER. Until 2026-08-30
          # `docker-compose.prod.yml` set `ALLOW_ORIGIN: "*"` as a LITERAL on that service, which
          # wins over anything in `.env`, so this line had never been read by anything and the
          # gateway answered every origin on earth (measured on prod 2026-08-27 and again on
          # 2026-08-30: `OPTIONS /api/presence` from `https://evil.example` -> 200,
          # `access-control-allow-origin: *`). That wildcard is also why the gateway was never the
          # iOS blocker - it accepted the very origin the Nest services refused.
          #
          # Every entry is a Canari client, and dropping one costs that client the gateway with no
          # server-side error to show for it. The three tauri origins are the app itself, one
          # spelling per platform - `http(s)://tauri.localhost` on Android/Windows,
          # `tauri://localhost` on iOS/macOS/Linux; omitting the iOS spelling from the Nest list
          # cost that platform its login (see cors-origins.ts, which this must stay in step with).
          # `dev.canari-emse.fr` is a proxied CNAME onto this SAME tunnel, so a list built from
          # FRONTEND_URL alone would refuse a hostname this very stack serves. `127.0.0.1:1420` is
          # how tauri.conf.json's devUrl actually spells the dev server, and the gateway matches
          # exactly where the Nest services accept any loopback.
          #
          # THE DEPLOY'S COLOUR DOES NOT PROVE THIS VALUE: an origin that is merely WRONG parses
          # fine and simply matches nothing. Read the served header back after deploying.
          upsert_env_var "ALLOW_ORIGIN" "$FRONTEND_URL,https://dev.${{ env.DOMAIN }},http://localhost:1420,http://127.0.0.1:1420,http://tauri.localhost,https://tauri.localhost,tauri://localhost"

          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            FIREBASE_SERVICE_ACCOUNT_JSON_COMPACT="$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | tr -d '\r\n')"
            upsert_env_var "FIREBASE_SERVICE_ACCOUNT_JSON" "$FIREBASE_SERVICE_ACCOUNT_JSON_COMPACT"
          else
            echo "⚠️ FIREBASE_SERVICE_ACCOUNT_JSON is not set in GitHub secrets (push notifications will be disabled)"
          fi

          if [ -n "$STRIPE_SECRET_KEY" ]; then
            upsert_env_var "STRIPE_SECRET_KEY" "$STRIPE_SECRET_KEY"
          else
            echo "⚠️ STRIPE_SECRET_KEY is not set in GitHub secrets (payments features may be disabled)"
          fi

          if [ -n "$STRIPE_WEBHOOK_SECRET" ]; then
            upsert_env_var "STRIPE_WEBHOOK_SECRET" "$STRIPE_WEBHOOK_SECRET"
          else
            echo "⚠️ STRIPE_WEBHOOK_SECRET is not set in GitHub secrets (Stripe webhooks will be rejected in production)"
          fi

          if [ -n "$LYDIA_PROVIDER_TOKEN" ]; then
            upsert_env_var "LYDIA_PROVIDER_TOKEN" "$LYDIA_PROVIDER_TOKEN"
          else
            echo "⚠️ LYDIA_PROVIDER_TOKEN is not set in GitHub secrets (Lydia payments unavailable if selected as the active provider)"
          fi

          if [ -n "$LYDIA_PROVIDER_PRIVATE_TOKEN" ]; then
            upsert_env_var "LYDIA_PROVIDER_PRIVATE_TOKEN" "$LYDIA_PROVIDER_PRIVATE_TOKEN"
          else
            echo "⚠️ LYDIA_PROVIDER_PRIVATE_TOKEN is not set in GitHub secrets (Lydia payments unavailable if selected as the active provider)"
          fi

          if [ -n "$CLOUDFLARE_CALLS_API_TOKEN" ]; then
            upsert_env_var "CLOUDFLARE_CALLS_API_TOKEN" "$CLOUDFLARE_CALLS_API_TOKEN"
          else
            echo "::warning::CLOUDFLARE_CALLS_API_TOKEN is not set - voice/video calls will fail (ice-servers returns 503)"
          fi

          if [ -n "$CLOUDFLARE_TURN_KEY_ID" ]; then
            upsert_env_var "CLOUDFLARE_TURN_KEY_ID" "$CLOUDFLARE_TURN_KEY_ID"
          else
            echo "::warning::CLOUDFLARE_TURN_KEY_ID is not set - voice/video calls will fail (ice-servers returns 503)"
          fi

          if [ -n "$GARAGE_RPC_SECRET" ]; then
            upsert_env_var "GARAGE_RPC_SECRET" "$GARAGE_RPC_SECRET"
          else
            echo "::error::GARAGE_RPC_SECRET is not set - media storage (Garage) will fail to start"
            exit 1
          fi

          if [ -n "$GARAGE_ADMIN_TOKEN" ]; then
            upsert_env_var "GARAGE_ADMIN_TOKEN" "$GARAGE_ADMIN_TOKEN"
          else
            echo "::error::GARAGE_ADMIN_TOKEN is not set - media storage (Garage) will fail to start"
            exit 1
          fi

          # Garage's own S3 key, and the ONLY S3 identity in the stack: media-service
          # authenticates with it too. It required an access key ID >= 8 characters and a secret
          # >= 16, which MinIO enforced neither of - that is why the cutover minted a new pair
          # instead of renaming MinIO's old root credentials. Until 2026-08-18 these values were
          # ALSO written under MINIO_ACCESS_KEY/SECRET_KEY, which media-service read; one value
          # under two names is a duplicate that can drift, and drift here refuses every media
          # request. One name now, everywhere.
          #
          # THE ENDPOINT AND THE CREDENTIALS FOR IT MUST MOVE IN THE SAME COMMIT. .env is
          # regenerated from .env.example on every deploy; an earlier version of this cutover
          # moved the endpoint in .env.example without moving these upserts, so media-service kept
          # getting MinIO's root credentials for a store that no longer existed and crash-looped
          # on `AccessDenied` inside `onModuleInit`. See docs/wiki/infrastructure/docker.md.
          if [ -n "$GARAGE_ACCESS_KEY_ID" ]; then
            upsert_env_var "GARAGE_ACCESS_KEY_ID" "$GARAGE_ACCESS_KEY_ID"
          else
            echo "::error::GARAGE_ACCESS_KEY_ID is not set - media storage (Garage) will fail to start"
            exit 1
          fi

          if [ -n "$GARAGE_SECRET_ACCESS_KEY" ]; then
            upsert_env_var "GARAGE_SECRET_ACCESS_KEY" "$GARAGE_SECRET_ACCESS_KEY"
          else
            echo "::error::GARAGE_SECRET_ACCESS_KEY is not set - media storage (Garage) will fail to start"
            exit 1
          fi

          if [ -n "$MIGALLERY_API_KEY" ]; then
            upsert_env_var "MIGALLERY_API_KEY" "$MIGALLERY_API_KEY"
          else
            echo "::warning::MIGALLERY_API_KEY is not set - avatar service will not work"
          fi

          # WP-SAFELINK-1: server-side Safe Browsing lookup for links shared in messages/posts.
          # Optional and fails OPEN when unset - a missing safety key must not become an outage
          # for every link in the app, same reasoning as the other optional keys above.
          if [ -n "$GOOGLE_SAFE_BROWSING_API_KEY" ]; then
            upsert_env_var "GOOGLE_SAFE_BROWSING_API_KEY" "$GOOGLE_SAFE_BROWSING_API_KEY"
          else
            echo "::warning::GOOGLE_SAFE_BROWSING_API_KEY is not set - links will not be checked against Safe Browsing"
          fi

          if [ -n "$CHANNELS_ENCRYPTION_SECRET" ]; then
            upsert_env_var "CHANNELS_ENCRYPTION_SECRET" "$CHANNELS_ENCRYPTION_SECRET"
          else
            echo "::error::CHANNELS_ENCRYPTION_SECRET is not set - channel encryption will fail"
            exit 1
          fi

          if [ -n "$INTERNAL_SHARED_SECRET" ]; then
            upsert_env_var "INTERNAL_SHARED_SECRET" "$INTERNAL_SHARED_SECRET"
          else
            echo "::error::INTERNAL_SHARED_SECRET is not set - inter-service HMAC auth will be disabled (security risk)"
            exit 1
          fi

          if [ -n "$CALL_ROOM_SECRET" ]; then
            upsert_env_var "CALL_ROOM_SECRET" "$CALL_ROOM_SECRET"
          else
            echo "::error::CALL_ROOM_SECRET is not set - WebRTC room access control will be disabled (security risk)"
            exit 1
          fi

          # APNs VoIP key (WP-XP-5, iOS CallKit rings). Optional: without it iOS falls back
          # to an FCM alert banner. The .env file is line-based, so a raw multi-line PEM is
          # base64-encoded before writing (ApnsVoipService accepts both forms).
          if [ -n "$APNS_VOIP_KEY_P8" ]; then
            case "$APNS_VOIP_KEY_P8" in
              *"BEGIN PRIVATE KEY"*) APNS_VOIP_KEY_P8="$(printf '%s' "$APNS_VOIP_KEY_P8" | base64 -w0)" ;;
            esac
            upsert_env_var "APNS_VOIP_KEY_P8" "$APNS_VOIP_KEY_P8"
            upsert_env_var "APNS_VOIP_KEY_ID" "$APNS_VOIP_KEY_ID"
            upsert_env_var "APNS_VOIP_TEAM_ID" "$APNS_VOIP_TEAM_ID"
          else
            echo "::warning::APNS_VOIP_KEY_P8 is not set - iOS CallKit VoIP pushes disabled (FCM banner fallback)"
          fi

          echo "✅ Runtime secrets synced to infrastructure/.env"

      - name: Check environment configuration
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          echo "🔍 Checking environment configuration…"

          FRONTEND_HOST_PORT=80
          if [ -f infrastructure/.env ]; then
            ENV_PORT=$(grep -E '^FRONTEND_HOST_PORT=' infrastructure/.env | cut -d= -f2 || true)
            if [ -n "$ENV_PORT" ]; then
              FRONTEND_HOST_PORT="$ENV_PORT"
            fi
          fi
          echo "FRONTEND_HOST_PORT=$FRONTEND_HOST_PORT" >> $GITHUB_ENV

          if [ ! -f infrastructure/.env ]; then
            echo ""
            echo "╔═══════════════════════════════════════════════════════════╗"
            echo "║  ⚠️  CONFIGURATION MANQUANTE                             ║"
            echo "╚═══════════════════════════════════════════════════════════╝"
            echo ""
            echo "Le fichier infrastructure/.env n'existe pas."
            echo "Pour le premier déploiement, vous devez :"
            echo ""
            echo "  1. SSH sur le serveur :"
            echo "     ssh ${{ env.DEPLOY_PATH }}"
            echo ""
            echo "  2. Lancer la configuration initiale :"
            echo "     make production"
            echo ""
            echo "  3. Configurer les secrets dans infrastructure/.env"
            echo ""
            echo "  4. Relancer ce workflow"
            echo ""
            exit 1
          fi

          if [ ! -f frontend/.env ]; then
            echo "⚠️ frontend/.env manquant, création depuis template…"
            cp frontend/.env.example frontend/.env
          fi

          echo "✅ Configuration .env présente"

          # Vérifier que JWT_SECRET est configuré (sans afficher la valeur)
          if grep -q "^JWT_SECRET=.*change.*me" infrastructure/.env 2>/dev/null; then
            echo ""
            echo "⚠️  WARNING: JWT_SECRET semble être une valeur par défaut"
            echo "   Assurez-vous d'avoir configuré un secret sécurisé !"
            echo ""
          fi

      - name: Pull Docker images
        working-directory: ${{ env.DEPLOY_PATH }}
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          CHANGED_SERVICES: ${{ needs.enumerate-services.outputs.services_args }}
        run: |
          if [ -n "$CHANGED_SERVICES" ]; then
            echo "🔄 Pulling changed Docker images: $CHANGED_SERVICES"
            eval "$DOCKER_COMPOSE -f infrastructure/docker-compose.prod.yml pull $CHANGED_SERVICES"
            echo "✅ Changed images pulled successfully"
          else
            echo "ℹ️ No service image changes detected. Skipping docker pull."
          fi

      - name: Deploy services
        working-directory: ${{ env.DEPLOY_PATH }}
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          echo "🚀 Deploying services with zero-downtime…"
          set +e
          eval "$DOCKER_COMPOSE -f infrastructure/docker-compose.prod.yml up -d --remove-orphans"
          DEPLOY_STATUS=$?
          set -e

          if [ "$DEPLOY_STATUS" -ne 0 ]; then
            echo "⚠️ First deploy attempt failed. Checking for frontend host port conflicts…"

            CONFLICTS=$(eval "$DOCKER_CLI ps --filter 'publish=$FRONTEND_HOST_PORT' --format '{{.ID}} {{.Image}} {{.Names}}'")

            NON_CANARI_CONFLICT=0
            if [ -n "$CONFLICTS" ]; then
              while IFS= read -r row; do
                [ -z "$row" ] && continue

                cid=$(echo "$row" | awk '{print $1}')
                image=$(echo "$row" | awk '{print $2}')
                name=$(echo "$row" | awk '{print $3}')

                if echo "$image" | grep -q "^${REGISTRY}/${IMAGE_PREFIX}/frontend:"; then
                  echo "🧹 Removing stale Canari frontend container using host port: $name ($cid)"
                  eval "$DOCKER_CLI rm -f $cid"
                else
                  echo "❌ Port conflict with non-Canari container: $name ($image)"
                  NON_CANARI_CONFLICT=1
                fi
              done <<< "$CONFLICTS"
            fi

            if [ "$NON_CANARI_CONFLICT" -ne 0 ]; then
              echo "Resolve host port ${FRONTEND_HOST_PORT} conflicts and retry deployment."
              exit 1
            fi

            echo "🔁 Retrying deployment after frontend cleanup…"
            eval "$DOCKER_COMPOSE -f infrastructure/docker-compose.prod.yml up -d --remove-orphans"
          fi

          echo "✅ Services deployed"

      - name: Run database migrations
        working-directory: ${{ env.DEPLOY_PATH }}
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
        run: |
          echo "🗄️ Running database migrations…"

          # Wait for PostgreSQL to accept connections (up to 60s).
          # psql and pg_isready connect via unix socket inside the container → trust auth, no password needed.
          for i in $(seq 1 30); do
            if eval "$DOCKER_COMPOSE -f infrastructure/docker-compose.prod.yml exec -T postgres pg_isready -U \"$POSTGRES_USER\" -d auth_db" >/dev/null 2>&1; then
              echo "✅ PostgreSQL is ready"
              break
            fi
            echo "⏳ Waiting for PostgreSQL… ($i/30)"
            sleep 2
            if [ "$i" -eq 30 ]; then
              echo "❌ PostgreSQL did not become ready in time"
              exit 1
            fi
          done

          PSQL="$DOCKER_COMPOSE -f infrastructure/docker-compose.prod.yml exec -T postgres \
            psql -U \"$POSTGRES_USER\" -d auth_db -v ON_ERROR_STOP=1"

          # Ledger of applied migrations, keyed by repo-relative path. Without it every file
          # replays on every deploy, which silently reverts admin changes made after a one-shot
          # data backfill (migrations 004 and 016 are exactly that). See infrastructure/MIGRATION.md.
          eval "$PSQL -q -c \"CREATE TABLE IF NOT EXISTS schema_migrations (filename TEXT PRIMARY KEY, checksum TEXT NOT NULL, applied_at TIMESTAMPTZ NOT NULL DEFAULT now())\""

          # Run all *.sql files found under apps/*/src/migrations/, sorted by filename (001_, 002_, …).
          # Files must still be idempotent: a deploy that fails mid-migration leaves the rest
          # unrecorded, so the next one re-runs them.
          MIGRATIONS=$(find apps/*/src/migrations -name "*.sql" 2>/dev/null | sort)

          if [ -z "$MIGRATIONS" ]; then
            echo "ℹ️ No migration files found - skipping"
          else
            for migration in $MIGRATIONS; do
              checksum=$(sha256sum "$migration" | cut -d' ' -f1)
              recorded=$(eval "$PSQL -At -c \"SELECT checksum FROM schema_migrations WHERE filename = '$migration'\"")

              if [ -n "$recorded" ]; then
                if [ "$recorded" != "$checksum" ]; then
                  echo "::warning::$migration changed after it was applied - production still has the old version. Add a new migration instead of editing an applied one."
                  eval "$PSQL -q -c \"UPDATE schema_migrations SET checksum = '$checksum' WHERE filename = '$migration'\""
                fi
                echo "⏭️ Already applied: $migration"
                continue
              fi

              echo "▶️ Applying: $migration"
              eval "$PSQL" < "$migration"
              eval "$PSQL -q -c \"INSERT INTO schema_migrations (filename, checksum) VALUES ('$migration', '$checksum') ON CONFLICT (filename) DO UPDATE SET checksum = EXCLUDED.checksum\""
              echo "✅ Done: $migration"
            done
          fi

          echo "✅ All migrations applied"

      - name: Verify runtime secrets are applied
        working-directory: ${{ env.DEPLOY_PATH }}
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          LYDIA_PROVIDER_TOKEN: ${{ secrets.LYDIA_PROVIDER_TOKEN }}
          LYDIA_PROVIDER_PRIVATE_TOKEN: ${{ secrets.LYDIA_PROVIDER_PRIVATE_TOKEN }}
        run: |
          if [ -z "$JWT_SECRET" ]; then
            echo "::error::Missing required GitHub secret: JWT_SECRET"
            exit 1
          fi

          expected_jwt_sha=$(printf '%s' "$JWT_SECRET" | sha256sum | awk '{print $1}')
          core_jwt_sha=$(eval "$DOCKER_COMPOSE -f infrastructure/docker-compose.prod.yml exec -T core-service sh -lc 'printf %s \"$JWT_SECRET\" | sha256sum | awk \"{print \\\$1}\"'" || true)

          if [ -z "$core_jwt_sha" ] || [ "$core_jwt_sha" != "$expected_jwt_sha" ]; then
            echo "::error::JWT_SECRET is not correctly applied in core-service"
            exit 1
          fi

          delivery_has_jwt=$(eval "$DOCKER_COMPOSE -f infrastructure/docker-compose.prod.yml exec -T chat-delivery-service sh -lc 'test -n \"$JWT_SECRET\" && echo yes || echo no'" || true)
          if [ "$delivery_has_jwt" != "yes" ]; then
            echo "::error::JWT_SECRET is not present in chat-delivery-service"
            exit 1
          fi

          if [ -n "$STRIPE_SECRET_KEY" ]; then
            expected_stripe_sha=$(printf '%s' "$STRIPE_SECRET_KEY" | sha256sum | awk '{print $1}')
            core_stripe_sha=$(eval "$DOCKER_COMPOSE -f infrastructure/docker-compose.prod.yml exec -T core-service sh -lc 'printf %s \"$STRIPE_SECRET_KEY\" | sha256sum | awk \"{print \\\$1}\"'" || true)
            social_stripe_sha=$(eval "$DOCKER_COMPOSE -f infrastructure/docker-compose.prod.yml exec -T social-service sh -lc 'printf %s \"$STRIPE_SECRET_KEY\" | sha256sum | awk \"{print \\\$1}\"'" || true)

            if [ -z "$core_stripe_sha" ] || [ "$core_stripe_sha" != "$expected_stripe_sha" ]; then
              echo "::error::STRIPE_SECRET_KEY is not correctly applied in core-service"
              exit 1
            fi
            if [ -z "$social_stripe_sha" ] || [ "$social_stripe_sha" != "$expected_stripe_sha" ]; then
              echo "::error::STRIPE_SECRET_KEY is not correctly applied in social-service"
              exit 1
            fi
          fi

          if [ -n "$STRIPE_WEBHOOK_SECRET" ]; then
            expected_webhook_sha=$(printf '%s' "$STRIPE_WEBHOOK_SECRET" | sha256sum | awk '{print $1}')
            core_webhook_sha=$(eval "$DOCKER_COMPOSE -f infrastructure/docker-compose.prod.yml exec -T core-service sh -lc 'printf %s \"$STRIPE_WEBHOOK_SECRET\" | sha256sum | awk \"{print \\\$1}\"'" || true)

            if [ -z "$core_webhook_sha" ] || [ "$core_webhook_sha" != "$expected_webhook_sha" ]; then
              echo "::error::STRIPE_WEBHOOK_SECRET is not correctly applied in core-service"
              exit 1
            fi
          fi

          # Lydia (WP-LYDIA-1): core-service only, unlike Stripe - social-service never reads these.
          if [ -n "$LYDIA_PROVIDER_TOKEN" ]; then
            expected_lydia_token_sha=$(printf '%s' "$LYDIA_PROVIDER_TOKEN" | sha256sum | awk '{print $1}')
            core_lydia_token_sha=$(eval "$DOCKER_COMPOSE -f infrastructure/docker-compose.prod.yml exec -T core-service sh -lc 'printf %s \"$LYDIA_PROVIDER_TOKEN\" | sha256sum | awk \"{print \\\$1}\"'" || true)

            if [ -z "$core_lydia_token_sha" ] || [ "$core_lydia_token_sha" != "$expected_lydia_token_sha" ]; then
              echo "::error::LYDIA_PROVIDER_TOKEN is not correctly applied in core-service"
              exit 1
            fi
          fi

          if [ -n "$LYDIA_PROVIDER_PRIVATE_TOKEN" ]; then
            expected_lydia_private_sha=$(printf '%s' "$LYDIA_PROVIDER_PRIVATE_TOKEN" | sha256sum | awk '{print $1}')
            core_lydia_private_sha=$(eval "$DOCKER_COMPOSE -f infrastructure/docker-compose.prod.yml exec -T core-service sh -lc 'printf %s \"$LYDIA_PROVIDER_PRIVATE_TOKEN\" | sha256sum | awk \"{print \\\$1}\"'" || true)

            if [ -z "$core_lydia_private_sha" ] || [ "$core_lydia_private_sha" != "$expected_lydia_private_sha" ]; then
              echo "::error::LYDIA_PROVIDER_PRIVATE_TOKEN is not correctly applied in core-service"
              exit 1
            fi
          fi

          echo "✅ Runtime secrets are applied in containers"

      - name: Wait for services to be healthy
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          echo "⏳ Waiting for critical services to be running…"
          # THE THREE DATASTORES ARE IN THIS LIST BECAUSE THEY WERE NOT, ON 2026-09-01. A postgres
          # major crossing crash-looped the only database for 33 minutes and this gate named seven
          # APPLICATION services and none of the three things they all depend on. It happened not to
          # matter that day - the migration step fails earlier, and a starved social-service does
          # enter `Restarting` - but a gate that catches its own dependency only through a downstream
          # symptom is the named-list defect this repository keeps paying for: it does not cover the
          # entity nobody added to it. A datastore that crash-loops for any OTHER reason - a full
          # disk, a corrupted volume - must fail the deploy by its own name.
          #
          # `Restarting` is safe to treat as fatal for these: an ordinary `up -d` recreate goes
          # Created -> Running, and Docker reports `Restarting` only after a non-zero exit brought
          # the restart policy in.
          critical_services=(
            chat-gateway
            call-service
            chat-delivery-service
            media-service
            core-service
            social-service
            frontend
            postgres
            redis
            garage
          )

          # ONE LIST, NOT TWO. The array and the regex below were maintained separately, which is
          # precisely how they came to disagree - the regex is derived from the array now, so a
          # service cannot be added to one and forgotten in the other.
          critical_pattern=$(IFS='|'; echo "${critical_services[*]}")

          ready=0
          for _ in {1..36}; do
            running_services=$(eval "$DOCKER_COMPOSE -f infrastructure/docker-compose.prod.yml ps --status running --services" || true)
            ps_all=$(eval "$DOCKER_COMPOSE -f infrastructure/docker-compose.prod.yml ps --all" || true)

            if echo "$ps_all" | grep -E "($critical_pattern)" | grep -E "Restarting|Exit|Dead|unhealthy" >/dev/null; then
              echo "❌ One or more critical services are unhealthy/restarting/exited"
              echo "$ps_all"
              exit 1
            fi

            missing=0
            for service in "${critical_services[@]}"; do
              if ! echo "$running_services" | grep -qx "$service"; then
                missing=1
                break
              fi
            done

            if [ "$missing" -eq 0 ]; then
              ready=1
              break
            fi

            sleep 5
          done

          if [ "$ready" -ne 1 ]; then
            echo "❌ Timeout waiting for critical services"
            eval "$DOCKER_COMPOSE -f infrastructure/docker-compose.prod.yml ps --all"
            exit 1
          fi

          echo "✅ Critical services are running"

      - name: Cleanup old resources
        run: |
          echo "🧹 Cleaning up old Docker resources…"
          eval "$DOCKER_CLI image prune -af --filter 'until=24h'"
          eval "$DOCKER_CLI container prune -f"
          # Le build cache n etait jamais purge et grossissait sans limite
          # (~30 Go observes). On garde 7 jours de cache pour ne pas ralentir
          # les builds recents.
          eval "$DOCKER_CLI builder prune -af --filter 'until=168h'"
          echo "✅ Cleanup completed"

      - name: Display running services
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          echo "📊 Currently running services:"
          eval "$DOCKER_COMPOSE -f infrastructure/docker-compose.prod.yml ps"

      - name: Deployment summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo "🔗 Application URL: https://${{ env.DOMAIN }}"
          echo "📦 Released v${{ inputs.version }} at ${{ inputs.sha }}"

      - name: Health Check
        run: |
          echo "🔍 Performing health checks…"
          sleep 5

          FRONTEND_HOST_PORT="${FRONTEND_HOST_PORT:-8080}"

          retry_http() {
            local label="$1"
            local expected_regex="$2"
            local cmd="$3"
            local attempts="${4:-12}"
            local delay="${5:-3}"
            local status="000"

            for _ in $(seq 1 "$attempts"); do
              status=$(eval "$cmd" || true)
              if echo "$status" | grep -Eq "$expected_regex"; then
                echo "✅ ${label} (HTTP ${status})"
                return 0
              fi
              sleep "$delay"
            done

            echo "❌ ${label} failed after ${attempts} attempts (last HTTP ${status})"
            return 1
          }

          # Check frontend (local host port)
          retry_http \
            "frontend health check" \
            "^(2|3)[0-9][0-9]$" \
            "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:${FRONTEND_HOST_PORT}/"

          # Check chat-delivery-service via Nginx (dedicated anonymous liveness route).
          retry_http \
            "chat-delivery-service health check" \
            "^200$" \
            "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:${FRONTEND_HOST_PORT}/api/chat-delivery-health"

          # Check media-service TCP/HTTP reachability via Nginx (status may be 2xx/4xx depending on route).
          retry_http \
            "media-service reachability check" \
            "^[1-5][0-9][0-9]$" \
            "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:${FRONTEND_HOST_PORT}/api/media"

          # ROUTE EXISTENCE, not just reachability. The check above passes on ANY status, which is
          # what let a media-service missing `POST /media/touch` deploy green while the endpoint
          # answered 404 in production for a day. Unauthenticated, an existing route answers 401 and
          # an absent one answers 404, so the two are distinguishable without a credential - and
          # this asserts the image really carries the code, which "the container started" never did.
          retry_http \
            "media-service /touch route present" \
            "^401$" \
            "curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{\"mediaIds\":[]}' http://127.0.0.1:${FRONTEND_HOST_PORT}/api/media/touch"

          echo "✅ Health checks completed"

      # WHICH COMMIT PRODUCTION IS SERVING, recorded by the thing that made it true. `prod-deployed`
      # was this tag's old name and the change detector's INPUT; the detector reads the previous
      # release now (user's decision, 2026-09-03), so the name changed with the job to stop the next
      # session reading a stale meaning into it. It is written only once the deploy has really
      # succeeded, and it is the ONLY record of the commit after an emergency push, which is why it
      # survived the deletion of its old purpose.
      - name: Record the released commit
        run: |
          set -euo pipefail
          git -C "${{ env.DEPLOY_PATH }}" tag -f prod-released "${{ inputs.sha }}"
          git -C "${{ env.DEPLOY_PATH }}" push -f \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            refs/tags/prod-released
          echo "📌 prod-released -> ${{ inputs.sha }} (v${{ inputs.version }})"

      - name: Notify deployment
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment to production succeeded"
          else
            echo "❌ Deployment to production failed"
          fi
