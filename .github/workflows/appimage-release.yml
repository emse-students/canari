name: AppImage Release

# Runs after "Bump version on release" syncs frontend/package.json on main.
on:
  workflow_run:
    workflows: ['Bump version on release']
    types: [completed]
  workflow_dispatch:

jobs:
  build-appimage:
    name: Build AppImage (Linux x86_64)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # A hyphen in the semver version IS the definition of a pre-release, and the manifest is the
      # only place that can be read from here - see android-release.yml for why neither the event
      # nor the head branch can answer this in a `workflow_run`.
      - name: Resolve release tag
        id: release_tag
        run: |
          set -euo pipefail
          VERSION="$(bash scripts/read-app-version.sh)"
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *)   PRERELEASE=false ;;
          esac
          {
            echo "version=${VERSION}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"
          echo "Building Canari v${VERSION} (prerelease=${PRERELEASE})"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            frontend/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bunx svelte-kit sync

      - name: Build MLS WASM
        uses: ./.github/actions/build-mls-wasm

      - name: Generate protobuf bindings
        working-directory: frontend
        run: bun run proto:gen

      # THE SECRET SET IS CHOSEN BY THE RELEASE, exactly as in the two store workflows. An AppImage
      # bakes its backend origin in like any other Tauri bundle, so an alpha attached to a
      # pre-release must point at dev; there is no fallback between the two sets, because falling
      # back is how an alpha ends up talking to production.
      - name: Validate required secrets
        env:
          IS_PRERELEASE: ${{ steps.release_tag.outputs.prerelease }}
          BASE_URL: ${{ secrets.BASE_URL }}
          AUTHENTIK_URL: ${{ secrets.AUTHENTIK_URL }}
          AUTHENTIK_CLIENT_ID: ${{ secrets.AUTHENTIK_CLIENT_ID }}
          DEV_BASE_URL: ${{ secrets.DEV_BASE_URL }}
          DEV_AUTHENTIK_URL: ${{ secrets.DEV_AUTHENTIK_URL }}
          DEV_AUTHENTIK_CLIENT_ID: ${{ secrets.DEV_AUTHENTIK_CLIENT_ID }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            required=(DEV_BASE_URL DEV_AUTHENTIK_URL DEV_AUTHENTIK_CLIENT_ID)
          else
            required=(BASE_URL AUTHENTIK_URL AUTHENTIK_CLIENT_ID)
          fi
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required GitHub secret: ${key}"
              exit 1
            fi
          done
          echo "✅ Required secrets are present"

      - name: Create frontend .env
        working-directory: frontend
        env:
          IS_PRERELEASE: ${{ steps.release_tag.outputs.prerelease }}
          BASE_URL: ${{ secrets.BASE_URL }}
          AUTHENTIK_URL: ${{ secrets.AUTHENTIK_URL }}
          AUTHENTIK_CLIENT_ID: ${{ secrets.AUTHENTIK_CLIENT_ID }}
          DEV_BASE_URL: ${{ secrets.DEV_BASE_URL }}
          DEV_AUTHENTIK_URL: ${{ secrets.DEV_AUTHENTIK_URL }}
          DEV_AUTHENTIK_CLIENT_ID: ${{ secrets.DEV_AUTHENTIK_CLIENT_ID }}
        run: |
          set -euo pipefail

          if [ "$IS_PRERELEASE" = "true" ]; then
            APP_URL="$DEV_BASE_URL"
            IDP_URL="$DEV_AUTHENTIK_URL"
            IDP_CLIENT="$DEV_AUTHENTIK_CLIENT_ID"
          else
            APP_URL="$BASE_URL"
            IDP_URL="$AUTHENTIK_URL"
            IDP_CLIENT="$AUTHENTIK_CLIENT_ID"
          fi

          case "$APP_URL" in
            *"dev.canari-emse.fr"*) URL_ENVIRONMENT=dev ;;
            *"canari-emse.fr"*) URL_ENVIRONMENT=production ;;
            *) URL_ENVIRONMENT=unknown ;;
          esac
          if [ "$IS_PRERELEASE" = "true" ] && [ "$URL_ENVIRONMENT" != "dev" ]; then
            echo "::error::This is a PRE-RELEASE but its backend URL resolves to '${URL_ENVIRONMENT}'. Refusing to attach an alpha pointing anywhere else."
            exit 1
          fi
          if [ "$IS_PRERELEASE" != "true" ] && [ "$URL_ENVIRONMENT" != "production" ]; then
            echo "::error::This is a STABLE release but its backend URL resolves to '${URL_ENVIRONMENT}'. Refusing to ship a production build pointing anywhere else."
            exit 1
          fi
          echo "AppImage targets ${URL_ENVIRONMENT} (${APP_URL})"

          echo "VITE_GATEWAY_URL=${APP_URL}" >> .env
          echo "VITE_DELIVERY_URL=${APP_URL}" >> .env
          echo "VITE_MEDIA_URL=${APP_URL}" >> .env
          echo "VITE_CALL_URL=${APP_URL}" >> .env
          echo "VITE_SOCIAL_URL=${APP_URL}" >> .env
          echo "VITE_CORE_URL=${APP_URL}" >> .env
          echo "VITE_AUTHENTIK_URL=${IDP_URL}" >> .env
          echo "VITE_AUTHENTIK_CLIENT_ID=${IDP_CLIENT}" >> .env
          echo "VITE_AUTHENTIK_REDIRECT_URI=http://localhost:1421/auth/callback" >> .env
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "VITE_DEPLOY_ENVIRONMENT=development" >> .env
          fi

      - name: Build Tauri AppImage
        working-directory: frontend
        run: bun tauri build --bundles appimage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: canari-linux-appimage
          path: frontend/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'workflow_run'
        with:
          tag_name: v${{ steps.release_tag.outputs.version }}
          fail_on_unmatched_files: true
          files: frontend/src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
