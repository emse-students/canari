name: Ship to Google Play

# Runs after "Bump version on release" syncs frontend/package.json on main.
# CALLED BY `release.yml`, AND BY NOTHING ELSE. It used to listen for the bump run's completion
# itself, which is what made three workflows each re-derive the same facts and each resolve `main`
# for itself - so a merge landing mid-release could give a store a different tree from production,
# with nothing anywhere to say so. The orchestrator resolves the commit once and hands it down.
#
# AND IT IS ALSO HAND-DISPATCHABLE AS A PURE COMPILE CHECK, which is a capability rather than a
# second door. This is the ONLY way to compile Swift, ObjC or Kotlin from the Windows workstation
# this project is developed on: none of a Swift `guard` body that falls through, a Kotlin nested
# type in a companion object, or a plugin command missing from its ACL is visible to
# `cargo clippy`, `bun run check` or any gate that runs locally. Collapsing the release chain into
# one run removed the trigger for a commit, which would have taken that capability away silently.
#
# WHAT MAKES IT SAFE IS `publish`, CARRIED AS DATA. The old version reasoned about
# `github.event_name` to tell a compile check from a release - and in a called workflow
# `github.event_name` is the CALLER's event, so that reasoning is not merely wrong here, it is
# unanswerable. A dispatch therefore declares `publish: false` and every step that reaches a store
# or a release reads that input instead of guessing from an event.
on:
  workflow_call:
    inputs:
      sha:
        description: 'The exact commit to build - resolved ONCE by the caller'
        required: true
        type: string
      version:
        description: 'The version the bump wrote into the manifests'
        required: true
        type: string
      prerelease:
        description: 'The string "true" or "false", already read off the version by the caller'
        required: true
        type: string

      publish:
        description: 'Whether this run may reach a store or a release. A release always may.'
        required: false
        default: true
        type: boolean

  # A COMPILE CHECK, and it ships nothing: `publish` defaults to false here and every publishing
  # step is gated on it. `sha` may be left empty, in which case the branch this is dispatched from
  # is what gets built - which is the whole point when the question is "does this native change
  # compile at all".
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to build. Empty builds the branch this is dispatched from.'
        required: false
        default: ''
        type: string
      version:
        description: 'Version to stamp. Only affects the artefact name on a compile check.'
        required: false
        default: '0.0.0-compilecheck'
        type: string
      prerelease:
        description: 'The string "true" or "false". A compile check should stay "true".'
        required: false
        default: 'true'
        type: string
      publish:
        description: 'Leave OFF. Turning it on makes a hand-dispatched run reach a real store.'
        required: false
        default: false
        type: boolean

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # An empty `sha` is the compile-check case: build the ref this was dispatched from.
          ref: ${{ inputs.sha != '' && inputs.sha || github.ref }}

      # THE TRACK IS THE ONLY THING DECIDED HERE, and it is decided from the caller's answer.
      #
      # This step used to read `frontend/package.json` back off the checkout and derive the version
      # and the pre-release flag itself, for a reason that was correct at the time: a `workflow_run`
      # carries neither `release.prerelease` nor a usable branch. It is no longer this file's
      # question. `release.yml` reads the manifest the bump just WROTE and hands the answer to all
      # three chains, so the Play track, the App Store channel and the estate cannot disagree - which
      # they could when each chain derived its own.
      - name: Resolve the Play track
        id: release_tag
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          PRERELEASE="${{ inputs.prerelease }}"
          if [ "$PRERELEASE" = "true" ]; then TRACK=internal; else TRACK=production; fi
          {
            echo "version=${VERSION}"
            echo "prerelease=${PRERELEASE}"
            echo "track=${TRACK}"
          } >> "$GITHUB_OUTPUT"
          echo "Building Canari v${VERSION} for the Play ${TRACK} track"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            frontend/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bunx svelte-kit sync

      - name: Build MLS WASM
        uses: ./.github/actions/build-mls-wasm

      - name: Generate protobuf bindings
        working-directory: frontend
        run: bun run proto:gen

      - name: Validate Android release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BASE_URL: ${{ secrets.BASE_URL }}
          AUTHENTIK_URL: ${{ secrets.AUTHENTIK_URL }}
          AUTHENTIK_CLIENT_ID: ${{ secrets.AUTHENTIK_CLIENT_ID }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          required=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
            ANDROID_STORE_PASSWORD
            JWT_SECRET
            BASE_URL
            AUTHENTIK_URL
            AUTHENTIK_CLIENT_ID
            GOOGLE_SERVICES_JSON
          )

          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required GitHub secret: ${key}"
              exit 1
            fi
          done

          echo "✅ Required Android secrets are present"

      - name: Setup Android Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "Decoding keystore…"
          cd frontend/src-tauri/gen/android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.jks
          echo "Creating keystore.properties…"
          echo "keyAlias=$ANDROID_KEY_ALIAS" > keystore.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> keystore.properties
          echo "storePassword=$ANDROID_STORE_PASSWORD" >> keystore.properties
          echo "storeFile=release.jks" >> keystore.properties

          echo "Writing google-services.json from secret…"
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "✅ google-services.json written"

      - name: Verify signing files are populated
        run: |
          test -s frontend/src-tauri/gen/android/release.jks
          test -s frontend/src-tauri/gen/android/keystore.properties
          grep -q '^keyAlias=' frontend/src-tauri/gen/android/keystore.properties
          grep -q '^keyPassword=' frontend/src-tauri/gen/android/keystore.properties
          grep -q '^storePassword=' frontend/src-tauri/gen/android/keystore.properties
          echo "✅ Android signing material prepared"

      - name: Print Android App Link SHA-256 fingerprint
        run: |
          chmod +x scripts/print-android-app-link-fingerprint.sh
          ./scripts/print-android-app-link-fingerprint.sh
          echo "::notice::Add this SHA-256 to GitHub secret ANDROID_APP_LINK_SHA256, then redeploy frontend (cd workflow)."

      # AN ALPHA POINTS AT dev.canari-emse.fr AND A STABLE AT PRODUCTION, and the mismatch is an
      # ASSERTION rather than a convention. This is the one place in the whole migration where a
      # mistake ships to phones: a store build bakes its backend origin in and cannot be re-pointed
      # afterwards, so an alpha built against production would let the tester programme write to
      # real data, and a stable built against dev would point every user at a box wiped every
      # Monday. Neither failure is visible in a green pipeline.
      #
      # There is NO FALLBACK from the DEV_ secrets to the production ones. Falling back is precisely
      # how an alpha would end up pointing at production; a missing secret stops the build instead.
      - name: Create frontend .env
        working-directory: frontend
        env:
          IS_PRERELEASE: ${{ steps.release_tag.outputs.prerelease }}
          BASE_URL: ${{ secrets.BASE_URL }}
          AUTHENTIK_URL: ${{ secrets.AUTHENTIK_URL }}
          AUTHENTIK_CLIENT_ID: ${{ secrets.AUTHENTIK_CLIENT_ID }}
          DEV_BASE_URL: ${{ secrets.DEV_BASE_URL }}
          DEV_AUTHENTIK_URL: ${{ secrets.DEV_AUTHENTIK_URL }}
          DEV_AUTHENTIK_CLIENT_ID: ${{ secrets.DEV_AUTHENTIK_CLIENT_ID }}
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
        run: |
          set -euo pipefail

          if [ "$IS_PRERELEASE" = "true" ]; then
            APP_URL="$DEV_BASE_URL"
            IDP_URL="$DEV_AUTHENTIK_URL"
            IDP_CLIENT="$DEV_AUTHENTIK_CLIENT_ID"
            EXPECTED_HOST="dev.canari-emse.fr"
          else
            APP_URL="$BASE_URL"
            IDP_URL="$AUTHENTIK_URL"
            IDP_CLIENT="$AUTHENTIK_CLIENT_ID"
            EXPECTED_HOST="canari-emse.fr"
          fi

          for name in APP_URL IDP_URL IDP_CLIENT; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is empty for a $([ "$IS_PRERELEASE" = "true" ] && echo pre-release || echo stable) build. The DEV_ and production secret sets are kept separate on purpose - there is no fallback between them."
              exit 1
            fi
          done

          case "$APP_URL" in
            *"dev.canari-emse.fr"*) URL_ENVIRONMENT=dev ;;
            *"canari-emse.fr"*) URL_ENVIRONMENT=production ;;
            *) URL_ENVIRONMENT=unknown ;;
          esac
          if [ "$IS_PRERELEASE" = "true" ] && [ "$URL_ENVIRONMENT" != "dev" ]; then
            echo "::error::This is a PRE-RELEASE but its backend URL resolves to '${URL_ENVIRONMENT}', not ${EXPECTED_HOST}. Refusing to ship an alpha pointing anywhere else to the tester programme."
            exit 1
          fi
          if [ "$IS_PRERELEASE" != "true" ] && [ "$URL_ENVIRONMENT" != "production" ]; then
            echo "::error::This is a STABLE release but its backend URL resolves to '${URL_ENVIRONMENT}', not ${EXPECTED_HOST}. Refusing to ship a production build pointing anywhere else."
            exit 1
          fi
          echo "Android build targets ${URL_ENVIRONMENT} (${APP_URL})"

          echo "VITE_FRONTEND_URL=${APP_URL}" >> .env
          echo "VITE_GATEWAY_URL=${APP_URL}" >> .env
          echo "VITE_DELIVERY_URL=${APP_URL}" >> .env
          echo "VITE_MEDIA_URL=${APP_URL}" >> .env
          echo "VITE_CALL_URL=${APP_URL}" >> .env
          echo "VITE_SOCIAL_URL=${APP_URL}" >> .env
          echo "VITE_CORE_URL=${APP_URL}" >> .env
          echo "VITE_AUTHENTIK_URL=${IDP_URL}" >> .env
          echo "VITE_AUTHENTIK_CLIENT_ID=${IDP_CLIENT}" >> .env
          echo "VITE_CALL_E2E_ENCRYPTION=false" >> .env
          if [ "$IS_PRERELEASE" = "true" ]; then
            # The same banner the dev web estate carries, for the same reason: `deployEnvironment()`
            # treats UNSET as production, so a tester holding an alpha must be told which one it is.
            echo "VITE_DEPLOY_ENVIRONMENT=development" >> .env
          fi
          if [ -n "$KLIPY_API_KEY" ]; then
            echo "VITE_KLIPY_KEY=${KLIPY_API_KEY}" >> .env
          fi

      - name: Verify frontend env for Android build
        working-directory: frontend
        run: |
          grep -q '^VITE_FRONTEND_URL=.' .env
          grep -q '^VITE_GATEWAY_URL=.' .env
          grep -q '^VITE_DELIVERY_URL=.' .env
          grep -q '^VITE_MEDIA_URL=.' .env
          grep -q '^VITE_CALL_URL=.' .env
          grep -q '^VITE_SOCIAL_URL=.' .env
          grep -q '^VITE_CORE_URL=.' .env
          grep -q '^VITE_AUTHENTIK_URL=.' .env
          grep -q '^VITE_AUTHENTIK_CLIENT_ID=.' .env
          echo "✅ Android frontend env prepared"

      - name: Build Android AAB + APK
        working-directory: frontend
        run: |
          bun tauri android build
          bun tauri android build --apk

      - name: Locate build outputs
        id: outputs
        run: |
          AAB=$(find frontend/src-tauri/gen/android/app/build/outputs/bundle -name "*.aab" | head -1)
          APK=$(find frontend/src-tauri/gen/android/app/build/outputs/apk/universal/release -name "*.apk" | head -1)
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "AAB: $AAB"
          echo "APK: $APK"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            ${{ steps.outputs.outputs.aab }}
            ${{ steps.outputs.outputs.apk }}

      - name: Check Google Play secret
        id: gplay
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON not set; skipping Google Play publish"
          fi

      # ONE UPLOAD, TO THE TRACK THE RELEASE NAMED. A pre-release goes to `internal` (the tester
      # programme, decision 9 of the migration: internal channels only, no Beta App Review in the
      # loop) and a stable to `production` - real public release, full rollout.
      #
      # NOTE: Google required the very first production release to be created MANUALLY in the Play
      # Console (store listing, content rating) before the API would accept uploads for
      # fr.emse.canari; subsequent releases are automatic. Switch `status` to `inProgress` and set
      # `userFraction` for a staged rollout instead of 100%.
      #
      # STILL EXACTLY ONE TRACK PER JOB, and that is not a stylistic choice: Google rejects
      # re-uploading the same versionCode to a second track in one job (confirmed on v0.9.21 -
      # "Version code 9021 has already been used"). The two tracks are reachable now because each
      # alpha carries its OWN versionCode - `bump-app-version.sh` bands the pre-release counter into
      # it - which is the thing that was missing when that comment said internal testing "needs its
      # own build cadence".
      # PLAY HAD NEVER RECEIVED RELEASE NOTES AT ALL, and nothing said so - the field simply stayed
      # whatever it was. `store/whats-new.txt` was read by `submit.mjs` and by nobody else, so every
      # release told iOS users what changed and left Android users with nothing.
      #
      # THE TEXT COMES THROUGH `submit.mjs --print-notes` rather than from `tail -n +2` here,
      # because the notes RULE - the version marker, the trim, the length ceiling - has one
      # implementation and a second reader in bash would be a second opinion about what valid notes
      # are. The same call refuses the same files the fifth preflight gate refuses.
      #
      # `whatsnew-<LOCALE>`, NO EXTENSION, in a directory: that is the layout the action documents,
      # and the locales are the ones the listing actually carries - MEASURED through the Play API on
      # 2026-09-03, `fr-FR` and `en-US`, not assumed. A file for a locale the listing lacks is
      # refused; a MISSING file is silent, which is how this went unnoticed.
      #
      # STABLE ONLY, mirroring the App Store arm. A pre-release cannot carry these notes: the file
      # opens with `version: X.Y.Z` naming the STABLE, so `--print-notes` refuses an alpha by
      # construction - and the notes for a stable are not the notes for the alpha that preceded it.
      - name: Write the release notes Play shows, from the one file that carries them
        id: notes
        if: inputs.publish && inputs.prerelease == 'false' && steps.gplay.outputs.present == 'true'
        env:
          MARKETING_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/whatsnew"
          mkdir -p "$dir"
          notes="$(node tools/app-store/submit.mjs --print-notes)"
          for locale in fr-FR en-US; do
            printf '%s\n' "$notes" > "$dir/whatsnew-$locale"
          done
          printf 'release notes for %s: %s characters, written for fr-FR and en-US\n' \
            "$MARKETING_VERSION" "${#notes}"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Publish to Google Play
        # GATED ON `inputs.publish`, WHICH IS DATA, and never on an event again. This step used to
        # read `github.event_name == 'workflow_run'`, meaning "a real release rather than a
        # hand-dispatched compile check" - and in a `workflow_call` workflow `github.event_name` is
        # the CALLER's event, so the condition became permanently FALSE when the chain collapsed
        # into one run: the build would have succeeded, the run would have been green, and NO STORE
        # WOULD HAVE RECEIVED ANYTHING.
        #
        # The distinction it was reaching for is real and still needed - a compile check must ship
        # nothing - so it is carried explicitly by the caller instead of inferred from an event
        # nobody here can see. `release.yml` passes nothing and takes the callable default, `true`;
        # a hand dispatch of THIS workflow defaults it to `false`.
        if: inputs.publish && steps.gplay.outputs.present == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fr.emse.canari
          releaseFiles: ${{ steps.outputs.outputs.aab }}
          # `tracks` (plural) is the non-deprecated input name for the same thing.
          tracks: ${{ steps.release_tag.outputs.track }}
          status: completed
          # EMPTY ON A PRE-RELEASE, and that is what "unset" looks like to an action: the step above
          # is skipped, so this resolves to `''`, which `core.getInput` cannot distinguish from an
          # absent input. Play then keeps whatever the field held, exactly as before.
          whatsNewDirectory: ${{ steps.notes.outputs.dir }}
          # NO `changesNotSentForReview`: once the app is fully published, Google always
          # sends changes for review automatically and REJECTS the query parameter
          # ("changesNotSentForReview must not be set", seen on v0.10.2). It was only
          # tolerated while the app was in its pre-launch review state.

      # LAST, AND THAT ORDERING IS THE FIX FOR SOMETHING THAT COST A WHOLE PLATFORM. It used to sit
      # BEFORE the store steps, so on `v0.16.0` this action was refused a release update
      # (`Resource not accessible by integration`, with `Contents: write` granted and printed by
      # the runner) and the two steps that actually SHIP - TestFlight and the App Store submission -
      # were `skipped` behind it. Production and Google Play both received 0.16.0; Apple received
      # nothing, and the run's only complaint was about a convenience.
      #
      # **A GITHUB RELEASE ASSET IS A CONVENIENCE; THE STORE IS THE DELIVERABLE.** So the store is
      # served first and this runs afterwards. Note what this is NOT: it is not a fix for the 403 -
      # that cause is unknown and is in `docs/wiki/backlog.md` - and it is not a
      # `continue-on-error`, which would swallow the failure. A refusal here still fails the job,
      # loudly. What changes is only what it can no longer take down with it.
      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        if: inputs.publish && github.event_name == 'release'
        with:
          tag_name: v${{ steps.release_tag.outputs.version }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.outputs.outputs.aab }}
            ${{ steps.outputs.outputs.apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


