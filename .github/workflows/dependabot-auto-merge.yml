name: Dependabot auto-merge

# Squash-merges Dependabot pull requests once the full check suite on the PR head commit is green,
# and only for updates whose failure mode this repository can actually SEE.
#
# The decision itself lives in `.github/scripts/dependabot-auto-merge.sh`, one implementation for
# both entry points below. The header there explains the ceiling; this file explains WHEN it runs.
#
# ---------------------------------------------------------------------------------------------
# WHY THERE ARE THREE TRIGGERS, AND WHY THE CONVERGENT ONE IS NOT THE CLOCK
# ---------------------------------------------------------------------------------------------
# `workflow_run` is the fast path: a PR-gating workflow finishes, and the pull request it belongs to
# is evaluated seconds later. It is also, on its own, NOT ENOUGH - and the measurement that says so
# is that on 2026-08-31, with this workflow re-enabled and working, seven mergeable green pull
# requests sat untouched. Their checks had completed days earlier, so no future `workflow_run` would
# ever name them again. An event-only automation can act on what it happened to catch and on
# nothing else; it cannot recover from being disabled, from a runner outage, or from being written
# after the queue it is meant to drain.
#
# THE SWEEP IS THE CONVERGENT PATH: it enumerates every open Dependabot pull request and applies
# the same decision to each, so the correct state is reached from ANY starting state. Termination
# comes from durable state on GitHub - a pull request is merged, or it carries a comment naming the
# test that would let it merge - never from how often the sweep runs.
#
# WHAT THE SWEEP HANGS OFF IS A PUSH TO `main` RATHER THAN AN HOUR. The hourly `schedule:` below is
# kept as a floor and no more; it does fire, with hours of jitter, and the correction to what was
# written here on 2026-08-31 is on that block. A push to `main` is the event this repository sees
# often and reliably, and it is also the event that could make a pull request stale, so answering it
# is the closest the queue gets to converging on the thing that disturbed it.
#
# ONE MEASURED LIMIT OF THAT, recorded because it is invisible otherwise: the CD run this workflow
# DISPATCHES after a merge does not come back here. `workflow_dispatch` is the documented exception
# that lets `GITHUB_TOKEN` start CD at all, but that run's completion emitted no `workflow_run`
# event on 2026-08-31 - the sweep of 22:35 was the last thing to happen that night. It matters less
# than it looks: since the staleness predicate stopped firing on every movement of `main`, ONE sweep
# merges everything mergeable instead of one pull request per re-trigger, so the chain no longer
# needs a hop per merge.
#
# ---------------------------------------------------------------------------------------------
# WHY MERGING SEVERAL IN ONE SWEEP IS SAFE
# ---------------------------------------------------------------------------------------------
# Two pull requests green in isolation are not evidence that their COMBINATION is green - nothing
# tests it before the merges. What makes that acceptable is that a merge no longer reaches an estate
# at all: since 2026-09-03 nothing deploys until a release is published, so a combination that breaks
# turns CI red on `main` and the next release is simply not cut. `main` can go red; production stays
# on the release it is serving. The sweep dispatches ONE CI run for the whole batch rather than one
# per merge, because a run tests the branch as it now stands.
#
# The list of refusals, and the state of each, is kept in `docs/wiki/backlog.md`.

on:
  workflow_run:
    # `CI` IS BOTH THE FAST PATH AND THE CONVERGENT ONE SINCE 2026-09-03, and that is a consequence
    # of the migration rather than a simplification for its own sake. CD used to run on every push
    # to `main`, which made its completion the closest thing this repository had to "somebody did
    # something"; CD now runs only when a release is published, so hanging the sweep off it would
    # mean the queue converges once a release, which is not a queue that drains.
    #
    # CI took that job because CI is now what runs on every push to `main` (see its own `on:`
    # block). Its completion after a PUSH is the convergent trigger - sweep the whole open queue -
    # and its completion after a DEPENDABOT PULL REQUEST is the fast path: evaluate that one.
    workflows: ["CI", "Code Analysis"]
    types: [completed]
  schedule:
    # Minute 17 rather than 0: the hour boundary is the busiest slot on shared runners.
    #
    # KEPT, AND THE CLAIM WRITTEN HERE ON 2026-08-31 WAS WRONG - it said this cron had produced ZERO
    # runs, measured in the three hours after it landed on `main`. It fired at 20:49:08Z the same
    # evening, and the correction matters more than the demotion: a three-hour window is not enough
    # to call a trigger dead, and the mechanism that reads it must not be built on the first quiet
    # interval anybody happened to look at.
    #
    # What DOES hold is the shape of the delivery, and it is measured over seven consecutive days
    # rather than one afternoon: `code-analysis.yml` asks for `0 2 * * *` and actually ran at 03:01,
    # 03:09, 08:05, 08:24, 08:47, 12:37 and 14:10 UTC. GitHub does not queue the slots an hourly
    # cron misses, it DROPS them. So this clock arrives, eventually, with hours of jitter - which is
    # a floor under the worst case and never the thing a verdict waits on.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # `gh workflow run pull-request.yml` after a merge, and nothing else. A merge made with `GITHUB_TOKEN`
  # raises no `push` event, so without this dispatch the merged COMBINATION is never tested and the
  # sweep is never woken to drain the rest - it fails 403 exactly as silently as the push that never
  # happened.
  #
  # IT USED TO DISPATCH THE DEPLOY TOO, and that is gone with the two-branch model: since 2026-09-02
  # a merge to `main` deploys NOTHING, and deployment happens when a human publishes a release
  # (`release.yml`). The arms of that chain are `workflow_call` workflows now and cannot be
  # dispatched at all, so nothing here may try.
  actions: write

# One sweep at a time. Two overlapping passes would each read a pre-merge mergeability and race on
# the same branches; `cancel-in-progress: false` because a pass that is already merging must finish.
concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Merge what this repository has a gate for
    runs-on: ubuntu-latest
    # The scheduled and manual paths carry no event to inspect; the author check that actually
    # protects the merge is inside the script, which runs for every pull request either way. This
    # condition only keeps the `workflow_run` path from waking on unrelated CI.
    #
    # TWO SHAPES OF `workflow_run` ARE ACCEPTED, and they mean different things. A run triggered by
    # DEPENDABOT'S OWN pull request is the fast path: evaluate that one pull request, seconds after
    # its checks finish. A run triggered by a PUSH is the convergent path: sweep the whole open
    # queue, because a push is the one event this repository sees often and reliably.
    #
    # `main` IS THE ONLY BRANCH AGAIN SINCE 2026-09-03. `dev` was in this list for one day, while
    # Dependabot targeted it; the user cancelled that model and every pull request lands on `main`,
    # so a push to `main` is the one event that can make a remaining pull request stale.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]') ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    steps:
      # THE IDENTITY PERFORMING AN AUTOMATED ACTION IS PART OF THE MECHANISM, AND `GITHUB_TOKEN`
      # CANNOT PERFORM THIS ONE. When the gates move under a Dependabot branch it has to be rebuilt,
      # and neither way of doing that is open to this workflow's default identity - measured, both
      # of them, on 2026-08-31. `PUT /pulls/{n}/update-branch` pushes a commit authored by
      # `github-actions[bot]`, which parks the re-triggered run in `action_required`, makes
      # Dependabot refuse the branch for good and fails this workflow's own actor filter; it left
      # seven branches unmergeable by every path at once. And `@dependabot recreate` is answered
      # with *"Sorry, only users with push access can use that command"* when the caller is
      # `github-actions[bot]`.
      #
      # So the sweep mints its own identity: an installation token for a GitHub App with Contents
      # and Pull requests write on this repository. It is minted per RUN and expires in an hour,
      # which is why an App beats a fine-grained PAT here - there is no long-lived secret to rotate
      # before it silently expires. It is used for EXACTLY ONE STEP, the rebuild request. The merge
      # itself stays on `GITHUB_TOKEN` deliberately: a merge made with an App token DOES raise a
      # `push` event, and the deploy dispatch below exists precisely because a `GITHUB_TOKEN` merge
      # does not. Swapping it would double every deploy.
      - name: Mint the identity a rebuild request is honoured for
        id: app-token
      # `client-id` AND NOT `app-id`: v3 deprecated the numeric id, and the annotation it printed on
      # every release run and every dependency sweep is the kind of line whose reader learns to skip
      # it. The two are different VALUES, not two names for one - `AUTOMERGE_APP_ID` is 4791068 and
      # `AUTOMERGE_APP_CLIENT_ID` is the `Iv23li...` string - so this could not be a rename, and the
      # old secret is kept only until nothing references it.
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

      # PINNED TO `main`, NOT TO THE EVENT: on the `workflow_run` path the pull request under
      # evaluation is Dependabot's, and this job holds write permissions. The decision script must
      # come from the trunk, never from the branch it is judging.
      - name: Check out the decision script from main
        uses: actions/checkout@v7
        with:
          ref: main
          # `infrastructure/docker-compose.prod.yml` IS PART OF THE DECISION, not a convenience:
          # `tests/ceiling.test.sh` derives the stateful images it demands coverage for from that
          # file rather than from a hardcoded list, so the next stateful service is covered by
          # whoever declares it. Without this path the test cannot read the compose file and fails
          # closed - which is the right direction, and still a stopped sweep.
          sparse-checkout: |
            .github/scripts
            infrastructure/docker-compose.prod.yml

      # THE PREDICATE IS TESTED IN THE RUN THAT USES IT. `lib/gate-moves.sh` decides whether a
      # green-but-older check suite is still evidence, and the half that matters - a truncated
      # compare, an unreadable payload - never occurs on a good day, so nothing but a test will
      # exercise it. Bash only, no dependencies, and a failure here stops the sweep BEFORE it
      # merges anything on a predicate that no longer holds.
      - name: Verify the staleness predicate before trusting it
        run: bash .github/scripts/tests/gate-moves.test.sh

      # AND THE TABLE THAT DECIDES WHAT MERGES, which had no test at all until it cost an outage.
      # On 2026-09-01 `postgres 15-alpine -> 18-alpine` merged on a green suite because `postgres`
      # was absent from the ceiling, and PostgreSQL 18 then refused production's data directory.
      # `tests/ceiling.test.sh` reads the stateful images out of `docker-compose.prod.yml` rather
      # than from a list, so the omission is named HERE, in the run that would do the merging,
      # instead of by eight services going down.
      - name: Verify the ceiling covers every stateful image production runs
        run: bash .github/scripts/tests/ceiling.test.sh

      - name: Collect the pull requests to evaluate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          list="$RUNNER_TEMP/prs.txt"
          : > "$list"

          # ONLY a Dependabot pull request's own run narrows this to one pull request. Every other
          # entry point - a push to main that finished CD, the schedule, a manual dispatch - takes
          # the sweep, because none of them is ABOUT a particular branch.
          entry="${{ github.event_name }}/${{ github.event.workflow_run.event }}"
          if [ "$entry" = "workflow_run/pull_request" ]; then
            # Exactly the pull request whose checks just finished.
            gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
              --jq '.[] | select(.state=="open") | .number' | head -n1 >> "$list"
          else
            # The sweep. `--state open` and the author filter are what make this convergent rather
            # than a re-run of whatever the last event happened to be.
            gh pr list --repo "$REPO" --author app/dependabot --state open \
              --limit 100 --json number --jq '.[].number' >> "$list"
          fi

          echo "PR_LIST=$list" >> "$GITHUB_ENV"
          echo "$(wc -l < "$list") pull request(s) to evaluate:"
          cat "$list"

      - name: Apply the ceiling to each
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          merged=0
          while IFS= read -r pr; do
            [ -z "$pr" ] && continue
            echo "::group::PR #$pr"
            # THE SCRIPT DECLINES BY PRINTING, NEVER BY STATUS - a refused or unmergeable branch
            # is a line on stdout and an exit 0 - so a non-zero status here is the script failing
            # to RUN, and it must be fatal and loud. It was neither: `if ...; then :; fi` swallowed
            # every cause alike, and on 2026-09-01 that turned out to hide `Permission denied` in
            # two of the four repositories carrying this workflow. The file had landed without its
            # executable bit, so the sweep executed NOTHING, printed `merged 0` and went green -
            # six consecutive passes in Sky, every one of them reporting success. It is invoked
            # through `bash` now so the mode bit cannot decide whether the chain runs at all.
            status=0
            bash .github/scripts/dependabot-auto-merge.sh "$pr" | tee "$RUNNER_TEMP/out-$pr.txt" || status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error::the sweep script exited $status on #$pr. It declines by PRINTING, so this is not a refusal - it could not run."
              exit "$status"
            fi
            if grep -q "^MERGED $pr\$" "$RUNNER_TEMP/out-$pr.txt"; then
              merged=$((merged + 1))
              # WHICH BRANCH IT LANDED ON DECIDES WHICH REF IS TESTED. It is `main` for everything
              # now that `dev` is gone, but it stays READ rather than assumed: this is the line that
              # would have to change the next time a second branch exists, and hardcoding it is what
              # made the previous switch a hazard rather than a setting.
              sed -n 's/^MERGED_ONTO //p' "$RUNNER_TEMP/out-$pr.txt" >> "$RUNNER_TEMP/bases.txt"
            fi
            if grep -q "^STALE $pr\$" "$RUNNER_TEMP/out-$pr.txt"; then
              echo "$pr" >> "$RUNNER_TEMP/stale.txt"
            fi
            echo "::endgroup::"
          done < "$PR_LIST"

          echo "merged=$merged" >> "$GITHUB_ENV"
          echo "merged $merged pull request(s) this pass"

      # WHAT A STALE PULL REQUEST NEEDS, AND WHY THIS STEP CANNOT PROVIDE IT.
      #
      # The script marks a pull request STALE only when the definitions that BUILD a check suite -
      # `.github/workflows/`, `.github/scripts/` - moved between its base and `main`. Then its green
      # checks describe gates that no longer exist (PR #272 was `CLEAN` with no
      # `Boot the real AppModule` run at all, that job having been written after its CI last ran),
      # and the branch has to be rebuilt before any verdict on it means anything.
      #
      # NEITHER WAY OF REBUILDING IT IS AVAILABLE TO THIS WORKFLOW, and both were tried:
      #
      #   `PUT /pulls/{n}/update-branch` pushes a merge commit authored by `github-actions[bot]`.
      #   Across seven pull requests on 2026-08-31 that cost three things at once: the `pull_request`
      #   run it re-triggers is created as `action_required`, parked until a human clicks Approve
      #   (twenty runs were sitting there); Dependabot then refuses the branch for good ("this PR has
      #   been edited by someone other than Dependabot"); and the entry condition here admits only a
      #   `workflow_run` whose actor is `dependabot[bot]`, so even an approval would not let it back
      #   in. The refresh made the branch unmergeable BY EVERY PATH.
      #
      #   `@dependabot recreate` is refused when the caller is `github-actions[bot]`. Measured on
      #   #303 on 2026-08-31, three seconds after the ask: "Sorry, only users with push access can
      #   use that command." The default token is not an account, and Dependabot authorises its
      #   commands by push access.
      #
      # So this step REPORTS rather than pretending, and the report is the point: a stale pull
      # request that says nothing is found by hand, a week late. It names what has to happen, ONCE
      # per pull request - a comment re-posted every sweep is noise, and noise is what its reader
      # learns to skip.
      #
      # IT IS ALSO THE ONE THING IN THIS CHAIN THAT STILL WANTS A HUMAN, and closing that gap is a
      # credential decision rather than a code one: a fine-grained PAT or a GitHub App token with
      # push access would let the ask above succeed. Recorded in `docs/wiki/backlog.md`. Closing the
      # pull request is NOT the alternative - Dependabot does not recreate a version whose pull
      # request was closed unmerged.
      # THE SWEEP ASKS FOR THE REBUILD ITSELF NOW, instead of naming the command and waiting for a
      # person to type it. A queue nobody drains is worse than the merge it prevented (user,
      # 2026-08-31), and this was the last place in the chain where a human stood in the loop.
      #
      # IDEMPOTENCE COMES FROM DURABLE STATE, NOT FROM A COUNTER OR A CLOCK: the marker carries the
      # HEAD the request was made against. A successful recreate replaces that head, so the marker
      # stops matching and a later staleness episode asks again; an unsuccessful one leaves the head
      # where it was, so the pass after this one does not ask twice. The command is the first line
      # of the body because that is what Dependabot parses.
      - name: Ask Dependabot to rebuild the branches whose gates moved
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          list="$RUNNER_TEMP/stale.txt"
          if [ ! -s "$list" ]; then echo "no branch is waiting on a rebuild."; exit 0; fi

          echo "$(wc -l < "$list") branch(es) need rebuilding before their checks mean anything."
          while IFS= read -r pr; do
            [ -z "$pr" ] && continue
            head=$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq .headRefOid) || head=""
            if [ -z "$head" ]; then
              echo "::warning::#$pr: could not read the head, so the request cannot be made idempotent - not asking."
              continue
            fi
            marker="<!-- auto-merge-recreate $head -->"
            if gh api "repos/$REPO/issues/$pr/comments" --paginate --jq '.[].body' | grep -qF "$marker"; then
              echo "  #$pr: already asked for ${head:0:8}; waiting on Dependabot."
              continue
            fi
            body="$RUNNER_TEMP/recreate-$pr.md"
            cat > "$body" <<EOF
          @dependabot recreate

          The gate definitions moved between this branch's base and \`main\`, so its checks were
          produced by workflow definitions \`main\` no longer carries and are not evidence about
          what \`main\` gates on now. Rebuilding is the only thing that makes a verdict on it mean
          anything.

          $marker
          EOF
            if gh pr comment "$pr" --repo "$REPO" --body-file "$body"; then
              echo "  #$pr: rebuild requested against ${head:0:8}"
            else
              echo "::error::#$pr: the rebuild request could not be posted. This is the one step the default identity cannot perform, so a failure here means the App token is missing, expired, or lacks Pull requests write."
            fi
          done < "$list"
      # THIS STEP USED TO DISPATCH A DEPLOY, AND DELETING THAT IS THE POINT OF THE MIGRATION.
      #
      # A squash merge made with GITHUB_TOKEN produces a push that triggers NOTHING - github's
      # anti-recursion rule - so CD never saw a single one of these merges and `main` drifted from
      # production silently. `workflow_dispatch` was the documented exception to that rule and was
      # the one call that closed the gap. **Nothing deploys at a push any more** (user, 2026-09-02),
      # CD has no dispatch left to call, and a dependency update reaches an estate when the next
      # release is published - so the gap it closed no longer exists.
      #
      # WHAT REPLACES IT IS CI, NOT NOTHING, and that is the half worth stating: the anti-recursion
      # rule still applies, so a `GITHUB_TOKEN` merge raises no `push` event and CI does not run on
      # `main` for it either. This dispatch keeps the sweep converging - CI's completion is what
      # wakes the next pass - and it is also what says whether the merged COMBINATION is green,
      # which no pull request tested. It cannot reach production: a red CI on `main` blocks the
      # next release rather than breaking the running one.
      - name: Dispatch CI for what merged
        # Both halves are load-bearing. The step above runs without `set -e` so one unmergeable
        # branch cannot stop a sweep, which means it can also end early and leave `merged` never
        # written - and an UNSET value is not equal to '0', so testing only that would dispatch on
        # the one path where nothing is known to have merged.
        if: env.merged != '' && env.merged != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bases="$RUNNER_TEMP/bases.txt"
          if [ ! -s "$bases" ]; then
            # `merged` is non-zero and no branch was recorded: the two are written by the same
            # loop, so this cannot happen without the script's contract having changed underneath.
            echo "::error::$merged merge(s) reported and no MERGED_ONTO line to name the branch. Refusing to guess which branch to test."
            exit 1
          fi
          echo "Dispatching CI for $merged merge(s)"
          sort -u "$bases" | while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            echo "  -> pull-request.yml on $ref"
            gh workflow run pull-request.yml --repo "$REPO" --ref "$ref"
          done
