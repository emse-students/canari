name: Dependabot auto-merge

# Squash-merges Dependabot pull requests once the full check suite on the PR head commit is green,
# and only for updates whose failure mode this repository can actually SEE.
#
# The decision itself lives in `.github/scripts/dependabot-auto-merge.sh`, one implementation for
# both entry points below. The header there explains the ceiling; this file explains WHEN it runs.
#
# ---------------------------------------------------------------------------------------------
# WHY THERE ARE THREE TRIGGERS, AND WHY THE CONVERGENT ONE IS NOT THE CLOCK
# ---------------------------------------------------------------------------------------------
# `workflow_run` is the fast path: a PR-gating workflow finishes, and the pull request it belongs to
# is evaluated seconds later. It is also, on its own, NOT ENOUGH - and the measurement that says so
# is that on 2026-08-31, with this workflow re-enabled and working, seven mergeable green pull
# requests sat untouched. Their checks had completed days earlier, so no future `workflow_run` would
# ever name them again. An event-only automation can act on what it happened to catch and on
# nothing else; it cannot recover from being disabled, from a runner outage, or from being written
# after the queue it is meant to drain.
#
# THE SWEEP IS THE CONVERGENT PATH: it enumerates every open Dependabot pull request and applies
# the same decision to each, so the correct state is reached from ANY starting state. Termination
# comes from durable state on GitHub - a pull request is merged, or it carries a comment naming the
# test that would let it merge - never from how often the sweep runs.
#
# WHAT THE SWEEP HANGS OFF IS A PUSH TO `main`, NOT AN HOUR. It was written on an hourly `schedule:`
# and that cron produced ZERO runs; the reasoning and the measurement are on the `schedule:` block
# below, which is kept only as a fallback. A push to `main` is the event this repository sees often
# and reliably, and it is also the event that MAKES pull requests stale, so answering it is the
# closest the queue gets to converging on the thing that disturbed it.
#
# ---------------------------------------------------------------------------------------------
# WHY MERGING SEVERAL IN ONE SWEEP IS SAFE
# ---------------------------------------------------------------------------------------------
# Two pull requests green in isolation are not evidence that their COMBINATION is green - nothing
# tests it before the merges. What makes that acceptable here is `cd.yml`: `deploy-to-server` needs
# `run-ci`, so a combination that breaks fails CI on `main` and the deploy is skipped. `main` can go
# red; production cannot follow it there. The sweep also dispatches ONE deploy for the whole batch
# rather than one per merge.
#
# The list of refusals, and the state of each, is kept in `docs/wiki/backlog.md`.

on:
  workflow_run:
    # `CD - Deploy to Production` IS THE CONVERGENT TRIGGER, and the other two are the fast path.
    # CD is the workflow that runs on every push to `main`, so its completion is the closest thing
    # this repository has to "somebody did something", and this workflow answers it with a FULL
    # SWEEP rather than with one pull request. See the schedule below for why that stopped being
    # the schedule's job.
    workflows: ["CI", "Code Analysis", "CD - Deploy to Production"]
    types: [completed]
  schedule:
    # Minute 17 rather than 0: the hour boundary is the busiest slot on shared runners.
    #
    # KEPT, BUT NO LONGER LOAD-BEARING - AND THE MEASUREMENT THAT DEMOTED IT IS THIS. On 2026-08-31
    # this cron had produced ZERO runs in the three hours since it landed on `main`, with the repo
    # neither a fork nor archived and the workflow `active`. Scheduled delivery here is not merely
    # late, it is unreliable: `code-analysis.yml` asks for `0 2 * * *` and actually ran at 03:01,
    # 03:09, 08:05, 08:24, 08:47, 12:37 and 14:10 UTC on seven consecutive days. GitHub does not
    # queue the slots an hourly cron misses, it DROPS them, so an hourly schedule on this
    # repository is a wish rather than a trigger. The comfortable rule this falsifies: a clock
    # whose only cost when wrong is LATENCY is fine - but this clock's failure mode is NOT
    # RUNNING AT ALL, which is the difference between a slow queue and a queue nobody drains.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # `gh workflow run cd.yml` after a merge. Without it the dispatch 403s and the deploy is skipped
  # exactly as silently as the push that never triggered one.
  actions: write

# One sweep at a time. Two overlapping passes would each read a pre-merge mergeability and race on
# the same branches; `cancel-in-progress: false` because a pass that is already merging must finish.
concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Merge what this repository has a gate for
    runs-on: ubuntu-latest
    # The scheduled and manual paths carry no event to inspect; the author check that actually
    # protects the merge is inside the script, which runs for every pull request either way. This
    # condition only keeps the `workflow_run` path from waking on unrelated CI.
    #
    # TWO SHAPES OF `workflow_run` ARE ACCEPTED, and they mean different things. A run triggered by
    # DEPENDABOT'S OWN pull request is the fast path: evaluate that one pull request, seconds after
    # its checks finish. A run triggered by a PUSH TO MAIN is the convergent path: sweep the whole
    # open queue, because a push is the one event this repository sees often and reliably.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]') ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    steps:
      # PINNED TO `main`, NOT TO THE EVENT: on the `workflow_run` path the pull request under
      # evaluation is Dependabot's, and this job holds write permissions. The decision script must
      # come from the trunk, never from the branch it is judging.
      - name: Check out the decision script from main
        uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: .github/scripts

      - name: Collect the pull requests to evaluate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          list="$RUNNER_TEMP/prs.txt"
          : > "$list"

          # ONLY a Dependabot pull request's own run narrows this to one pull request. Every other
          # entry point - a push to main that finished CD, the schedule, a manual dispatch - takes
          # the sweep, because none of them is ABOUT a particular branch.
          entry="${{ github.event_name }}/${{ github.event.workflow_run.event }}"
          if [ "$entry" = "workflow_run/pull_request" ]; then
            # Exactly the pull request whose checks just finished.
            gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
              --jq '.[] | select(.state=="open") | .number' | head -n1 >> "$list"
          else
            # The sweep. `--state open` and the author filter are what make this convergent rather
            # than a re-run of whatever the last event happened to be.
            gh pr list --repo "$REPO" --author app/dependabot --state open \
              --limit 100 --json number --jq '.[].number' >> "$list"
          fi

          echo "PR_LIST=$list" >> "$GITHUB_ENV"
          echo "$(wc -l < "$list") pull request(s) to evaluate:"
          cat "$list"

      - name: Apply the ceiling to each
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          merged=0
          while IFS= read -r pr; do
            [ -z "$pr" ] && continue
            echo "::group::PR #$pr"
            # The script never fails a pull request it merely declines, so a single unmergeable
            # branch cannot stop the sweep.
            if .github/scripts/dependabot-auto-merge.sh "$pr" | tee "$RUNNER_TEMP/out-$pr.txt"; then :; fi
            if grep -q "^MERGED $pr\$" "$RUNNER_TEMP/out-$pr.txt"; then
              merged=$((merged + 1))
            fi
            if grep -q "^STALE $pr\$" "$RUNNER_TEMP/out-$pr.txt"; then
              echo "$pr" >> "$RUNNER_TEMP/stale.txt"
            fi
            echo "::endgroup::"
          done < "$PR_LIST"

          echo "merged=$merged" >> "$GITHUB_ENV"
          echo "merged $merged pull request(s) this pass"

      # THE BUDGET FOR RE-TESTING WHAT MAIN NOW GATES ON. The script marks a pull request STALE when
      # its head is not built on current `main`, because its green checks were then produced by
      # workflow definitions `main` no longer carries - PR #272 was `CLEAN` with no
      # `Boot the real AppModule` run at all, that job having been written after its CI last ran.
      # Rebuilding the branch re-runs CI under today's definitions and the next pass reads a verdict
      # that means something.
      #
      # WHY DEPENDABOT IS ASKED TO DO IT, RATHER THAN `PUT /pulls/{n}/update-branch` WHICH IS WHAT
      # THIS STEP CALLED UNTIL 2026-08-31. That endpoint pushes a merge commit authored by
      # `github-actions[bot]`, and across seven pull requests here it cost three things at once:
      #
      #   1. The `pull_request` run it re-triggers is created as `action_required` - parked until a
      #      human clicks Approve. A dependabot-authored push is not. Twenty runs were sitting there.
      #   2. Dependabot then refuses the branch permanently: "Looks like this PR has been edited by
      #      someone other than Dependabot. That means Dependabot can't rebase it - sorry!"
      #   3. The entry condition on this workflow admits a `workflow_run` whose actor is
      #      `dependabot[bot]`, so even a human approval would not have let the branch back in.
      #
      # The refresh made the branch unmergeable BY EVERY PATH, and every push to `main` made another
      # one stale - so the step written to drain the queue was the one filling it. A queue nobody
      # drains is worse than the merge it prevented.
      #
      # `recreate` rather than `rebase`: it is the one that ends in the same state whatever was done
      # to the branch before - a freshly generated branch on current `main`, authored by Dependabot.
      # `rebase` refuses an edited branch, which is precisely the state this step used to create.
      #
      # CAPPED, because each rebuild is a full CI run and every merge makes every other branch stale
      # at once: without a ceiling one sweep would launch thirty. Three a pass drains a queue this
      # size in a day, unattended, and bounds what a bad day can cost. The cap is a budget, not a
      # correctness argument - nothing here is wrong if it never fires, only slower.
      - name: Ask Dependabot to rebuild at most three branches whose checks predate what main gates on
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          list="$RUNNER_TEMP/stale.txt"
          if [ ! -s "$list" ]; then echo "nothing stale."; exit 0; fi

          echo "$(wc -l < "$list") stale; asking Dependabot to rebuild at most 3."
          head -n 3 "$list" | while IFS= read -r pr; do
            [ -z "$pr" ] && continue
            # Dependabot answers a command asynchronously, so a zero exit here means the request was
            # posted and nothing more. The next pass measures the outcome the only way that means
            # anything - whether the pull request's base is current `main`. A request Dependabot
            # ignored leaves the branch stale, and it is asked again: the same request, on the same
            # condition, until the condition is gone.
            if gh pr comment "$pr" --repo "$REPO" --body "@dependabot recreate"; then
              echo "  #$pr: rebuild requested"
            else
              echo "  #$pr: could not ask for a rebuild - the pass leaves it stale"
            fi
          done

      # A squash merge made with GITHUB_TOKEN produces a push that triggers NOTHING - github's
      # anti-recursion rule - so CD never saw a single one of these merges and main drifted from
      # production silently. `workflow_dispatch` is the documented exception to that rule, so this
      # is the one call that closes the gap. ONE dispatch for the whole pass, not one per merge:
      # the deploy builds `main` as it now stands, and that is the same artefact either way.
      - name: Dispatch one deploy if anything merged
        # Both halves are load-bearing. The step above runs without `set -e` so one unmergeable
        # branch cannot stop a sweep, which means it can also end early and leave `merged` never
        # written - and an UNSET value is not equal to '0', so testing only that would dispatch a
        # deploy on the one path where nothing is known to have merged.
        if: env.merged != '' && env.merged != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Dispatching CD for $merged merge(s)"
          gh workflow run cd.yml --repo "$REPO" --ref main
