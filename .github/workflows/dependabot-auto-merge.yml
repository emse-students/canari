name: Dependabot auto-merge

# Squash-merges Dependabot pull requests once the full check suite on the PR head commit is green,
# and only for updates whose failure mode this repository can actually SEE.
#
# The decision itself lives in `.github/scripts/dependabot-auto-merge.sh`, one implementation for
# both entry points below. The header there explains the ceiling; this file explains WHEN it runs.
#
# ---------------------------------------------------------------------------------------------
# WHY THERE ARE TWO TRIGGERS, AND WHY THE SECOND IS THE IMPORTANT ONE
# ---------------------------------------------------------------------------------------------
# `workflow_run` is the fast path: a PR-gating workflow finishes, and the pull request it belongs to
# is evaluated seconds later. It is also, on its own, NOT ENOUGH - and the measurement that says so
# is that on 2026-08-31, with this workflow re-enabled and working, seven mergeable green pull
# requests sat untouched. Their checks had completed days earlier, so no future `workflow_run` would
# ever name them again. An event-only automation can act on what it happened to catch and on
# nothing else; it cannot recover from being disabled, from a runner outage, or from being written
# after the queue it is meant to drain.
#
# THE HOURLY SWEEP IS THE CONVERGENT PATH: it enumerates every open Dependabot pull request and
# applies the same decision to each, so the correct state is reached from ANY starting state. The
# clock is not load-bearing - it decides how quickly the queue drains, never whether the outcome is
# right - and termination comes from durable state on GitHub: a pull request is merged, or it
# carries a comment naming the test that would let it merge.
#
# ---------------------------------------------------------------------------------------------
# WHY MERGING SEVERAL IN ONE SWEEP IS SAFE
# ---------------------------------------------------------------------------------------------
# Two pull requests green in isolation are not evidence that their COMBINATION is green - nothing
# tests it before the merges. What makes that acceptable here is `cd.yml`: `deploy-to-server` needs
# `run-ci`, so a combination that breaks fails CI on `main` and the deploy is skipped. `main` can go
# red; production cannot follow it there. The sweep also dispatches ONE deploy for the whole batch
# rather than one per merge.
#
# The list of refusals, and the state of each, is kept in `docs/wiki/backlog.md`.

on:
  workflow_run:
    workflows: ["CI", "Code Analysis"]
    types: [completed]
  schedule:
    # Minute 17 rather than 0: the hour boundary is the busiest slot on shared runners.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # `gh workflow run cd.yml` after a merge. Without it the dispatch 403s and the deploy is skipped
  # exactly as silently as the push that never triggered one.
  actions: write

# One sweep at a time. Two overlapping passes would each read a pre-merge mergeability and race on
# the same branches; `cancel-in-progress: false` because a pass that is already merging must finish.
concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Merge what this repository has a gate for
    runs-on: ubuntu-latest
    # The scheduled and manual paths carry no event to inspect; the author check that actually
    # protects the merge is inside the script, which runs for every pull request either way. This
    # condition only keeps the `workflow_run` path from waking on unrelated CI.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]')
    steps:
      # PINNED TO `main`, NOT TO THE EVENT: on the `workflow_run` path the pull request under
      # evaluation is Dependabot's, and this job holds write permissions. The decision script must
      # come from the trunk, never from the branch it is judging.
      - name: Check out the decision script from main
        uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: .github/scripts

      - name: Collect the pull requests to evaluate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          list="$RUNNER_TEMP/prs.txt"
          : > "$list"

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Exactly the pull request whose checks just finished.
            gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
              --jq '.[] | select(.state=="open") | .number' | head -n1 >> "$list"
          else
            # The sweep. `--state open` and the author filter are what make this convergent rather
            # than a re-run of whatever the last event happened to be.
            gh pr list --repo "$REPO" --author app/dependabot --state open \
              --limit 100 --json number --jq '.[].number' >> "$list"
          fi

          echo "PR_LIST=$list" >> "$GITHUB_ENV"
          echo "$(wc -l < "$list") pull request(s) to evaluate:"
          cat "$list"

      - name: Apply the ceiling to each
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          merged=0
          while IFS= read -r pr; do
            [ -z "$pr" ] && continue
            echo "::group::PR #$pr"
            # The script never fails a pull request it merely declines, so a single unmergeable
            # branch cannot stop the sweep.
            if .github/scripts/dependabot-auto-merge.sh "$pr" | tee "$RUNNER_TEMP/out-$pr.txt"; then :; fi
            if grep -q "^MERGED $pr\$" "$RUNNER_TEMP/out-$pr.txt"; then
              merged=$((merged + 1))
            fi
            echo "::endgroup::"
          done < "$PR_LIST"

          echo "merged=$merged" >> "$GITHUB_ENV"
          echo "merged $merged pull request(s) this pass"

      # A squash merge made with GITHUB_TOKEN produces a push that triggers NOTHING - github's
      # anti-recursion rule - so CD never saw a single one of these merges and main drifted from
      # production silently. `workflow_dispatch` is the documented exception to that rule, so this
      # is the one call that closes the gap. ONE dispatch for the whole pass, not one per merge:
      # the deploy builds `main` as it now stands, and that is the same artefact either way.
      - name: Dispatch one deploy if anything merged
        # Both halves are load-bearing. The step above runs without `set -e` so one unmergeable
        # branch cannot stop a sweep, which means it can also end early and leave `merged` never
        # written - and an UNSET value is not equal to '0', so testing only that would dispatch a
        # deploy on the one path where nothing is known to have merged.
        if: env.merged != '' && env.merged != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Dispatching CD for $merged merge(s)"
          gh workflow run cd.yml --repo "$REPO" --ref main
