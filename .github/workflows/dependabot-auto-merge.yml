name: Dependabot auto-merge

# Automatically squash-merges Dependabot pull requests once the full check
# suite on the PR head commit is green. Triggered when a PR-gating workflow
# completes, then independently verifies EVERY check-run on the head SHA so it
# is robust to path-filtered matrix jobs and to repos with several CI
# workflows: the merge only fires on the completion that leaves nothing
# pending and nothing failed. No branch protection required.
#
# AND IT MERGES ONLY WHAT THIS REPOSITORY'S GATES CAN ACTUALLY SEE.
#
# On 2026-08-31 this workflow, which had no ceiling at all, merged
# `@nestjs/platform-express` 11 -> 12 into core-service ALONE. The result was a
# framework split across one service - platform-express 12 declaring
# `peerDependencies: {"@nestjs/common": "^12.0.0", "@nestjs/core": "^12.0.0"}`
# against two packages pinned at 11.2.3 - and CI was green, because a peer
# mismatch is a warning to bun and the service still compiles.
#
# THE FIRST CEILING WRITTEN THAT DAY REFUSED BY SEMVER: every major, and every
# minor whose new version's major was 0. It was wrong, and the measurement that
# says so is that 33 pull requests were open and it refused nearly all of them.
# A queue nobody drains is worse than the merge it prevented, and the standing
# directive is explicit (user, 2026-08-31): "Je prefere blinder de test et faire
# les choses automatiquement qu'avoir une review humaine qui n'arrive jamais."
#
# SEMVER IS THE WRONG QUESTION. `base64` 0.22 -> 0.23 and `axum` 0.7 -> 0.8 are
# exactly the kind of break `cargo test` and `tsc` DO see - they stop compiling.
# What a green suite cannot see is a dependency whose failure mode this repository
# has no test for at all, and that has nothing to do with the version number:
# `openmls` can change a wire or state format and compile perfectly, and the SFU's
# ten tests never touch the ICE stack whatever version of `webrtc` is under them.
#
# SO THE CEILING IS A LIST OF DEPENDENCIES WHOSE FAILURE MODE IS UNOBSERVABLE
# HERE, AND EVERY ENTRY NAMES THE TEST THAT WOULD RETIRE IT. Anything not on that
# list merges on a green suite, whatever its update type, because for those the
# suite IS the evidence. A refusal is never a routing decision to a human queue:
# it is this workflow saying a gate is missing, and it says so IN A COMMENT ON
# THE PULL REQUEST, so the gap is readable rather than silent.
#
# The list, and the state of each entry, is kept in `docs/wiki/backlog.md`.

on:
  workflow_run:
    workflows: ["CI", "Code Analysis"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  # `gh workflow run cd.yml` after a merge. Without it the dispatch 403s and the deploy is
  # skipped exactly as silently as the push that never triggered one.
  actions: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only act on Dependabot PR runs. Fail-closed on everything else.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Refuse only what this repository has no gate for
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Dependabot writes one `updated-dependencies` block per dependency into the commit
          # message, with typed fields. A grouped PR carries several, and EVERY one has to pass.
          # The blocks are read AS BLOCKS rather than as three independent `sed` lists: an update
          # Dependabot could not classify carries no `update-type` at all, and three lists pasted
          # side by side would then pair the wrong name with the wrong version, silently.
          message=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.commit.message')

          parsed=$(awk '
            /^ *- dependency-name:/ {
              if (name != "") print name "|" type "|" version
              name = $0; sub(/^ *- dependency-name: */, "", name); type = ""; version = ""
              next
            }
            /^ *dependency-version:/ { version = $0; sub(/^ *dependency-version: */, "", version) }
            /^ *update-type:/ { type = $0; sub(/^ *update-type: *version-update:semver-/, "", type) }
            END { if (name != "") print name "|" type "|" version }
          ' <<< "$message")

          if [ -z "$parsed" ]; then
            echo "No updated-dependencies block on $HEAD_SHA - refusing to guess."
            echo "allowed=false" >> "$GITHUB_ENV"
            echo "reasons=- this commit carries no machine-readable updated-dependencies block, so nothing here can tell what it changes." >> "$GITHUB_ENV"
            exit 0
          fi

          # The loop reads from a redirection rather than a pipe, so the counters below belong to
          # the CURRENT shell - a piped `while` runs in a subshell and its state is discarded.
          refused=0
          reasons_file="$RUNNER_TEMP/ceiling-reasons.md"
          : > "$reasons_file"
          while IFS='|' read -r name type version; do
            [ -z "$name" ] && continue
            # Dependabot YAML-quotes any dependency name that starts with `@`, so the trailer for a
            # scoped npm package reads `"@nestjs/common"`, quotes included. Matching without
            # stripping them silently misses the entire scope - which is how a first draft of this
            # ceiling merged the exact `@nestjs/common` major it was written to refuse.
            name="${name%\"}"
            name="${name#\"}"
            gate=""
            case "$name" in
              openmls|openmls_*|tls_codec|tls_codec_derive|hpke-rs*|libcrux*|chacha20poly1305|aes-gcm|argon2|ciborium)
                # Not only the protocol crates: everything that WRITES A FORMAT SOMEONE ELSE MUST
                # STILL READ belongs here. `argon2` derives the at-rest device key, `chacha20poly1305`
                # seals it, `ciborium` serialises the keystore. A parameter or encoding change in any
                # of them compiles perfectly and locks every existing device out of its own data.
                gate="a cross-version state test. Nothing here opens a group, or a keystore, written by the PREVIOUS version, so a wire, encoding or key-derivation change compiles clean, passes every suite, and is discovered by a member whose conversation stopped decrypting" ;;
              webrtc|webrtc-*|str0m|sdp|ice|turn|stun)
                gate="one relay-path call. The SFU has ten tests and not one of them touches the ICE stack; that is campaign rung 15 CALL, which has no runner yet" ;;
              # `@nestjs/*` WAS REFUSED HERE UNTIL 2026-08-31, and the entry is gone because the
              # test it named now exists and is green on all four services: `boot-nest-apps` builds
              # the real `AppModule` against a real Postgres, Redis and S3 endpoint. That is what a
              # refusal is for - it names a missing gate, and it leaves when the gate arrives. It
              # released 22 of the 28 refusals measured that morning.
              typeorm)
                # BARE `typeorm`, not `@nestjs/typeorm`: the wrapper is exercised by the boot, which
                # resolves `forRootAsync`, builds every entity's metadata and synchronises a schema.
                # The ORM ITSELF is not: no test in this repository issues a real query, because the
                # unit suites mock every repository. A major that changes how a query is BUILT would
                # pass all 1105 of them and fail in production. (Its migrations are not the gap -
                # they are raw `.sql` files that TypeORM never runs.)
                #
                # `major` OR unknown: a "update the requirement to permit the latest version" pull
                # request carries NO update-type trailer at all - PR #297 is one.
                if [ "$type" = "major" ] || [ -z "$type" ]; then
                  gate="a test that issues a REAL query. The boot job proves the schema builds; every unit suite mocks its repositories, so nothing here has ever watched this ORM return a row"
                fi ;;
            esac

            if [ -n "$gate" ]; then
              echo "  REFUSED: $name -> $version ($type): $gate"
              refused=$((refused + 1))
              # Accumulated in a FILE, not a shell variable: a multi-line value assembled inline
              # would have to carry a literal newline, and a literal newline inside a YAML block
              # scalar has to be indented like the rest of the block or it ends the scalar.
              echo "- \`$name\` -> \`$version\`: $gate." >> "$reasons_file"
            else
              echo "  ok: $name -> $version ($type) - the suite is evidence about this one"
            fi
          done <<< "$parsed"

          if [ "$refused" -ne 0 ]; then
            echo "allowed=false" >> "$GITHUB_ENV"
            {
              echo "reasons<<REASONS_EOF"
              cat "$reasons_file"
              echo "REASONS_EOF"
            } >> "$GITHUB_ENV"
            echo "$refused update(s) have no gate here; this PR waits for one to be written."
            exit 0
          fi
          echo "allowed=true" >> "$GITHUB_ENV"

      # A REFUSAL THAT SAYS NOTHING IS THE QUEUE NOBODY DRAINS. The comment names the missing test,
      # so the pull request carries its own reason for sitting there. It is posted ONCE: this
      # workflow fires on every check-suite completion, and a marker line is cheaper and more
      # reliable than reasoning about how many runs a push produced.
      - name: Say what gate is missing, once
        if: env.allowed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REASONS: ${{ env.reasons }}
        run: |
          set -euo pipefail
          MARKER='<!-- canari-auto-merge-ceiling -->'

          pr=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
                 --jq '.[] | select(.state=="open") | .number' | head -n1)
          if [ -z "${pr:-}" ]; then echo "No open PR for $HEAD_SHA."; exit 0; fi

          if gh api "repos/$REPO/issues/$pr/comments" --paginate --jq '.[].body' | grep -qF "$MARKER"; then
            echo "Already explained on #$pr."
            exit 0
          fi

          gh pr comment "$pr" --repo "$REPO" --body "$MARKER
          **Not auto-merged: this repository has no gate that would see this one fail.**

          $REASONS
          This is not a semver judgement - a break that stops the tree compiling is caught by the
          suite and merges on its own. It is a statement that a TEST IS MISSING. Write the one named
          above and this whole class of update starts merging by itself; the list is in
          docs/wiki/backlog.md."

      - name: Merge when the whole check suite is green
        if: env.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Resolve the open Dependabot PR whose head is this commit.
          pr=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
                 --jq '.[] | select(.state=="open") | .number' | head -n1)
          if [ -z "${pr:-}" ]; then
            echo "No open PR for $HEAD_SHA; nothing to do."
            exit 0
          fi
          echo "Evaluating checks for PR #$pr ($HEAD_SHA)"

          # Inspect every check-run on the head commit. Merge only if at least
          # one exists, all are completed, and none reported a bad conclusion.
          runs=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" --paginate \
                   --jq '.check_runs[] | "\(.name)|\(.status)|\(.conclusion // "")"')

          total=0; pending=0; bad=0
          while IFS='|' read -r name status conclusion; do
            [ -z "$name" ] && continue
            # Ignore this workflow's own run if it ever surfaces as a check.
            case "$name" in "Dependabot auto-merge"*) continue ;; esac
            total=$((total + 1))
            [ "$status" != "completed" ] && pending=$((pending + 1))
            case "$conclusion" in
              success|skipped|neutral|"") ;;
              *) bad=$((bad + 1)); echo "  FAIL: $name -> $conclusion" ;;
            esac
          done <<< "$runs"

          echo "checks: total=$total pending=$pending bad=$bad"
          if [ "$total" -eq 0 ]; then echo "No checks yet; skip."; exit 0; fi
          if [ "$bad" -ne 0 ]; then echo "A check failed; not merging."; exit 0; fi
          if [ "$pending" -ne 0 ]; then echo "Checks still running; will re-evaluate on next completion."; exit 0; fi

          echo "All checks green -> merging PR #$pr"
          gh pr merge "$pr" --repo "$REPO" --squash --delete-branch

          # A squash merge made with GITHUB_TOKEN produces a push that triggers NOTHING -
          # github's anti-recursion rule - so CD never saw a single one of these merges and
          # main drifted from production silently. `workflow_dispatch` is the documented
          # exception to that rule, so this is the one call that closes the gap, and it is
          # here rather than in a `workflow_run` on this workflow because that would also
          # fire on every completion where nothing was merged at all.
          echo "Dispatching CD for the merge of #$pr"
          gh workflow run cd.yml --repo "$REPO" --ref main
