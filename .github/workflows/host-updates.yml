name: Host OS updates

# =================================================================================================
# IS THE PRODUCTION BOX ACTUALLY TAKING ITS SECURITY UPDATES?
#
# `unattended-upgrades` was installed on all four hosts on 2026-09-03, security origins only, never
# rebooting. This workflow is the other half, and without it the install would be the exact defect
# this repository names hardest: a correct mechanism with no report is found by hand, a day late.
#
# WHY A RED RUN IS THE REPORT. There is no alerting anywhere in this estate - both outages of
# 2026-09-01 were reported by the USER, and nothing pages anybody
# (`docs/wiki/backlog.md`). What this repository DOES read is `gh run list`, so a failing run is the
# only channel that already exists. Everything the script finds is emitted as `::error::` so it is
# also legible in the run summary without opening a log.
#
# WHY IT RUNS ON THE SELF-HOSTED RUNNER. The report has to be taken ON the box - `apt-config dump`,
# the timer's last trigger and `/var/log/unattended-upgrades` are all local facts. That runner lives
# on the production origin, which is why this workflow reports production and nothing else: the
# runner's key is authorised on none of the other three hosts (measured 2026-09-03), and installing
# cross-host keys in order to write a report is a privilege expansion nobody asked for. The gap is
# in `docs/wiki/backlog.md` with what would close it.
#
# WHY A CLOCK IS ACCEPTABLE HERE, given this repository has measured GitHub dropping hourly slots
# outright: a late report costs latency on a report, never correctness of the thing reported. The
# updates themselves are applied by systemd on the box whether this ever fires or not. That is the
# one shape `durable-rules` permits a schedule - a floor under the worst case - and it is why the
# script judges whether the HOST's timer fired rather than trusting that this one did.
# =================================================================================================

on:
  schedule:
    # Daily, after the apt-daily-upgrade window. GitHub delivers this with hours of jitter and
    # sometimes not at all, which is fine for the reason above.
    - cron: '30 7 * * *'
  workflow_dispatch:

# ONE RUNNER, SO EVERY WORKFLOW THAT ASKS FOR IT MUST SAY WHAT IT MAY NOT OVERLAP WITH -
# `deploy-env.test.sh` derives that assertion from `runs-on: self-hosted` rather than from a list of
# workflow names, precisely so a new workflow like this one cannot be added without it. This job
# only READS, so an overlap would be harmless; the group is declared anyway, because a rule that is
# waived the first time it is inconvenient is not a rule. It is its OWN group: queueing a read-only
# report behind a deploy would make the report late for no benefit.
concurrency:
  group: host-updates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    name: Security updates on the production host
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # `apt-get -s upgrade` needs no privilege and neither does `apt-config`. Reading
      # `/var/log/unattended-upgrades` needs the `adm` group, which the runner account was added to
      # on 2026-09-03 - it grants nothing an account already in `sudo` and `docker` did not have,
      # and without it the script's ERROR arm is blind. Losing the group again is itself reported,
      # rather than making the check quietly stop working.
      - name: Read the host and judge it
        run: bash infrastructure/deploy/host-update-report.sh
