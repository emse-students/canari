# =================================================================================================
# EVERYTHING THIS REPOSITORY DOES ON A CLOCK, IN ONE PLACE
#
# WHY ONE FILE (user, 2026-09-04: *"le moins de workflows differents possibles, ca inonde la console
# github"*). There were four workflows here - `host-updates`, `cache-cleanup`, `dev-refresh`, and
# the scheduled half of `code-analysis` - each a separate row in the Actions list, each with its own
# permissions block, its own dispatch and its own conventions, and not one of them ever reading
# another. They have exactly one thing in common and it is the only thing that matters about them:
# **nobody is watching when they run.**
#
# WHAT A CLOCK IS ALLOWED TO BE HERE, and it is the same rule for all four. *Termination comes from
# a proof, never from a clock*, so a schedule is only ever a FLOOR UNDER THE WORST CASE: if it
# arrives late, or not at all, the cost must be a late REPORT and never a wrong outcome. That holds
# for every job below - the host applies its own updates whether this fires or not, a buildkit cache
# that survives another week costs quota, the dev estate is reset on demand by anyone who needs
# it, and a nightly audit re-asks a question the pull-request path already asks on every change.
# **A job whose correctness depended on this firing would not belong here.** It is measured, not
# assumed: `code-analysis` asked for `0 2 * * *` and actually ran at 03:01, 03:09, 08:05, 08:24,
# 08:47, 12:37 and 14:10 UTC on seven consecutive days, and GitHub DROPS the slots a cron misses
# rather than queueing them.
#
# HOW A RUN KNOWS WHICH JOB IT IS. `github.event.schedule` carries the cron string that fired,
# verbatim, so each job names its own. That string is the whole routing mechanism, which makes a
# typo a job that never runs and says nothing - so `scheduled.test.sh` reads the crons declared
# below and the crons the jobs name, and fails if the two sets differ.
# =================================================================================================
name: Scheduled

on:
  schedule:
    # Daily, and THREE jobs read this one: the host's security updates, after the apt-daily-upgrade
    # window, last night's backups, hours after the 03:30 and 04:00 runs they judge, and the 90-day
    # ceiling on technical logs.
    - cron: '30 7 * * *'
    # Daily. A new advisory can land against code nobody touched, which is the half the
    # pull-request path cannot see.
    - cron: '0 2 * * *'
    # Sundays, and TWO jobs read this one. The Actions cache quota is 10 GB and buildkit entries
    # are never evicted; GHCR image versions never expire either.
    - cron: '0 3 * * 0'
    # Daily, and TWO jobs read this one. Did the last stable release actually reach both stores? And
    # does a Dependabot cargo pull request need its committed lockfiles completed?
    - cron: '0 9 * * *'
    # Mondays, and TWO jobs read this one. Ask what the cargo directories Dependabot cannot reach
    # are behind on, and whether upstream released past a vendored fork. The dev copy
    # from production read this slot too until 2026-10-16; its successor, `dev-reset`, has no clock.
    # Adding a job here means editing this line too: a schedule serves whichever `if:` names it, and
    # a comment naming one hides the rest.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which one to run by hand'
        type: choice
        default: all
        options: [all, hosts, backups, log-retention, analysis, alerts, caches, ghcr-cleanup, dev-reset, stores, cargo-unreachable, vendored-upstream, cargo-lock-refresh]
      dry_run:
        description: 'dev-reset only: report what would happen and change nothing'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # IS THE PRODUCTION BOX ACTUALLY TAKING ITS SECURITY UPDATES?
  #
  # `unattended-upgrades` was installed on all four hosts on 2026-09-03, security origins only,
  # never rebooting. This job is the other half, and without it the install would be the exact
  # defect this repository names hardest: *a correct mechanism with no report is found by hand, a
  # day late.*
  #
  # WHY A RED RUN IS THE REPORT. There is no alerting anywhere in this estate - both outages of
  # 2026-09-01 were reported by the USER, and nothing pages anybody. What
  # this repository DOES read is `gh run list`, so a failing run is the only channel that already
  # exists. Everything the script finds is emitted as `::error::` so it is legible in the run
  # summary without opening a log.
  #
  # WHY IT RUNS ON THE SELF-HOSTED RUNNER. The report has to be taken ON the box - `apt-config
  # dump`, the timer's last trigger and `/var/log/unattended-upgrades` are all local facts. That
  # runner lives on the production origin, which is why this reports production and nothing else:
  # its key is authorised on none of the other three hosts (measured 2026-09-03), and installing
  # cross-host keys in order to write a report is a privilege expansion nobody asked for. The gap is
  # in `docs/wiki/backlog.md` with what would close it.
  #
  # AND ITS ROOT DISK (2026-10-24), in the same report rather than a new job: the host's
  # administrators found it at 90 % before anything here said so. Red at 85 %, with the three
  # consumers that are ours - backups, Docker, runner leftovers - printed beside the percentage.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  hosts:
    name: Security updates and disk on the production host
    if: >
      github.event.schedule == '30 7 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
      contains(fromJSON('["all", "hosts"]'), inputs.job))
    runs-on: self-hosted
    timeout-minutes: 10
    # ONE RUNNER, SO EVERY JOB THAT ASKS FOR IT MUST SAY WHAT IT MAY NOT OVERLAP WITH -
    # `deploy-env.test.sh` derives that assertion from `runs-on: self-hosted` rather than from a
    # list of workflow names, precisely so a new job like this one cannot be added without it. This
    # job only READS, so an overlap would be harmless; the group is declared anyway, because a rule
    # waived the first time it is inconvenient is not a rule. It is its OWN group, at the JOB level:
    # queueing a read-only report behind the dev refresh below would make the report late for no
    # benefit, which a workflow-level group would do.
    concurrency:
      group: host-updates
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # `apt-get -s upgrade` needs no privilege and neither does `apt-config`. Reading
      # `/var/log/unattended-upgrades` needs the `adm` group, which the runner account was added to
      # on 2026-09-03 - it grants nothing an account already in `sudo` and `docker` did not have,
      # and without it the script's ERROR arm is blind. Losing the group again is itself reported,
      # rather than making the check quietly stop working.
      # THIS RUNNER'S HOST IS THE SHARED ONE, whose unattended-upgrades policy is its
      # administrators' (full stable, packagecloud, an automatic 02:00 reboot, a log the runner
      # cannot read) and is not ours to change: the report judges what is OUR question there
      # (timer ran, nothing security pending, no reboot owed) and only prints the policy.
      - name: Read the host and judge it
        env:
          POLICY_OWNER: host-admins
        run: bash infrastructure/deploy/host-update-report.sh

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # DID LAST NIGHT'S BACKUPS HAPPEN, WHOLE, AND OFFSITE?
  #
  # Five nights (2026-09-26 to 2026-09-30) wrote no archive, the media run stopped before its
  # offsite mirror, and no snapshot had ever held Garage's `node_key` - all of it found by hand.
  # The backups are the gha-runner CRONTAB, not this workflow, so a red run here is their only
  # report; the reasons are those of `hosts` above: no alerting exists, `gh run list` is read.
  #
  # ON THE SELF-HOSTED RUNNER because the artefacts are local files and the runner account IS the
  # one whose crontab runs the backups, so it reads exactly what they wrote and asks the offsite
  # host with the same key. It reads only - restic without a lock - so it cannot block a backup.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  backups:
    name: Last night's backups
    if: >
      github.event.schedule == '30 7 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
      contains(fromJSON('["all", "backups"]'), inputs.job))
    runs-on: self-hosted
    timeout-minutes: 15
    # Its own group, at the job level, for the reason `hosts` gives: a read-only report queued
    # behind the dev refresh would only be late.
    concurrency:
      group: backup-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Read the artefacts and judge them
        run: bash infrastructure/backup/backup-report.sh

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # NO TECHNICAL LOG OLDER THAN THE PRIVACY POLICY'S 90 DAYS
  #
  # The policy promises IP logs are kept 90 days at most and then deleted automatically; a
  # size-capped container log is no bound in time. Deletes the deploy-log archives past their 30
  # days (files this project wrote, no container touched) and goes RED naming any container whose
  # live log holds a line older than 60 days - only recreating it deletes that, and that is a
  # human's production change. The 30 days between 60 and 90 are the slack for this run being late
  # or dropped, which is what makes a clock acceptable here: missing it costs a late report, never
  # the promise. docs/wiki/infrastructure/logging.md, the only copy of the reasoning.
  #
  # ON THE SELF-HOSTED RUNNER because the archive is in the deploying account's home and the logs
  # are the local daemon's.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  log-retention:
    name: Technical logs inside the 90-day promise
    if: >
      github.event.schedule == '30 7 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
      contains(fromJSON('["all", "log-retention"]'), inputs.job))
    runs-on: self-hosted
    timeout-minutes: 15
    # Its own group, at the job level, for the reason `hosts` gives.
    concurrency:
      group: log-retention
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Prune the log archive and judge the live logs
        run: bash infrastructure/deploy/log-retention-report.sh

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # THE NIGHTLY SECURITY PASS
  #
  # THE SAME FILE THE PULL REQUEST RUNS, called rather than copied. `code-analysis.yml` is a
  # `workflow_call` library, so CodeQL, the secret scan and the vulnerability audit are ONE
  # definition asked at two moments: on every pull request, where it feeds `CI passed` and can
  # therefore block a merge, and here, where it re-asks the question against code nobody touched.
  # A new advisory lands against an unchanged tree, which is precisely what the pull-request path
  # cannot see.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  analysis:
    name: Security
    if: >
      github.event.schedule == '0 2 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
      contains(fromJSON('["all", "analysis"]'), inputs.job))
    # Derived from what the callee declares, not chosen here: a caller CAPS a called workflow, and
    # exceeding that cap is a startup failure with no log and no annotation.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/code-analysis.yml
    # HERE AN UNAUDITED TREE IS A FAILURE, and on a pull request it is not. `bun audit` exits 1 for
    # an npm 503 exactly as it does for a real advisory, so tolerating that on a pull request is what
    # keeps a five-minute outage in somebody else's datacentre from walling every merge here. Nothing
    # is behind THIS run, so the same silence is simply reported - which is what stops the toleration
    # from turning into a tree nobody has audited for a week with only warnings to show for it.
    with:
      registry_outage_is_failure: true

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # WHAT GITHUB KNOWS AND THE PASS ABOVE CANNOT SEE
  #
  # The analysis job re-asks THIS repository's own questions against an unchanged tree. This one asks
  # GitHub's, and they are not the same question: GHSA-7gcf-g7xr-8hxj was raised against `serde_with`
  # in `frontend/src-tauri/Cargo.lock`, and on 2026-09-04 all three of the mechanisms that should
  # have caught it were blind at once - Dependabot could not open the pull request (a `links`
  # manifest it cannot parse), `cargo audit` exited 0 (the advisory is GHSA-only and not in RustSec),
  # and nothing here read the alert list at all. It was found because a `git push` printed a line
  # about it.
  #
  # IT RIDES THE SAME CRON as the analysis rather than taking one of its own. Both answer "has
  # something landed against code nobody touched", the answer only changes once a day, and a fifth
  # schedule line would be a fifth thing to reason about for no extra resolution.
  #
  # The Dependabot list needs `secrets.DEPENDABOT_ALERTS_TOKEN` (no `permissions:` key covers it);
  # the CODE SCANNING list, read by the second step, needs only `security-events: read`. A refusal
  # is REPORTED rather than tolerated - the script's whole design is that an empty list and a refused
  # request must not look alike - so if either credential is ever narrowed the run goes red saying so.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  alerts:
    name: Dependabot and code scanning alerts on the default branch
    if: >
      github.event.schedule == '0 2 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
      contains(fromJSON('["all", "alerts"]'), inputs.job))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # FOR THE CODE SCANNING STEP ONLY, and here the key does exactly what it says: code scanning
      # alerts are the resource `security-events` governs. The pull-request `CodeQL` check refuses
      # only a NEW alert, so a standing one failed nothing - 2521 stood four weeks, found by hand.
      security-events: read
      # NO `permissions:` KEY GRANTS THIS, WHICH IS WHY THE JOB HAD NEVER PASSED. It declared
      # `security-events: read` and failed 403 on every nightly run since it was written: that
      # permission covers code scanning and secret scanning, and Dependabot alerts are a separate
      # resource GITHUB_TOKEN cannot read at any setting. Only a PAT or a GitHub App holding the
      # fine-grained "Dependabot alerts: read" repository permission can, so the permission is
      # dropped rather than kept as a claim the API refuses.
    steps:
      - uses: actions/checkout@v7

      - name: Read GitHub's alert list and judge it
        env:
          # THE SECRET IS THE FIX AND `GITHUB_TOKEN` IS THE PROOF IT IS MISSING. With the secret set
          # the job answers unattended; without it the run fails and the script says which
          # credential to mint. It is deliberately NOT a silent skip - an alert list nobody reads
          # looks exactly like an empty one, which is the defect this report exists to end.
          GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/github-alerts-report.sh dependabot

      # Runs whatever the step above found: the two lists are independent, and a red Dependabot
      # half must not hide a standing code scanning alert behind it.
      - name: Read GitHub's code scanning alert list and judge it
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/github-alerts-report.sh code-scanning

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # THE ACTIONS CACHE QUOTA IS 10 GB, AND BUILDKIT NEVER EVICTS
  #
  # Docker buildkit caches (`type=gha`) create one cache entry per blob and are never evicted
  # automatically, so they accumulate until `cache-to` starts failing with "failed to reserve
  # cache" - a build that gets slower and then breaks, for a reason that is invisible in the build
  # log.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  caches:
    name: Prune stale buildkit caches
    if: >
      github.event.schedule == '0 3 * * 0' ||
      (github.event_name == 'workflow_dispatch' &&
      contains(fromJSON('["all", "caches"]'), inputs.job))
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete buildkit caches older than 7 days
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CUTOFF=$(date -d '7 days ago' +%s)

          echo "Pruning buildkit caches older than $(date -d @"$CUTOFF" -Iseconds)..."

          gh cache list --repo "$REPO" --limit 200 --json id,key,createdAt \
            --jq '.[] | select(.key | startswith("buildkit-") or startswith("index-buildkit-")) | "\(.id) \(.createdAt)"' \
          | while read -r id created; do
              created_ts=$(date -d "$created" +%s 2>/dev/null || echo 0)
              if [ "$created_ts" -lt "$CUTOFF" ]; then
                echo "  Deleting cache $id (created $created)"
                gh cache delete "$id" --repo "$REPO" || true
              fi
            done

          echo "Pruning complete."

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # GHCR NEVER EXPIRES A VERSION, AND `build.yml` PUSHES THREE TAGS PER SERVICE ON EVERY RELEASE
  #
  # Measured 2026-09-24: 6048 versions of `frontend` alone, 1990 of them tagged (the rest are
  # untagged single-platform images this build never made multi-arch, left behind whenever a
  # commit or version tag moved onto a newer push) - and no job anywhere has ever deleted one.
  # Every other of the 8 services accumulates the same way.
  #
  # KEEP is a rollback margin, not a guess at what is deployed: production is deployed by its
  # release's `v<version>` tag (`serve-prod.yml`), one push per service per release (pre-releases
  # included), so what is running is always among the newest few pushes and survives by
  # construction, and a rollback to a recent release still finds its images. 30 covers
  # months of release cadence at this project's rate without ever approaching a number that would
  # make "can I still reach last month's build" a real question.
  #
  # ONE `gh api DELETE` PER VERSION, NOT THE THIRD-PARTY ACTION - `actions/delete-package-versions`
  # caps a single run at 100 deletions, which would take dozens of weekly runs just to work through
  # today's backlog, and its handling of untagged versions next to a multi-arch manifest list is
  # undocumented. Moot here anyway: `build.yml` sets no `platforms:` input, so every image is a
  # single-platform push with no manifest-list children to protect - an untagged version here is
  # simply a superseded single image, safe to delete outright.
  ghcr-cleanup:
    name: Prune stale GHCR image versions
    if: >
      github.event.schedule == '0 3 * * 0' ||
      (github.event_name == 'workflow_dispatch' &&
      contains(fromJSON('["all", "ghcr-cleanup"]'), inputs.job))
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      # THE SAME EIGHT NAMES `build.yml` PUSHES TO, HARDCODED THE SAME WAY IT HARDCODES THEM - an
      # allowlist of exactly what this destructive step may touch, never a wildcard over the org's
      # packages, and never derived from a listing that could grow to include something else.
      - name: Delete versions beyond the rollback margin, oldest first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SERVICES=(
            core-service
            social-service
            chat-gateway
            call-service
            chat-delivery-service
            frontend
            frontend-ssr
            media-service
          )
          KEEP=30

          for service in "${SERVICES[@]}"; do
            package="canari%2F${service}"
            echo "=== ${service} ==="

            # created_at first so a lexicographic sort is a chronological one (ISO 8601), newest
            # first - never trusted from the API's own order, which is not a documented contract.
            versions="$(gh api "orgs/emse-students/packages/container/${package}/versions?per_page=100" \
              --paginate --jq '.[] | "\(.created_at)\t\(.id)"' | sort -r)"
            total=$(printf '%s\n' "$versions" | grep -c . || true)

            if [ "$total" -le "$KEEP" ]; then
              echo "  ${total} version(s), at or under the ${KEEP} kept - nothing to do"
              continue
            fi

            printf '%s\n' "$versions" | tail -n "+$((KEEP + 1))" | cut -f2 | while read -r id; do
              [ -z "$id" ] && continue
              if gh api --method DELETE "orgs/emse-students/packages/container/${package}/versions/${id}" >/dev/null 2>&1; then
                :
              else
                echo "  ::warning::could not delete version ${id} of ${service} - left in place"
              fi
            done
            echo "  ${total} version(s), kept ${KEEP} newest"
          done

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # RESET THE DEV ESTATE TO THE FICTIONAL SEED - ON DEMAND ONLY, AND NEVER FROM PRODUCTION
  #
  # This job copied production's database into dev every Monday until 2026-10-16, when the owner's
  # GDPR review ended it: dev now holds `infrastructure/dev/seed.sql`, people and associations that
  # are visibly invented, and nothing restores production's rows into it again.
  #
  # NO CRON, AND THAT IS THE POINT. The copy ran weekly to stay fresh; a seed never goes stale, and
  # what a reset destroys on a schedule is the testers' own work. So it runs when somebody asks - it
  # lives in this file only because a fifth visible workflow needs a reason beyond "another topic".
  # And it is NOT part of `all`: that choice re-runs the reports, and a destructive job is picked by
  # its own name or not at all.
  # The reasoning, and what the seed does and does not carry, is on
  # `docs/wiki/infrastructure/dev-environment.md`, the only copy.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  dev-reset:
    name: Reset dev.canari-emse.fr to the fictional seed
    if: >
      vars.DEV_ENVIRONMENT_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.job == 'dev-reset'
    runs-on: self-hosted
    permissions:
      contents: read
    concurrency:
      group: dev-reset
      cancel-in-progress: false
    steps:
      # The script lives in the repository, so it is read from the DEV checkout - never from
      # production's. A reset must not be able to depend on production's working tree at all.
      - name: Point at the dev checkout
        id: checkout
        run: |
          set -euo pipefail
          path="/srv/canari-dev"
          if [ ! -d "$path/.git" ]; then
            echo "::error::$path is not a checkout - the dev estate has never been deployed, so there is nothing to reset. Publish a pre-release first."
            exit 1
          fi
          # AT `dev-deployed`, NOT `origin/main`: the reset applies this tree's migrations and loads
          # this tree's seed, and both must be those of the commit dev's IMAGES were built from -
          # main is ahead of it by whatever merged since the last pre-release. It also stops a reset
          # from moving the compose file under a running estate.
          if ! git -C "$path" fetch --force origin "refs/tags/dev-deployed:refs/tags/dev-deployed"; then
            echo "::error::origin has no dev-deployed tag, so nothing says which commit dev's images come from. On a virgin estate (first deploy refused for want of a schema), tag the commit that deploy used: git tag dev-deployed <sha> && git push origin dev-deployed - then reset."
            exit 1
          fi
          git -C "$path" reset --hard dev-deployed
          if [ ! -f "$path/infrastructure/dev/reset-dev-to-seed.sh" ]; then
            echo "::error::dev-deployed ($(git -C "$path" rev-parse --short HEAD)) predates the seed - publish a pre-release from a main that carries infrastructure/dev/reset-dev-to-seed.sh, then reset."
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "resetting from $(git -C "$path" rev-parse --short HEAD) (dev-deployed)"

      - name: Empty dev and load the fictional seed
        working-directory: ${{ steps.checkout.outputs.path }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            bash infrastructure/dev/reset-dev-to-seed.sh --dry-run
          else
            bash infrastructure/dev/reset-dev-to-seed.sh
          fi

      # THE RESET IS NOT THE END OF THE JOB. It stops dev's application containers, and the script
      # brings them back - but "the containers are back" is not "the estate answers", which is the
      # house rule these lines exist to honour. `/api/version` needs the database the reset just
      # emptied, so it is the cheapest statement that the services read the seeded schema.
      # A DRY RUN CHANGES NOTHING, SO IT PROVES NOTHING - and asserting anyway reports the estate's
      # PRE-EXISTING state as this run's failure. Measured 2026-09-02: the first dry run of the old
      # copy went green through every guard and then failed here on twenty 502s, which were the
      # schemaless database it had deliberately not touched. A gate must only assert what the run it
      # guards actually did.
      - name: Prove the dev estate still answers
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/api/version || true)"
            if [ "$status" = "200" ]; then
              echo "dev answers /api/version after the reset"
              curl -s http://127.0.0.1:3080/api/version
              exit 0
            fi
            echo "  not yet (HTTP $status, $i/20)"
            sleep 6
          done
          echo "::error::dev did not answer /api/version within 2 minutes of the reset - the services may not read the seeded database"
          exit 1

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # DID THE LAST STABLE ACTUALLY REACH BOTH STORES?
  #
  # THE THREE-DAY SILENCE THIS ENDS. A release publishes the web, Google Play and the App Store from
  # one run, and nothing ever asked afterwards whether the stores got it. On 2026-09-04 the App
  # Store submission stopped on an occupied version slot, the iOS job went red, `production` - a
  # success dependency on it - was skipped, and the same thing happened on v0.16.3 and v0.16.4.
  # Production sat on v0.16.1 for three days while two releases reported themselves shipped, and it
  # was found by a HUMAN noticing a fix was not live.
  #
  # AND THE FIX FOR THAT CREATED THE GAP THIS CLOSES. A submission deferred by a busy Apple queue is
  # GREEN now (`EXIT_SLOT_HELD` in `tools/app-store/submit.mjs`), which is right - the web must not
  # be held hostage by a review queue - but it means a release can end with the build in TestFlight,
  # never submitted, and nothing saying so. **Making a failure quiet without adding a report is how
  # a three-day silence becomes a permanent one.**
  #
  # WHY A RED RUN IS THE REPORT, same as `hosts` above: nothing pages anybody in this estate, and
  # `gh run list` is what actually gets read.
  #
  # IT DOES NOT CRY WOLF. Apple reviews in DAYS, so `WAITING_FOR_REVIEW` is a pass - a daily report
  # that calls a normal review a problem is one its reader learns to skip, and the next real finding
  # goes with it. What fails this job is a version never submitted, a version a store REFUSED, or a
  # half this report could not read at all. That last one is deliberate: a credential that expires
  # must not turn the whole check into a green light.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  stores:
    name: Did the last stable reach both stores?
    if: >
      github.event.schedule == '0 9 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
      contains(fromJSON('["all", "stores"]'), inputs.job))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # The Play library takes its credential from a FILE, and `PLAY_SA_KEY` is the documented
      # override for exactly this: CI has the JSON as a secret, not as a path.
      - name: Put the Play service account where the library looks
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not set - the Play half of this report cannot be read, and this report does not treat 'could not look' as a pass"
            exit 1
          fi
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-sa.json"
          echo "PLAY_SA_KEY=$RUNNER_TEMP/play-sa.json" >> "$GITHUB_ENV"

      - name: Ask both stores what they hold
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_BUNDLE_ID: fr.emse.canari
        run: bun tools/store-divergence/divergence.mjs

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # THE CARGO DIRECTORIES DEPENDABOT CANNOT REACH, AND THE TRIGGER THAT REMEMBERS THEM
  #
  # THE DECISION (user, 2026-09-10): keep `/frontend/src-tauri` and its custom-tabs plugin declared
  # to Dependabot and update them deliberately - option 3 of the three in `docs/wiki/backlog.md`,
  # with a NAMED trigger, because "somebody remembers" is not a mechanism. Option 1, dropping the
  # `links` key, is refuted by a generated file rather than by an argument: `links` is what exports
  # a build script's metadata to dependents, and without it `tauri-build` never learns where the
  # plugin's Kotlin lives, so `open_custom_tab` fails on a phone while everything builds green.
  # Option 2, undeclaring them, makes the artefact that ships to phones permanently unmanaged.
  #
  # 194 UPDATES WERE PENDING THE DAY THIS WAS WRITTEN - 193 in `/frontend/src-tauri` and one in the
  # plugin - which is what 33 days of a silence nobody could see is worth.
  #
  # IT RIDES THE MONDAY CRON rather than taking a sixth schedule line. Two jobs on one cron is legal
  # and `scheduled.test.sh` checks it is deliberate; a weekly cadence is also the right resolution,
  # because a lockfile that is one patch behind is not news and a daily issue-churn would be.
  #
  # THE REPORT IS AN ISSUE, AND A RED RUN MEANS SOMETHING ELSE. Unlike `alerts` and `stores` above,
  # a finding here does NOT fail the run: a Rust tree is always slightly behind, so a red nightly
  # for it would be red every night, and a line its reader learns to skip is the one that hides the
  # next defect. The issue says there is work; a red run says this reporter is broken. Everything
  # that could make an empty answer a lie - a refused issue list, a failing cargo, a creation that
  # did not land, a derivation that found no directory - fails loudly instead.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  cargo-unreachable:
    name: Cargo updates Dependabot cannot open
    if: >
      github.event.schedule == '0 4 * * 1' ||
      (github.event_name == 'workflow_dispatch' &&
      contains(fromJSON('["all", "cargo-unreachable"]'), inputs.job))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # The report IS an issue, so this job writes one. It is the only thing it writes.
      issues: write
    steps:
      - uses: actions/checkout@v7

      # `dtolnay/rust-toolchain` pins nothing here on purpose: resolving the latest compatible
      # versions is the entire question this job asks, so it wants the toolchain CI otherwise uses.
      - uses: dtolnay/rust-toolchain@stable

      - name: Ask what those directories are behind on, and record it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/cargo-blocked-update-report.sh

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # A VENDORED FORK IS A DEPENDENCY NOTHING ELSE WATCHES
  #
  # `frontend/src-tauri` replaces `tauri-plugin-websocket` with a local copy (`[patch.crates-io]`,
  # pinned `=2.5.0`). Dependabot does not reach `src-tauri`, `cargo-unreachable` above asks `cargo
  # update`, which cannot move an `=` pin, and `cargo audit` was never shown to match a PATH
  # package - so an upstream fix, security included, would reach nobody. This compares the fork's
  # version with crates.io's latest STABLE release, for an allowlist of crates the script asserts
  # against the tree.
  #
  # A RED RUN IS THE REPORT, like `alerts` and unlike `cargo-unreachable`: a fork one release behind
  # is a rebase owed, not the normal state of a tree, and the `::error` title names it. A crates.io
  # that does not answer exits 75 under its own title - nothing was compared, which is neither a
  # finding nor a pass. `gh run list` shows both as a failed run; the annotation title in the run
  # summary is what separates them. It rides the Monday cron: upstream plugin releases are weeks apart.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  vendored-upstream:
    name: Upstream releases past a vendored fork
    if: >
      github.event.schedule == '0 4 * * 1' ||
      (github.event_name == 'workflow_dispatch' &&
      contains(fromJSON('["all", "vendored-upstream"]'), inputs.job))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Compare each vendored fork with crates.io
        run: bash .github/scripts/vendored-upstream-report.sh

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # A DEPENDABOT CARGO BUMP THAT IS INCOMPLETE BY CONSTRUCTION, COMPLETED (WP-RUST-LOCK-AUTOMERGE)
  #
  # `mls-wasm` and `src-tauri` commit their own `Cargo.lock` and consume `mls-core` by path, so
  # Dependabot's one pull request for an `mls-core` bump leaves both locks stale and fails CI's
  # `cargo metadata --locked` - the last dependency update that could not merge unattended. THE
  # USER DECIDED (2026-10-18) that a machine completes it and `CI passed` is the only verdict.
  #
  # IT RIDES THE DAILY 09:00 SLOT WITH `stores`. Dependabot opens security updates on any day, not
  # only on its Monday run, and a run that finds nothing costs one API call. A late or dropped slot
  # costs a late refresh, never a wrong merge: every decision reads durable state (the pull
  # requests, the branch), so the next slot or a dispatch picks up exactly where this one stopped.
  # What arms the new pull request, and the allowlist it must satisfy, is `arm-auto-merge.yml`;
  # what refuses a dependency nothing here would see fail is `dependency-ceiling` in `ci.yml`,
  # which reads the refresh branch too. The script header carries what it refuses and why.
  #
  # NOT PART OF `all`: that choice re-runs the REPORTS, and this job ACTS (it pushes, opens and
  # closes pull requests), so it is picked by name, like `dev-reset`.
  #
  # TWO TOKENS, EACH FOR ONE THING. The push and the pull requests are the App's, minted with ONLY
  # `contents: write` and `pull-requests: write` whatever else the App holds: a push made with
  # `GITHUB_TOKEN` raises no `pull_request` run, so the refresh would sit with no `CI passed` at all
  # (the anti-recursion rule `arm-auto-merge.yml` documents for the merge itself). The REPORT - an
  # issue listing every refusal - is `GITHUB_TOKEN`'s, `issues: write` below, so the App needs no
  # Issues permission. A refusal is work, so it is the issue; a FAILURE (an unreadable API, a cargo
  # that cannot answer, a refused push) turns this run red, which is what `gh run list` shows.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  cargo-lock-refresh:
    name: Complete Dependabot's cargo bump (lockfiles)
    if: >
      github.event.schedule == '0 9 * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'cargo-lock-refresh')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # ONE RUN AT A TIME: two runs reading "no refresh pull request yet" at once would both build
    # one. The second waits and then finds the first one's pull request - durable state again.
    concurrency:
      group: cargo-lock-refresh
      cancel-in-progress: false
    permissions:
      contents: read
      # The report IS an issue. It is the only thing `GITHUB_TOKEN` writes here.
      issues: write
    steps:
      - name: Mint the App identity that pushes and opens the pull request
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          # The token is narrowed to what this job does, whatever the installation grants.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Complete the pull requests that need it, and report what it refused
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPORT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          # The commit identity is the App's bot account, so GitHub resolves its commits to
          # `<slug>[bot]` - the one login `arm-auto-merge.yml` accepts besides Dependabot's.
          uid="$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          export COMMIT_NAME="${APP_SLUG}[bot]"
          export COMMIT_EMAIL="${uid}+${APP_SLUG}[bot]@users.noreply.github.com"
          bash .github/scripts/cargo-lock-refresh.sh
