name: Refresh dev.canari-emse.fr from production

# WHY THIS IS A SCHEDULE AND NOT A BUTTON. The dev estate carries a copy of production's data, and a
# copy is only useful while it resembles what it copied - a dev database three months stale answers
# questions about a population that no longer exists, which is the failure mode this repository keeps
# naming. The user's own standing rule decides the shape: "Je prefere blinder de test et faire les
# choses automatiquement qu'avoir une review humaine qui n'arrive jamais". So it runs weekly on its
# own, and the dispatch exists for the times somebody needs it NOW.
#
# WHAT MAKES IT SAFE TO RUN UNATTENDED is not this file - it is the script's own guards. It resolves
# both clusters by COMPOSE LABEL, never by a path or a container name that could be a typo; it
# refuses if source and target resolve to the same project or the same container; and it strips push
# tokens and Stripe customer ids before the restore, so a copy can never ring a real member's phone
# or charge a real card. Read `infrastructure/dev/copy-prod-to-dev.sh` before changing anything here.
#
# IT IS DESTRUCTIVE TOWARDS DEV, ON PURPOSE, AND TOWARDS NOTHING ELSE. Whatever was typed into dev
# since the last refresh is gone. That is what a copy of production means, and it is why the estate
# carries a permanent banner saying so.

on:
  schedule:
    # Mondays at 04:00 UTC. Deliberately not during the day: the copy stops dev's application
    # containers while it restores, so the estate is down for the duration.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would happen and change nothing'
        type: boolean
        required: false
        default: false

# Two refreshes at once would have the second restoring into a database the first is still writing.
concurrency:
  group: dev-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Copy production into dev
    # The same gate as the dev jobs in `cd.yml`, and absent today: with no dev estate there is
    # nothing to copy into, and the script would refuse for want of a `canari-dev` postgres anyway -
    # this just makes the skip say why.
    if: vars.DEV_ENVIRONMENT_ENABLED == 'true'
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      # The script lives in the repository, so it is read from the DEV checkout - never from
      # production's. A refresh must not be able to depend on production's working tree at all.
      - name: Point at the dev checkout
        id: checkout
        run: |
          set -euo pipefail
          path="/home/canari/canari-dev"
          if [ ! -d "$path/.git" ]; then
            echo "::error::$path is not a checkout - the dev estate has never been deployed, so there is nothing to refresh. Run the CD workflow first."
            exit 1
          fi
          git -C "$path" fetch origin main
          git -C "$path" reset --hard origin/main
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "refreshing from $(git -C "$path" rev-parse --short HEAD)"

      - name: Copy production into dev
        working-directory: ${{ steps.checkout.outputs.path }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            bash infrastructure/dev/copy-prod-to-dev.sh --dry-run
          else
            bash infrastructure/dev/copy-prod-to-dev.sh
          fi

      # THE COPY IS NOT THE END OF THE JOB. It stops dev's application containers to restore, and
      # the script brings them back - but "the containers are back" is not "the estate answers",
      # which is the house rule these two lines exist to honour. `/api/version` needs the database
      # the copy just replaced, so it is the cheapest statement that the restore really worked.
      # A DRY RUN CHANGES NOTHING, SO IT PROVES NOTHING - and asserting anyway reports the estate's
      # PRE-EXISTING state as this refresh's failure. Measured 2026-09-02: the first dry run went
      # green through the copy step and then failed here on twenty 502s, which were the schemaless
      # dev database the dry run had deliberately not touched. A gate must only assert what the run
      # it guards actually did.
      - name: Prove the dev estate still answers
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/api/version || true)"
            if [ "$status" = "200" ]; then
              echo "dev answers /api/version after the refresh"
              curl -s http://127.0.0.1:3080/api/version
              exit 0
            fi
            echo "  not yet (HTTP $status, $i/20)"
            sleep 6
          done
          echo "::error::dev did not answer /api/version within 2 minutes of the refresh - the restore may have left the database in a state the services cannot read"
          exit 1
