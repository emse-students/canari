# =================================================================================================
# ONE ARMING MECHANISM, FOR EVERY PULL REQUEST IN THE REPOSITORY
#
# THE HUMAN GESTURE IS OPENING A PULL REQUEST, AND NOTHING ELSE (user, 2026-08-31: *"Je prefere
# blinder de test et faire les choses automatiquement qu'avoir une review humaine qui n'arrive
# jamais"*, and *"pour avoir un projet qui peut 'vivre tout seul'"*). This workflow asks GitHub to
# squash-merge the pull request the moment `CI passed` goes green, and then gets out of the way.
#
# WHY IT IS ITS OWN FILE, AND WHY `pull_request_target`. Until 2026-09-04 arming was split in two -
# a job inside `ci.yml` for humans, and a 448-line hourly sweep for Dependabot - and the
# reason given for the split was that **a `pull_request` run from Dependabot has no secrets**:
# GitHub runs it as if it came from a fork, so `secrets.AUTOMERGE_APP_*` arrive EMPTY and no App
# token can be minted. That fact is true. The conclusion drawn from it was not: `pull_request_target`
# runs in the context of the BASE repository, with its secrets, for every pull request including
# Dependabot's. One mechanism, one file, no schedule, no bot comments, no hourly mail.
#
# `pull_request_target` IS SAFE HERE FOR ONE SPECIFIC REASON: THIS JOB NEVER CHECKS OUT THE PULL
# REQUEST. The whole danger of that trigger is running untrusted code with the base repository's
# secrets; there is no `actions/checkout` below, nothing is built and nothing is executed from the
# branch. The only call made is `gh pr merge --auto`. **Do not add a checkout to this file.** If
# something ever needs the pull request's tree, it belongs in `ci.yml`, which runs on
# `pull_request` and is untrusted by design.
#
# IT DOES NOT DEPEND ON THE TESTS, AND MUST NOT. `--auto` hands the decision to GitHub, which merges
# the instant the required check passes and never before; arming is a declaration of intent, not a
# verdict. A job that waited for the suite would hold a runner for its whole length and would then
# have to re-read the checks anyway - and a workflow that merges on its OWN reading of "green" is a
# second opinion about which jobs matter. `CI passed` is the ruleset's answer and must stay the only
# one.
#
# THE CREDENTIAL IS THE WHOLE DESIGN, AND `GITHUB_TOKEN` WOULD BREAK RELEASING. Auto-merge merges as
# whoever armed it, and a merge made by `GITHUB_TOKEN` raises NO `push` event - GitHub's
# anti-recursion rule. So `main` would get no run of `ci.yml`, its merge commit would carry
# no `CI passed` check, and `release-preflight.sh`'s third gate - "the tests passed on the commit
# being released" - would refuse EVERY release, on commits that had in fact been tested. An App token
# does raise the event, so the same `canari-auto-merge` installation that pushes the version bump
# arms this. Measured on #329 and #330: merged by `app/canari-auto-merge`, each followed by a `push`
# run of the CI workflow on the merge commit.
# =================================================================================================
name: Arm auto-merge

on:
  pull_request_target:
    branches: [main]
    # `ready_for_review` is what covers a pull request opened as a draft and finished later; without
    # it, taking a draft out of draft raises no event this workflow listens for and the branch sits
    # armed by nothing.
    types: [opened, reopened, synchronize, ready_for_review]

# READ ONLY AT THE TOP, because the write is not done with `GITHUB_TOKEN` at all - it is done with
# the App token minted below. A `pull_request_target` run gets a WRITE `GITHUB_TOKEN` by default,
# which is exactly the thing to give away here.
permissions:
  contents: read

# ONE ARMING AT A TIME PER PULL REQUEST. A branch pushed twice in quick succession raises two
# `synchronize` events, and the second arming would race the first - GitHub refuses to arm what is
# already armed, so the loser reports a failure for a state that is in fact correct.
# `cancel-in-progress: true` because the older of two armings of the SAME pull request has nothing
# the newer one does not.
# THE DRAFT FLAG IS IN THE GROUP, because "the newer run" is only a superset when both saw the same
# pull request. A push and `gh pr ready` in the same second raise a `synchronize` that still reads
# `draft: true` and a `ready_for_review`; one group let the draft run - which skips - cancel the one
# that would have armed, and #1259 sat green and unarmed (2026-09-30). A draft run now shares a
# group only with draft runs, so it can never cancel an arming.
concurrency:
  group: arm-auto-merge-${{ github.event.pull_request.number }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

jobs:
  arm:
    name: Arm auto-merge
    # WHOSE PULL REQUESTS, AND WHY NOT EVERY ONE:
    #
    #   * ONLY A BRANCH THAT LIVES IN THIS REPOSITORY. `head.repo.full_name == github.repository` is
    #     the trust boundary and not a formality: creating a branch here requires push access, so
    #     the author is somebody the repository already trusts. A pull request from a FORK is armed
    #     by nobody and merged by a human, which is the correct answer for code from outside.
    #   * NOT a draft. A draft is a pull request whose author has said it is not ready.
    #
    # These two stay a job-level `if:` because they need no API call. WHO may be armed does now -
    # see the step below for why `author_association` left this condition entirely.
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Mint the identity whose merge raises a push event
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # `client-id`, NOT `app-id`. Version 3 of this action deprecated `app-id`, and every run
          # that uses it prints `Input 'app-id' has been deprecated` as a warning annotation - on a
          # file that fires for EVERY pull request, which is the definition of a line its reader
          # learns to skip. The two inputs take DIFFERENT values, a numeric App id against an
          # `Iv23li...` string, so this is a secret swap and not a rename.
          client-id: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

      # WHOSE PULL REQUESTS - PART TWO, AND WHY IT IS A STEP AND NOT PART OF THE `if:` ABOVE.
      #
      # `github.event.pull_request.author_association` is what this used to gate on: Dependabot by
      # name, everyone else via `contains(["OWNER","MEMBER","COLLABORATOR"], author_association)`.
      # It skipped EVERY pull request from a member whose organization membership is PRIVATE -
      # measured on #709: `GET /pulls/709` answered `author_association: "MEMBER"` and
      # `GET /collaborators/.../permission` answered `admin`, both queried seconds apart with a
      # token that can see private membership, while the webhook payload this `if:` reads is
      # computed WITHOUT that visibility and fell back to a value outside the three names - so a
      # real admin's own pull request armed nobody, silently, every single time.
      #
      # The fix asks the question this job actually cares about - can this login push to THIS repo -
      # directly, over the API, with the App's own token, rather than trusting a webhook field that
      # depends on a privacy setting on the AUTHOR'S profile that has nothing to do with their
      # access here.
      - name: Decide whether this author may be armed
        id: authz
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          # canari-only:begin
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # canari-only:end
        run: |
          set -euo pipefail

          # canari-only:begin
          # A PULL REQUEST THAT APPROVES A HELD MIGRATION IS NEVER ARMED, WHOEVER OPENED IT (review of
          # #2873, 2026-11-01). `infrastructure/migration-approvals.txt` is the owner's yes to a
          # migration that is not plainly additive, and the deploy applies what it names
          # (infrastructure/lib/migration-hold.sh). Armed, such a pull request would merge itself on
          # a green CI, and the yes would be anybody's. So it reaches `main` only by the owner's own
          # merge. Read FIRST, for every author, by pull request number only (no branch name, no
          # checkout); a rename counts by either name. An unreadable file list refuses and disarms,
          # and a push that adds the file to an armed pull request disarms it.
          approvals='infrastructure/migration-approvals.txt'
          if ! touched="$(gh api "repos/$REPO/pulls/$PR/files?per_page=100" --paginate --jq '.[] | .filename, (.previous_filename // empty)')"; then
            echo "::error::#$PR: its file list could not be read, so nobody can say whether it approves a held migration - not armed."
            echo "armable=false" >> "$GITHUB_OUTPUT"
            gh pr merge "$PR" --disable-auto --repo "$REPO" || echo "::error::#$PR: auto-merge could NOT be disabled - check it by hand."
            exit 1
          fi
          if grep -qxF "$approvals" <<<"$touched"; then
            echo "::warning::#$PR changes $approvals - an approval of a held migration is merged by the OWNER's own hand, never armed (docs/wiki/cicd.md)."
            echo "armable=false" >> "$GITHUB_OUTPUT"
            armed_now="$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')" || armed_now=unknown
            if [ "$armed_now" != 'false' ]; then
              if ! gh pr merge "$PR" --disable-auto --repo "$REPO"; then
                echo "::error::#$PR: auto-merge could NOT be disabled - check it by hand."
                exit 1
              fi
              echo "::warning::#$PR: auto-merge is disabled."
            fi
            exit 0
          fi
          # canari-only:end

          # Dependabot is never a collaborator and never will be - it is the whole population this
          # escape hatch exists for, same as before. Kept as a GitHub expression (not `$AUTHOR` in
          # shell) so the exact literal survives for anything that greps this file for it.
          if [ "${{ github.event.pull_request.user.login == 'dependabot[bot]' }}" = 'true' ]; then
            echo "armable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # canari-only:begin
          # THE LOCKFILE REFRESH IS THE ONE PULL REQUEST FROM THE APP THAT IS ARMED (user,
          # 2026-10-18; `cargo-lock-refresh.sh` opens it). The App is never a collaborator that can
          # be asked, and "armed because the App wrote it" would be a hole the size of the
          # repository, so this is a CLOSED allowlist read over the API - this job still checks out
          # nothing, and every string below (branch, messages, file names, patches) is DATA handed
          # to `jq`, never to the shell. ALL must hold:
          #   1. the branch is `deps/lock-refresh/cargo/dependabot-<n>`, and #<n> is a pull request
          #      Dependabot OPENED (its author is the one fact here nobody can set) from a cargo branch;
          #   2. every commit of #<n> has Dependabot's shape: author login and noreply address,
          #      committer `web-flow`, a signature GitHub verified. That proves GitHub created the
          #      commit naming Dependabot - not that Dependabot did, since a WRITER can create such a
          #      commit through the API. Write access is trusted already: a writer can open and arm
          #      a pull request of their own, so this protects the allowlist, not a boundary;
          #   3. this pull request is #<n>'s commits carried one for one - the same message AND the
          #      same patch (every `+`/`-` line of every file, read per commit) - plus ONE commit on
          #      top. Who committed them is NOT what is relied on: an address is not an identity and
          #      the App's commits are unsigned. The CONTENT is what is checked, against #<n>;
          #   4. every file is a `Cargo.toml` or a `Cargo.lock`; the manifest lines are exactly
          #      Dependabot's; every `source` key a lock gains (any spacing, bare or quoted key) has
          #      the crates.io value, git or sparse index; no lock moves or adds a crate of the
          #      Tauri runtime (`tauri`, `tauri-*`, `wry`, `tao`; the `name` key read with any spacing);
          #   5. `CI passed` - not read here: auto-merge hands that to GitHub, as for everybody, and
          #      `dependency-ceiling` refuses a breaking or Tauri-runtime update on this branch there.
          # TIED TO ONE COMMIT: the event's head SHA must be the head the commit list ends on (the
          # file list is read BEFORE it, so both describe that head), and the arming is made HERE
          # with `--match-head-commit`, so GitHub refuses it if the head moved after the reads. The
          # shared step below arms without that binding, so this path never hands it `armable=true`.
          # A REFUSAL DISARMS, AND SO DOES AN UNREADABLE ANSWER: a `synchronize` run that cannot
          # evaluate the new head must not leave the arming made for the old one standing. The
          # disarm is best effort and loud; the run then goes red. Threat model: docs/wiki/cicd.md.
          if [ "$AUTHOR" = 'canari-auto-merge[bot]' ]; then
            set -E
            disarm() {
              if gh pr merge "$PR" --disable-auto --repo "$REPO"; then
                echo "::warning::#$PR: auto-merge is disabled."
              else
                echo "::error::#$PR: auto-merge could NOT be disabled - check it by hand."
                return 1
              fi
            }
            on_error() {
              trap - ERR
              echo "::error::#$PR: the allowlist could not be evaluated (an answer was unreadable); disarming so no earlier arming carries over."
              echo "armable=false" >> "$GITHUB_OUTPUT"
              disarm || true
              exit 1
            }
            trap on_error ERR
            refuse_app() {
              trap - ERR
              echo "#$PR: $1 - not armed."
              echo "armable=false" >> "$GITHUB_OUTPUT"
              armed_now="$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')" || armed_now=unknown
              if [ "$armed_now" != 'false' ]; then
                disarm || exit 1
              fi
              exit 0
            }
            if ! [[ "$HEAD_REF" =~ ^deps/lock-refresh/cargo/dependabot-([1-9][0-9]{0,6})$ ]]; then
              refuse_app "the App's branch is not a lockfile refresh"
            fi
            ORIG="${BASH_REMATCH[1]}"
            if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              refuse_app "the event carries no head commit id"
            fi
            dir="$(mktemp -d)"
            commits='[.[] | {sha, a: .author.login, e: .commit.author.email, c: .committer.login, v: .commit.verification.verified, m: .commit.message}]'
            files='[.[] | {f: .filename, p: (if (.filename | test("(^|/)Cargo\\.(toml|lock)$")) then .patch else null end)}]'
            gh api "repos/$REPO/pulls/$ORIG" --jq '{u: .user.login, r: .head.ref}' > "$dir/orig.json"
            gh api "repos/$REPO/pulls/$ORIG/commits?per_page=100" --jq "$commits" > "$dir/orig-commits.json"
            gh api "repos/$REPO/pulls/$ORIG/files?per_page=100" --jq "$files" > "$dir/orig-files.json"
            # Files BEFORE commits: if the commit list still ends on the event's head, the file list
            # read before it described that head too.
            gh api "repos/$REPO/pulls/$PR/files?per_page=100" --jq "$files" > "$dir/files.json"
            gh api "repos/$REPO/pulls/$PR/commits?per_page=100" --jq "$commits" > "$dir/commits.json"
            # Every commit's own patch, so a carried commit is compared by CONTENT with the one it
            # claims to carry. Bounded, because each is one call.
            for which in orig-commits commits; do
              count="$(jq length "$dir/$which.json")"
              if [ "$count" -lt 1 ] || [ "$count" -gt 20 ]; then
                refuse_app "a commit list is empty or longer than this check reads"
              fi
              : > "$dir/$which-patches.json"
              while IFS= read -r sha; do
                if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
                  refuse_app "a commit id is not a commit id"
                fi
                gh api "repos/$REPO/commits/$sha" --jq '[.files[] | {f: .filename, p: .patch}]' >> "$dir/$which-patches.json"
              done < <(jq -r '.[].sha' "$dir/$which.json")
            done
            verdict="$(jq -nr --arg head "$HEAD_SHA" \
              --slurpfile orig "$dir/orig.json" --slurpfile oc "$dir/orig-commits.json" --slurpfile mc "$dir/commits.json" \
              --slurpfile of "$dir/orig-files.json" --slurpfile mf "$dir/files.json" \
              --slurpfile op "$dir/orig-commits-patches.json" --slurpfile mp "$dir/commits-patches.json" '
              def signed_dependabot: .a == "dependabot[bot]" and .e == "49699333+dependabot[bot]@users.noreply.github.com"
                and .c == "web-flow" and .v == true;
              def app: "canari-auto-merge[bot]";
              def changed: [(.p // "") | split("\n")[] | select(test("^[-+]"))];
              def lines: map({f, d: changed}) | sort_by(.f);
              def unreadable: any(.[]; .p == null);
              def manifests: [.[] | select(.f | test("(^|/)Cargo\\.toml$"))];
              def locks: [.[] | select(.f | test("(^|/)Cargo\\.lock$"))];
              # A TOML key is read with ANY spacing and bare or quoted (`source=`, ` source = `,
              # `"source" =`): a check keyed on the spelling Cargo writes is one a hand-written lock
              # walks past. (No apostrophe in this program: it is one single-quoted shell word.)
              def key($k): "^[ +-]\\s*[\"\\x27]?" + $k + "[\"\\x27]?\\s*=";
              def value: capture("=\\s*(?<v>.*?)\\s*$").v;
              def crates_io: . == "\"registry+https://github.com/rust-lang/crates.io-index\""
                or . == "\"sparse+https://index.crates.io/\"";
              def foreign_source: [.[] | changed[] | select(startswith("+") and test(key("source")))] | any(value | crates_io | not);
              def runtime: test("^(tauri|tauri-.+|wry|tao)$");
              def runtime_moved: any(.[]; reduce ((.p // "") | split("\n")[]) as $l ({n: null, hit: false};
                if ($l | startswith("@@")) then .n = null
                elif ($l | test(key("name"))) then .n = ($l | value | gsub("^[\"\\x27]|[\"\\x27]$"; ""))
                  | (if ($l | startswith("+")) and (.n | runtime) then .hit = true else . end)
                elif ($l | test(key("version"))) and ($l | test("^[+-]")) and (.n != null) and (.n | runtime) then .hit = true
                else . end) | .hit);
              $orig[0] as $o | $oc[0] as $oc | $mc[0] as $mc | $of[0] as $of | $mf[0] as $mf |
              ($oc | length) as $n |
              if ($o.u != "dependabot[bot]") or ($o.r | startswith("dependabot/cargo/") | not) then "its original is not a Dependabot cargo pull request"
              elif ($mf | length) == 0 or ($mf | length) >= 100 or ($of | length) >= 100 then "a file list is empty or longer than one page"
              elif ($oc | all(signed_dependabot) | not) then "a commit of the original does not have the shape of a signed Dependabot commit"
              elif ($mc[-1].sha != $head) then "its head moved since this event (the run for the new head decides)"
              elif ($mc | length) != $n + 1 or ($op | length) != $n or ($mp | length) != $n + 1 then "it is not the original commits plus one"
              elif ([$mc[:-1][] | .m] != [$oc[] | .m]) then "its carried commits do not carry the original messages"
              elif any($op[], $mp[:-1][]; unreadable) then "a carried commit has a patch the API will not show"
              elif ([$mp[:-1][] | lines] != [$op[] | lines]) then "its carried commits are not the original commits, patch for patch"
              elif ($mc[:-1] | all(.a == "dependabot[bot]" and .c == app) | not) or ($mc[-1] | .a == app and .c == app | not) then "its commits are not shaped as the App carrying Dependabot plus one of its own"
              elif ($mf | all(.f | test("(^|/)Cargo\\.(toml|lock)$")) | not) then "it changes a file that is not a Cargo.toml or a Cargo.lock"
              elif ($mf | unreadable) or ($of | manifests | unreadable) then "a manifest or lockfile diff is too large for the API to show"
              elif ($mf | manifests | lines) != ($of | manifests | lines) then "its manifest change is not the one Dependabot signed"
              elif ($mf | locks | foreign_source) then "a lockfile gains a source that is not crates.io"
              elif ($mf | locks | runtime_moved) then "a lockfile moves or adds a crate of the Tauri runtime"
              else "ok" end')"
            if [ "$verdict" != 'ok' ]; then
              refuse_app "$verdict"
            fi
            trap - ERR
            echo "#$PR completes Dependabot's #$ORIG and changes nothing else - arming it on $HEAD_SHA only."
            # The shared step below would arm without the head binding; this path arms itself.
            echo "armable=false" >> "$GITHUB_OUTPUT"
            if gh pr merge "$PR" --auto --squash --match-head-commit "$HEAD_SHA" --repo "$REPO"; then
              echo "Auto-merge armed on $HEAD_SHA. GitHub will squash-merge #$PR when CI passed goes green."
              exit 0
            fi
            # Already armed is the ordinary `synchronize` case; a head that moved is refused by GitHub
            # and the run for the new head decides. Anything else is loud.
            armed_now="$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')" || armed_now=unknown
            if [ "$armed_now" = 'true' ]; then
              echo "Auto-merge was already armed on #$PR, and this run's evaluation of $HEAD_SHA holds."
              exit 0
            fi
            echo "::error::#$PR: could not arm auto-merge on $HEAD_SHA (the head moved, or the App lacks Pull requests write)."
            exit 1
          fi
          # canari-only:end

          permission="$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq '.permission')"
          case "$permission" in
            admin | maintain | write)
              echo "armable=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "$AUTHOR has '$permission' access to $REPO - not armed."
              echo "armable=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Ask GitHub to merge it when the checks pass
        if: steps.authz.outputs.armable == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # `--squash` EXPLICITLY, because the repository permits all three methods - the merge
          # method is decided here rather than by whatever the settings happen to allow, which is
          # why the history is uniform.
          #
          # THERE IS NO `--delete-branch`, AND THAT IS THE FIX RATHER THAN AN OMISSION. It was
          # passed until 2026-09-03 and did nothing at all: `gh` performs the deletion itself after
          # a merge IT made, and `--auto` makes no merge - it arms and exits. #329 and #330 both
          # left their branches behind while the flag sat in this command appearing to remove them,
          # which is the shape of a mechanism believed because it is written down. What deletes the
          # branch is the repository's own `delete_branch_on_merge`, and `--auto` needs
          # `allow_auto_merge` before any of this works at all - both are repository settings, both
          # are invisible in this tree, and both are inventoried in `infrastructure/MIGRATION.md`
          # section 3bis alongside the ruleset.
          if gh pr merge "$PR" --auto --squash --repo "$REPO"; then
            echo "Auto-merge armed. GitHub will squash-merge #$PR as soon as CI passed goes green."
            exit 0
          fi

          # ALREADY ARMED IS NOT A FAILURE, and it is the ordinary case on `synchronize`: every push
          # to the branch re-runs this, and GitHub refuses to arm what is already armed. Anything
          # else is a real problem and must fail loudly - the App uninstalled, its Pull requests
          # write permission revoked, auto-merge disabled on the repository - because the silent
          # version of that is a pull request that simply never merges and nobody looking.
          state="$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [ "$state" = 'true' ]; then
            echo "Auto-merge was already armed on #$PR; nothing to do."
            exit 0
          fi
          echo "::error::Could not arm auto-merge on #$PR, and it is not armed. Check that the"
          echo "::error::canari-auto-merge App is installed with Pull requests write, and that"
          echo "::error::auto-merge is still allowed on the repository."
          exit 1
