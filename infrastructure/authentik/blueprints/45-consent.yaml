# The terms of use (CGU): one tick of ACCEPTANCE, asked once per version, before ANY application receives the person.
# The legal basis of the processing is the performance of the service (the account), not this tick: the tick proves
# the person was informed of the terms and of the list of data (decided by the user, 2026-10-16).
#
# Applied by infrastructure/authentik/apply-blueprints.py, never by the worker's own discovery
# (instantiate: false) - see infrastructure/authentik/README.md. Every reference is a !Find on a
# NATURAL key (slug, name, managed id), never a primary key, so the same file builds any instance.
#
# WHY THE AUTHORIZATION FLOW, and not the enrolment flow: a provider (Canari, Sky, MiGallery, Le
# Cercle, the archives...) that names this flow asks for the terms whichever source signed the person
# in - the CAS and the Alumni source alike - for the accounts that already exist (enrolment runs once,
# at the first sign-in) and for every future version of the text.
#
# WHICH PROVIDERS NAME IT IS DECLARED IN 50-providers.yaml, one `authorization_flow` per provider, and
# nowhere else (2026-11-18). This file only BUILDS the flow; a flow no provider names is inert. Since
# the hold of 2026-10-17 was lifted (2026-11-20) every provider names it, production's included
# (docs/wiki/infrastructure/authentik.md#the-terms-of-use-are-a-stage-of-the-authorization-flow-2026-10-16).
# The answer is stored on the
# account: `cgu_version` (which text) and `cgu_accepted_at` (when). THE VERSION IS WRITTEN IN TWO
# PLACES BELOW, the policy and the hidden prompt - change both, or the stage re-asks forever.
# check-consent-version.sh (run by test-blueprints.sh in CI) fails while they, the page's `updated`
# date, the test's VERSION and core-service's CONSENT_VERSION (the handoff mint's gate) disagree.
# EVERY BINDING ON THIS FLOW IS ON AN ALLOWLIST OF core-service's handoff gate
# (miconnect-reader.client.ts CONSENT_FLOW_ALLOWLIST): it recognises exactly them, by policy and
# stage names - the two terms bindings, answered from the person's `cgu_version`, and the two Alumni
# link-step bindings, answered from the rule both sides run (libs/contracts/alumni-access.json).
# Rename a stage or a policy, or bind anything else here, and the handoff to Sky, MiGallery and
# Le Cercle is refused `policy_bound` until the gate follows.
version: 1
metadata:
  name: miconnect-consent
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  - model: authentik_flows.flow
    identifiers:
      slug: "miconnect-authorization"
    attrs:
      name: "miconnect-authorization"
      title: "Conditions d'utilisation de MiConnect"
      designation: "authorization"
      authentication: "require_authenticated"
      # No per-application consent screen (the terms stages below are the only ones); a denial shows the message and continues.
      denied_action: "message_continue"
  - model: authentik_stages_prompt.prompt
    identifiers:
      name: "miconnect-consent-prompt-notice"
    attrs:
      field_key: "cgu_notice"
      label: "Information"
      type: "static"
      order: 1
      initial_value: "<p>MiConnect te connecte aux services des associations de l'École avec ton compte du CAS ou des Alumni. Pour cela, nous enregistrons ton <strong>nom</strong>, ton <strong>prénom</strong>, ton identifiant, ton campus, ta ou tes formations, ton année d'entrée et tes appartenances, et nous les transmettons aux services auxquels tu te connectes (Canari, Sky, MiGallery, Le Cercle, le wiki Mino, les archives). C'est nécessaire pour te reconnaître : sans cela, la connexion est impossible.</p><p>Si tu te connectes avec ton compte Alumni, nous enregistrons aussi si tu es <strong>cotisant</strong> de l'association des Alumni, avec la date de cette lecture, et, si ton compte MiConnect a été créé par les Alumni, ton <strong>adresse e-mail</strong>. Ils ne sont transmis à aucun service : MiConnect s'en sert seul, pour ouvrir MiGallery et Le Cercle aux cotisants après tes cinq premières années.</p><p><a href=\"https://canari.emse.fr/legal/miconnect\" target=\"_blank\" rel=\"noopener\">Lire les conditions d'utilisation et la politique de données</a></p>"
  - model: authentik_stages_prompt.prompt
    identifiers:
      name: "miconnect-consent-prompt-accept"
    attrs:
      field_key: "cgu_accept"
      label: "J'ai lu les conditions d'utilisation de MiConnect, qui décrivent les données enregistrées à ma connexion, et je les accepte."
      type: "checkbox"
      order: 2
      required: true
  - model: authentik_stages_prompt.prompt
    identifiers:
      name: "miconnect-consent-prompt-version"
    attrs:
      field_key: "attributes.cgu_version"
      label: "Version des conditions"
      type: "hidden"
      order: 3
      initial_value: "2026-11-24"
  - model: authentik_stages_prompt.prompt
    identifiers:
      name: "miconnect-consent-prompt-date"
    attrs:
      field_key: "attributes.cgu_accepted_at"
      label: "Date d'acceptation"
      type: "hidden"
      order: 4
      # A HIDDEN field submits its INITIAL value, evaluated when the POST is validated - the moment
      # of acceptance. A placeholder is never evaluated for the write: with only a placeholder
      # expression, the account received the expression's SOURCE TEXT (driven 2026-10-16 by
      # test-consent-flow.py).
      placeholder: ""
      placeholder_expression: false
      initial_value: "from datetime import datetime, timezone\nreturn datetime.now(timezone.utc).isoformat()"
      initial_value_expression: true
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: "miconnect-consent-needed"
    attrs:
      execution_logging: false
      # True = the stage is shown. The literal is THE CURRENT VERSION (see the header).
      # NEVER IN AN IMPERSONATED SESSION: there request.user is the person impersonated, so the
      # administrator would be shown the terms and their tick written on THAT person's account
      # (driven 2026-10-16 by test-consent-flow.py). Only the person may accept.
      expression: |-
        session = request.http_request.session if request.http_request else {}
        if "authentik/impersonate/user" in session:
            ak_logger.info("miconnect-consent: impersonated session, terms neither shown nor written")
            return False
        return request.user.attributes.get("cgu_version") != "2026-11-24"
  # THE TICK IS CHECKED HERE, because `required` on a checkbox is not: authentik builds a checkbox as
  # a BooleanField with required=False, so `required: true` above only reaches the browser's form,
  # and a POST without the tick was ACCEPTED and written (driven 2026-10-16 by test-consent-flow.py).
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: "miconnect-consent-validate-accept"
    attrs:
      execution_logging: false
      expression: |-
        if request.context.get("prompt_data", {}).get("cgu_accept") is True:
            return True
        ak_message("Coche la case pour accepter les conditions d'utilisation : sans elles, MiConnect ne peut pas te connecter.")
        return False
  - model: authentik_stages_prompt.promptstage
    identifiers:
      name: "miconnect-consent-ask"
    attrs:
      validation_policies:
        - !Find [authentik_policies_expression.expressionpolicy, [name, "miconnect-consent-validate-accept"]]
      fields:
        - !Find [authentik_stages_prompt.prompt, [name, "miconnect-consent-prompt-notice"]]
        - !Find [authentik_stages_prompt.prompt, [name, "miconnect-consent-prompt-accept"]]
        - !Find [authentik_stages_prompt.prompt, [name, "miconnect-consent-prompt-version"]]
        - !Find [authentik_stages_prompt.prompt, [name, "miconnect-consent-prompt-date"]]
  - model: authentik_stages_user_write.userwritestage
    identifiers:
      name: "miconnect-consent-write"
    attrs:
      user_creation_mode: "never_create"
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, "miconnect-authorization"]]
      stage: !Find [authentik_stages_prompt.promptstage, [name, "miconnect-consent-ask"]]
      order: 10
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_policies.policybindingmodel, [flowstagebinding__target__slug, "miconnect-authorization"], [flowstagebinding__stage__name, "miconnect-consent-ask"], [flowstagebinding__order, 10]]
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, "miconnect-consent-needed"]]
      order: 0
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, "miconnect-authorization"]]
      stage: !Find [authentik_stages_user_write.userwritestage, [name, "miconnect-consent-write"]]
      order: 20
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_policies.policybindingmodel, [flowstagebinding__target__slug, "miconnect-authorization"], [flowstagebinding__stage__name, "miconnect-consent-write"], [flowstagebinding__order, 20]]
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, "miconnect-consent-needed"]]
      order: 0
  # THE ALUMNI LINK STEP (D44, owner 2026-11-23). For a person whose earliest cursus has entry year P
  # and whose account holds no Alumni link: a skippable reminder from 1 September P+1, a BLOCKING
  # page from 1 February P+2 - or from 2027-02-01 if that is later, which is the grace for the promos
  # already past their date when the step shipped (one `max`, so no launch date is written anywhere).
  # Every student has an Alumnforce account from entry, so the blocking page has no "not yet" exit.
  # The reminder shows ONCE PER MiConnect SESSION (owner, 2026-11-24): the first authorization of a
  # session meets it, the next ones of that session do not - a marker in the session, keyed by the
  # account, set when the stage is due (and in that authorization's plan, which keeps its own reminder
  # due through its "Continuer"). The blocking page shows at EVERY authorization.
  #
  # WHY HERE: this flow is the one EVERY application sign-in passes, signed in (a provider plans it
  # at each authorization, whichever source the session came from). Being signed in is what makes
  # the link possible at all: authentik links an Alumni identity to the account of the session that
  # reaches the source. In the CAS source's own flow the page would sit after the login, where a
  # person refusing the block is already signed in and walks past it at the next authorization.
  #
  # THE LINK COMES BACK TO THE APPLICATION (2026-11-25, miconnect-sign-in-paths.md). The page's link
  # is the link flow of 30-sources.yaml with THIS authorization as `next`, and the policy that shows
  # the page writes the OFFER (`miconnect/alumni-link-offered` = the account's pk and a nonce the
  # page's link carries, used once) the link flow honours: no D49 confirmation (D49 is "every link outside the D44 step"), Alumnforce, the link,
  # then authentik restores the done flow from the session's flow token and the authorization runs
  # again - signed in, linked, so this step no longer shows and the application gets its code. No
  # Enterprise Source stage: authentik's own `handle_existing_link` resumes a session flow token.
  # Under the reminder, "Continuer" goes on without linking.
  #
  # THE SIGN-IN HANDOFF ANSWERS THESE TWO BINDINGS ITSELF (lead, 2026-11-23): core-service's gate
  # allowlists them by policy and stage names; the reminder never stops a mint (it is skippable),
  # the block refuses `alumni_link_required` when it would hold, and Canari then opens the site
  # through its MiConnect sign-in, which shows the person this page. The dates are ONE rule run by
  # both sides: change a constant here and in libs/contracts/alumni-access.json together, or
  # test-consent-flow.py (which runs that file's cases) fails.
  #
  # "TODAY" IS THE PARIS DATE, unless the plan context carries a `date` under `miconnect_today`:
  # nothing a person sends can put a date object there, and test-consent-flow.py drives every
  # boundary through it instead of a wall clock. NEVER IN AN IMPERSONATED SESSION, for the reason the
  # terms are not. Driven by test-consent-flow.py.
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: "miconnect-alumni-link-reminder"
    attrs:
      execution_logging: false
      expression: |-
        from datetime import date, datetime
        from uuid import uuid4
        from zoneinfo import ZoneInfo
        from authentik.core.models import UserSourceConnection

        REMINDED = "miconnect/alumni-link-reminded"
        OFFERED = "miconnect/alumni-link-offered"

        session = request.http_request.session if request.http_request else {}
        if "authentik/impersonate/user" in session:
            return False
        user = request.user
        today = context.get("miconnect_today")
        if not isinstance(today, date):
            today = datetime.now(ZoneInfo("Europe/Paris")).date()
        profile = user.attributes.get("profile")
        cursus = profile.get("cursus") if isinstance(profile, dict) else None
        # An entry year is an int that is not a bool (True is an int in Python), in an entry that is
        # an object: anything else is ignored, as core-service ignores it (libs/contracts cases).
        promos = [c["promo"] for c in (cursus if isinstance(cursus, list) else []) if isinstance(c, dict) and type(c.get("promo")) is int]
        if not promos or UserSourceConnection.objects.filter(user=user, source__slug="alumni").exists():
            return False
        first = min(promos)
        if not date(first + 1, 9, 1) <= today < max(date(first + 2, 2, 1), date(2027, 2, 1)):
            return False
        # ONCE PER MiConnect SESSION (owner, 2026-11-24): the reminder is shown at the first
        # authorization of a session and not at the next ones. The marker is the session's own, keyed
        # by the account (a sign-in as someone else in the same browser is reminded), set at the
        # moment the stage is due - no clock, nothing written on the account. The executor re-evaluates
        # this binding at EVERY request of the stage (its "Continuer" POST included), so the plan that
        # set the marker carries it too and keeps its own reminder due to its end.
        plan = context.get("flow_plan")
        if plan is not None and plan.context.get(REMINDED) == user.pk:
            return True
        if session.get(REMINDED) == user.pk:
            return False
        if request.http_request is not None:
            session[REMINDED] = user.pk
            # The OFFER the link flow honours (30-sources.yaml): MiConnect proposes the link to THIS
            # account, so the D49 confirmation is not shown and the link resumes this sign-in. It is
            # a NONCE the page's link carries: the offer outlives the page (after "Continuer"), and
            # only the link MiConnect showed may use it, once - a visit without it meets D49.
            offer = session.get(OFFERED)
            if not (isinstance(offer, dict) and offer.get("pk") == user.pk and offer.get("nonce")):
                session[OFFERED] = {"pk": user.pk, "nonce": uuid4().hex}
            if plan is not None:
                plan.context[REMINDED] = user.pk
        return True
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: "miconnect-alumni-link-required"
    attrs:
      execution_logging: false
      expression: |-
        from datetime import date, datetime
        from uuid import uuid4
        from zoneinfo import ZoneInfo
        from authentik.core.models import UserSourceConnection

        session = request.http_request.session if request.http_request else {}
        if "authentik/impersonate/user" in session:
            return False
        user = request.user
        today = context.get("miconnect_today")
        if not isinstance(today, date):
            today = datetime.now(ZoneInfo("Europe/Paris")).date()
        profile = user.attributes.get("profile")
        cursus = profile.get("cursus") if isinstance(profile, dict) else None
        # An entry year is an int that is not a bool (True is an int in Python), in an entry that is
        # an object: anything else is ignored, as core-service ignores it (libs/contracts cases).
        promos = [c["promo"] for c in (cursus if isinstance(cursus, list) else []) if isinstance(c, dict) and type(c.get("promo")) is int]
        if not promos or UserSourceConnection.objects.filter(user=user, source__slug="alumni").exists():
            return False
        first = min(promos)
        due = today >= max(date(first + 2, 2, 1), date(2027, 2, 1))
        if due and request.http_request is not None:
            # The OFFER the link flow honours (30-sources.yaml), a nonce the page's link carries, as
            # the reminder's: kept while it is this account's, so every rendering shows the same one.
            offer = session.get("miconnect/alumni-link-offered")
            if not (isinstance(offer, dict) and offer.get("pk") == user.pk and offer.get("nonce")):
                session["miconnect/alumni-link-offered"] = {"pk": user.pk, "nonce": uuid4().hex}
        return due
  # The blocking page cannot be submitted until the link exists (a person who linked in another tab
  # goes on from here).
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: "miconnect-alumni-link-validate-linked"
    attrs:
      execution_logging: false
      expression: |-
        from authentik.core.models import UserSourceConnection

        if UserSourceConnection.objects.filter(user=request.user, source__slug="alumni").exists():
            return True
        ak_message("Lie d'abord ton compte Alumni avec le lien ci-dessus.")
        return False
  - model: authentik_stages_prompt.prompt
    identifiers:
      name: "miconnect-alumni-link-prompt-reminder"
    attrs:
      field_key: "alumni_link_reminder"
      label: "Ton compte Alumni"
      type: "static"
      order: 1
      initial_value_expression: true
      initial_value: |-
        from html import escape
        from urllib.parse import urlencode

        # The link goes through the link flow with THIS authorization as `next` (30-sources.yaml), so
        # the person lands on the application once linked. The authorization's query is what the
        # flow executor stored in the session for this flow (the authorize view's parameters).
        query = http_request.session.get("authentik/flows/get") if http_request is not None else None
        # The OFFER's nonce (the policy showing this page wrote it): without it the link flow shows D49.
        offer = http_request.session.get("miconnect/alumni-link-offered") if http_request is not None else None
        params = {}
        if isinstance(offer, dict) and offer.get("pk") == getattr(user, "pk", None) and offer.get("nonce"):
            params["offer"] = offer["nonce"]
        else:
            ak_logger.warning("miconnect-alumni-link: the page shows with no offer for this account, its link will meet the D49 confirmation")
        if query is not None and query.get("client_id"):
            params["next"] = "/application/o/authorize/?" + query.urlencode()
        else:
            ak_logger.warning("miconnect-alumni-link: an authorization with no client_id, the link will not come back to an application")
        link = "/if/flow/miconnect-alumni-link/" + ("?" + urlencode(params) if params else "")
        return f"<p>Ton compte MiConnect n'est pas encore lié à ton compte <strong>Alumni</strong> (le réseau des anciens des Mines de Saint-Étienne, où tu as un compte depuis ton entrée à l'École). Lie-le maintenant : quand ton compte de l'École disparaîtra, à la fin de tes études, c'est lui qui te connectera, avec le même profil.</p><p><a href=\"{escape(link)}\">Lier mon compte Alumni</a> (tu reviens ensuite directement au service)</p><p>Le lien sera obligatoire au milieu de ta deuxième année. Pour l'instant, tu peux continuer sans.</p>"
  - model: authentik_stages_prompt.prompt
    identifiers:
      name: "miconnect-alumni-link-prompt-required"
    attrs:
      field_key: "alumni_link_required"
      label: "Ton compte Alumni"
      type: "static"
      order: 1
      initial_value_expression: true
      initial_value: |-
        from html import escape
        from urllib.parse import urlencode

        # As the reminder's link: through the link flow, back to THIS authorization once linked.
        query = http_request.session.get("authentik/flows/get") if http_request is not None else None
        # The OFFER's nonce (the policy showing this page wrote it): without it the link flow shows D49.
        offer = http_request.session.get("miconnect/alumni-link-offered") if http_request is not None else None
        params = {}
        if isinstance(offer, dict) and offer.get("pk") == getattr(user, "pk", None) and offer.get("nonce"):
            params["offer"] = offer["nonce"]
        else:
            ak_logger.warning("miconnect-alumni-link: the page shows with no offer for this account, its link will meet the D49 confirmation")
        if query is not None and query.get("client_id"):
            params["next"] = "/application/o/authorize/?" + query.urlencode()
        else:
            ak_logger.warning("miconnect-alumni-link: an authorization with no client_id, the link will not come back to an application")
        link = "/if/flow/miconnect-alumni-link/" + ("?" + urlencode(params) if params else "")
        return f"<p>Pour continuer, lie ton compte MiConnect à ton compte <strong>Alumni</strong> (le réseau des anciens des Mines de Saint-Étienne, où tu as un compte depuis ton entrée à l'École). Quand ton compte de l'École disparaîtra, c'est lui qui te connectera, avec le même profil.</p><p><a href=\"{escape(link)}\">Lier mon compte Alumni</a></p><p>Une fois le lien fait, tu arrives directement sur le service.</p>"
  - model: authentik_stages_prompt.promptstage
    identifiers:
      name: "miconnect-alumni-link-remind"
    attrs:
      fields:
        - !Find [authentik_stages_prompt.prompt, [name, "miconnect-alumni-link-prompt-reminder"]]
  - model: authentik_stages_prompt.promptstage
    identifiers:
      name: "miconnect-alumni-link-require"
    attrs:
      fields:
        - !Find [authentik_stages_prompt.prompt, [name, "miconnect-alumni-link-prompt-required"]]
      validation_policies:
        - !Find [authentik_policies_expression.expressionpolicy, [name, "miconnect-alumni-link-validate-linked"]]
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, "miconnect-authorization"]]
      stage: !Find [authentik_stages_prompt.promptstage, [name, "miconnect-alumni-link-remind"]]
      order: 30
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_policies.policybindingmodel, [flowstagebinding__target__slug, "miconnect-authorization"], [flowstagebinding__stage__name, "miconnect-alumni-link-remind"], [flowstagebinding__order, 30]]
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, "miconnect-alumni-link-reminder"]]
      order: 0
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, "miconnect-authorization"]]
      stage: !Find [authentik_stages_prompt.promptstage, [name, "miconnect-alumni-link-require"]]
      order: 40
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_policies.policybindingmodel, [flowstagebinding__target__slug, "miconnect-authorization"], [flowstagebinding__stage__name, "miconnect-alumni-link-require"], [flowstagebinding__order, 40]]
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, "miconnect-alumni-link-required"]]
      order: 0
