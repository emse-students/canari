# The account Canari writes a person's profile through (WP4 of the profile reform,
# docs/wiki/profiles-and-access.md, decision D9), and marks an Alumni duplicate through (D47, D48): a
# SERVICE ACCOUNT that may view and change users and read their source connections, and do nothing
# else, and its API token.
#
# Applied by infrastructure/authentik/apply-blueprints.py, never by the worker's own discovery
# (instantiate: false) - see infrastructure/authentik/README.md.
#
# WHY A ROLE AND A GROUP. authentik grants a global permission to a ROLE, and a role reaches a user
# only through a group. The role carries exactly:
#   - `view_user`, `change_user`: read a user by uuid and PATCH its attributes - the profile (WP4),
#     and the merge MARK an admin's "Rattacher" writes on a duplicate (`attributes.alumni_merge_into`
#     and who marked it, when; D48);
#   - `view_usersourceconnection`: list which sources a user is linked to, which is how the merge
#     checks the duplicate holds the Alumni link alone and the target none, and how the admin's
#     duplicates list is made.
# NOT `delete_user`. The merge itself - the Alumni link moved onto the marked account, the duplicate
# deleted, in one transaction - is done by authentik at the duplicate's next Alumni sign-in, after
# re-checking the mark against what the Alumni SSO asserts at that sign-in (30-sources.yaml,
# `miconnect-alumni-merge-or-refuse`). `change_user` is a GLOBAL permission, broader than the profile
# corrections and merge marks it is held for; narrowing it is planned
# (docs/wiki/backlog.d/the-miconnect-editor-token-reach.md). The applier revokes any
# permission a role holds beyond this list (apply-blueprints.py), so an instance that once granted
# `delete_user` loses it at the next apply.
# Not enough to create or delete an account, add, change or delete a source connection, touch a
# source, a flow, a provider or another role. It is deliberately NOT a superuser group.
# test-profile-editor.py proves each of these by USING the token.
#
# THE TOKEN KEY IS `!Env`, never written here: the file is public. It is read from the worker's
# environment (`MICONNECT_EDITOR_TOKEN`, declared with `:?` in compose.yml), and the same value is the
# GitHub secret of that name that production's core-service reads. The applier refuses a missing
# value before it commits, so a release cannot blank the token.
version: 1
metadata:
  name: miconnect-profile-editor
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  - model: authentik_rbac.role
    identifiers:
      name: "miconnect-profile-editor"
    attrs:
      permissions:
        - authentik_core.view_user
        - authentik_core.change_user
        - authentik_core.view_usersourceconnection
  - model: authentik_core.group
    identifiers:
      name: "miconnect-profile-editors"
    attrs:
      is_superuser: false
      roles:
        - !Find [authentik_rbac.role, [name, "miconnect-profile-editor"]]
  - model: authentik_core.user
    identifiers:
      username: "miconnect-canari-editor"
    attrs:
      name: "Canari - profile editor"
      type: "service_account"
      is_active: true
      path: "goauthentik.io/service-accounts"
      groups:
        - !Find [authentik_core.group, [name, "miconnect-profile-editors"]]
  - model: authentik_core.token
    identifiers:
      identifier: "miconnect-canari-editor"
    attrs:
      user: !Find [authentik_core.user, [username, "miconnect-canari-editor"]]
      intent: "api"
      expiring: false
      description: "Canari core-service - writes attributes.profile (WP4), merges Alumni duplicates (D48)"
      key: !Env MICONNECT_EDITOR_TOKEN
