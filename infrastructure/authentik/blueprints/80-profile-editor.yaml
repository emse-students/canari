# The account Canari writes a person's profile through (WP4 of the profile reform,
# docs/wiki/profiles-and-access.md, decision D9), and marks an Alumni duplicate through (D47, D48): a
# SERVICE ACCOUNT that may READ users and their source connections, and WRITE through one flow only.
#
# Applied by infrastructure/authentik/apply-blueprints.py, never by the worker's own discovery
# (instantiate: false) - see infrastructure/authentik/README.md.
#
# WHY A ROLE AND A GROUP. authentik grants a global permission to a ROLE, and a role reaches a user
# only through a group. The role carries exactly:
#   - `view_user`: read a user by uuid (its profile, a duplicate's mark), list users by search;
#   - `view_usersourceconnection`: list which sources a user is linked to, which is how the merge
#     checks the duplicate holds the Alumni link alone and the target none, and how the admin's
#     duplicates list is made.
# NOT `change_user` (dropped 2026-11-25, docs/wiki/backlog.d/the-miconnect-editor-token-reach.md):
# that permission is global and lets its holder change any field of any account, far beyond the
# profile corrections and merge marks it was held for. NOT `delete_user`: the merge itself - the
# Alumni link moved onto the marked account, the duplicate deleted, in one transaction - is done by
# authentik at the duplicate's next Alumni sign-in (30-sources.yaml, `miconnect-alumni-merge-or-refuse`).
# The applier revokes any permission a role holds beyond this list (apply-blueprints.py), so an
# instance that once granted `change_user` or `delete_user` loses it at the next apply.
#
# THE ONE WRITE PATH: the flow `miconnect-profile-write`, below. core-service POSTs one prompt to the
# flow executor with the token (`target` = the account's uuid, `changes` = a JSON object), and the
# prompt's validation policy writes it, under the target's row lock, if and only if:
#   - the caller is the editor account (the flow's group binding, and the policy again);
#   - `changes` names only `name` and `attributes`, and `attributes` only `profile` (an object) and the
#     three merge-mark keys (a string, or null to remove the key) - the ALLOWLIST;
#   - the target is exactly one account, a person (internal or external) and not a superuser (no
#     superuser group on its ancestry);
#   - a merge-mark key is written on an `alumni-` account only (the only accounts a mark is for).
# The keys named are MERGED into the stored attributes server-side, so no other key is ever written
# and no read-modify-write window exists. Anything else is refused with a message, nothing written,
# logged at warning with `[PROFILE_WRITE]`. Every write is logged at info with the keys written.
# test-profile-editor.py proves each of these by USING the token; editor-reach.py checks, on every
# test instance and daily on production, that the account holds nothing beyond this file.
#
# THE TOKEN KEY IS `!Env`, never written here: the file is public. It is read from the worker's
# environment (`MICONNECT_EDITOR_TOKEN`, declared with `:?` in compose.yml), and the same value is the
# GitHub secret of that name that production's core-service reads. The applier refuses a missing
# value before it commits, so a release cannot blank the token.
version: 1
metadata:
  name: miconnect-profile-editor
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  - model: authentik_rbac.role
    identifiers:
      name: "miconnect-profile-editor"
    attrs:
      permissions:
        - authentik_core.view_user
        - authentik_core.view_usersourceconnection
  - model: authentik_core.group
    identifiers:
      name: "miconnect-profile-editors"
    attrs:
      is_superuser: false
      roles:
        - !Find [authentik_rbac.role, [name, "miconnect-profile-editor"]]
  - model: authentik_core.user
    identifiers:
      username: "miconnect-canari-editor"
    attrs:
      name: "Canari - profile editor"
      type: "service_account"
      is_active: true
      path: "goauthentik.io/service-accounts"
      groups:
        - !Find [authentik_core.group, [name, "miconnect-profile-editors"]]
  - model: authentik_core.token
    identifiers:
      identifier: "miconnect-canari-editor"
    attrs:
      user: !Find [authentik_core.user, [username, "miconnect-canari-editor"]]
      intent: "api"
      expiring: false
      description: "Canari core-service - writes attributes.profile (WP4), merges Alumni duplicates (D48)"
      key: !Env MICONNECT_EDITOR_TOKEN
  # THE WRITE PATH. Two text fields, never `hidden`: authentik resets a hidden field to its default.
  - model: authentik_stages_prompt.prompt
    identifiers:
      name: "miconnect-profile-write-prompt-target"
    attrs:
      field_key: "target"
      label: "target"
      type: "text"
      required: true
      order: 0
  - model: authentik_stages_prompt.prompt
    identifiers:
      name: "miconnect-profile-write-prompt-changes"
    attrs:
      field_key: "changes"
      label: "changes"
      type: "text_area"
      required: true
      order: 1
  # A validation policy that WRITES: the check and the write are one transaction under the target's
  # row lock, so nothing can change the account between the decision and the write. It runs in the
  # request's process (a lone policy outside a daemon, as `miconnect-alumni-merge-or-refuse`).
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: "miconnect-profile-write"
    attrs:
      execution_logging: false
      expression: |-
        import json
        import uuid

        from django.db import transaction

        from authentik.core.models import User

        EDITOR = "miconnect-canari-editor"
        MARK = ("alumni_merge_into", "alumni_merge_marked_by", "alumni_merge_marked_at")
        ALLOWED = ("profile",) + MARK

        def refuse(reason):
            ak_logger.warning("[PROFILE_WRITE] refused, nothing written", reason=reason)
            ak_message(f"refused: {reason}")
            return False

        caller = request.user
        if caller is None or caller.username != EDITOR or caller.type != "service_account":
            return refuse("the caller is not the profile editor")
        prompt = request.context.get("prompt_data") or {}
        try:
            target_uuid = uuid.UUID(str(prompt.get("target") or ""))
        except ValueError:
            return refuse("target is not a uuid")
        try:
            changes = json.loads(str(prompt.get("changes") or ""))
        except ValueError:
            return refuse("changes is not JSON")
        if not isinstance(changes, dict) or not changes:
            return refuse("changes is not a non-empty object")
        extra = sorted(set(changes) - {"name", "attributes"})
        if extra:
            return refuse(f"field(s) outside the allowlist: {extra}")
        name = changes.get("name")
        if "name" in changes and (not isinstance(name, str) or not name.strip() or len(name) > 200):
            return refuse("name is not a non-empty string of at most 200 characters")
        attributes = changes.get("attributes", {})
        if not isinstance(attributes, dict):
            return refuse("attributes is not an object")
        extra = sorted(set(attributes) - set(ALLOWED))
        if extra:
            return refuse(f"attribute(s) outside the allowlist: {extra}")
        if "profile" in attributes and not isinstance(attributes["profile"], dict):
            return refuse("attributes.profile is not an object")
        for key in MARK:
            if key in attributes and attributes[key] is not None and not isinstance(attributes[key], str):
                return refuse(f"attributes.{key} is neither a string nor null")
        if "name" not in changes and not attributes:
            return refuse("nothing to write")
        with transaction.atomic():
            targets = list(User.objects.select_for_update().filter(uuid=target_uuid))
            if len(targets) != 1:
                return refuse(f"{len(targets)} account(s) carry the target uuid")
            target = targets[0]
            if target.type not in ("internal", "external"):
                return refuse(f"the target is a {target.type} account")
            if target.is_superuser:
                return refuse("the target is a superuser")
            if any(key in attributes for key in MARK) and not target.username.startswith("alumni-"):
                return refuse("a merge mark is written on an alumni- account only")
            stored = dict(target.attributes or {})
            for key, value in attributes.items():
                if value is None:
                    stored.pop(key, None)
                else:
                    stored[key] = value
            target.attributes = stored
            fields = ["attributes"]
            if "name" in changes:
                target.name = name
                fields.append("name")
            target.save(update_fields=fields)
        ak_logger.info("[PROFILE_WRITE] written", target_pk=target.pk, keys=sorted(attributes), name_written="name" in changes)
        return True
  - model: authentik_stages_prompt.promptstage
    identifiers:
      name: "miconnect-profile-write"
    attrs:
      fields:
        - !Find [authentik_stages_prompt.prompt, [name, "miconnect-profile-write-prompt-target"]]
        - !Find [authentik_stages_prompt.prompt, [name, "miconnect-profile-write-prompt-changes"]]
      validation_policies:
        - !Find [authentik_policies_expression.expressionpolicy, [name, "miconnect-profile-write"]]
  - model: authentik_flows.flow
    identifiers:
      slug: "miconnect-profile-write"
    attrs:
      name: "miconnect-profile-write"
      title: "Canari - profile write"
      designation: "stage_configuration"
      authentication: "require_authenticated"
      # A refusal of the caller is an answer (`ak-stage-access-denied`), never a redirect elsewhere.
      denied_action: "message"
  # Only the editors' group may plan it: anyone else meets the access-denied stage before any prompt.
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_policies.policybindingmodel, [flow__slug, "miconnect-profile-write"]]
      group: !Find [authentik_core.group, [name, "miconnect-profile-editors"]]
      order: 0
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, "miconnect-profile-write"]]
      stage: !Find [authentik_stages_prompt.promptstage, [name, "miconnect-profile-write"]]
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
