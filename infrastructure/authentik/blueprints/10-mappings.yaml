# The claims every provider hands out (scope mappings) and the CAS source's own user mapping.
#
# Applied by infrastructure/authentik/apply-blueprints.py, never by the worker's own discovery
# (instantiate: false) - see infrastructure/authentik/README.md. Every reference is a !Find on a
# NATURAL key (slug, name, managed id), never a primary key, so the same file builds any instance.
version: 1
metadata:
  name: miconnect-mappings
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  # RENAMES (WPA-2, 2026-09-30). Each entry below runs only while the OLD name still exists, and
  # gives the object its new name before the entry that describes it by that name. It finds the
  # object by PK, because authentik merges an entry's identifiers back into its attributes: found
  # by its old name, it would write that old name straight back. So an instance
  # built under the old names is renamed in place, and a fresh one never sees these. They are dead
  # once production has taken them, and are deleted then (docs/wiki/profiles-and-access.md, WPA).
  - model: authentik_providers_oauth2.scopemapping
    conditions:
      - !Find [authentik_providers_oauth2.scopemapping, [name, "First + Last Names"]]
    identifiers:
      pk: !Find [authentik_providers_oauth2.scopemapping, [name, "First + Last Names"]]
    attrs:
      name: "miconnect-claim-name"
  - model: authentik_providers_oauth2.scopemapping
    conditions:
      - !Find [authentik_providers_oauth2.scopemapping, [name, "Formation"]]
    identifiers:
      pk: !Find [authentik_providers_oauth2.scopemapping, [name, "Formation"]]
    attrs:
      name: "miconnect-claim-formation"
  - model: authentik_providers_oauth2.scopemapping
    conditions:
      - !Find [authentik_providers_oauth2.scopemapping, [name, "Personnel de l'école"]]
    identifiers:
      pk: !Find [authentik_providers_oauth2.scopemapping, [name, "Personnel de l'école"]]
    attrs:
      name: "miconnect-claim-school-status"
  - model: authentik_providers_oauth2.scopemapping
    conditions:
      - !Find [authentik_providers_oauth2.scopemapping, [name, "Promotion"]]
    identifiers:
      pk: !Find [authentik_providers_oauth2.scopemapping, [name, "Promotion"]]
    attrs:
      name: "miconnect-claim-promo"
  - model: authentik_providers_oauth2.scopemapping
    conditions:
      - !Find [authentik_providers_oauth2.scopemapping, [name, "avatar"]]
    identifiers:
      pk: !Find [authentik_providers_oauth2.scopemapping, [name, "avatar"]]
    attrs:
      name: "miconnect-claim-avatar"
  - model: authentik_providers_oauth2.scopemapping
    conditions:
      - !Find [authentik_providers_oauth2.scopemapping, [name, "fake-email"]]
    identifiers:
      pk: !Find [authentik_providers_oauth2.scopemapping, [name, "fake-email"]]
    attrs:
      name: "miconnect-claim-email"
  - model: authentik_sources_oauth.oauthsourcepropertymapping
    conditions:
      - !Find [authentik_sources_oauth.oauthsourcepropertymapping, [name, "CAS EMSE"]]
    identifiers:
      pk: !Find [authentik_sources_oauth.oauthsourcepropertymapping, [name, "CAS EMSE"]]
    attrs:
      name: "miconnect-cas-identity"
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: "miconnect-claim-name"
    attrs:
      # The explicit names of the profile (WP1), which ended the capitals heuristic this mapping ran.
      expression: |-
        profile = request.user.attributes.get("profile") or {}
        return {"firstName": profile.get("firstName"), "lastName": profile.get("lastName")}
      scope_name: "name"
      description: "Gives the first and last names"
  # COMPATIBILITY (WP1 -> WP9, docs/wiki/legacy-compatibility.md): `formation` and `promo` are the
  # FIRST cursus of the profile, so every application reading them keeps working untouched.
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: "miconnect-claim-formation"
    attrs:
      expression: |-
        cursus = (request.user.attributes.get("profile") or {}).get("cursus") or []
        return {"formation": cursus[0]["formation"] if cursus else None}
      scope_name: "formation"
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: "miconnect-claim-school-status"
    attrs:
      expression: "return {\"school_status\": request.user.attributes.get(\"school_status\")}"
      scope_name: "school_status"
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: "miconnect-claim-promo"
    attrs:
      expression: |-
        cursus = (request.user.attributes.get("profile") or {}).get("cursus") or []
        return {"promo": cursus[0]["promo"] if cursus else None}
      scope_name: "promo"
      description: "Année d'entrée à l'école"
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: "miconnect-claim-avatar"
    attrs:
      expression: |-
        # The avatar URL MinoWiki receives: a per-person HMAC that MiGallery verifies
        # (src/lib/server/avatar-signature.ts), so no API key travels in claims. The key is the env var
        # MIGALLERY_AVATAR_SIGNING_KEY, the same value as MiGallery's AVATAR_SIGNING_KEY.
        import base64, hashlib, hmac, os
        uid = request.user.uid
        key = os.environ["MIGALLERY_AVATAR_SIGNING_KEY"].encode()
        sig = base64.urlsafe_b64encode(hmac.new(key, uid.encode(), hashlib.sha256).digest()).rstrip(b"=").decode()
        return {"avatar": f"https://gallery.mitv.fr/api/users/{uid}/avatar?sig={sig}"}
      scope_name: "profile"
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: "miconnect-claim-email"
    attrs:
      expression: "return {\"email\": f\"{request.user.username}@canari.emse.fr\"}"
      scope_name: "email"
  # The profile itself (WP1): the campus, every cursus and every post, on every provider.
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: "miconnect-claim-profile"
    attrs:
      expression: |-
        profile = request.user.attributes.get("profile") or {}
        return {"campus": profile.get("campus"), "cursus": profile.get("cursus") or [], "posts": profile.get("posts") or []}
      scope_name: "profile"
      description: "Gives the campus, the cursus and the posts"
  # MinoWiki 3's groups (claim `minoGroups`, scope profile), created by hand in production on
  # 2026-11-13 and copied here from it: the user's `mino-*` groups, then statut-eleve or
  # statut-personnel, promo-YYYY and formation-xxx from the first cursus. The wiki keeps only the
  # names it knows. The accented spellings are VALUES school_status takes, not prose.
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: "miconnect-claim-mino-groups"
    attrs:
      expression: |-
        # MinoWiki 3: the groups sent to the wiki (claim minoGroups). The wiki uses only the names it knows.
        names = [g.name for g in request.user.groups.all()]
        out = [n for n in names if n.startswith("mino-")]
        st = (request.user.attributes.get("school_status") or "").strip().lower()
        if st.startswith(("eleve", "elève", "élève", "éleve")):
            out.append("statut-eleve")
        elif st.startswith("personnel"):
            out.append("statut-personnel")
        cursus = (request.user.attributes.get("profile") or {}).get("cursus") or []
        if cursus:
            if cursus[0].get("promo"):
                out.append("promo-%s" % cursus[0]["promo"])
            if cursus[0].get("formation"):
                out.append("formation-%s" % str(cursus[0]["formation"]).lower())
        return {"minoGroups": out}
      scope_name: "profile"
      description: "MinoWiki 3 : groupes mino-*, statut, promo, formation"
  # The Reseau console's `profile` claims (owner, 2026-11-25), in place of authentik's managed
  # `profile` mapping, which sends the name of EVERY group the person belongs to. The console needs
  # who signed in and that they hold its access group - nothing about their other memberships.
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: "miconnect-claim-reseau-profile"
    attrs:
      expression: |-
        return {
            "name": request.user.name,
            "given_name": request.user.name,
            "preferred_username": request.user.username,
            "groups": ["acces-reseau"] if request.user.groups.filter(name="acces-reseau").exists() else [],
        }
      scope_name: "profile"
      description: "Gives the name, the username and the acces-reseau group only"
  # The account's stable identifier, on Canari's providers only: Canari is the editor of the profile
  # (WP4), and the key it writes back through authentik's API is this uuid, never the `sub`.
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: "miconnect-claim-uuid"
    attrs:
      expression: "return {\"miconnect_uuid\": str(request.user.uuid)}"
      scope_name: "profile"
      description: "Gives the MiConnect account uuid"
  # Whether the account holds the Alumni link (WP8, D44), on Canari's providers only: Canari shows
  # the reminder banner from it. A boolean and nothing else - never the alumni id, never `cotisant`.
  # The name `alumni_linked` is read by core-service; renaming it is a change on both sides.
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: "miconnect-claim-alumni-linked"
    attrs:
      expression: |-
        from authentik.core.models import UserSourceConnection
        return {"alumni_linked": UserSourceConnection.objects.filter(user=request.user, source__slug="alumni").exists()}
      scope_name: "profile"
      description: "Says whether the account is linked to its Alumni account"
  # THE SCHOOL ADDRESS, FOR CANARI'S MAIL CLIENT ONLY (owner, 2026-11-27;
  # docs/wiki/mail-client-transport.md#eligibility). Its OWN scope, `school_mail`, bound to Canari's
  # production and dev providers and no other (50-providers.yaml), so no other site can ask for it:
  # every other provider keeps the synthetic `email` above. It stays out of the id_token
  # (`include_claims_in_id_token: false` on those providers): the client keeps the id_token for the
  # sign-out, and the address must reach it only where it is meant to be kept.
  #
  # Sent ONLY when the address is the CAS's: the account holds the `cas-emse` link AND was created
  # from it (the link's identifier is the account's username - the CAS `sub` the enrolment wrote,
  # identity-sources.md), because only then is `user.email` the address the CAS wrote at enrolment.
  # An account created through the Alumni SSO (`alumni-<af_id>`) carries the address its holder
  # typed at Alumnforce, which may name any mailbox, so it never gets the claim - even once it holds a
  # CAS link too. And only on a domain of libs/contracts/mail-domains.json (keys equal to it:
  # school-mail-claim.test.mjs), as ONE address: exactly one `@`, a local part, no whitespace (the
  # same rule as core-service's `readSchoolMail`). Otherwise the claim is ABSENT, which Canari reads as
  # "not offered". Measured on production 2026-11-27: every `cas-emse` link's identifier equals its
  # account's username (719 of 719), so the rule loses no CAS account.
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: "miconnect-claim-school-mail"
    attrs:
      expression: |-
        from authentik.core.models import UserSourceConnection
        SCHOOL_DOMAINS = ("etu.emse.fr", "emse.fr")
        user = request.user
        cas = UserSourceConnection.objects.filter(user=user, source__slug="cas-emse").first()
        if cas is None or cas.identifier != user.username:
            return {}
        address = (user.email or "").strip().lower()
        if address.count("@") != 1 or any(c.isspace() for c in address):
            return {}
        local, _, domain = address.partition("@")
        if not local or domain not in SCHOOL_DOMAINS:
            return {}
        return {"school_mail": address}
      scope_name: "school_mail"
      description: "Gives the school address of a CAS account, to Canari's mail client"
  - model: authentik_sources_oauth.oauthsourcepropertymapping
    identifiers:
      name: "miconnect-cas-identity"
    attrs:
      expression: |-
        return {
            "username": info.get("sub") or info.get("id") or "inconnu",
            "name": info.get("name") or f"{info.get('given_name', '')} {info.get('family_name', '')}".strip()
        }
