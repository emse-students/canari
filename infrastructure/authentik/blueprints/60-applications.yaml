# The application each provider is attached to, and its launch URL.
#
# Applied by infrastructure/authentik/apply-blueprints.py, never by the worker's own discovery
# (instantiate: false) - see infrastructure/authentik/README.md. Every reference is a !Find on a
# NATURAL key (slug, name, managed id), never a primary key, so the same file builds any instance.
version: 1
metadata:
  name: miconnect-applications
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  - model: authentik_core.application
    identifiers:
      slug: "archives"
    attrs:
      name: "Archives MINO"
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "miconnect-archives"]]
      meta_launch_url: "https://archives.canari-emse.fr"
  - model: authentik_core.application
    identifiers:
      slug: "canari"
    attrs:
      name: "Canari"
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "miconnect-canari"]]
      meta_launch_url: "https://canari.emse.fr"
  - model: authentik_core.application
    identifiers:
      slug: "canari-dev"
    attrs:
      name: "Canari (dev)"
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "miconnect-canari-dev"]]
  - model: authentik_core.application
    identifiers:
      slug: "canari-local"
    attrs:
      name: "Canari Local"
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "miconnect-canari-local"]]
  - model: authentik_core.application
    identifiers:
      slug: "cercle"
    attrs:
      name: "Cercle"
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "miconnect-cercle"]]
      meta_launch_url: "https://cercle.emse.fr"
  - model: authentik_core.application
    identifiers:
      slug: "migallery"
    attrs:
      name: "MiGallery"
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "miconnect-migallery"]]
      meta_launch_url: "https://gallery.mitv.fr/"
  - model: authentik_core.application
    identifiers:
      slug: "mino-wiki"
    attrs:
      name: "MinoWiki"
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "miconnect-mino-wiki"]]
      meta_launch_url: "https://mino.emse.fr"
  # DELETED (2026-09-30) with its provider (50-providers.yaml). Delete this entry once production has taken it.
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: "portail-etu"
  - model: authentik_core.application
    identifiers:
      slug: "sky"
    attrs:
      name: "Sky"
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "miconnect-sky"]]
      meta_launch_url: "https://sky.emse.fr"
