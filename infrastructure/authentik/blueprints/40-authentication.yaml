# Signing in (miconnect-auth, CAS only), its failure page, the password flow the test campaign uses, Canari's sign-out flow and the MINO logout redirect.
#
# Applied by infrastructure/authentik/apply-blueprints.py, never by the worker's own discovery
# (instantiate: false) - see infrastructure/authentik/README.md. Every reference is a !Find on a
# NATURAL key (slug, name, managed id), never a primary key, so the same file builds any instance.
version: 1
metadata:
  name: miconnect-authentication
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  # RENAMES (WPA-2, 2026-09-30). Each entry below runs only while the OLD name still exists, and
  # gives the object its new name before the entry that describes it by that name. It finds the
  # object by PK, because authentik merges an entry's identifiers back into its attributes: found
  # by its old name, it would write that old name straight back. So an instance
  # built under the old names is renamed in place, and a fresh one never sees these. They are dead
  # once production has taken them, and are deleted then (docs/wiki/profiles-and-access.md, WPA).
  - model: authentik_flows.flow
    conditions:
      - !Find [authentik_flows.flow, [slug, "mino-provider-invalidation-flow"]]
    identifiers:
      pk: !Find [authentik_flows.flow, [slug, "mino-provider-invalidation-flow"]]
    attrs:
      slug: "miconnect-invalidation-mino"
  - model: authentik_stages_redirect.redirectstage
    conditions:
      - !Find [authentik_stages_redirect.redirectstage, [name, "Archives MINO logout redirect"]]
    identifiers:
      pk: !Find [authentik_stages_redirect.redirectstage, [name, "Archives MINO logout redirect"]]
    attrs:
      name: "miconnect-logout-redirect-archives"
  - model: authentik_flows.flow
    identifiers:
      slug: "miconnect-auth"
    attrs:
      name: "miconnect-auth"
      title: "Connexion à MiConnect"
      designation: "authentication"
      background: "no_background.png"
      denied_action: "continue"
  - model: authentik_flows.flow
    identifiers:
      slug: "miconnect-auth-fallback"
    attrs:
      name: "miconnect-auth-fallback"
      title: "Connexion à MiConnect (secours)"
      designation: "authentication"
  - model: authentik_flows.flow
    identifiers:
      slug: "password-login"
    attrs:
      name: "password-login"
      title: "Connexion par mot de passe"
      designation: "authentication"
  - model: authentik_flows.flow
    identifiers:
      slug: "miconnect-invalidation-mino"
    attrs:
      name: "miconnect-invalidation-mino"
      title: "Tu es déconnecté de %(app)s."
      designation: "invalidation"
  # Canari's sign-out (user decision 2026-10-14): end-session on the three Canari providers runs THIS
  # flow, which ENDS the MiConnect session, so the next sign-in asks who you are instead of answering
  # with the account that just left. `default-provider-invalidation-flow` is stageless and only
  # forgets the provider's tokens. The way back to the app is the request's post_logout_redirect_uri,
  # checked against the provider's `logout` redirect URIs (docs/wiki/infrastructure/authentik.md).
  - model: authentik_flows.flow
    identifiers:
      slug: "miconnect-invalidation-signout"
    attrs:
      name: "miconnect-invalidation-signout"
      title: "Tu es déconnecté de MiConnect."
      designation: "invalidation"
      authentication: "none"
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: "miconnect-identification"
    attrs:
      user_fields: []
      sources:
        - !Find [authentik_sources_oauth.oauthsource, [slug, "cas-emse"]]
      show_source_labels: true
  - model: authentik_stages_deny.denystage
    identifiers:
      name: "miconnect-auth-failed"
    attrs:
      deny_message: "La connexion n'a pas abouti. Ce n'est pas ton compte : le service d'authentification de l'école (CAS) est revenu sans réponse valide. Retourne dans l'application et relance la connexion, elle aboutit généralement à la deuxième tentative."
  - model: authentik_stages_redirect.redirectstage
    identifiers:
      name: "miconnect-logout-redirect-archives"
    attrs:
      mode: "static"
      target_static: "https://archives.canari-emse.fr/s/memoires-des-mines/"
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, "miconnect-auth"]]
      stage: !Find [authentik_stages_identification.identificationstage, [name, "miconnect-identification"]]
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, "miconnect-auth"]]
      stage: !Find [authentik_stages_user_login.userloginstage, [name, "miconnect-login"]]
      order: 40
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, "miconnect-auth-fallback"]]
      stage: !Find [authentik_stages_deny.denystage, [name, "miconnect-auth-failed"]]
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, "password-login"]]
      stage: !Find [authentik_stages_identification.identificationstage, [name, "default-authentication-identification"]]
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, "password-login"]]
      stage: !Find [authentik_stages_password.passwordstage, [name, "default-authentication-password"]]
      order: 15
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, "password-login"]]
      stage: !Find [authentik_stages_user_login.userloginstage, [name, "default-source-authentication-login"]]
      order: 20
  # A PASSWORD SIGN-IN IS GUARDED ON BOTH FLOWS THAT TAKE ONE (2026-10-23): `password-login` (the test
  # campaign and the store review) and authentik's own `default-authentication-flow`, both reachable
  # by URL. Between the identification and the password, `miconnect-password-refused` stops:
  #   - an address or a username whose reputation has fallen to the threshold (each failed password
  #     costs 1, the tenant floors the score at -5, a score expires after a day), and
  #   - a SUPERUSER: an admin signs in through the CAS (`miconnect-auth`), never by password alone.
  # And `password-login` asks for the second factor of an account that has one, as the default flow
  # already does (`default-authentication-mfa-validation` skips an account with none).
  # Driven by test-password-guard.py; the reasoning is in docs/wiki/infrastructure/authentik.md.
  - model: authentik_policies_reputation.reputationpolicy
    identifiers:
      name: "miconnect-password-reputation"
    attrs:
      execution_logging: true
      check_ip: true
      check_username: true
      threshold: -5
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: "miconnect-password-superuser"
    attrs:
      execution_logging: true
      # In a stage binding evaluated after identification, `request.user` is the PENDING user.
      expression: "return bool(getattr(request.user, 'is_superuser', False))"
  - model: authentik_stages_deny.denystage
    identifiers:
      name: "miconnect-password-refused"
    attrs:
      deny_message: "La connexion par mot de passe n'est pas possible pour ce compte en ce moment. Connecte-toi avec le CAS de l'école."
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, "password-login"]]
      stage: !Find [authentik_stages_deny.denystage, [name, "miconnect-password-refused"]]
      order: 12
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: "any"
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, "default-authentication-flow"]]
      stage: !Find [authentik_stages_deny.denystage, [name, "miconnect-password-refused"]]
      order: 15
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: "any"
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_policies.policybindingmodel, [flowstagebinding__target__slug, "password-login"], [flowstagebinding__stage__name, "miconnect-password-refused"], [flowstagebinding__order, 12]]
      policy: !Find [authentik_policies_reputation.reputationpolicy, [name, "miconnect-password-reputation"]]
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_policies.policybindingmodel, [flowstagebinding__target__slug, "password-login"], [flowstagebinding__stage__name, "miconnect-password-refused"], [flowstagebinding__order, 12]]
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, "miconnect-password-superuser"]]
      order: 1
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_policies.policybindingmodel, [flowstagebinding__target__slug, "default-authentication-flow"], [flowstagebinding__stage__name, "miconnect-password-refused"], [flowstagebinding__order, 15]]
      policy: !Find [authentik_policies_reputation.reputationpolicy, [name, "miconnect-password-reputation"]]
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_policies.policybindingmodel, [flowstagebinding__target__slug, "default-authentication-flow"], [flowstagebinding__stage__name, "miconnect-password-refused"], [flowstagebinding__order, 15]]
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, "miconnect-password-superuser"]]
      order: 1
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, "password-login"]]
      stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, "default-authentication-mfa-validation"]]
      order: 18
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, "miconnect-invalidation-signout"]]
      stage: !Find [authentik_stages_user_logout.userlogoutstage, [name, "default-invalidation-logout"]]
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, "miconnect-invalidation-mino"]]
      stage: !Find [authentik_stages_redirect.redirectstage, [name, "miconnect-logout-redirect-archives"]]
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
