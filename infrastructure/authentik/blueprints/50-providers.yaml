# One OAuth2 provider per application. Client SECRETS are deliberately absent: an entry that does not name a field leaves it as it is, so the live secrets stay where they are and never reach this public repository.
#
# Applied by infrastructure/authentik/apply-blueprints.py, never by the worker's own discovery
# (instantiate: false) - see infrastructure/authentik/README.md. Every reference is a !Find on a
# NATURAL key (slug, name, managed id), never a primary key, so the same file builds any instance.
version: 1
metadata:
  name: miconnect-providers
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: "miconnect-archives"
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, "miconnect-auth"]]
      authorization_flow: !Find [authentik_flows.flow, [slug, "miconnect-authorization"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "miconnect-invalidation-mino"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "miconnect-claim-promo"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "miconnect-claim-formation"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "miconnect-claim-email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "miconnect-claim-avatar"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "miconnect-claim-name"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "miconnect-claim-profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "miconnect-claim-school-status"]]
      grant_types:
        - "authorization_code"
        - "refresh_token"
      client_id: "SJ8aeGmNC3tKgBzeTDufsuJYGH_Ayxxk"
      access_token_validity: "minutes=5"
      refresh_token_threshold: "hours=1"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - matching_mode: "strict"
          url: "https://archives.canari-emse.fr/oidc/redirect"
          redirect_uri_type: "authorization"
        - matching_mode: "strict"
          url: "https://archives.canari-emse.fr/s/memoires-des-mines/"
          redirect_uri_type: "logout"
      logout_uri: "https://archives.canari-emse.fr/s/memoires-des-mines/"
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: "miconnect-canari"
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, "miconnect-auth"]]
      authorization_flow: !Find [authentik_flows.flow, [slug, "miconnect-authorization"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "miconnect-invalidation-signout"]]
      property_mappings:
