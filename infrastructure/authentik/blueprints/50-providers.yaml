        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "miconnect-claim-profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "miconnect-claim-uuid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "miconnect-claim-school-status"]]
      grant_types:
        - "authorization_code"
        - "refresh_token"
      client_id: "qqzuUBQpD9oqLw8LrpPiMKWwdbTXoBscrC0yGjWl"
      access_token_validity: "minutes=5"
      refresh_token_threshold: "hours=1"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      # THE LOCAL ESTATE on a workstation (2026-11-18): its nginx entry (8081, the harness's), the
      # Vite dev server (1420, and 127.0.0.1:1420, Tauri's devUrl) and the harness APK's scheme. Port
      # 1421 never carried a sign-in on this client (`strictPort` pins the dev server to 1420). Asks for the terms,
      # like dev, so the harness drives them.
      redirect_uris:
        - matching_mode: "strict"
          url: "http://localhost:8081/auth/callback"
          redirect_uri_type: "authorization"
        - matching_mode: "strict"
          url: "http://localhost:1420/auth/callback"
          redirect_uri_type: "authorization"
        - matching_mode: "strict"
          url: "http://127.0.0.1:1420/auth/callback"
          redirect_uri_type: "authorization"
        - matching_mode: "strict"
          url: "fr.emse.canari://callback"
          redirect_uri_type: "authorization"
        - matching_mode: "strict"
          url: "http://localhost:8081/login"
          redirect_uri_type: "logout"
        - matching_mode: "strict"
          url: "http://localhost:1420/login"
          redirect_uri_type: "logout"
        - matching_mode: "strict"
          url: "http://127.0.0.1:1420/login"
          redirect_uri_type: "logout"
        - matching_mode: "strict"
          url: "fr.emse.canari://signed-out"
          redirect_uri_type: "logout"
