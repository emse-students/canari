# One OAuth2 provider per application. Client SECRETS are deliberately absent: an entry that does not name a field leaves it as it is, so the live secrets stay where they are and never reach this public repository.
#
# Applied by infrastructure/authentik/apply-blueprints.py, never by the worker's own discovery
# (instantiate: false) - see infrastructure/authentik/README.md. Every reference is a !Find on a
# NATURAL key (slug, name, managed id), never a primary key, so the same file builds any instance.
version: 1
metadata:
  name: miconnect-providers
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: "Archives MINO"
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, "miconnect-auth"]]
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "mino-provider-invalidation-flow"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "Promotion"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "Formation"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "fake-email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "avatar"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "First + Last Names"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "Personnel de l'école"]]
      grant_types:
        - "authorization_code"
      client_id: "SJ8aeGmNC3tKgBzeTDufsuJYGH_Ayxxk"
      access_token_validity: "minutes=5"
      refresh_token_threshold: "hours=1"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - matching_mode: "strict"
          url: "https://archives.canari-emse.fr/oidc/redirect"
          redirect_uri_type: "authorization"
        - matching_mode: "strict"
          url: "https://archives.canari-emse.fr/s/memoires-des-mines/"
          redirect_uri_type: "logout"
