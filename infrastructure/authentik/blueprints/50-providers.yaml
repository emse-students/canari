        - !Find [authentik_providers_oauth2.scopemapping, [name, "miconnect-claim-formation"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "miconnect-claim-name"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "miconnect-claim-profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "miconnect-claim-uuid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "miconnect-claim-school-status"]]
      grant_types:
        - "authorization_code"
        - "refresh_token"
      client_id: "KyTy6F1C3LkvhHmskO9TP5iqEjge2H6FzsaHiClv"
      access_token_validity: "minutes=5"
      refresh_token_threshold: "hours=1"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      # PRODUCTION: the web origin, the phone apps' scheme, and the old origin - nothing else
      # (2026-11-18). `canari-emse.fr` answers a 301 to `canari.emse.fr`, but a browser that still
      # runs the app it cached there starts its sign-in from that origin, and one did on 2026-11-13;
      # it goes when the estate migration retires the origin
      # (docs/wiki/infrastructure/estate-migration.md). Removed the same day: the `tauri.localhost`
      # pair (an Android build from before the deep link, last seen 2026-04-25) and the loopback dev
      # ports, which belong to `miconnect-canari-local` alone. Authorizes through the terms flow
      # (`miconnect-authorization`, 45-consent.yaml): the hold on production was lifted 2026-11-20.
      redirect_uris:
        - matching_mode: "strict"
          url: "https://canari.emse.fr/auth/callback"
          redirect_uri_type: "authorization"
        - matching_mode: "strict"
          url: "https://canari-emse.fr/auth/callback"
          redirect_uri_type: "authorization"
        - matching_mode: "strict"
          url: "fr.emse.canari://callback"
          redirect_uri_type: "authorization"
        - matching_mode: "strict"
          url: "https://canari.emse.fr/login"
          redirect_uri_type: "logout"
        - matching_mode: "strict"
          url: "https://canari-emse.fr/login"
          redirect_uri_type: "logout"
        - matching_mode: "strict"
          url: "fr.emse.canari://signed-out"
          redirect_uri_type: "logout"
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: "miconnect-canari-dev"
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, "miconnect-auth"]]
      authorization_flow: !Find [authentik_flows.flow, [slug, "miconnect-authorization"]]
