# One OAuth2 provider per application. Client SECRETS are deliberately absent: an entry that does not name a field leaves it as it is, so the live secrets stay where they are and never reach this public repository.
#
# Applied by infrastructure/authentik/apply-blueprints.py, never by the worker's own discovery
# (instantiate: false) - see infrastructure/authentik/README.md. Every reference is a !Find on a
# NATURAL key (slug, name, managed id), never a primary key, so the same file builds any instance.
version: 1
metadata:
  name: miconnect-providers
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  # RENAMES (WPA-2, 2026-09-30). Each entry below runs only while the OLD name still exists, and
  # gives the object its new name before the entry that describes it by that name. It finds the
  # object by PK, because authentik merges an entry's identifiers back into its attributes: found
  # by its old name, it would write that old name straight back. So an instance
  # built under the old names is renamed in place, and a fresh one never sees these. They are dead
  # once production has taken them, and are deleted then (docs/wiki/profiles-and-access.md, WPA).
  - model: authentik_providers_oauth2.oauth2provider
    conditions:
      - !Find [authentik_providers_oauth2.oauth2provider, [name, "Archives MINO"]]
    identifiers:
      pk: !Find [authentik_providers_oauth2.oauth2provider, [name, "Archives MINO"]]
    attrs:
      name: "miconnect-archives"
