        - "refresh_token"
      client_id: "nep2XHicSXTMBdeLgZ4EBMzHRs8oMuVephzMTmD2"
      access_token_validity: "minutes=5"
      refresh_token_threshold: "hours=1"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      # Wiki.js 3 (2026-11-13): its OIDC strategy calls back on /_api/auth/<strategy id>/callback and
      # returns to the site root after a sign-out. The Wiki.js 2 callbacks (/login/9bbf0969-.../callback)
