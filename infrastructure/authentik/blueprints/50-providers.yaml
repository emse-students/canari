        - !Find [authentik_providers_oauth2.scopemapping, [name, "miconnect-claim-school-status"]]
      grant_types:
        - "authorization_code"
        - "refresh_token"
      client_id: "6cNHJotTO9THNMewP4vCO3O6aRLsNTSqKRuQjv4o"
      access_token_validity: "minutes=5"
      refresh_token_threshold: "hours=1"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      # DEV and every PRE-RELEASE build (TestFlight, the Play tester tracks): the dev web origin and
      # the phone apps' scheme (2026-11-18); a loopback origin is `miconnect-canari-local`'s. Asks
      # for the terms (`miconnect-authorization`, 45-consent.yaml): a pre-release app signs in here,
      # so this is where the terms are read on a phone before production asks anybody.
      redirect_uris:
        - matching_mode: "strict"
          url: "https://dev.canari-emse.fr/auth/callback"
          redirect_uri_type: "authorization"
        - matching_mode: "strict"
          url: "fr.emse.canari://callback"
          redirect_uri_type: "authorization"
        - matching_mode: "strict"
          url: "https://dev.canari-emse.fr/login"
          redirect_uri_type: "logout"
        - matching_mode: "strict"
          url: "fr.emse.canari://signed-out"
          redirect_uri_type: "logout"
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: "miconnect-canari-local"
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, "miconnect-auth"]]
      authorization_flow: !Find [authentik_flows.flow, [slug, "miconnect-authorization"]]
