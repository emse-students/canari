      policy: !Find [authentik_policies_expression.expressionpolicy, [name, "miconnect-alumni-link-resume-mismatch"]]
      order: 0
    attrs:
      failure_result: true
  - model: authentik_sources_saml.samlsource
    identifiers:
      slug: "alumni"
    attrs:
      name: "Mines Saint-Etienne Alumni"
      # ENABLED WITH ITS VERIFICATION CERTIFICATE (2026-11-23). A SAML source without a verification
      # key pair verifies no signature at all (test-blueprints.sh refuses that shape), so
      # `verification_kp` and the two `signed_*` flags below are what make `enabled` safe.
      enabled: true
      verification_kp: !Find [authentik_crypto.certificatekeypair, [name, "miconnect-alumni-idp-signing"]]
      # Signed on both levels - an unsigned response or assertion is refused.
      signed_response: true
      signed_assertion: true
      # IdP-initiated SSO skips request-ID validation; it stays off.
      allow_idp_initiated: false
      # PROMOTED BESIDE THE CAS (D45, owner 2026-11-23): the login page's identification stage lists
      # it (40-authentication.yaml).
      promoted: true
      # Its own sign-in flow writes the membership read (D43); enrolment is the shared flow, whose
      # routing page only an Alumni identity meets (D47, 20-enrollment.yaml).
      authentication_flow: !Find [authentik_flows.flow, [slug, "miconnect-alumni-authentication"]]
      enrollment_flow: !Find [authentik_flows.flow, [slug, "miconnect-enrollment"]]
      user_path_template: "users"
      # Runs because the binding is POST: the link confirmation above, then the auto-submitted request.
      pre_authentication_flow: !Find [authentik_flows.flow, [slug, "miconnect-alumni-pre-authentication"]]
      user_property_mappings:
        - !Find [authentik_sources_saml.samlsourcepropertymapping, [name, "miconnect-alumni-identity"]]
      # The IdP's metadata offers ONE SingleSignOnService, HTTP-Redirect, yet the same URL accepts a
      # POSTed request (read on production 2026-11-23, cold and repeat sign-ins): POST_AUTO is what
      # runs the pre-authentication flow, D49's page. The answer comes back by POST to our ACS.
      sso_url: "https://mines-saint-etienne.org/sso/saml/ssoservice"
      binding_type: "POST_AUTO"
