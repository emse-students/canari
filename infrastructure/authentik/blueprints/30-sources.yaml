# Where people come from: the school CAS (OIDC) and the Alumni SAML source (its SSO URL is a placeholder until the Alumni SSO exists).
#
# Applied by infrastructure/authentik/apply-blueprints.py, never by the worker's own discovery
# (instantiate: false) - see infrastructure/authentik/README.md. Every reference is a !Find on a
# NATURAL key (slug, name, managed id), never a primary key, so the same file builds any instance.
version: 1
metadata:
  name: miconnect-sources
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  - model: authentik_sources_oauth.oauthsource
    identifiers:
      slug: "cas-emse"
    attrs:
      name: "Cas EMSE"
      promoted: true
      authentication_flow: !Find [authentik_flows.flow, [slug, "default-source-authentication"]]
      enrollment_flow: !Find [authentik_flows.flow, [slug, "miconnect-enrollment-cas"]]
      user_property_mappings:
        - !Find [authentik_sources_oauth.oauthsourcepropertymapping, [name, "miconnect-cas-identity"]]
      user_path_template: "users"
      icon: "https://cas.emse.fr/cas/images/serv-num-2a0fdbe0a16dbb659e497f61b812568a.png"
      provider_type: "openidconnect"
      # The CAS advertises S256 (its .well-known); the source was built with none until WPA-2.
      pkce: "S256"
      request_token_url: null
      authorization_url: "https://cas.emse.fr/cas/oidc/oidcAuthorize"
      access_token_url: "https://cas.emse.fr/cas/oidc/oidcAccessToken"
      profile_url: "https://cas.emse.fr/cas/oidc/oidcProfile"
      consumer_key: "miconnect"
      # The CAS client secret, from the worker's environment (`.env`, beside compose.yml). Required
      # to CREATE the source; on an existing one it rewrites the same value.
      consumer_secret: !Env MICONNECT_CAS_CONSUMER_SECRET
      additional_scopes: "openid profile email"
      oidc_well_known_url: "https://cas.emse.fr/cas/oidc/.well-known/openid-configuration"
      oidc_jwks_url: "https://cas.emse.fr/cas/oidc/jwks"
  - model: authentik_sources_saml.samlsource
    identifiers:
      slug: "alumni"
    attrs:
      name: "Mines Saint-Etienne Alumni"
      promoted: true
      authentication_flow: !Find [authentik_flows.flow, [slug, "default-source-authentication"]]
      enrollment_flow: !Find [authentik_flows.flow, [slug, "miconnect-enrollment-alumni"]]
      user_path_template: "users"
      pre_authentication_flow: !Find [authentik_flows.flow, [slug, "default-source-pre-authentication"]]
      sso_url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ270K"
      slo_url: ""
