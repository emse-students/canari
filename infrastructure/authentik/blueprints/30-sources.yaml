        plan = request.context.get("flow_plan")
        return plan is None or plan.context.get("miconnect/alumni-link-mode") != "parked"
  - model: authentik_stages_redirect.redirectstage
    identifiers:
      name: "miconnect-alumni-link-to-source"
    attrs:
      mode: "static"
      target_static: "/source/saml/alumni/"
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, "miconnect-alumni-link"]]
      stage: !Find [authentik_stages_redirect.redirectstage, [name, "miconnect-alumni-link-to-source"]]
