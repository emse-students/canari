  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_policies.policybindingmodel, [flowstagebinding__target__slug, "miconnect-alumni-link"], [flowstagebinding__stage__name, "miconnect-alumni-link-confirm-both"], [flowstagebinding__order, 5]]
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, "miconnect-alumni-link-decide"]]
      order: 0
    attrs:
      # A policy that raises shows the naming page, never a silent link.
      failure_result: true
  # THE PARKED LINK IS WRITTEN HERE, after the page when it showed. The policy writes the connection
  # and the membership read itself, in one transaction, and returns False (the deny stage is skipped);
  # it returns True - the refusal - when the account already holds an Alumni link or the identity is
  # already linked to an account (a link made meanwhile, another tab). A raise refuses too.
  - model: authentik_stages_deny.denystage
    identifiers:
      name: "miconnect-alumni-link-parked-refused"
    attrs:
      deny_message: "Ton compte Alumni n'a pas été lié : ce compte MiConnect est déjà lié à un compte Alumni, ou ce compte Alumni l'est déjà à un autre compte. Rien n'a été modifié : contacte un administrateur si ce n'est pas normal."
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: "miconnect-alumni-link-parked-write"
    attrs:
      execution_logging: false
      expression: |-
        from django.db import transaction

        from authentik.core.models import User, UserSourceConnection
        from authentik.events.models import Event, EventAction
        from authentik.sources.saml.models import SAMLSource, UserSAMLSourceConnection

        plan = request.context.get("flow_plan")
        if plan is None or plan.context.get("miconnect/alumni-link-mode") != "parked":
            return False
        parked = plan.context["miconnect/alumni-link-parked"]
        http = request.http_request
        with transaction.atomic():
            # The source's row first, then the account's: two writes (two tabs, two accounts) of an
            # identity are serialised, so the checks below cannot both pass.
            source = SAMLSource.objects.select_for_update().get(slug="alumni")
            user = User.objects.select_for_update().get(pk=http.user.pk)
            if UserSourceConnection.objects.filter(source=source).filter(user=user).exists() or UserSourceConnection.objects.filter(source=source, identifier=parked["identifier"]).exists():
                ak_logger.warning("miconnect-alumni-link: the parked Alumni identity is not linked, a link already exists", user=user.username)
                return True
            UserSAMLSourceConnection.objects.create(user=user, source=source, identifier=parked["identifier"])
            if parked.get("alumni_read"):
                user.attributes["alumni"] = parked["alumni_read"]
                user.save(update_fields=["attributes"])
            # authentik's own journal line for a link (as PostSourceStage writes it), in the same
            # transaction: no link without its Event.
            Event.new(EventAction.SOURCE_LINKED, app="miconnect", message="Linked Source", source=source, miconnect_route="routing", names_agree=bool(parked.get("agree"))).from_http(http)
        plan.context["miconnect/alumni-link-parked"] = {}
        return False
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, "miconnect-alumni-link"]]
      stage: !Find [authentik_stages_deny.denystage, [name, "miconnect-alumni-link-parked-refused"]]
      order: 9
    attrs:
