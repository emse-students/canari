  # THE LINK MiConnect PROPOSES (miconnect-sign-in-paths.md): the D44 step's link and the D47 routing
  # page's return after the CAS both come HERE, with the application's authorization as `next`. The
  # flow executor stores that `next` in the session, where the Alumni source's entry reads it
  # (sources/saml/views.py:75-82), and where this flow's own end reads it, so the link ends on the
  # application instead of the settings page. Its first policy DECIDES, once per run (kept in the
  # plan, so the page's POST re-reads the same decision), from what the SESSION holds - nothing in
  # the URL decides:
  #   - "parked": the routing page's "I have a School account" (20-enrollment.yaml) kept the identity
  #     Alumnforce asserted in that sign-in, `miconnect/alumni-link-parked`. The owner's decision of
  #     2026-11-25 (option 1): it is linked HERE, to the account the CAS just signed in, with NO second
  #     Alumnforce sign-in - at once when the name Alumnforce asserted is the account's name (folded
  #     by `miconnect-alumni-names-agree`, the merge's comparison), else after a page naming BOTH
  #     accounts and a tick. The membership read of that assertion is written with it. Honoured only
  #     when this link names the record's nonce (`parked=`, which only the routing policy's link
  #     carries); a record this link does not name is DROPPED, logged at warning - someone else's,
  #     left in a shared browser, never reaches a later sign-in's link;
  #   - "proposed": the D44 step offered the link to this account (`miconnect/alumni-link-offered` =
  #     its pk and a nonce, 45-consent.yaml) AND this link names that nonce (`offer=`, only the
  #     step's page carries it): the pre-authentication flow is told (`miconnect/alumni-link-proposed`),
  #     skips the D49 page and resumes the sign-in after Alumnforce answers (above). The offer outlives
  #     its page ("Continuer", a block shown again), so a visit without the nonce meets D49;
  #   - nothing: a link to this URL from anywhere else - the source as before, D49 page, settings.
  # The parked record is taken out of the session at once, an offer when its nonce is used. No mode
  # in an impersonated session, nor with a `next` that is not a path on MiConnect (the flow would
  # redirect to it). The bindings below: the
  # naming page (parked, names differ), the write (parked; its deny stage shows a refusal), the
  # round trip to Alumnforce (not parked). Driven by test-consent-flow.py steps 10-12.
  - model: authentik_flows.flow
    identifiers:
      slug: "miconnect-alumni-link"
    attrs:
      name: "miconnect-alumni-link"
      title: "Lier ton compte Alumni"
      designation: "stage_configuration"
      authentication: "require_authenticated"
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: "miconnect-alumni-link-decide"
    attrs:
      execution_logging: false
      expression: |-
        from hmac import compare_digest
        from html import escape

        from django.utils.http import url_has_allowed_host_and_scheme

        MODE = "miconnect/alumni-link-mode"
        PARKED = "miconnect/alumni-link-parked"
        OFFERED = "miconnect/alumni-link-offered"
        plan = request.context.get("flow_plan")
        if plan is None or request.http_request is None:
            return False

        def named(record, sent):
            """True when `record` is a dict whose nonce is the one this link carries."""
            return isinstance(record, dict) and bool(record.get("nonce")) and compare_digest(str(sent or ""), str(record["nonce"]))

        if MODE not in plan.context:
            session = request.http_request.session
            query = session.get("authentik/flows/get") or {}
            user = request.http_request.user
            parked = session.pop(PARKED, None)
            if parked is not None and not named(parked, query.get("parked")):
                ak_logger.warning("miconnect-alumni-link: a parked Alumni identity this link does not name is dropped, nothing is linked from it", user=getattr(user, "username", None))
                parked = None
            offered = named(session.get(OFFERED), query.get("offer")) and session[OFFERED].get("pk") == user.pk
            if offered:
                del session[OFFERED]
            back = query.get("next") or ""
            local = back == "" or (back.startswith("/") and not back.startswith("//") and "\\" not in back and url_has_allowed_host_and_scheme(back, allowed_hosts=None))
            impersonated = "authentik/impersonate/user" in session
            mode = None
            if impersonated or not local or not user.is_authenticated:
                if parked is not None or offered:
                    ak_logger.warning("miconnect-alumni-link: an offer this link cannot honour, nothing is skipped", local_next=local, impersonated=impersonated)
            elif isinstance(parked, dict) and parked.get("identifier"):
                mode = "parked"
                asserted = f"{parked.get('firstname') or ''} {parked.get('lastname') or ''}".strip()
                parked["agree"] = ak_call_policy("miconnect-alumni-names-agree", names=[asserted, user.name]).passing
                plan.context[PARKED] = parked
                plan.context.setdefault("prompt_data", {})["alumni_link_parked_notice"] = (
                    f"<p>Tu viens de te connecter avec le compte <strong>Alumni</strong> de <strong>{escape(asserted or '?')}</strong>, "
                    f"puis avec le CAS au compte MiConnect <strong>{escape(user.name)}</strong> ({escape(user.username)}). "
                    "Les deux noms diffèrent : lier ce compte Alumni à ce compte MiConnect ?</p>"
                    "<p>Si l'un des deux n'est pas le tien, ferme cette page : rien ne sera lié.</p>"
                )
            elif offered:
                mode = "proposed"
                session["miconnect/alumni-link-proposed"] = user.pk
            plan.context[MODE] = mode
        parked = plan.context.get(PARKED) or {}
        return plan.context[MODE] == "parked" and not parked.get("agree")
