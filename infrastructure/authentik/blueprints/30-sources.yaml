  # THE RESUMED SIGN-IN (the flow token above). authentik restores this plan when Alumnforce answers
  # and appends its PostSourceStage, which attaches the asserted Alumni identity to the plan's pending
  # user. The ONE stage here runs first and refuses (failure_result: a raise refuses too) unless:
  #   - the pending user is the account the session holds NOW (no token can outlive its account: a
  #     sign-out or a sign-in as someone else flushes the session, this proves it again);
  #   - an Alumni identity, when that account holds no Alumni link yet;
  #   - the `next` the flow will redirect to is a path on MiConnect.
  # A token left by an abandoned Alumni round trip can meet a link of ANOTHER source the person
  # makes later (the CAS from the settings): that is let through, logged at warning - authentik would
  # link it to the same account (the session's, checked above) without the token; only where it ends
  # differs. It also takes the token out of the session: one token, one link. Driven by
  # test-consent-flow.py (steps 10 and 12).
  - model: authentik_flows.flow
    identifiers:
      slug: "miconnect-alumni-link-done"
    attrs:
      name: "miconnect-alumni-link-done"
      title: "Lier ton compte Alumni"
      designation: "stage_configuration"
      authentication: "require_authenticated"
  - model: authentik_stages_deny.denystage
    identifiers:
      name: "miconnect-alumni-link-resume-refused"
    attrs:
      deny_message: "Ton compte Alumni n'a pas été lié : la connexion a changé pendant l'opération. Rien n'a été modifié. Reconnecte-toi au service, puis lie ton compte Alumni depuis tes paramètres MiConnect."
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: "miconnect-alumni-link-resume-mismatch"
    attrs:
      execution_logging: false
      expression: |-
        from django.utils.http import url_has_allowed_host_and_scheme

        from authentik.core.models import UserSourceConnection
        from authentik.core.sources.flow_manager import SESSION_KEY_OVERRIDE_FLOW_TOKEN
        from authentik.flows.planner import PLAN_CONTEXT_PENDING_USER, PLAN_CONTEXT_REDIRECT, PLAN_CONTEXT_SOURCE

        http = request.http_request
        if http is None:
            return True
        http.session.pop(SESSION_KEY_OVERRIDE_FLOW_TOKEN, None)
        plan = request.context.get("flow_plan")
        context = plan.context if plan is not None else {}
        pending = context.get(PLAN_CONTEXT_PENDING_USER)
        source = context.get(PLAN_CONTEXT_SOURCE)
        back = context.get(PLAN_CONTEXT_REDIRECT) or ""
        refused = []
        if pending is None or not http.user.is_authenticated or pending.pk != http.user.pk:
            refused.append("the session's account is not the one the link was proposed to")
        if getattr(source, "slug", None) != "alumni":
            ak_logger.warning("miconnect-alumni-link: a resume token left by an abandoned Alumni link met a link of another source, linked as authentik links it, to the session's account", source=getattr(source, "slug", None), pending=getattr(pending, "username", None))
        elif pending is not None and UserSourceConnection.objects.filter(user=pending, source=source).exists():
            refused.append("the account already holds an Alumni link")
        # A path on MiConnect, or authentik's own default when the person came with no `next`.
        local = isinstance(back, str) and (back == "authentik_core:if-user" or (back.startswith("/") and not back.startswith("//") and "\\" not in back and url_has_allowed_host_and_scheme(back, allowed_hosts=None)))
        if not local:
            refused.append("the redirect is not a path on MiConnect")
        if refused:
            ak_logger.warning("miconnect-alumni-link: the resumed link is refused, nothing is written", reasons=refused, pending=getattr(pending, "username", None))
            return True
        return False
