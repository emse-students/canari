# Stack Authentik (fournisseur OIDC de Canari), projet Docker Compose "miconnect".
#
# Source de verite versionnee, et REFERENCE DE RECONSTRUCTION : aucun pipeline ne
# deploie cette stack. Elle tourne dans /srv/miconnect/ sur l hote mutualise depuis
# le 2026-09-24, et son .env est ecrit a la main a cote de ce fichier. Le README
# de ce dossier porte l histoire et la procedure de reconstruction.
#
# Les montages relatifs (./data, ./certs, ./custom-templates) sont resolus depuis
# le dossier d ou la commande est lancee. Le volume nomme "database" porte la base.

# LE NOM DU PROJET EST DECLARE ET JAMAIS DEDUIT, parce qu il nomme le volume.
# Sans cette ligne, le projet prend le nom du DOSSIER : un dossier nomme autrement
# demarrerait sur une base VIDE au lieu d echouer, et cette stack est le seul
# endroit ou la configuration OIDC existe. C est la perte silencieuse que cette
# ligne rend impossible - elle manquait jusqu au 2026-09-24, ou le nom n a tenu
# que parce que les deux dossiers successifs s appelaient "miconnect" par chance.
name: miconnect

services:
  postgresql:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - database:/var/lib/postgresql/data

  server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.0}
    restart: unless-stopped
    command: server
    env_file:
      - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
      AUTHENTIK_URL_DOMAIN: auth.canari-emse.fr
      AUTHENTIK_LOG_LEVEL: debug
    # ONE publish, and an ADDRESS rather than a bare port. `9443` was dropped on 2026-09-24:
    # the tunnel ingress reaches this stack at `http://10.0.0.7:9000`, measured on the connector
    # itself, so the TLS listener had no consumer. On the shared host, TLS is terminated by the
    # host's nginx with the DSI certificate, exactly as it is for the other estates - carrying
    # `9443` across would need either a second certificate there or `proxy_ssl_verify off`, and
    # both are refused. AUTHENTIK_PUBLISH holds the whole left-hand side so a move can bind it to
    # loopback (`127.0.0.1:9000`) without editing this file.
    ports:
      - ${AUTHENTIK_PUBLISH:-9000}:9000
    shm_size: 512mb
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./custom-templates:/templates

  worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.0}
    restart: unless-stopped
    command: worker
    # STILL root, and no longer for the reason it was: the Docker socket below is gone. What is
    # left is `./certs` and `./data`, written by this container and owned on the host by root. It
    # is NOT verified that a non-root worker can write them, so dropping this is its own change
    # with its own verification, not a line to delete while moving a machine.
    user: root
    env_file:
      - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
      AUTHENTIK_LOG_LEVEL: debug
    shm_size: 512mb
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      # THE DOCKER SOCKET IS NOT MOUNTED, and was removed on 2026-09-24. Authentik wants it only
      # to run outposts as containers through a Docker service connection; the sole outpost here is
      # the EMBEDDED one, which runs inside the server container and needs no socket. The service
      # connection object exists in the database and NO outpost references it - checked before this
      # line was deleted rather than after. What the mount cost: on a machine shared with other
      # tenants it is root-equivalent control of the whole daemon, theirs included.
      - ./data:/data
      - ./certs:/certs
      - ./custom-templates:/templates

volumes:
  database:
    driver: local
