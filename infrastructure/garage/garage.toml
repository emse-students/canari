# Garage configuration - single-node object storage for encrypted media blobs.
# Non-secret: paths, ports and region only. rpc_secret and admin_token come from the
# GARAGE_RPC_SECRET / GARAGE_ADMIN_TOKEN environment variables (Garage reads these natively),
# never written here. See docs/wiki/infrastructure/docker.md.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

# One node, no replication - same durability model as the single-node MinIO it replaces;
# the restic-based offsite backup (infrastructure/backup/) is what provides recovery.
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
