# THE ESTATE'S EDGE: THE ONE CONTAINER THAT HOLDS THE HOST PORT, AND A RELEASE NEVER REPLACES IT.
#
# WHY IT EXISTS (2026-10-17, docs/wiki/cicd.md#a-deploy-replaces-nothing-a-member-is-talking-to).
# The frontend container used to publish the host port itself, and a host port belongs to exactly
# one container: its successor could not start until it was gone, so every release left the host's
# proxy with nothing to connect to while the new frontend came up - a 502 on every request in that
# window. This relay holds the port instead and is the same container from one release to the
# next, so the frontend behind it can be replaced like every other service: the new one starts
# BESIDE the old one, and the old one leaves only once the new one is healthy.
#
# LAYER 4, ON PURPOSE. It forwards bytes and reads nothing: no header is added or rewritten, the
# body limit, the WebSocket upgrade, the gzip and the `X-Real-IP` the host proxy sets all pass
# through untouched, and the frontend's nginx stays the single place any HTTP policy lives
# (docs/wiki/infrastructure/nginx.md). The frontend trusts `X-Real-IP` from a private hop, and this
# relay is one (172.16.0.0/12), as the Docker gateway in front of it used to be.
#
# HOW IT CHANGES WITHOUT BEING REPLACED. This directory is mounted read-only from the deployed
# checkout, so a release that edits this file is picked up by `nginx -s reload` (deploy-environment.sh
# sends it), which is graceful: the old workers finish their connections. Only a change to the
# compose definition of `edge` itself recreates the container - an image bump - and that one deploy
# has a gap of about a second.

worker_processes 1;
error_log /dev/stderr notice;
# The compose healthcheck reads this pid file and the LISTEN row of `listen 80` below: move either and
# the edge never turns healthy, so the deploy fails rather than believing a relay that is not there.
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

stream {
    # Docker's own DNS, re-asked every 2 s. `frontend` resolves to EVERY running replica of the
    # service, so during a deploy it names the old and the new one; once the old one is gone, it
    # leaves this cache within 2 s.
    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 2s;

    # A variable, so the name is resolved per connection through the resolver above. A literal
    # would be resolved ONCE at startup and pinned to whatever address the frontend had that day.
    map $server_port $edge_upstream {
        default frontend:80;
    }

    # No access log: every request is logged by the frontend behind this, with the client's
    # address; a line per TCP connection here would name only the host proxy. What this relay
    # says is in the error log, and the one line it is expected to write during a deploy is the
    # failover below ("connect() failed ... while connecting to upstream"), which is the old
    # replica refusing because it is draining.
    access_log off;

    server {
        listen 80;
        proxy_pass $edge_upstream;

        # FAILOVER, AND WHY IT CANNOT DUPLICATE A REQUEST. A connection is handed to the next
        # replica only when CONNECTING failed - refused by a replica that stopped listening, or no
        # answer within 2 s from one whose address has just been released - so no byte of the
        # request has reached anybody yet. 2 s is two orders of magnitude above a connect on this
        # bridge, and it is spent only on an address the resolver above still names for at most
        # 2 s after its container is gone.
        proxy_connect_timeout 2s;
        proxy_next_upstream on;

        # An idle connection is closed after this. The frontend holds a WebSocket open for an hour
        # (`proxy_read_timeout 3600s` on /api/ws), so the relay must not cut it sooner.
        proxy_timeout 3600s;
    }
}
