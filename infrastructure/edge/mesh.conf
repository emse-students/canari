# THE ESTATE'S MESH: WHERE ONE SERVICE CALLS ANOTHER, AND A RELEASE NEVER REPLACES IT.
#
# WHY IT EXISTS (2026-11-07, docs/wiki/cicd.md#service-to-service-calls-go-through-the-mesh). A release
# takes a retiring replica out of the frontend nginx and the edge before it stops (the replica lists,
# infrastructure/lib/rolling.sh), so a request that comes through nginx is never reset by a release. A
# call from one service to another did not come through nginx: it resolved its peer through Docker's
# DNS, which names a replica for as long as it runs, so a call could land in the accept queue of the
# replica being stopped and be reset when its listener closed. Nothing finer than a proxy can take a
# replica out of Docker's DNS. So the callers name THIS nginx (`http://mesh:3012` for core-service), and
# the deploy takes the retiring replica out of it exactly as it does out of the frontend: a target per
# service, `$target_<service>`, from a list it writes (targets/mesh.conf) and a reload whose pairing
# check holds before the replica is told to stop.
#
# PINNED, LIKE THE EDGE, AND THAT IS WHAT CLOSES IT. A proxy the deploy replaced would be the very
# exposure it exists to close: its callers would resolve it by DNS while it stopped. This one runs a
# third-party image with this directory mounted from the deployed checkout, so a release changes it by
# `nginx -s reload`, which hands the listening sockets to the new workers - nothing queued on them is
# reset. Only a change to its compose definition (an image bump, shared with the edge) recreates it,
# with a new address: calls fail until it is healthy and each caller has resolved it again - a few
# seconds, because every Bun caller keeps an address the resolver lifetime
# (BUN_CONFIG_DNS_TIME_TO_LIVE_SECONDS) and not Bun's 30 s default.
#
# IT FORWARDS, IT DECIDES NOTHING. The request line, every header (`X-Internal-Secret` included, which
# the frontend nginx deliberately blanks on what a browser sends) and the body reach the service as the
# caller wrote them; no header is added, so a service sees exactly what it saw when called directly.
# Not the frontend's nginx for that reason: that one strips `X-Internal-*` and runs `auth_request`.
#
# ONE REQUEST PER CONNECTION, ON BOTH SIDES - BOTH ARE LOAD-BEARING.
#   - Towards the services: `proxy_pass` to a variable caches no upstream connection, so every upstream
#     connection an old worker holds is a request that has chosen its replica - what the pairing check
#     counts (the same reason the frontend declares no `upstream` block).
#   - Towards the callers: `keepalive_timeout 0`. A reload ends its old workers gracefully, and a worker
#     ending gracefully CLOSES its idle keep-alive connections; a caller that had just written its next
#     request into one would read a reset. With no idle connection there is nothing for a reload to
#     close: each answer carries `Connection: close`, and the caller's next call opens a connection on
#     the listening socket, which a reload never closes. A deploy reloads this nginx twice per replaced
#     service it routes, so this is not a corner case.

worker_processes 1;
error_log /dev/stderr notice;
# The compose healthcheck reads this pid file and the LISTEN rows of the three ports below: move either
# and the mesh never turns healthy, so the deploy fails rather than believing a proxy that is not there.
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    # WHERE EACH SERVICE IS SENT, written by infrastructure/lib/rolling.sh BEFORE any container starts:
    # the service's DNS name at rest, the new replica's container name while it is replaced. Not
    # tracked by git (targets/.gitignore).
    include /etc/nginx/edge/targets/mesh.conf;

    # Every service logs the requests it answers; a line here would name only the caller's container.
    access_log off;

    # Docker's DNS; `valid=` is ROLLING_RESOLVER_TTL_SECONDS (deploy-replace.test.sh holds them equal),
    # `resolver_timeout` the bound every request waiting on it gets (2 s, as in both other proxies).
    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 2s;

    keepalive_timeout 0;

    # Untouched in both directions: no body limit (each service applies its own), nothing buffered, and
    # header names as the caller spelled them.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    underscores_in_headers on;
    ignore_invalid_headers off;
    large_client_header_buffers 4 32k;
    # And the answer's headers: nginx reads them into ONE buffer, 4 KB by default, and answers 502
    # ("upstream sent too big header") past it - a refusal the service never made. The frontend's
    # @ssr location met exactly that (Dockerfile.frontend); the same three lines, held equal by
    # deploy-replace.test.sh.
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;

    # A connect refused or unanswered is handed to the next address of the target - nothing was sent,
    # so even a POST is safe to hand on (the frontend's two lines, held equal by deploy-replace.test.sh).
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout;
    # The CALLER's timeout governs a call, as it did when it called the service directly: nginx's 60 s
    # default would cut a call nothing cut before.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # One `server` per routed service, on the service's own port, so a caller's URL changes by its host
    # alone. The ports are the `mesh:<port>` of each service's `canari.deploy.rotation` label.
    server {
        listen 3010;
        location / {
            proxy_pass http://$target_chat_delivery_service;
        }
    }

    server {
        listen 3012;
        location / {
            proxy_pass http://$target_core_service;
        }
    }

    server {
        listen 3014;
        location / {
            proxy_pass http://$target_social_service;
        }
    }
}
