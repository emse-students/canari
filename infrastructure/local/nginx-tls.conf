# TLS for the LOCAL estate, added as a SECOND server block rather than by editing the image.
#
# WHY IT IS NOT IN `Dockerfile.frontend`. That file is the single source of truth for the nginx
# configuration (CLAUDE.md), and production's nginx terminates no TLS at all - the Cloudflare tunnel
# does it at the edge and speaks plain HTTP to the container. Putting a certificate in the shared
# image would make the local estate's shape diverge from production's in the one file that exists to
# keep them the same. This block is mounted into `conf.d/` by the LOCAL compose file only, so the
# image is byte-identical to the one production's shape is described by.
#
# IT TERMINATES AND FORWARDS, IT DOES NOT DUPLICATE. Everything the estate does - the
# `auth_request` that turns a bearer token into `X-User-Id`, the CSP, the SPA fallback, the SSR
# delegation, the per-service routing - lives in `default.conf` on :80 and is not restated here. A
# second copy of that routing is how two configurations drift until one of them silently stops
# authenticating. This block owns exactly one concern: the transport.
#
# WHY IT EXISTS AT ALL is a product constraint, not a preference. `setRefreshCookie` picks the
# refresh cookie's attributes from `ALLOW_INSECURE_COOKIES`; on `true` the cookie is `SameSite=Lax`
# without `Secure`, and a `Lax` cookie cannot be SET in a third-party context. The Android WebView's
# page is `tauri.localhost`, so it discards the cookie on arrival and the phone logs itself out
# before it has published a key package - measured 2026-09-04, which is why every `+A1` row was
# blocked on the estate rather than on the product. `SameSite=None` requires `Secure`, and `Secure`
# cannot be set over plain HTTP. So: real TLS, and `ALLOW_INSECURE_COOKIES=false` beside it. One
# without the other changes nothing.

# `$connection_upgrade` DOES NOT EXIST until this map defines it, and nothing in the image defines
# it: `default.conf` writes `Connection "upgrade"` as a LITERAL, inside the two `/api/ws` and
# `/api/call` locations only. This block proxies `/`, so a literal here would send
# `Connection: upgrade` on every ordinary GET as well - which is a protocol error the client is
# entitled to reject, and one that fails as a hang rather than a message. The map keeps the header
# empty except when the client actually asked to upgrade. `conf.d/*.conf` is included from the `http`
# block, so this is the right scope for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/local.crt;
    ssl_certificate_key /etc/nginx/certs/local.key;

    # TLS 1.2 is kept because the Android WebView on the bench negotiates it, and this estate exists
    # to reproduce that client rather than to be exemplary about ciphers.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:LocalTLS:4m;
    ssl_session_timeout 1h;

    # An upload is the biggest body this estate carries and the limit belongs on the listener that
    # receives it: a 413 raised here would surface as a failed media send, which is a defect this
    # campaign has already chased once for another reason.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:80;

        # `$host` rather than a literal: the estate is reached as `localhost` from the browsers and
        # may be reached by an IP from elsewhere, and the inner server must see what the client
        # asked for.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # THE ONE HEADER THAT CARRIES THE POINT OF THIS FILE. The inner server and every service
        # behind it see a plain HTTP request; this is what tells them the client's transport was
        # encrypted, so a redirect or an absolute URL built upstream does not downgrade the scheme.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket. The chat gateway is reached through this listener like everything else, and a
        # missing Upgrade pair does not fail loudly - it answers 200 with an HTML body, and the
        # client reports a connection that closed for no reason.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A long-lived socket must not be reaped by the proxy that carries it. The gateway's own
        # heartbeat is what decides liveness; a 60 s default here would cut idle sockets and every
        # reconnect would look like a network fault of the product's making.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;

        # THE HEADER BUFFER IS A SEPARATE THING FROM `proxy_buffering`, AND THIS COST A 502.
        # `proxy_buffering off` streams the BODY; the response HEADERS are still read into one
        # buffer whose default is a single page, and this estate's headers do not fit in it: the
        # CSP alone is about 1.5 kB, and the inner server adds it to every block that sets any
        # header of its own. Nothing noticed while there was one hop - a server that GENERATES a
        # header never has to parse it back. Adding a second hop made nginx read its own output,
        # and `/chat` answered `502 Bad Gateway` with `upstream sent too big header` in the error
        # log while `/api/version` - which sets no CSP - kept answering 200. That asymmetry is
        # exactly what makes this worth writing down: the health check was green.
        proxy_buffer_size       16k;
        proxy_buffers        8  16k;
        proxy_busy_buffers_size 32k;
    }
}
