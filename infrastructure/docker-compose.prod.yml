# THE PROJECT NAME CHANGED WITH THE MOVE TO THE SHARED HOST (2026-09-24) - see
# docs/wiki/infrastructure/estate-migration.md. It used to be `infrastructure`, inferred from the
# directory this file sits in, because nothing declared otherwise; the OLD VM's volumes are still
# `infrastructure_postgres_data`, `infrastructure_redis_data` and so on, and stay that way - this
# file was never deployed there again after the cutover. On the TARGET, `canari-prod` is declared
# up front, alongside `docker-compose.dev.yml`'s own `name: canari-dev`: two files in one directory,
# each carrying its own identity, cannot be merged into one estate by a caller who forgets `-p`.
name: canari-prod

# Every service carries this block (asserted by compose-logging.test.sh under the CI scripts tests).
# Without it json-file keeps a container log with NO ceiling for as long as the container lives. The
# ceiling is 3 x 10 MB per container: measured on the shared host 2026-10-08, the largest log was
# 46 MB (garage) and the median 0.1 MB, against a disk 88 % used with 5.5 GB free, so the worst case
# of one estate (13 containers) is ~0.4 GB. Rotation bounds the DISK; it does not keep a log past
# its container, which `up -d` recreates - that is infrastructure/lib/archive-logs.sh, called by the
# deploy. See docs/wiki/infrastructure/logging.md.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"


services:

  # ─────────────────────────────────────────────────────
  # Infrastructure (dépendances partagées)
  # ─────────────────────────────────────────────────────
  redis:
    logging: *logging
    labels:
      canari.deploy.replace: pinned
    # PINNED BY DIGEST TO WHAT PRODUCTION IS PROVEN TO RUN, not to whatever the tag resolved to
    # the morning somebody rebuilt. `redis:alpine` is a FLOATING MAJOR - it was serving 8.8.0 on
    # 2026-09-01 and a `docker compose pull` could have moved it to 9 without a line changing
    # here. The tag before the `@` is documentation: the digest is what is fetched.
    image: redis:8.10-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: always
    # Bounded on purpose. Redis holds presence, rendezvous digests and history streams and was
    # running with maxmemory 0 / noeviction, i.e. unbounded growth on a 16 GB host - the forecast
    # puts the worst case at ~2.3 GB of `history:` streams alone. `volatile-lru` is strictly safer
    # than `noeviction`, never worse: it only ever evicts keys that already carry a TTL, and once
    # those are gone it degrades to exactly the previous behaviour (write errors) instead of
    # taking the host down. Current usage is 2.29 MB, so this cap does not bind in normal
    # operation - it is a ceiling, not a budget.
    #
    # PERSISTED, because this is not a cache. `history:{groupId}` is the only SHARED copy of a
    # conversation's messages - the per-device queue is deleted on ACK, and MLS forward secrecy means
    # a device cannot re-read what it did not decrypt at the time. Without a volume the stream lived
    # in the container's writable layer and died with it. Measured 2026-08-12: the container had been
    # recreated 31 hours earlier and the busiest DM's stream went back exactly 22.6 hours, while a
    # peer still held twice as many messages. AOF and not RDB alone: the default snapshot points
    # (`3600 1 300 100 60 10000`) lose everything written since the last one.
    #
    # Losing the rest of this database is survivable, which is why the volume can be added without a
    # migration: presence keys regenerate on reconnect, rendezvous digests have a 60 s TTL, and
    # `group:members:*` is repopulated from `device_group_membership` whenever the set is found
    # empty (see that entity's docblock, role 1).
    #
    # Raised to 2 GB on 2026-08-12, and it must be raised BEFORE `HISTORY_STREAM_MAXLEN` is: that
    # cap decides how much a single group may hold, this one decides how much the whole store may.
    # Raising the per-group cap first would let eviction start choosing which conversations keep a
    # shared copy. The host has 13 GB free, so 2 GB is a ceiling with room, not an allocation.
    command:
      [
        "redis-server",
        "--maxmemory",
        "2gb",
        "--maxmemory-policy",
        "volatile-lru",
        "--appendonly",
        "yes",
      ]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    logging: *logging
    labels:
      canari.deploy.replace: pinned
    # Same rule. The tag pinned the MAJOR only, so every patch arrived unannounced.
    #
    # THE MAJOR HERE IS NOT A FREE CHOICE, AND MOVING IT IS NOT A DEPENDENCY BUMP. Dependabot
    # proposed `15-alpine -> 18-alpine` on 2026-09-01, the auto-merge took it on a fully green suite,
    # and the deploy that followed recreated this container: PostgreSQL 18 exited on startup against
    # the existing `postgres_data` - `there appears to be PostgreSQL data in /var/lib/postgresql/data`
    # - because 18+ needs `pg_upgrade` AND moved the expected mount to `/var/lib/postgresql` with a
    # major-version subdirectory under it. `auth_db` is the ONLY database, so all eight backend
    # services went down for 33 minutes while the frontend kept serving 200s.
    #
    # No gate in this repository can see that failure: `make run-ci`, `boot-nest-apps` and every
    # compose stack create their cluster from an EMPTY volume, which is the one case that always
    # works. `postgres` is therefore still refused by name in `.github/scripts/lib/ceiling.sh`, and
    # that refusal STAYS after this change: what made 18 safe here was a procedure and a window, not
    # a green suite, and the next major will need both again.
    #
    # **18 IS REACHED BY A LOGICAL DUMP AND RESTORE ONTO A NEW VOLUME, NOT BY RETAGGING THIS LINE.**
    # The tag and the mount move in ONE commit because they have to: pointing `postgres_data` at
    # `/var/lib/postgresql` while the image is still 15 hands the 15 entrypoint an empty directory
    # and it initialises a new cluster over the estate. Rehearsed on production's own bytes on
    # 2026-09-15 and again on 2026-09-18 before the window - 53 of 53 tables row-identical, 160
    # indexes, every constraint class, four extensions and an identical sort-order fingerprint (both
    # images are Alpine, so both clusters are musl and the collation does not move under the
    # indexes). The procedure, its numbers and its rollback are in
    # `docs/wiki/infrastructure/databases.md`, the only copy.
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    restart: always
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: auth_db
    volumes:
      - postgres_data_18:/var/lib/postgresql

  adminer:
    logging: *logging
    labels:
      canari.deploy.replace: pinned
    # REACHED TWO WAYS: loopback on the host (an ssh tunnel), and /adminer/ through the frontend nginx for
    # GLOBAL ADMINS (core-service signs a short cookie; docs/wiki/infrastructure/databases.md). It publishes
    # nothing else.
    # PINNED BY DIGEST, not `:latest` - and `:latest` was the worst of the three floating tags, on a
    # database admin UI, in PRODUCTION. The image carries no version label, so the digest is the only
    # name it has.
    image: adminer@sha256:400af848ac3f57938abde4867677df1b195674d232c8896a27d111d04b9c088c
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    # upload progress OFF (host IT's request, 2026-10-22): Adminer does not use it, and PHP is patched here
    # by moving the image digest, not by the host's unattended-upgrades - the container is already php-cli.
    volumes:
      - ./adminer/php-hardening.ini:/usr/local/etc/php/conf.d/zz-hardening.ini:ro
    depends_on:
      - postgres

  # ─────────────────────────────────────────────────────
  # RUST SERVICES (3000-3009 range)
  # ─────────────────────────────────────────────────────

  # Chat Gateway (Rust / Axum) - port 3000
  chat-gateway:
    logging: *logging
    labels:
      canari.deploy.replace: overlap
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-emse-students/canari}/chat-gateway:${TAG:-latest}
    restart: always
    build:
      context: ..
      dockerfile: infrastructure/local/Dockerfile.chat-gateway
    expose:
      - "3000"
    environment:
      RUST_LOG: chat_gateway=info,tower_http=info
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      DELIVERY_SERVICE_URL: http://chat-delivery-service:3010
      # The presence audience (WP-PRESENCE): who shares a conversation or a community with whom is
      # asked of chat-delivery and social-service over this network. Unset, every presence read is a 503.
      SOCIAL_SERVICE_URL: http://social-service:3014
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
      # THE CORS ALLOWLIST, AND THE ONLY SERVICE THAT READS IT. It was a `"*"` LITERAL here until
      # 2026-08-30, which beat anything in `.env` - so the list CD had been writing since the iOS
      # incident reached nothing, and this gateway answered every origin on earth. It is not `:-`
      # with a default: a default is a policy nobody chose, and the two available ones are both
      # wrong (a wildcard silently re-opens this, a single origin silently cuts every Tauri client
      # off `/api/presence`). An absent declaration must stop the deploy instead.
      ALLOW_ORIGIN: ${ALLOW_ORIGIN:?ALLOW_ORIGIN must be set in infrastructure/.env - see .env.example; CD writes it in the deploy job}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 2s
    depends_on:
      redis:
        condition: service_healthy

  call-service:
    logging: *logging
    labels:
      canari.deploy.replace: exclusive
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-emse-students/canari}/call-service:${TAG:-latest}
    restart: always
    build:
      context: ..
      dockerfile: infrastructure/local/Dockerfile.call-service
    expose:
      - "3004"
    environment:
      RUST_LOG: info
      PORT: "3004"
      JWT_SECRET: ${JWT_SECRET}
      CLOUDFLARE_CALLS_API_TOKEN: ${CLOUDFLARE_CALLS_API_TOKEN:-}
      CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:-}
      CLOUDFLARE_TURN_TTL_SECONDS: ${CLOUDFLARE_TURN_TTL_SECONDS:-7200}
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
      CALL_ROOM_SECRET: ${CALL_ROOM_SECRET:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────────────────
  # NODE.JS SERVICES (3010-3029 range)
  # ─────────────────────────────────────────────────────

  # Chat Delivery Service (NestJS) - New port 3010
  chat-delivery-service:
    logging: *logging
    labels:
      canari.deploy.replace: overlap
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-emse-students/canari}/chat-delivery-service:${TAG:-latest}
    restart: always
    build:
      context: ..
      dockerfile: infrastructure/local/Dockerfile.chat-delivery-service
    expose:
      - "3010"
    environment:
      # The review cohort (review-cohort.ts): no conversation, call or invitation crosses it.
      SERVICE_ACCOUNT_USER_ID: ${SERVICE_ACCOUNT_USER_ID:-}
      PORT: "3010"
      NODE_ENV: ${NODE_ENV:-production}
      # Same as core/social: browser origin for CORS (same-site prod usually unaffected).
      FRONTEND_URL: ${FRONTEND_URL:-}
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/auth_db
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      CLOUDFLARE_CALLS_API_TOKEN: ${CLOUDFLARE_CALLS_API_TOKEN:-}
      CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:-}
      # The TURN budget's meter (B7): Cloudflare's own count of relayed egress, read with an
      # Account Analytics token. Unset: ice-servers answers STUN only (TURN_METER_UNAVAILABLE) - no relay without a budget.
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_TURN_ANALYTICS_TOKEN: ${CLOUDFLARE_TURN_ANALYTICS_TOKEN:-}
      # GB of metered relay egress per UTC calendar month. Unset: 950. 0: calls are STUN only.
      CLOUDFLARE_TURN_MONTHLY_BUDGET_GB: ${CLOUDFLARE_TURN_MONTHLY_BUDGET_GB:-}
      # The key-group shared-payload WRITER (migration 034). A literal of env-manifest.tsv: false
      # until a release AFTER the one shipping its readers. Neither true nor false: no boot.
      QUEUED_PAYLOAD_SHARED_WRITES: ${QUEUED_PAYLOAD_SHARED_WRITES:-false}
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-}
      # Server-to-server media fetch for rich media notifications (WP-XP-3): the push proxy relays
      # the encrypted blob from media-service using INTERNAL_SECRET.
      MEDIA_SERVICE_URL: ${MEDIA_SERVICE_URL:-http://media-service:3011}
      CALL_ROOM_SECRET: ${CALL_ROOM_SECRET:-}
      MIGALLERY_API_URL: ${MIGALLERY_API_URL:-https://gallery.mitv.fr}
      MIGALLERY_API_KEY: ${MIGALLERY_API_KEY:-}
      # Server-side Safe Browsing lookup for shared links (WP-SAFELINK-1). Optional and
      # fails open: unset means no check, never a blocked link.
      GOOGLE_SAFE_BROWSING_API_KEY: ${GOOGLE_SAFE_BROWSING_API_KEY:-}
      # The GIF picker's search (chat-delivery /api/mls/gifs): the server asks KLIPY so a reader's
      # query, IP and identifier never reach it. Unset: the picker says GIF search is not configured.
      KLIPY_API_KEY: ${KLIPY_API_KEY:-}
      # Direct APNs VoIP pushes for iOS CallKit rings (WP-XP-5). Optional: unset falls
      # back to an FCM alert banner on iOS.
      APNS_VOIP_KEY_P8: ${APNS_VOIP_KEY_P8:-}
      APNS_VOIP_KEY_ID: ${APNS_VOIP_KEY_ID:-}
      APNS_VOIP_TEAM_ID: ${APNS_VOIP_TEAM_ID:-}
      APNS_VOIP_TOPIC: ${APNS_VOIP_TOPIC:-}
      APNS_VOIP_SANDBOX: ${APNS_VOIP_SANDBOX:-}
    depends_on:
      redis:
        condition: service_healthy
    # `node -e`, in images that run bun. That is NOT a leftover: `oven/bun:*-alpine` ships a
    # `node` shim at /usr/local/bun-node-fallback-bin/node, on PATH, which dispatches to bun.
    # Measured 2026-08-27 inside the image: `node -e` runs, `fetch` resolves, and the exit code
    # is honoured both ways. What the shim does NOT support is a REPL or `node --version`, so do
    # not "verify" it with either - both fail while every healthcheck here passes.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3010/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 2s

  # ─────────────────────────────────────────────────────
  # Garage - S3-compatible object storage, replacing MinIO (unmaintained upstream).
  # CUTOVER TAKEN 2026-08-14: every object copied from MinIO via rclone and verified
  # (rclone check, 0 diff, 200 objects / 45.370 MiB both sides) before media-service
  # was repointed here. See docs/wiki/infrastructure/docker.md.
  # ─────────────────────────────────────────────────────
  garage:
    logging: *logging
    labels:
      canari.deploy.replace: pinned
    image: dxflrs/garage:v2.5.0
    restart: always
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    ports:
      - "127.0.0.1:${GARAGE_API_HOST_PORT:-19010}:3900"   # S3 API (loopback only, for the migration tooling)
      - "127.0.0.1:${GARAGE_ADMIN_HOST_PORT:-19011}:3903"   # Admin API (health, CLI)
    environment:
      GARAGE_RPC_SECRET: "${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET is required - see .env.example}"
      GARAGE_ADMIN_TOKEN: "${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN is required - see .env.example}"
      # The key Garage provisions on first boot, and the ONLY S3 credential in the stack:
      # media-service authenticates with these same two values below. They were two separate
      # names until 2026-08-18 (`MINIO_ACCESS_KEY`/`MINIO_SECRET_KEY` mirrored these), which is
      # one duplicate that can drift, and drifting means every media request is refused.
      # Garage requires an access key ID >= 8 characters and a secret >= 16 - a constraint MinIO
      # never had, which is why the old `MINIO_ROOT_USER` could not simply be reused.
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY_ID:?GARAGE_ACCESS_KEY_ID is required - see .env.example}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_ACCESS_KEY:?GARAGE_SECRET_ACCESS_KEY is required - see .env.example}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET:-canari-media}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Media Service (NestJS) - New port 3011
  # Stores only opaque encrypted blobs; never sees decryption keys.
  # ─────────────────────────────────────────────────────
  media-service:
    logging: *logging
    labels:
      canari.deploy.replace: exclusive
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-emse-students/canari}/media-service:${TAG:-latest}
    restart: always
    build:
      context: ..
      dockerfile: infrastructure/local/Dockerfile.media-service
    expose:
      - "3011"
    environment:
      PORT: "3011"
      NODE_ENV: ${NODE_ENV:-production}
      FRONTEND_URL: ${FRONTEND_URL:-}
      JWT_SECRET: ${JWT_SECRET}
      # Shared secret gating server-to-server DELETE /media/:id (social-service cleanup).
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
      # THE LIVE SWITCH (docs/wiki/services/lives.md): every live route answers 404 unless this is
      # exactly `true`. render-env.sh writes `true` on both estates; lives_mode closes them at runtime.
      LIVE_ENABLED: ${LIVE_ENABLED:-false}
      GARAGE_ENDPOINT: ${GARAGE_ENDPOINT:-garage}
      GARAGE_PORT: "${GARAGE_PORT:-3900}"
      GARAGE_USE_SSL: "${GARAGE_USE_SSL:-false}"
      # REQUIRED BY GARAGE, AND ITS ABSENCE IS A CRASH LOOP, NOT A DEGRADATION. Garage signs with
      # the region in garage.toml (`garage`); the S3 client defaults to `us-east-1`, and the
      # mismatch fails at `bucketExists` during `onModuleInit` - so the service never finishes
      # booting. This took media-service down on production for over two hours (13:56-16:10Z,
      # 2026-08-14) before the missing line was found.
      GARAGE_REGION: ${GARAGE_REGION:-garage}
      GARAGE_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:?GARAGE_ACCESS_KEY_ID is required - set via CD secrets or .env}
      GARAGE_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:?GARAGE_SECRET_ACCESS_KEY is required - set via CD secrets or .env}
      GARAGE_BUCKET: ${GARAGE_BUCKET:-canari-media}
      MEDIA_MAX_SIZE_MB: "${MEDIA_MAX_SIZE_MB:-50}"
    volumes:
      - media_meta:/app/media_meta
      # Staging of resumable upload sessions (parts land here before the object store takes the blob).
      - media_upload_sessions:/app/upload_sessions
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3011/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      # This waits on the store `GARAGE_ENDPOINT` actually names. It waited on MinIO until
      # 2026-08-14, which gated the boot on a service media-service no longer talks to while
      # leaving the one it does talk to ungated: `bucketExists` runs in `onModuleInit`, so
      # reaching Garage before it is ready is a crash loop, and the deploy's health gate reads
      # that as a failed release.
      garage:
        condition: service_healthy

  # ─────────────────────────────────────────────────────
  # Core Service (NestJS) - port 3012
  # Handles Auth, Users, Payment
  # ─────────────────────────────────────────────────────
  core-service:
    logging: *logging
    labels:
      canari.deploy.replace: overlap
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-emse-students/canari}/core-service:${TAG:-latest}
    restart: always
    build:
      context: ..
      dockerfile: infrastructure/local/Dockerfile.core-service
    expose:
      - "3012"
    environment:
      PORT: "3012"
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required - see .env.example}"
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-}
      # The /adminer/ route (database admin UI, global admins only). PRODUCTION ONLY: the dev compose
      # does not set it, so core-service issues no session there and the route does not exist.
      # It also needs INTERNAL_SHARED_SECRET (32+ characters) and refuses to open without it.
      ADMINER_ENABLED: "true"
      AUTHENTIK_BASE_URL: ${AUTHENTIK_BASE_URL:-}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: auth_db
      # Lydia (WP-LYDIA-1) - which provider is actually live is an admin-editable platform_config
      # setting, not env-driven; these are only the credentials, read by whichever provider is active.
      LYDIA_ENV: ${LYDIA_ENV:-production}
      LYDIA_PROVIDER_TOKEN: ${LYDIA_PROVIDER_TOKEN:-}
      LYDIA_PROVIDER_PRIVATE_TOKEN: ${LYDIA_PROVIDER_PRIVATE_TOKEN:-}
      FORM_URL: http://social-service:3014
      FORM_SERVICE_URL: http://social-service:3014
      # Account deletion fans out to media-service to remove the user's own uploads.
      MEDIA_SERVICE_URL: ${MEDIA_SERVICE_URL:-http://media-service:3011}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
      SERVICE_ACCOUNT_USER_ID: ${SERVICE_ACCOUNT_USER_ID:-}
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY:-}
      SKY_API_URL: ${SKY_API_URL:-https://sky.emse.fr}
      SKY_API_KEY: ${SKY_API_KEY:-}
      MIGALLERY_API_URL: ${MIGALLERY_API_URL:-https://gallery.mitv.fr}
      MIGALLERY_API_KEY: ${MIGALLERY_API_KEY:-}
      # PRODUCTION ONLY (WP4): the authentik service account that writes a person's profile. Dev holds
      # none and refuses the edit with a typed error, because both estates share ONE MiConnect.
      MICONNECT_EDITOR_TOKEN: ${MICONNECT_EDITOR_TOKEN:-}
      # Account restore on a new Android phone (WP-RESTORE-1): the signing-certificate SHA-256 the
      # restore key's origin is computed from. Empty, every /api/auth/restore route answers 503
      # (docs/wiki/account-restore.md).
      ANDROID_APP_LINK_SHA256: ${ANDROID_APP_LINK_SHA256:-}
      # THE ONE FIELD THAT TELLS THE TWO ESTATES APART AT RUNTIME, and until 2026-09-02 nothing
      # delivered it. `render-env.sh` computes it for dev, the manifest declares it,
      # `deploy-build.ts` parses it and `version.service.spec.ts` tests it - and no compose file
      # passed it in, so `/api/version` answered `build: null` on BOTH estates. A value produced
      # and never consumed does not exist, and it was about to be used as the proof that the
      # tunnel had been moved onto dev. Production renders nothing here BY DECISION, so this stays
      # empty and a non-null build IS dev - the variable is declared anyway so the two files stay
      # identical wherever they can be, which is this file pair's whole promise.
      DEPLOY_BUILD: ${DEPLOY_BUILD:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3012/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 2s
    depends_on:
      postgres:
        condition: service_started

  # ─────────────────────────────────────────────────────
  # Social Service (NestJS) - port 3014
  # Handles Channels, Posts, Forms
  # ─────────────────────────────────────────────────────
  social-service:
    logging: *logging
    labels:
      canari.deploy.replace: overlap
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-emse-students/canari}/social-service:${TAG:-latest}
    restart: always
    build:
      context: ..
      dockerfile: infrastructure/local/Dockerfile.social-service
    expose:
      - "3014"
    environment:
      PORT: "3014"
      NODE_ENV: ${NODE_ENV:-production}
      FRONTEND_URL: ${FRONTEND_URL:-}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: auth_db
      REDIS_URL: redis://redis:6379
      CHANNELS_ENCRYPTION_SECRET: "${CHANNELS_ENCRYPTION_SECRET:?CHANNELS_ENCRYPTION_SECRET is required - see .env.example}"
      USER_SERVICE_URL: http://core-service:3012
      PAYMENT_SERVICE_URL: http://core-service:3012
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required - see .env.example}"
      MEDIA_SERVICE_URL: http://media-service:3011
      # THE LIVE SWITCH (docs/wiki/services/lives.md): every live route answers 404 unless this is
      # exactly `true`. render-env.sh writes `true` on both estates; lives_mode closes them at runtime.
      LIVE_ENABLED: ${LIVE_ENABLED:-false}
      # THE LYDIA RECONCILIATION SWITCH (docs/wiki/lydia-api.md section 7): the sweep asks Lydia
      # nothing unless this is exactly `true`. render-env.sh computes it - `true` on dev, `false` on
      # production until the amount format Lydia signs is measured.
      LYDIA_RECONCILE_ENABLED: ${LYDIA_RECONCILE_ENABLED:-false}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-}
      SERVICE_ACCOUNT_USER_ID: ${SERVICE_ACCOUNT_USER_ID:-}
      DELIVERY_INTERNAL_URL: http://chat-delivery-service:3010
      CERCLE_API_KEY: ${CERCLE_API_KEY:-}
      # Signs the calendar subscription URLs; unset, the signing route answers 503 and every
      # selection feed is refused (fails closed). Rotating it ends every saved subscription URL.
      AGENDA_SIGNING_KEY: ${AGENDA_SIGNING_KEY:-}
      # Signs a reported live chat line kept for staff (WP-L8b, docs/wiki/services/lives.md);
      # unset, every chat-line report is refused 503 and nothing is kept.
      LIVE_REPORT_SIGNING_KEY: ${LIVE_REPORT_SIGNING_KEY:-}
      # Encrypts each association's Lydia Business private token at rest (migration 100). Unset, a
      # manager's key entry answers 503 and every Lydia callback is refused (the payer's return still
      # confirms). Rotating it makes every stored key unreadable: managers must enter them again.
      LYDIA_KEY_ENCRYPTION_SECRET: ${LYDIA_KEY_ENCRYPTION_SECRET:-}
      LIVE_KEY_ENCRYPTION_SECRET: ${LIVE_KEY_ENCRYPTION_SECRET:-}
    healthcheck:
      # `/api/health` since 2026-09-24, like the other three services. It probed
      # `/api/channels/health` - a route that belongs to ChannelsController and answers about the
      # channel service specifically - because social-service had no root health route at all. The
      # route ships in the same commit as this line, so the image and this file move together.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3014/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 2s
    depends_on:
      postgres:
        condition: service_started
      core-service:
        condition: service_started
      media-service:
        condition: service_started


  # SvelteKit server (adapter-node). Renders NO component - the app stays a SPA - it only
  # writes each page's Open Graph head into the shell before nginx sends it, which is the
  # one thing a crawler or an unfurler can see (frontend/src/hooks.server.ts). Reaches the
  # services directly on this network, never back through nginx, with INTERNAL_SECRET.
  # Not published: the edge is the only container binding a host port.
  frontend-ssr:
    logging: *logging
    labels:
      canari.deploy.replace: overlap
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-emse-students/canari}/frontend-ssr:${TAG:-latest}
    restart: always
    environment:
      NODE_ENV: production
      PORT: '3000'
      # adapter-node 6 has no `ORIGIN`: the origin is derived per request (scheme https by default,
      # host from `Host`, which nginx @ssr forwards). No PROTOCOL_HEADER: it would trust a value a
      # client can send. Nothing guards a form action today; see architecture.md.
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
      SOCIAL_SERVICE_URL: http://social-service:3014
      CORE_SERVICE_URL: http://core-service:3012
      DELIVERY_SERVICE_URL: http://chat-delivery-service:3010
    # The image's own HEALTHCHECK, restated with `start_interval` so a new replica is known healthy
    # within seconds of booting rather than one 30 s interval later.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    depends_on:
      social-service:
        condition: service_started
      core-service:
        condition: service_started
      chat-delivery-service:
        condition: service_started

  frontend:
    logging: *logging
    labels:
      canari.deploy.replace: overlap
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-emse-students/canari}/frontend:${TAG:-latest}
    restart: always
    environment:
      NODE_ENV: production
      PORT: '80'
      # ORIGIN / VITE_GATEWAY_URL / VITE_DELIVERY_URL were declared here and read by nothing: this
      # image is `nginx:stable-alpine` serving a build, with no entrypoint substituting anything,
      # and a `VITE_` variable is baked in at BUILD time (the workflows write them into
      # `frontend/.env` before `bun run build`). They are gone - all three took their value from
      # `ALLOW_ORIGIN`, which is a CORS allowlist and not an origin.
    # NO HOST PORT SINCE 2026-10-17 - the edge below holds it, so a release can start this
    # container's successor beside it (docs/wiki/cicd.md#a-deploy-replaces-nothing-a-member-is-talking-to).
    expose:
      - "80"
    # `/nginx-health` answers from this nginx alone (no upstream, no access-log line), so healthy means
    # "this image's configuration loaded and it is listening" - what the edge needs to send it traffic.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    depends_on:
      frontend-ssr:
        condition: service_started

  # THE ONE CONTAINER THAT HOLDS THE HOST PORT, AND A RELEASE NEVER REPLACES IT. A layer-4 relay to
  # `frontend` (edge/nginx.conf says why, and why it reads nothing): the frontend used to publish the
  # port itself, and a port belongs to ONE container, so its successor could not start until it had
  # gone - a 502 on everything while it booted. Recreated only when this definition changes (an image
  # bump), which costs that one deploy about a second; its configuration is reloaded in place.
  edge:
    logging: *logging
    labels:
      canari.deploy.replace: pinned
    image: nginx:1.31.8-alpine@sha256:1ef7ca94d7879df82421428ce13bd1eaa412404953859cf7a5b6512c25e67a60
    restart: always
    command: ["nginx", "-c", "/etc/nginx/edge/nginx.conf", "-g", "daemon off;"]
    # The DIRECTORY, not the file: `git reset --hard` replaces a file by a new inode, and a bind mount
    # of a single file keeps showing the old one - the reload would read yesterday's configuration.
    volumes:
      - ./edge:/etc/nginx/edge:ro
    ports:
      # 127.0.0.1 ONLY. The host's own nginx is the single public entry point and reaches this over
      # the loopback; publishing on 0.0.0.0 offered it to every other tenant of a machine this
      # project does not own. The default is the shared host's real port, not 80, which belongs to
      # that nginx - see `compute_frontend_host_port` in deploy/render-env.sh.
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8081}:80"
    # HEALTHY MEANS LISTENING. Without a healthcheck the deploy believed the edge the moment Docker
    # said `running` - before nginx had opened port 80 - and Docker's port proxy answered that window
    # with a reset (2026-10-18, docs/wiki/cicd.md#the-edge-is-ready-when-it-listens-not-when-it-runs).
    # The pid file is written by nginx's master after its listeners are open and its signals set (so
    # the deploy's `nginx -s reload` has a master to reach); the LISTEN row on :80 is the listener
    # itself, which a stale pid file from a killed container cannot fake. Nothing is proxied: a probe
    # THROUGH the relay would open a connection to `frontend` every 30 s and log its failures.
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/run/nginx.pid && grep -q ' 00000000:0050 00000000:0000 0A ' /proc/net/tcp"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s
    depends_on:
      frontend:
        condition: service_started

volumes:
  # THE 15 VOLUME IS KEPT, AND KEEPING IT IS THE ROLLBACK. Rolling back is pointing
  # the service above at this name and the 15 digest again; the dump is the SECOND
  # line of defence, never the first. Delete it only once 18 has served a full week.
  postgres_data:
  # 18+ expects ONE mount at `/var/lib/postgresql` and puts the cluster in a
  # major-version subdirectory under it, so this cannot reuse the name above: the 15
  # entrypoint handed `/var/lib/postgresql` would find an empty directory and
  # initialise a new cluster over the estate. New major, new name, on purpose.
  postgres_data_18:
  # The shared message log. See the redis service above for why this is not optional.
  redis_data:
  garage_meta:
  garage_data:
  media_meta:
  # Transient staging, DELIBERATELY not backed up: a session is a day of resumable work at most.
  media_upload_sessions:
